name: Haskell CI

on:
  push:
    branches: [ trunk ]
  pull_request:
    branches: [ trunk ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    # regex-pcre links against libpcre and finds it via pkg-config; without these
    # the dependency fails to *configure* before any project code is compiled.
    # (See the README's Linux install line: pkg-config + libpcre3-dev.)
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y pkg-config libpcre3-dev

    # haskell/actions/setup has been unmaintained since 2023-09-09 and its
    # 'latest' resolved to stack 2.11.1, whose bundled Hackage TUF keys can no
    # longer validate the current root.json ("does not have enough signatures
    # signed with the appropriate keys"), so any package fetch died. Use the
    # maintained action, which resolves a current stack.
    - uses: haskell-actions/setup@v2
      with:
        enable-stack: true
        stack-version: 'latest'

    - uses: actions/cache@v4
      name: Cache ~/.stack
      with:
        path: ~/.stack
        # stack.yaml itself belongs in the key: the resolver lives there, so
        # without it a snapshot bump silently reuses the previous snapshot's cache.
        key: ${{ runner.os }}-stack-${{ hashFiles('languages/haskell/stack.yaml','languages/haskell/stack.yaml.lock','languages/haskell/package.yaml') }}
        restore-keys: ${{ runner.os }}-stack-

    - name: Install dependencies
      run: |
        stack build --only-dependencies
      working-directory: languages/haskell

    - name: Build
      run: |
        stack build --test --bench --no-run-tests --no-run-benchmarks
      working-directory: languages/haskell

    - name: Test
      run: |
        stack test
      working-directory: languages/haskell

    # The behavioural corpus (test/corpus/) is the regression net for the
    # cell-language rewrite. It records what dmnmd actually does today — stdout,
    # stderr and exit status — one small input per verified defect, and labels every
    # case 'policy' (behaviour we have declared correct; a diff is a regression) or
    # 'symptom' (behaviour that is wrong and should change; a diff is progress).
    #
    # It sits outside `stack test` on purpose — test/corpus/README.md gives the
    # reasons — which means that without this step nothing automated would ever
    # notice a policy regression, and the net would only fire when somebody
    # remembered to run it by hand.
    #
    # `make corpus` runs every case but exits nonzero only for a policy regression or
    # a case with no recording. Symptom diffs are printed and are expected to appear
    # here as the grammar is replaced; they are information, not failure.
    #
    # The runner does not build. `stack build` above populates stack's local install
    # root, which is the third entry in the runner's binary search order.
    - name: Behavioural corpus
      run: |
        make corpus
      working-directory: languages/haskell
