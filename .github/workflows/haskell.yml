name: Haskell CI

on:
  push:
    branches: [ trunk ]
  pull_request:
    branches: [ trunk ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    # regex-pcre links against libpcre and finds it via pkg-config; without these
    # the dependency fails to *configure* before any project code is compiled.
    # (See the README's Linux install line: pkg-config + libpcre3-dev.)
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y pkg-config libpcre3-dev

    # haskell/actions/setup has been unmaintained since 2023-09-09 and its
    # 'latest' resolved to stack 2.11.1, whose bundled Hackage TUF keys can no
    # longer validate the current root.json ("does not have enough signatures
    # signed with the appropriate keys"), so any package fetch died. Use the
    # maintained action, which resolves a current stack.
    - uses: haskell-actions/setup@v2
      with:
        enable-stack: true
        stack-version: 'latest'

    - uses: actions/cache@v4
      name: Cache ~/.stack
      with:
        path: ~/.stack
        # stack.yaml itself belongs in the key: the resolver lives there, so
        # without it a snapshot bump silently reuses the previous snapshot's cache.
        key: ${{ runner.os }}-stack-${{ hashFiles('languages/haskell/stack.yaml','languages/haskell/stack.yaml.lock','languages/haskell/package.yaml') }}
        restore-keys: ${{ runner.os }}-stack-

    - name: Install dependencies
      run: |
        stack build --only-dependencies
      working-directory: languages/haskell

    - name: Build
      run: |
        stack build --test --bench --no-run-tests --no-run-benchmarks
      working-directory: languages/haskell

    - name: Test
      run: |
        stack test
      working-directory: languages/haskell
