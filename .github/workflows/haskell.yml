name: Haskell CI

on:
  push:
    branches: [ trunk ]
  pull_request:
    branches: [ trunk ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    # regex-pcre links against libpcre and finds it via pkg-config; without these
    # the dependency fails to *configure* before any project code is compiled.
    # (See the README's Linux install line: pkg-config + libpcre3-dev.)
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y pkg-config libpcre3-dev

    # haskell/actions/setup has been unmaintained since 2023-09-09; use the
    # maintained fork. The GHC version is pinned to `tested-with` in
    # languages/haskell/dmnmd.cabal — keep the two in step. It used to also be
    # pinned by stack.yaml's resolver (lts-24.20), which is gone: dmnmd is
    # cabal-only, matching legalese/l4-ide.
    - uses: haskell-actions/setup@v2
      id: setup
      with:
        ghc-version: '9.10.3'
        cabal-version: 'latest'

    - uses: actions/cache@v4
      name: Cache cabal store and build products
      with:
        path: |
          ${{ steps.setup.outputs.cabal-store }}
          languages/haskell/dist-newstyle
        # dmnmd.cabal belongs in the key: the dependency set and the megaparsec
        # lower bound live there, so without it a bump silently reuses a store
        # resolved against the previous constraints.
        key: ${{ runner.os }}-cabal-${{ steps.setup.outputs.ghc-version }}-${{ hashFiles('languages/haskell/dmnmd.cabal') }}
        restore-keys: ${{ runner.os }}-cabal-${{ steps.setup.outputs.ghc-version }}-

    - name: Install dependencies
      run: |
        cabal update
        cabal build --only-dependencies --enable-tests
      working-directory: languages/haskell

    - name: Build
      run: |
        cabal build --enable-tests
      working-directory: languages/haskell

    - name: Test
      run: |
        cabal test
      working-directory: languages/haskell

    # The behavioural corpus (test/corpus/) is the regression net for the
    # cell-language rewrite. It records what dmnmd actually does today — stdout,
    # stderr and exit status — one small input per verified defect, and labels every
    # case 'policy' (behaviour we have declared correct; a diff is a regression) or
    # 'symptom' (behaviour that is wrong and should change; a diff is progress).
    #
    # It sits outside `cabal test` on purpose — test/corpus/README.md gives the
    # reasons — which means that without this step nothing automated would ever
    # notice a policy regression, and the net would only fire when somebody
    # remembered to run it by hand.
    #
    # `make corpus` runs every case but exits nonzero only for a policy regression or
    # a case with no recording. Symptom diffs are printed and are expected to appear
    # here as the grammar is replaced; they are information, not failure.
    #
    # The runner does not build. The `cabal build` above is what makes the binary
    # current: `cabal list-bin` is the runner's second search entry, and it resolves
    # to the dist-newstyle product that step produced.
    - name: Behavioural corpus
      run: |
        make corpus
      working-directory: languages/haskell
