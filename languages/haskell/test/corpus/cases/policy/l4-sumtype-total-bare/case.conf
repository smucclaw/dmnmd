TITLE='a total table whose result is a sum type stays bare: the last arm becomes the OTHERWISE, its guard dropped'
WHY='DECISIONS.md D-22 rule 3 says a result is a MAYBE only where a no-match region exists, so total tables stay bare. A result column that declares a domain is an L4 sum type, and a sum type has no sentinel value for the dead OTHERWISE of a total table to return: an empty string is a check error against it, and fabricating a member, or adding one to the enum, is forbidden (CLAUDE.md), because where one table output domain is another table input domain it silently widens the other table declared domain. So before D-22 part 4 this table was emitted as GIVETH A MAYBE Dish, with JUST arms and OTHERWISE NOTHING, and that NOTHING could never happen.

This table covers all four members of the declared domain of season (the sub-header row) and has no catch-all row and no declared default, so DMN.Regions finds no no-match region and the result is bare. The OTHERWISE takes the value of the last arm, Stew, and that arm guard is dropped. For a total table that is the same function: an input that reaches the OTHERWISE matched no earlier arm, so it must have matched the last. Reading the last arm as the OTHERWISE is an ASSUMED choice, not a ruled one, and is in its own commit so that it can be reverted alone.

The guard grid is built from the remaining arms only. That is why the THEN column sits two positions further left than it did while the Winter arm was in the grid: the Winter guard was the widest cell in its column. Compare policy/l4-sumtype-partial-maybe, the same table without its Winter row, which has the same two guard lines and keeps its MAYBE, because Winter then matches no rule.'
SOURCE='src/DMN/Translate/L4.hs toL4, the promoted last arm and maybeResult; DECISIONS.md D-22 part 4'
ARGS='--to=l4 input.md'
