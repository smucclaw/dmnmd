TITLE='a comparison whose operand dmnmd cannot read (a date literal) is refused, located, and nothing is emitted'
WHY='WHAT IT PINS: an input cell shaped like a comparison, in a column that declares no type, whose operand is not a number literal, is refused at exit 1 with a diagnostic naming the table, the column and the row, and the table is not emitted.

WHAT IT USED TO DO: pass 1 read the cell as text, and inference found no numeric evidence in it, because parseNumberCell refuses >= date("2026-09-24") and a Left there reads as String. The column typed String, and --to=ts emitted day === ">= date(\"2026-09-24\")" at exit 0 with nothing on stderr. That is an equality test against the spelling of the cell, which no input will ever satisfy: the rule was permanently dead and the tool reported success.

WHY REFUSED RATHER THAN READ: dmnmd reads a comparison only against a number literal. S-FEEL date literals are not supported (the temporal type question is held by DECISIONS.md D-3), so the honest outcome is a refusal that says so.

WHERE THE CHECK LIVES: pass 1 of the markdown reader (DMN.DecisionTable.mkInputFsAt, called from DMN.ParseTable for input columns only), not inference and not structuralErrors, because the quotes that make "<1 year" a string literal are stripped in pass 1 and the IR keeps no record of them. The two escape hatches the message names are pinned by policy/md-test-shaped-label-quoted-kept and policy/md-test-shaped-label-declared-string-kept.'
SOURCE='src/DMN/ParseCell.hs unreadableTestShape; src/DMN/DecisionTable.hs mkInputFsAt; src/DMN/ParseTable.hs mkFEELCol'
ARGS='--to=ts input.md'
