TITLE='--to=md is refused before anything is read, unconditionally, because the binary cannot write it'
WHY='This was symptom/cli-to-md-unimplemented. The refusal used to live in the per-table output loop, which made it fire only after the whole input had been read and only if the input happened to contain a table: the same flag was a hard error on one file and a silent exit 0 on a prose file. A refusal contingent on the input is an unimplemented branch, not a decision. It also fired after the -o file had already been truncated - see policy/cli-out-not-opened-until-render-succeeds.

checkOutFormat now consults one list, implementedOutFormats, immediately after option parsing and before parseTables. Two lists used to disagree about what --to accepts (Options.parseFileFormat advertises md and xml; the outputTo fallthrough did not) and the user met the generous one first; the parser still accepts md as an INPUT format, which it genuinely is.

md is worth its own recording rather than sharing the xml one for a reason the xml case does not cover: Md is reachable without the user ever typing --to, because .md is in fileExtensionMappings and detectOutformat infers the output format from the -o filename, so `dmnmd -o notes.md table.md` selects it.

What this case pins is the SHAPE of the refusal - up front, exit 1, one list of formats - not the fact that md is unwritable. Implementing --to=md is a legitimate change that would retire this case; it must retire it deliberately, with an argument, rather than by drifting.

The recorded format list is expected to GROW as backends land, and has already done so once: it read "'ts', 'js', 'py' and 'l4'" until --to=xml was implemented (DECISIONS.md D-8), which is a diff to read and accept rather than a regression. That is the one axis on which a change here is not a bug.'
SOURCE='app/Main.hs checkOutFormat / implementedOutFormats, called from main before parseTables; app/Options.hs parseFileFormat accepts "md" and fileExtensionMappings maps ".md" to Md'
ARGS='--to=md input.md'
