TITLE='markdown with no decision tables exits 0, and says on stderr why each pipe table was skipped'
WHY='A pipe table whose top-left cell is not a hit policy is prose, not a broken decision table. ParseMarkdown.isDecisionTable asks parseHitPolicy itself, skips the chunk, and says so as a note:. This is why a README full of documentation tables exits 0. See CLAUDE.md, "Diagnostics and exit status".'
SOURCE='app/ParseMarkdown.hs isDecisionTable; CLAUDE.md exit-status table'
ARGS='--to=ts input.md'
