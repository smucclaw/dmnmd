TITLE='an = test against a declared domain is warned, because DMN has no = and dmnmd checks values but exempts tests'
WHY='WHAT IT DOES: a Number column declares the domain 1, 2, 3 in its sub-header row and a cell reads "= 9". dmnmd accepts that directly at exit 0. On emission the cell becomes the bare value 9, and a warning now says so and predicts the consequence. WHY THE NORMALISATION IS FORCED: DMN §9.2 rule 5s operator slot is < <= > >= and contains no "=" at all; a BARE VALUE is DMNs equality test. There is no "= 9" to emit, so this is not a choice the emitter is making. WHY IT IS NOT INVISIBLE, which the code claimed and a verify lens disproved: DecisionTable.domainErrors exempts a TEST from the declared domain, on the reasoning that a test selects a subset of the domain rather than naming a member, while it checks a plain VALUE for membership. So "= 9" is exempt on the way in and 9 is a violation on the way back, and dmnmd refuses the document it just wrote. WHY A WARNING AND NOT A REFUSAL: the emitted document is correct DMN and says exactly what the author meant. What changes is which of dmnmds OWN checks it then trips, so refusing would block a legal table over an internal asymmetry. The round-trip harness carries the matching xfail. The warning uses the same fEval membership test domainErrors uses, so the prediction cannot drift from the refusal it predicts, and it does NOT fire for an = test whose value IS in the domain -- verified with that control.'
SOURCE='src/DMN/Translate/XML.hs, eqDomainWarns; src/DMN/DecisionTable.hs, domainErrors; DECISIONS.md D-8'
ARGS='--to=xml input.md'
