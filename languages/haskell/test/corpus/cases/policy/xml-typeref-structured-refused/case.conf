TITLE='a column whose typeRef names a structured <itemDefinition> is refused, and the message says which components made it structured'
WHY='tRouting is declared with <itemComponent> children rather than a <typeRef>, so
it is a record type. A dmnmd decision table column holds one scalar; there is
nothing to map a record onto. Refusing beats picking a component or flattening.

This is tier 3 of BUILD-SPEC-dmnmd-l4-sumtype.md sectionB.3, and it is out of scope
DELIBERATELY rather than merely unimplemented. Structured types are recursive, and
supporting them means deciding what a decision table column even is.

Two diagnostics, and both are wanted:

  warning at the document level  - the itemDefinition itself, named, with its
                                   component names, whether or not anything uses it
  error   at the column          - the table that actually used it, refused

The document-level one exists so a reader who sees the column error can find out
what the declaration was; the column-level one exists so the refusal is attributed
to the table it kills. Neither alone is enough - CLAUDE.md calls the missing link
between them out by name.

Note the error REPEATS the reason rather than saying "see above". Diagnostics get
grepped and truncated, and a cross-reference that assumes the other line is
visible is not much better than silence.'
SOURCE='src/DMN/XML/XmlToDmnmd.hs unusable/resolveTypeRef; src/DMN/XML/ParseDMN.hs itdComponents; BUILD-SPEC-dmnmd-l4-sumtype.md sectionB.3 tier3'
ARGS='--from=xml --to=l4 input.dmn'
