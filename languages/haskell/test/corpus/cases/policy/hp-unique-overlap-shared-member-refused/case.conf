TITLE='two rules of a U table whose multi-value cells share a member overlap, and are refused'
WHY='D-22 rule 2. Rows 3 and 4 agree on Version 1.2 and Tier premium, and their Season cells, `Fall, Winter` and `Spring, Winter`, share Winter. A multi-value cell is an OR, so both rules match Version 1.2, premium, Winter, and a Unique table must not contain overlapping rules (DMN 1.3 §8.2.10). Before D-22 part 2 the table was accepted, and --to=ts emitted first-match code in which Version 1.2, premium, Winter always answered extended and never seasonal. The refusal names both rows and the one input they share, and no wider overlap, because here the overlap is that one input. Row 5, the trailing catch-all, is in no message: D-22 rule 1 reads it as the default output value. D-13 is silent, because the two guards are not identical. This table was `policy/hp-unique-near-duplicate-rows-accepted` until D-22 part 2 re-fixtured that case.'
SOURCE='src/DMN/Regions.hs conflicts, conflictErrors; src/DMN/BuildTable.hs tableErrors; DECISIONS.md D-22'
ARGS='--to=ts input.md'
