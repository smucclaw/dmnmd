TITLE='a U table with two separate overlaps is refused with one message for each'
WHY='D-22 rule 2. `< 18` and `<= 21` both match every Age below 18, and `> 65` and `>= 40` both match every Age above 65, so this Unique table has two conflict regions, and the refusal names each. Rows 1 and 2 are named with the witness Age = 17 and the overlap Age < 18, and rows 3 and 4 with Age = 66 and Age > 65. The witness is the representative of the first region the two rules share: the lowest value some cell names inside it, else an integer inside it, which is why it is 17 and 66 here. Row 5, the trailing catch-all, matches everything, but D-22 rule 1 reads it as the default output value, so it is in neither message. This table was `policy/md-prefix-comparisons`, accepted and emitted first-match at exit 0, until D-22 part 2 re-fixtured that case with comparisons that do not overlap.'
SOURCE='src/DMN/Regions.hs conflicts, conflictErrors; DECISIONS.md D-22'
ARGS='--to=ts input.md'
