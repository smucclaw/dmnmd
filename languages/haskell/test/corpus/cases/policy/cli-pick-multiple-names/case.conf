TITLE='--pick takes a comma-separated list, trims spaces around each name, and emits the matches in file order'
WHY='The option is documented as --pick TABLE,... and README.md uses it as --pick="Example 2", so both the list form and surrounding whitespace are part of the promised surface. Main.hs implements it as filter (\dt -> tableName dt `elem` (trim <$> splitOn "," (pick opts))) mydtables, and three separate properties fall out of that one line: more than one name may be given; each name is trimmed, so " Dessert , Dish " selects the same two tables as "Dessert,Dish"; and because it is a filter over the parsed list rather than a lookup per name, the output comes out in FILE order, not in the order the names were written. The fixture asks for Dessert first and Dish second and gets Dish first, which is the assertion. policy/md-pick-filter already covers the single-name case and symptom/struct-tablename-collision covers the case where the membership test matches more than intended; this covers a --pick that legitimately matches several tables. Exit-status row relied on: markdown with decision tables, status 0.'
SOURCE='app/Main.hs pick filter (splitOn/trim/elem); app/Options.hs --pick metavar TABLE,...'
ARGS='--to=ts --pick " Dessert , Dish " input.md'
