TITLE='a quoted S-FEEL string literal is unwrapped: "Fall" means the four characters Fall'
WHY='In S-FEEL a string literal is written in double quotes, so the cell "Fall"
denotes the four-character string Fall. dmnmd used to compile it to
`Season === "\"Fall\""` - a comparison against the six-character string
INCLUDING the quote marks - so the row could only ever match input that
literally contained quotes. A silent misparse of the classic kind: nothing
reported, exit 0, and the table looked right.

That is fixed, and this case is the regression net for the fix.

It matters well beyond hand-written markdown. The XML reader emits quoted
strings, because that is how DMN XML writes an outputEntry
(<text>"adult"</text>), so before the fix every table that round-tripped
through XML acquired cells this grammar could not read.

Two rules are pinned here and both are load-bearing:

1. The value loses its quotes. Row 1 emits Season === "Fall".
2. A wildcard row is untouched. Row 2 is `-`, which becomes FAnything, not a
   string, and must not acquire or lose anything.

The companion case policy/md-quoted-literal-all-or-nothing pins the other half
of the rule - that a cell is unquoted only when EVERY comma-fragment is a
well-formed literal - which is what keeps this fix from re-breaking
symptom/xml-comma-split-negation.'
SOURCE='src/DMN/DecisionTable.hs unquoteCell / isSFeelLiteral; BUILD-SPEC-dmnmd-e4.md section 2.2'
ARGS='--to=ts input.md'
