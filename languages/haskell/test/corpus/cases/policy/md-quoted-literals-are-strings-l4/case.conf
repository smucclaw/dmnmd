TITLE='the L4 face of policy/md-quoted-literals-are-strings: the quoted columns are STRING, not NUMBER and BOOLEAN'
WHY='The same table as policy/md-quoted-literals-are-strings, read through --to=l4, because L4 is the backend where a wrong type is most visible. It used to emit GIVEN Year IS A NUMBER and GIVETH A MAYBE BOOLEAN, with guards Year EQUALS 2020 and results TRUE and FALSE, where the author wrote the strings "2020", "2021", "yes" and "no". It now emits GIVEN Year IS A STRING and GIVETH A MAYBE STRING, with the guards and results compared against the strings. The XML reader has done this since audit finding f4 (mkFsKeepingQuotes); the markdown reader does it since mkDataFsAt.'
SOURCE='src/DMN/DecisionTable.hs mkDataFsAt, unquoteBuilt; src/DMN/Translate/L4.hs'
ARGS='--to=l4 input.md'
