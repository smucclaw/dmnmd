TITLE='a column whose cells disagree about their type is REFUSED, not silently demoted to string equality'
WHY='D-2, the canonical case. `<= 8` and `> 8` read as Number, `unknown` reads as String; inference will not pick a winner. It used to leave the column untyped and emit `Guest_Count === "<= 8"` at exit 0, so every comparison in the column evaporated into an equality test against its own source text -- a plausible wrong answer, silently. The refusal names both dissenting cells with their row numbers and gives the two repairs. Refusing here is right because an UNDECLARED column is a guess, and a guess that contradicts itself is not one dmnmd is entitled to resolve; a declared column still wins outright and is never looked at by this check.'
SOURCE='src/DMN/DecisionTable.hs inferenceErrors / columnVerdict VConflict; DECISIONS.md D-2'
ARGS='--to=ts input.md'
