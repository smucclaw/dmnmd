TITLE='a shared <inputData> takes its type from whichever table declares one, not from the first table to mention it'
WHY='--to=xml writes ONE <inputData> per input column name and every decision references it. Its type used to come from the FIRST column with that name, so an all-wildcard, untyped Age in table First deleted table Second declaration Age : Number from the shared node: <variable name="Age"/> with no typeRef, at exit 0 with no diagnostic, on trunk 18481de and on 2c64890 alike. A Nothing displacing a Just, found by the audit of docket queue item #10. Untyped is consistent with every type, so it cannot conflict with one; two columns that declare DIFFERENT types are warned by policy/xml-inputdata-name-type-conflict, and there the first declaration still wins. What is pinned: <variable id="informationItem_1" name="Age" typeRef="number"/>.'
SOURCE='src/DMN/Translate/XML.hs definitionsOf inputVars'
ARGS='--to=xml input.md'
