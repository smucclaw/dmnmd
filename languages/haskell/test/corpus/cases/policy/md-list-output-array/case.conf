TITLE='a [T]-typed OUTPUT column emits a real array in TS/JS/PY, one element per comma-separated member'
WHY='This is the ONE piece of genuine list awareness anywhere in the tree, and until
now it was covered by no test and no corpus case.

FEELhelpers.showFeels decides whether to "squash" a cell to its head or wrap it
as an array, and the test is the column type:

  squash = maybe True (\case DMN_List _ -> False; _ -> True) (vartype ch)

So `sides : [String] (out)` with a cell `fries, slaw` emits

  return {"sides":["fries","slaw"]};

which is correct, and a single-member cell `soup` emits `{"sides":["soup"]}`,
also correct - a one-element list, not a bare scalar.

RECORDED AS POLICY BECAUSE IT IS RIGHT. It is being pinned now, before the cell
layer is reworked to make a list-typed column mean list TESTS on the input side,
precisely because a refactor there could break this with nothing noticing. If
this recording moves, the fix is to the code, not to the recording.

Deliberately NO wildcard row in this fixture: a `-` output cell in a list column
emits {"sides":[undefined]}, which is wrong, and mixing the two into one case
would put a defect under `policy/` where a correct fix would look like a
regression. That half is recorded separately as
symptom/md-list-output-wildcard-undefined.'
SOURCE='src/DMN/Translate/FEELhelpers.hs:25-30 showFeels squash test; src/DMN/Translate/FEELhelpers.hs:22-23 wrapArray'
ARGS='--to=ts input.md'
