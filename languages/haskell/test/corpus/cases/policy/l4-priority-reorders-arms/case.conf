TITLE='hit policy P reorders the BRANCH arms by output enum priority, not by row order'
WHY='CLAUDE.md: Priority reorders arms through outputOrder, the same function evalTable uses, rather than by row order. This is the same table as policy/eval-hp-priority, so the interpreter and the backend can be compared on one input. The enum subhead ranks Stew first, so the all-wildcard row is lifted to the FIRST arm and renders as IF TRUE THEN Stew, which makes every later arm dead. That looks degenerate but is correct: under P every input matches the wildcard row and that row has the highest output priority, so the table really does always answer Stew, and a first-match BRANCH over priority-sorted rows computes exactly the highest-priority match. The recording is discriminating - flip the hit policy to F on the identical table and the output becomes kids, then Spareribs, then OTHERWISE Stew, a different arm order AND a different OTHERWISE, so a rewrite that quietly degraded P into F cannot pass this. It additionally pins two things nothing else covers: that a non-trailing all-wildcard row renders as TRUE padded to the grid width by trueIfBlank rather than being lifted into the OTHERWISE, and that the HP_Priority arm passes Nothing for catchAll, so the OTHERWISE is never the output of a catch-all row. Real l4 check succeeds, exit 0.

UPDATED when L4 sum types landed. The output column declares a domain, so it
emits DECLARE Dish IS ONE OF and arms THEN <ctor>.
WHAT THIS CASE TESTS IS UNCHANGED: the higher-priority arm must still be emitted
FIRST, so a first-match BRANCH agrees with evalTable outputOrder. Read the arm
ORDER here, not the arm spelling.

UPDATED again for D-22 part 4. HP_Priority hardwires catchAll = Nothing while
still turning the all-wildcard row into a vacuously-true ARM, so the table is
total and its OTHERWISE is unreachable, but it must still typecheck, and a sum
type has no sentinel. This recording used to read GIVETH A MAYBE Dish, with JUST
arms and OTHERWISE NOTHING, whose NOTHING could never happen. Now the result is
bare, and the OTHERWISE is the value of the LAST arm in priority order, kids,
whose guard is dropped. That value is unreachable here, because IF TRUE comes
first: it is the arm taken from the sorted order, not a claim that kids is the
default. It is the last of the SORTED arms and not the last ROW, which is the
wildcard row and would have given Stew. Verified for D-22 part 4: l4 check
succeeds on the recorded output.'
SOURCE='src/DMN/Translate/L4.hs the (armRows, catchAll) HP_Priority arm and trueIfBlank; src/DMN/DecisionTable.hs outputOrder'
ARGS='--to=l4 input.md'
