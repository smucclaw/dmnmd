TITLE='hit policy P reorders the BRANCH arms by output enum priority, not by row order'
WHY='CLAUDE.md: Priority reorders arms through outputOrder, the same function evalTable uses, rather than by row order. This is the same table as policy/eval-hp-priority, so the interpreter and the backend can be compared on one input. The enum subhead ranks Stew first, so the all-wildcard row is lifted to the FIRST arm and renders as IF TRUE THEN Stew, which makes every later arm dead. That looks degenerate but is correct: under P every input matches the wildcard row and that row has the highest output priority, so the table really does always answer Stew, and a first-match BRANCH over priority-sorted rows computes exactly the highest-priority match. The recording is discriminating - flip the hit policy to F on the identical table and the output becomes kids, then Spareribs, then OTHERWISE Stew, a different arm order AND a different OTHERWISE, so a rewrite that quietly degraded P into F cannot pass this. It additionally pins two things nothing else covers: that a non-trailing all-wildcard row renders as TRUE padded to the grid width by trueIfBlank rather than being lifted into the OTHERWISE, and that the HP_Priority arm passes Nothing for catchAll so the OTHERWISE falls to the type sentinel. Real l4 check succeeds, exit 0.'
SOURCE='src/DMN/Translate/L4.hs the (armRows, catchAll) HP_Priority arm and trueIfBlank; src/DMN/DecisionTable.hs outputOrder'
ARGS='--to=l4 input.md'
