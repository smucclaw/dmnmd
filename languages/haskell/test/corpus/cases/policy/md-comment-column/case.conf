TITLE='a (comment) column is carried through as a comment and never becomes a guard'
WHY='The (comment) label appeared in the corpus only inside a symptom case. It
matters more than it looks: a comment column holds free prose, so if the rewrite
ever let one leak into the guard or the inference pass, arbitrary English would
start being parsed as S-FEEL — which is exactly the failure mode behind
symptom/infer-prose-with-angle-crash and -with-dots-crash. This case pins that
the column stays inert.'
SOURCE='src/DMN/ParseTable.hs column label parsing; src/DMN/Translate/JS.hs'
ARGS='--to=ts input.md'
