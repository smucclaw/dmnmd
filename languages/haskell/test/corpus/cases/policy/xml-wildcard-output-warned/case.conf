TITLE='a wildcard OUTPUT cell has no DMN spelling; dmnmd writes an empty <text/> and says what a conformant engine will make of it'
WHY='`-` in an output column parses to FAnything and every other backend emits its own "no value" (undefined in ts/js, None in py). DMN has no <outputEntry> spelling for it: `-` is unary-test syntax (§9.2 rule 12) and an <outputEntry> is a tLiteralExpression, so the two are different grammars and only <inputEntry> admits the dash.

dmnmd writes an empty <text/>. That is the honest choice available: dmnmd own reader reads it back as the same FAnything, so the round trip is exact, and the alternative spellings are worse - a literal `-` is a FEEL syntax error, and inventing a value would be the silent wrong answer this whole backend is arranged to avoid.

But exactness for dmnmd is not conformance. Another engine reads a rule with an empty output entry as producing null, which is a different statement from dmnmd undefined, so the author is told - loudly, with the table, column and row - rather than left to find out from Camunda. Exit status is 0: a Warning means something was said, not that anything was refused.

Nobody had this construct on a fidelity list before it was measured. It was found by Survey B probing FAnything in an output column, not by reading the spec.'
SOURCE='src/DMN/Translate/XML.hs fidelityDiags outputWildcardWarns; DMN13.xsd tDecisionRule/outputEntry is tLiteralExpression; DMN 1.3 §9.2 rule 12'
ARGS='--to=xml input.md'
