TITLE='a data row with fewer cells than the header is refused, naming the first column it does not reach'
WHY='Until this was fixed the case was symptom/struct-short-row-truncated: zipWith truncates to the shorter list at three places (mkFEELCol, getInputs and getOutputs, and matches), so a missing input cell was not a wildcard written down but a guard that was never emitted, and the rule fired for any value of that input; a missing output cell became an empty answer; nothing warned. Now ParseTable.rowArityDiags compares the row width with the header and the table is refused at exit 1 with nothing emitted. The message names the table, the first column the row does not reach and the row number the author wrote, says that dmnmd does not pad a short row, and says the repair: fill in the missing cells, writing - for an input that should match anything. Padding with - would WIDEN the rule in silence, which is why --to=xml and the XML reader already refused a short row; policy/xml-short-row-refused pins that this table is still not emitted as XML. The same refusal covers every row, so a table whose rows are all short is refused too (policy/md-all-short-rows-refused).'
SOURCE='src/DMN/ParseTable.hs rowArityDiags, called from parseDataRow; audit lens "table structure", finding 27; audit 10 finding f2; chosen in the branch fix/audit10-parser-silent-drops (assumed, not ruled)'
ARGS='--to=ts input.md'
