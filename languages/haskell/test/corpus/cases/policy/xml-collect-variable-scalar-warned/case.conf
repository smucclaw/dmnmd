TITLE='under COLLECT, a <variable> typed as a SINGLE value contradicts the hit policy: warned, not applied, column inferred'
WHY='A list-valued hit policy makes the decision result a list, so a scalar typeRef on the decision variable cannot be the type of the result. dmnmd does not pick a reading of a self-contradictory document. It does not apply the type to the output column, infers the column from its cells, and says so in a warning. Applying "number" here would refuse both string cells; ignoring it in silence, as trunk 18481de and 2c64890 both did, is the Nothing-with-no-diagnostic shape the audit of docket queue item #10 exists to remove. What is pinned: a warning naming typeRef "number", the cells emitted as the strings "gold" and "silver", exit 0.'
SOURCE='src/DMN/XML/XmlToDmnmd.hs resolveElementType'
ARGS='-f xml --to=ts input.dmn'
