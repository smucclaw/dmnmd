TITLE='an A table over a collection column is not analysed for conflicts, keeps its warning, and still refuses disagreement at run time'
WHY='The ANY twin of `policy/eval-unique-collection-overlap-at-runtime`, and the same reasoning: regions do not model membership, so this table is read with a warning, and a collection holding both 5 and 7 matches two rules that disagree. The -q interpreter refuses that input at run time: multiple distinct rows returned. A collection holding only 5 answers pass. It takes over a role `policy/eval-hp-any-two-rows-disagree` had until D-22 part 2 made the reader refuse that table: every other ANY case agrees, so only a disagreeing one can catch an HP_Any arm that merely stopped refusing, and this is now the one that reaches that arm through the binary.'
SOURCE='src/DMN/DecisionTable.hs evalTable HP_Any arm, tableWarnings; src/DMN/Regions.hs CollectionColumn; DECISIONS.md D-5, D-22'
ARGS='-q -t ts input.md'
STDIN_FILE='stdin'
