TITLE='a refused cell in the SUB-HEADER row is located to table and column, with no row segment'
WHY='The sub-header row declares what a column may hold; it has no rule number, so there is none to print. The house style omits the row segment entirely rather than inventing a phrase for it -- exactly as policy/enum-domain-empty-member-refused already does when domainErrors complains about a sub-header. Naming it would also be a lie in the commonest case: a row with a blank leftmost cell is swallowed INTO the sub-header (symptom/struct-blank-rownum-swallowed), so an author who merely forgot a rule number would be told something about a declared domain they never wrote. This case exists because that Nothing arm has no other coverage and a message shape with no test is a message shape that drifts.

This WHY used to end by claiming the case was told apart from its twin, policy/num-subheader-inferred-refused, "only by the source position, mkFsAt here and mkFAt there", and that the pair was "the live demonstration of why test/corpus/README.md keeps source positions in the recordings". Both halves are RETRACTED (D-7). The runner scrub_positions every .hs:N:C to .hs:LINE:COL before deciding whether a diff is a regression, so a swap between the two wrappers was already classified cosmetic and already exited 0 -- the positions never enforced anything, and after D-7 there is no CallStack in either recording to compare. What actually separates this case from its twin is its INPUT: here the column is declared "Amount : Number", there it is bare and inferred. The wrapper distinction now lives in test/Spec.hs, in "located cell refusals (mkFsAt / mkFAt)", which calls each by name.'
SOURCE='src/DMN/ParseTable.hs parseTable sub-header zipWith, via DMN.DecisionTable.mkFsAt with siteRow = Nothing'
ARGS='--to=ts input.md'
