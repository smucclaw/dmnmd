TITLE='a refused cell in the SUB-HEADER row is located to table and column, with no row segment'
WHY='The sub-header row declares what a column may hold; it has no rule number, so there is none to print. The house style omits the row segment entirely rather than inventing a phrase for it -- exactly as policy/enum-domain-empty-member-refused already does when domainErrors complains about a sub-header. Naming it would also be a lie in the commonest case: a row with a blank leftmost cell is swallowed INTO the sub-header (symptom/struct-blank-rownum-swallowed), so an author who merely forgot a rule number would be told something about a declared domain they never wrote. This case exists because that Nothing arm has no other coverage and a message shape with no test is a message shape that drifts. Read it against its twin, policy/num-subheader-inferred-refused: same input shape, same column name, same absent row, BYTE-IDENTICAL message text -- the two are told apart only by the source position, mkFsAt here and mkFAt there. That pair is the live demonstration of why test/corpus/README.md keeps source positions in the recordings instead of stripping them.'
SOURCE='src/DMN/ParseTable.hs parseTable sub-header zipWith, via DMN.DecisionTable.mkFsAt with siteRow = Nothing'
ARGS='--to=ts input.md'
