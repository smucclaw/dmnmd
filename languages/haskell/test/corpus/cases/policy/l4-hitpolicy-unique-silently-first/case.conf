TITLE='a Unique table whose rules overlap is refused before the L4 backend can turn it into a first-match BRANCH'
WHY='FIXED by D-22 part 2, and moved from symptom/ under its old slug, which names the defect it used to record. WHAT IT DID: this table is marked U and its two rules overlap on [10..20]. The L4 backend emitted the same first-match BRANCH it emits for F, so Age 15 answered 5 purely because that arm is written first, at exit 0 with empty stderr. DMN Unique means at most one rule may match, so the substitution was observable rather than academic, and one half of dmnmd (the -q interpreter, at run time) called the table an authoring error while the other half quietly picked a winner. WHAT IT DOES NOW: the reader refuses the table, naming both rows, the witness Age = 10 and the overlap Age is in [10..20], and exits 1 with nothing emitted, so no backend sees it. The L4 backend still emits a first-match BRANCH for a U table. But for every table the region checker analyses, a U table that reaches it has no two rules that can both match apart from a trailing catch-all, which D-22 rule 1 reads as the default and L4 renders as OTHERWISE, so first-match and Unique give the same answer on every input. A U table over a collection column is not analysed (D-22 keeps its overlap warning) and still reaches the backend with that warning, as `policy/list-input-membership-l4` records. The four catch-all recordings this case used to name (md-backend-l4, l4-sumtype-emitted, md-l4-ditto-wide-chars, l4-keyword-column-names-quoted) did not move.'
SOURCE='src/DMN/Regions.hs conflicts, conflictErrors; src/DMN/BuildTable.hs tableErrors; src/DMN/Translate/L4.hs l4Refusal; DECISIONS.md D-22'
ARGS='--to=l4 input.md'
