TITLE='a document mixing two DMN releases'"'"' namespaces is refused, naming both'
WHY='A DMN 1.5 <definitions> whose <decision> subtree is in the DMN 1.3 model namespace. No DMN validator accepts this, and dmnmd refuses it because the pickler tree is built for the ONE release the root element declared. This case is what distinguishes "resolve the release once and thread it" from the cheaper "accept any of a list of namespaces at every position independently": the second reads this file happily and is thereby inventing a dialect nobody else implements, which is the same class of error as accepting input and quietly giving a different answer. Only the OUTERMOST stray element is reported, because an xmlns is inherited by every descendant and one misplaced declaration would otherwise produce a dozen identical lines about one mistake.'
SOURCE='src/DMN/XML/ParseDMN.hs refuseUnmodelled (strayNS); test/dmn15/README.md'
ARGS='-f xml --to=ts input.dmn'
