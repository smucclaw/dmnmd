TITLE='emitting a U table with a trailing catch-all row PROMOTES it to <defaultOutputEntry>, warns, and exits 0'
WHY='D-16 phase 2, superseding the phase-1 recording this case grew out of (it was policy/hp-unique-catchall-warned until then). A row with `-` in every input column matches everything, so under hit policy Unique it overlaps every other rule -- the one thing DMN 1.3 §8.2.10 says a U table must not contain. Phase 1 could only WARN about that and emit the rule anyway, because DecisionTable had no slot for the construct DMN spells the intent as, the default output value of §8.2.11. Phase 2 added the slot (dtDefaultOutput), so the emitter now promotes the shape instead: a TRAILING, comment-free, full-arity catch-all whose outputs are not all wildcards is moved into <defaultOutputEntry> and its <rule> is dropped. The emitted document is genuinely U-conformant -- no rule overlaps any other -- and meaning-preserving for EVERY engine, ordered or not, which is strictly better than the warned hazard it replaces. The reader of dmnmd itself reads the document back into the same DecisionTable, so the promotion is invisible to the round trip: test/roundtrip/run-roundtrip.sh passes this shape byte-identically on both the ts and l4 legs, because dtDefaultOutput comes back filled and the backends render it as the trailing arm it is equivalent to. Still a warning, not silence, for the same reason rowNumberWarns is one: something authored is genuinely dropped -- the NUMBER of the row, which a default has no field for -- and the author should hear that the document spells their row differently than they wrote it. Ineligible catch-alls (mid-table, commented, all-wildcard outputs, or a table that already carries a default) are NOT promoted and keep a phase-1-style warning that names the reason; those are pinned at the hspec level in the TranslateXMLSpec promotion block, because each needs a table this fixture format cannot vary cheaply. What is pinned here: promote, warn once naming the row as the author numbered it, exit 0, and emit a document whose <output> carries the value and whose rule count is one less than the row count of the table.'
SOURCE='src/DMN/Translate/XML.hs promoteTrailingCatchAll; DECISIONS.md D-16'
ARGS='--to=xml input.md'
