TITLE='`Age * 2 + 1` in an OUTPUT cell is refused, and the message names the chaining limit and prints `(Age * 2) + 1`'
WHY='D-15. parseFNF3 accepts exactly ONE top-level operator whose operands may be an atom or a parenthesised sub-expression, so a chain is refused outright -- it is NOT truncated to `Age * 2` with `+ 1` silently dropped, and that fail-closed behaviour is half of what this case pins. The other half is the message. It used to end its list of acceptable forms with "or an arithmetic expression", which offers as acceptable the very construct being refused: `Age * 2 + 1` IS an arithmetic expression in FEEL, and nothing in the message named the limit or the repair. It now names both, and prints `(Age * 2) + 1`, which is ACCEPTED and emits `((Age * 2.0) + 1.0)` -- see policy/md-arith-output for that shape. It also names `Age * -1` and `Age * (-1)` as refused (parseFNF0 uses an UNSIGNED scientific, so a sign is legal only as a whole cell) with `Age * (0 - 1)` and `0 - Age` as the working negations, and it caveats the closing `: String` advice, which is ACCEPTED and turns the formula into the string literal "Age * 2 + 1" at exit 0. Every repair the message offers was emitted to js and py and EXECUTED at Age=3 before this was recorded. notATestMsg is given the cell and not its position and fires for both, which is why it says arithmetic is legal only in an OUTPUT cell; num-arith-chain-refused-input is the twin, and the two recordings differ only in the located site.'
SOURCE='src/DMN/ParseFEEL.hs parseFNF3; src/DMN/ParseCell.hs notATestMsg'
ARGS='--to=ts input.md'
