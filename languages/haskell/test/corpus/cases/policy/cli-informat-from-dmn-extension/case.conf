TITLE='a .dmn file is read as DMN XML without an explicit --from'
WHY='Every xml case in the corpus passes `-f xml`, so nothing pins the extension-based detection that makes `dmnmd model.dmn --to=ts` work at all -- the invocation a user actually types. detectInformat only consults the extension when --from was left at Unknown, and getSame requires every input file to share one extension, so this also pins that a single .dmn argument resolves to Xml rather than falling through to the markdown reader (which would find no pipe tables in the XML and exit 0 with an empty output file -- silent, green, and wrong). The input here is byte-identical to policy/xml-baseline-13, and the emitted output is identical to that case'"'"'s; the identity is the assertion, exactly as it is for the xml-*-namespace-* cases.'
SOURCE='app/Options.hs detectInformat / detectFormat / detectFormat'"'"' / fileExtensionMappings'
ARGS='--to=ts input.dmn'
