TITLE='hit policy A, one matching row: returns that row output once'
WHY='The degenerate ANY table -- a single all-wildcard row -- must return ok. It
is the floor of the policy: if an A table cannot answer when exactly one row
matches and there is nothing to disagree about, the arm is broken outright, which
is what this case recorded for as long as it was a symptom. The guard read
not (null (nub …)) where it meant length (nub …) > 1, so it was never false and
no A table had ever returned an answer.

Kept as a policy case even though the two-row cases subsume it, because it is the
cheapest probe of the arm and it fails for a different reason than they do: a
regression that reintroduced an unconditional refusal surfaces here first and
with the least noise.

On its own this case CANNOT certify D-5. Its table has one row, so the nub is a
singleton whatever the success branch does with it, and a build that returned the
list-valued shape would pass this while doubling every real answer. That is why
it sits beside eval-hp-any-multirow-duplicated, which has two matching rows and
is the case that actually pins single-hit-ness.'
SOURCE='src/DMN/DecisionTable.hs evalTable, the HP_Any arm. DECISIONS.md D-5'
ARGS='-q -t ts input.md'
STDIN_FILE='stdin'
