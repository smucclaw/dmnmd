TITLE='a sub-header row that stops before a trailing annotation column is accepted, and padded with an empty cell'
WHY='A sub-header cell declares the domain of a column, and a comment column declares none, so a sub-header short only by comment columns loses nothing. Trunk accepted it, and ts, js, py and l4 printed exactly what they print for the same table with the missing sub-header cell written as an empty one; --to=xml lost the row comment (the description cheap), which was not traced but is what the merge of a short sub-header into the header does to a column it does not reach. ParseTable.subHeaderArityDiags then refused the row. Now it is accepted again and parseTableBody pads it with an empty cell, which declares no domain, so Colour keeps its declared domain, Price survives as an output, and the annotation column stays in the table in every backend. The expected output of this case is the output of the explicitly-padded table. policy/md-short-subheader-refused is the other side: a sub-header that fails to reach an input or an output column is still refused.'
SOURCE='src/DMN/ParseTable.hs subHeaderArityDiags and parseTableBody; audit 10 finding f1'
ARGS='--to=ts input.md'
