TITLE='an unmodelled typeRef is an Error: the table is refused and the run exits 1'
WHY='Inferring a dmnmd type from the cells of a column whose declared type we do not model risks turning every guard in that column into a string comparison that can never match. Refusing is the intended behaviour. NOTE: test/dmn13/README.md still describes this fixture as "must warn and degrade, not crash"; that description predates the current reader, which errors. The recording here is the behaviour, and the behaviour is what CLAUDE.md "Diagnostics and exit status" prescribes.'
SOURCE='src/DMN/XML/XmlToDmnmd.hs convertType; CLAUDE.md "Diagnostics and exit status"'
ARGS='-f xml --to=ts input.dmn'
