TITLE='a bare `1,000` is refused as thousands-shaped, and the refusal is located'
WHY='This case previously read "a bare 1,000 becomes the OR of 1 and 0" and blamed the comma split for a misparse. THAT DIAGNOSIS WAS RETRACTED and the retraction is part of what this case now records. FEEL has no grouping production -- rule 31 admits no separator, and rules 32-33 are digit = [0-9] and digits = digit , {digit} -- so 1,000 is legally TWO unary tests, 1 and 000, and 000 is a well-formed literal denoting 0. The old output was CONFORMANT. What was wrong was the SILENCE: nobody writing 1,000 in a value column means "1 or 0", and dmnmd said nothing. So the policy is a REFUSAL, not a new parse. Inventing a thousands separator would be a markdown-surface extension under BUILD-SPEC-dmnmd-extensions.md §6, and could not be added without breaking policy/md-multivalue-cell and test/golden/miles-card-dmn.md, whose `4111, 4112` is the same shape. Be clear about what is pinned: dmnmd REFUSES A CELL THAT DMN 1.3 ADMITS. That is a deliberate deviation, discriminated by whitespace -- policy/num-thousands-with-space-accepted is the control and shows that `1, 000` still parses as two alternatives. Whitespace is a convention rather than a rule, so if the discriminator is ever revisited this recording changes, and that is a scope decision rather than a regression. Also pinned: exit 1, nothing emitted, and the location `table "BigSpender": column "Spend": row 1`.'
SOURCE='src/DMN/ParseCell.hs thousandsGrouped; src/DMN/DecisionTable.hs mkFsEither, thousandsMsg; located by mkFsAt'
ARGS='--to=ts input.md'
