TITLE='with --asserts, a block that names two points is asserted at both, so a closed upper bound is exercised at the bound'
WHY='DMN.Regions cuts Age at 18 and 21 and gives each its own point piece, but the pieces [18], (18, 21) and [21] are live for the same rules (the rules >= 18 and <= 21), so they are one block, [18..21].
A block has one representative, the lowest value a cell names in it, 18, so one assertion per region never visits Age = 21, the closed upper bound of the rule <= 21.
With <= written as < in the L4 emitter every assertion still held: a blind spot found by a mutation test after the first version of --asserts landed.
Where a Number block names a higher point than its representative, a region now gets a second assertion straight after the first, at the top input: every column at the highest value its block names.
Here that is Age = 21 in the three regions of the middle block, marked with a trailing comment and counted in the header: 9 regions, 12 asserted.
The nine first assertions are what they were, in the same order.
The expected values are the interpreter answers (evalTable), so Age = 21 expects the answer for the rules >= 18 and <= 21, not the answer for an age of 22.
policy/md-prefix-comparisons is the same table without the flag.'
SOURCE='src/DMN/Translate/L4.hs assertLines; src/DMN/Regions.hs blockTop, regionTopInput; DECISIONS.md D-21 Implementation step 2'
ARGS='--to=l4 --asserts input.md'
