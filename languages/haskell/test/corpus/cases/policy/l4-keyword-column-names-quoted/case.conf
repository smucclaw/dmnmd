TITLE='input column names that are L4 keywords are backtick-quoted in the GIVEN block, the function header and the guards'
WHY='CLAUDE.md states that column, table and field names which are L4 keywords get backtick-quoted, and nothing in the corpus held the backend to it: every existing L4 recording uses names like Season, Guests, Dish and Merchant, not one of which is in reservedWordsL4, so the entire quoting path was unexercised. This table names its input columns GIVEN and THEN, both reserved, and they come out quoted in all three positions the backend writes a variable: GIVEN backtick-GIVEN IS A STRING in the parameter block, backtick-GIVEN backtick-THEN on the function header, and IF backtick-GIVEN EQUALS Fall AND backtick-THEN <= 8 in the guard. Verified beyond the bytes: real l4 check succeeds on this output, exit 0. Without the quoting the emitted GIVEN GIVEN IS A STRING is a parse error, so this pins a correctness property rather than a formatting preference. Deliberately single-output so it does not overlap symptom/l4-record-name-keyword-unquoted, which is about the record TYPE name that quoteVar never sees; the table name here is Reserved, which is not a keyword.'
SOURCE='src/DMN/Translate/L4.hs quoteVar / isReservedL4 / reservedWordsL4; BUILD-SPEC-dmnmd-to-l4.md section 9.6; CLAUDE.md '"'"'Column/table/field names that are L4 keywords get backtick-quoted'"'"''
ARGS='--to=l4 input.md'
