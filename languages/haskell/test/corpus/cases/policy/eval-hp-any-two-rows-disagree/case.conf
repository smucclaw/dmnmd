TITLE='hit policy A, two rules whose outputs DISAGREE where both match: refused when the table is read'
WHY='Rows 1 and 2 both match every Age below 10 and name different Verdicts, so under DMN the table is ill-defined: ANY permits multiple matches, not multiple ANSWERS (DMN 1.3 §8.2.10). Since D-22 part 2 the reader refuses it statically, naming both rows, the witness Age = 9, the overlap Age < 10 and the outputs that disagree, and exits 1 before the -q interpreter reads any input. Before that, the refusal came from evalTable at run time, for the input 5, at exit 0, and the table was otherwise accepted. This case used to be the only ANY case that could catch an interpreter arm that merely stopped refusing, because every other ANY case agrees. That role is now `policy/eval-hp-any-collection-disagree-at-runtime`, whose collection column the region checker does not analyse. The second output is spelled deny rather than no on purpose. A no cell infers as Boolean, and D-2 anchored inference then refuses the whole column, so the recording would carry a second refusal about a different defect beside this one. Anyone rewriting this fixture should keep the outputs clear of the boolean vocabulary.'
SOURCE='src/DMN/Regions.hs conflicts, conflictErrors; src/DMN/DecisionTable.hs evalTable, the HP_Any arm. DECISIONS.md D-5, D-22'
ARGS='-q -t ts input.md'
STDIN_FILE='stdin'
