TITLE='hit policy A, two matching rows whose outputs DISAGREE: refused, and this is the only ANY case that can catch an arm that merely stopped refusing'
WHY='Age 5 matches both rules and they name different Verdicts, so under DMN the
table is ill-defined and refusing is the correct answer. ANY permits multiple
matches, not multiple ANSWERS.

This is the control for D-5 and the reason it exists is that every other ANY case
in the corpus AGREES. All of them are satisfied by an arm that simply stopped
refusing altogether -- delete the conflict branch and they go green. Only this
case notices. It was recorded before the fix, deliberately, and it is the one ANY
recording that did NOT change when the fix landed: the message text is
byte-identical either side of D-5.

That invariance is the whole point, and it is also what makes the case worth
reading. Before the fix this text was what EVERY A table got, well-formed or not.
After it, the text is reached only by a genuine conflict. Same bytes, opposite
meaning -- so the recording alone cannot tell you which build produced it, and
eval-hp-any-multirow-duplicated is what disambiguates.

The second output is spelled deny rather than no on purpose. A no cell infers as
Boolean, and D-2 anchored inference then refuses the whole column at exit 1
before evalTable is reached -- a refusal that looks like this defect and is not
it. Anyone rewriting this fixture should keep the outputs clear of the boolean
vocabulary.'
SOURCE='src/DMN/DecisionTable.hs evalTable, the HP_Any arm. DECISIONS.md D-5'
ARGS='-q -t ts input.md'
STDIN_FILE='stdin'
