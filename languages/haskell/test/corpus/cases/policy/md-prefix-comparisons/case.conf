TITLE='prefix comparisons < <= > >= are parsed correctly'
WHY='The prefix arms are the ones that are right today. `< 18` must stay `Age < 18.0`, and the strictness must not flip. This is the direct control for the four suffix cases, `policy/num-suffix-*-mirrored` (this said they were under symptom/, which they no longer are). RE-FIXTURED under D-22 part 2. The table used to hold all four comparisons on one column, `< 18`, `<= 21`, `> 65` and `>= 40`, plus a trailing catch-all. `< 18` and `<= 21` both match below 18, and `> 65` and `>= 40` both match above 65, which D-22 refuses, so that table is now `policy/hp-unique-overlap-comparisons-refused`. Four half-lines on one column cannot be pairwise disjoint, so a second column, Scheme, separates two pairs, and each pair meets at its threshold with opposite strictness: 18 is in `>= 18` and not in `< 18`, and 21 is in `<= 21` and not in `> 21`. So the strictness is now pinned twice, by the emitted text and by the conflict check: writing `<= 18` in row 1, or `>= 21` in row 4, makes that pair overlap at its threshold and the table is refused (both run by hand on 2026-09-29).'
SOURCE='src/DMN/DecisionTable.hs mkFEither, the four isPrefixOf arms; src/DMN/Regions.hs conflictErrors'
ARGS='--to=ts input.md'
