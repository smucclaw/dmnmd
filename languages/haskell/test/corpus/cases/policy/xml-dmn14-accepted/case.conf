TITLE='a DMN 1.4 document reads, and its DMNDI namespace is DMN 1.3'"'"'s rather than 1.4'"'"'s'
WHY='This case exists for one reason, and it guards a mistake nothing else in the repo can see. DMN 1.4 pairs a 1.4 MODEL namespace with the 1.3 DMNDI namespace: DMN14.xsd declares xmlns=".../20211108/MODEL/" and then imports namespace=".../20191111/DMNDI/" schemaLocation="DMNDI13.xsd", and the OMG ships no DMNDI14.xsd at all. A release is therefore two INDEPENDENT URIs, not one date substituted into a template — any mkRelease :: Date -> DmnRelease is wrong on its first use — and because both fields are Strings, getting one wrong compiles cleanly, matches nothing, and makes the <dmndi:DMNDI> subtree resurface as a generic "xpCheckEmptyContents: unprocessed XML content", which is exactly the failure mode the by-name refusals exist to eliminate, arriving by the back door. Verified by introducing the error rather than by argument: setting DMN 1.4''s DMNDI URI to .../20211108/DMNDI/ (the date-template guess) turns THIS CASE AND ONLY THIS CASE red, because 1.4 is the only release whose DMNDI date differs from its model date. The blunter error of writing relModelNS where relDmndiNS was meant is caught more widely — three policy cases, including the pre-existing xml-no-decision-exits-zero. NOTE that the input must keep its <dmndi:DMNDI> element: the pickler is xpOption, so a document that merely declares the prefix without using it accepts whatever URI you give it, and this fixture caught nothing at all until the element was added.'
SOURCE='src/DMN/XML/ParseDMN.hs DmnRelease (relModelNS vs relDmndiNS), xpDMNDIElem; DMN14.xsd:3-9; test/dmn15/README.md'
ARGS='-f xml --to=ts input.dmn'
