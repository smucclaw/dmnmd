TITLE='a multi-output tables mk helper takes the FIELD types, so a domained column is a sum type on both sides'
WHY='Two output columns, one of them domained. The record says `dish IS A Dish`, and
the mkPlan helper that builds it must accept a Dish - not a STRING.

It used to emit `GIVEN v1 IS A STRING` against `dish IS A Dish`, because
declareRecord used colTypeL4 while ctorHelper used type2l4. Two functions
answering the same question differently, which is the shape of most bugs in this
backend.

WHAT MADE IT HARD TO READ was that l4 did not report a type error. It reported an
AMBIGUITY, on the record name:

  There are multiple definitions for the identifier Plan
    Plan (defined at multi.l4:19:1-5) of type FUNCTION FROM NUMBER TO Plan
    Plan (defined at multi.l4:6:9-13) of type FUNCTION FROM Dish AND STRING TO Plan

because `Plan` names both the record constructor and the decision function, and
l4 resolves an overloaded name by the EXPECTED TYPE AT THE USE SITE. With the
parameter types wrong neither candidate fitted, so instead of "STRING is not
Dish" it said "I cannot tell which Plan you meant". The record/function name
collision was a red herring: the same two names coexist happily once the types
line up, which this recording shows.

Worth remembering when reading any l4 diagnostic: an ambiguity complaint about an
overloaded name may be a TYPE error wearing a disguise. Check whether the types
you emitted are the ones you meant before you go looking for a naming problem.'
SOURCE='src/DMN/Translate/L4.hs ctorHelper pdecl (colTypeL4, not type2l4); declareRecord'
ARGS='--to=l4 input.md'
