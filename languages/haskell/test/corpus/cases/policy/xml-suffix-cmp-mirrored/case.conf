TITLE='D-11: the suffix comparison 5 <= is emitted as >= 5, and NOTHING in the emitter can tell that it happened'
WHY='DECISIONS.md D-11 keeps dmnmd suffix comparison (`5 <=` meaning `>= 5`) as a deliberate extension, on the grounds that S-FEEL operator slot is prefix-only and there is no <inputEntry> spelling for the suffix form. It records a price: "--to=xml must emit the mirrored form and record a fidelity note. Correct, but no longer isomorphic to the source."

Half of that price is paid here and is what this case records: the emitted <inputEntry> reads `>= 5`, which is the correct prefix spelling of the same test.

The other half CANNOT BE PAID WHERE D-11 SAYS, and this case exists to pin that too. DMN.ParseCell.suffixCmp mirrors the cell at PARSE time - `5 <=` is built directly as FSection Fgte (VN 5) - and DMN.Types.FEELexp has no provenance field. By the time any backend sees the table, `5 <=` and `>= 5` are the same value, indistinguishable by construction. So the emitter has nothing to detect and no note to raise; a diagnostic claiming to fire on the suffix form would be one that never fires.

The empirical proof is in the round-trip harness: the four policy/num-suffix-* fixtures round-trip CLEAN (md --to=xml | --from=xml --to=ts is byte-identical to md --to=ts), because both routes canonicalise identically. D-11 was amended rather than left to be discovered.

The three ways to pay it properly, none of which belongs in this commit: add provenance to FSection (touches every backend and its Eq); warn at parse time unconditionally, which needs the markdown warning channel D-7 has not landed; or accept that the record IS the note - which is what this case is.'
SOURCE='DMN/ParseCell.hs suffixCmp; DMN/Types.hs FEELexp (no provenance); src/DMN/Translate/XML.hs showFeelXML; DECISIONS.md D-11, as amended'
ARGS='--to=xml input.md'
