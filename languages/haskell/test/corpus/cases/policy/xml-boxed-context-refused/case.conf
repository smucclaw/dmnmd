TITLE='an unmodelled DMN 1.3 boxed expression is refused BY NAME, not by a generic unpickling failure'
WHY='Seven global elements substitute for "expression" in DMN13.xsd; dmnmd models two, <decisionTable> and <literalExpression>. The other five -- <context>, <invocation>, <functionDefinition>, <relation>, <list> -- have never been modelled and used to reach the generic "dmnmd could not read this DMN 1.3 document" plus a raw hxt xpCheckEmptyContents dump, which names neither the construct nor where it is. readerRefusal could not have caught them at any price: it scans the DIRECT CHILDREN of <definitions>, and a boxed expression sits inside a <decision>. refuseUnmodelled scans the whole document (multi) and already knew how to name an element, say what it is, say which release added it and locate it under its owner -- it simply had no entry for the 1.3 five. Measured: <context> appears in 8 of the 355 documents in an l4-ide corpus export. What is pinned: the construct sentence naming <context>, what it is, "added in DMN 1.3", and the owning decision by NAME; exit 1; and the ABSENCE of both "could not read this" and "xpCheckEmptyContents". Also pinned by omission: the closing advice does NOT mention <typeConstraint> here, because none is present -- that clause appears only when a <typeConstraint> is actually among the offenders, as in policy/xml-typeconstraint-refused, whose own 1.3 document does contain one.'
SOURCE='src/DMN/XML/ParseDMN.hs unmodelledConstructs (the DMN 1.3 block) and refuseUnmodelled'
ARGS='-f xml --to=ts input.dmn'
