TITLE='an inferred y/n column is Boolean and BUILDS -- the three boolean vocabularies now agree'
WHY='Not D-2: inference resolved this column, and it resolved CORRECTLY -- a y/n column is Boolean and refusing it would be the wrong answer. What was broken is that mkVB could not build what inference accepted. Its FALSE list read ["false","no","t","y","negative"], a copy-paste of the TRUE list short forms, so "t" and "y" were dead there (the true guard fires first) and "f" and "n" were in NEITHER list. yes/no always worked, which is what made this easy to miss for so long.'
SOURCE='src/DMN/DecisionTable.hs mkFEither mkVB, the false-value list'
ARGS='--to=ts input.md'
