TITLE='with --asserts, --to=l4 appends one #ASSERT per region, each equal to what the interpreter answers there'
WHY='DECISIONS.md D-21 step 2.
Each region of the table (DMN.Regions) is one set of inputs on which every rule matches throughout or not at all, so one #ASSERT per region covers every distinguishable behaviour of the table.
The expected value is the interpreter answer (evalTable) at the region representative input: JUST (mkEligible ...) where a rule matches, NOTHING where none does.
A negative input or output is parenthesised.
This table has no rule for a minor who is a member and none for a senior who is not, so two regions answer NOTHING and the result is a MAYBE.
Run under the real l4 (l4 check, then l4 run) every one of these assertions is satisfied; the hspec cross-check in EmitAssertsSpec does that for every markdown fixture.
Without the flag the output is exactly what it was before the flag existed, which backend-baseline.sh checks.'
SOURCE='src/DMN/Translate/L4.hs assertLines; app/Main.hs renderAll; DECISIONS.md D-21 Implementation step 2'
ARGS='--to=l4 --asserts input.md'
