TITLE='a <decisionTable typeRef> is NOT applied to the columns of a MULTI-output table'
WHY='The negative control for xml-decision-table-typeref-types-single-output, and the reason that case is guarded on the output count rather than written as a plain fallback. DMN puts a column type on its own <output> clause only when the table has more than one output; the table-level typeRef then names the type of the whole result, a composite whose type is an <itemDefinition>, not the type of any one column. So here "rank", which declares no typeRef of its own, must still be INFERRED, and its bare numerals make it a Number: the ts output has 7.0 and 8.0 unquoted. If they come back as "7" and "8" the guard has been dropped and every untyped column of every multi-output table is taking the composite type, which is a silent wrong answer at exit 0 in the opposite direction from the defect the sibling case fixes.'
SOURCE='src/DMN/XML/XmlToDmnmd.hs convTable singleOutput (the `case dtOutput of [_] -> Just SingleOutput {..}; _ -> Nothing` guard)'
ARGS='-f xml --to=ts input.dmn'
