TITLE='a COLLECT COUNT table with a declared String column of numerals survives --to=xml then --from=xml'
WHY='Not a markdown defect: this case exists for the round-trip gate (test/roundtrip/run-roundtrip.sh collects every corpus input.md), which had a recorded blind spot. Under COLLECT COUNT the decision variable types the COUNT (DMN 1.3 section 8.2.10), so dmnmd writes a counted column with no type anywhere in the document, and the XML reader recovers the column type by inference. The cells here are written as the FEEL strings "5" and "6". Before the XML inference pre-pass kept the quotes of the cells it grades (audit finding f4), that inference read them as the numbers 5 and 6, and the round trip changed the output from {"Flag":"5"} to {"Flag":5.0}. The gate did not see it because no fixture exercised the shape; run against the pre-fix binary this case fails with "differs after round trip". What is pinned here is the direct output, {"Flag":"5"} and {"Flag":"6"}; the round-trip comparison is run-roundtrip.sh.'
SOURCE='src/DMN/XML/XmlToDmnmd.hs resolveColumn; src/DMN/Translate/XML.hs resultTypeOf (ResultIsCount); test/roundtrip/run-roundtrip.sh; audit 2026-09-26 finding f4'
ARGS='--to=ts input.md'
