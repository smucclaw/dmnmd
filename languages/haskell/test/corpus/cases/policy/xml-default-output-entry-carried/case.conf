TITLE='a <defaultOutputEntry> is CARRIED into dtDefaultOutput and rendered, no longer warned about and dropped'
WHY='D-16 phase 2, superseding the drop this case used to pin (it was policy/xml-default-output-entry-warns until then, whose WHY was the governing rule itself: parse-but-not-honour must be loud). The rule is now discharged the better way -- the value is HONOURED. The reader parses the default at the column type through the same mkCells its ordinary cells go through, stores it in dtDefaultOutput, and the backends render it: js/ts/py as the trailing default arm (rowsPlusDefault materialises it as the catch-all row it is equivalent to under first-match, numbered one past the rules), l4 as the OTHERWISE, and evalTable answers it exactly when no rule matches. What is pinned: no warning about the default (the only stderr line left is the unrelated DRG drop), exit 0, and a generated function whose final arm returns the declared value -- here else if ("default") returning "unknown". If this case ever regrows the "does not carry" warning, the slot has been disconnected from the reader; if the final arm disappears from the ts output, the backends have stopped rendering the slot.'
SOURCE='src/DMN/XML/XmlToDmnmd.hs resolveColumn/convTable; src/DMN/Types.hs rowsPlusDefault; DECISIONS.md D-16'
ARGS='-f xml --to=ts input.dmn'
