TITLE='`40 - 50` in an INPUT cell is refused as arithmetic, located, and told to write [40..50]'
WHY='The worst-shaped defect in the num cluster. `40 - 50` is arithmetic -- S-FEEL writes ranges [40..50] -- and it parsed as such, but an INPUT entry has no arithmetic production (rule 12): a unary test is a value, a comparison, an interval, or "-". The consequence was not a near-miss. fEval has no FFunction arm, so the cell could never match anything; it could only reach a backend, where it became the JavaScript guard `(40.0 - 50.0)` -- the input variable dropped ENTIRELY and the guard unconditionally truthy. Every row below it was dead. Refused in structuralErrors, where the row number and column name are in scope, so it is located without any new plumbing. Note what is NOT refused: arithmetic in an OUTPUT cell is a rule 3 simple expression and stays legal -- see policy/md-arith-output.'
SOURCE='src/DMN/DecisionTable.hs structuralErrors, inputArithErrs'
ARGS='--to=ts input.md'
