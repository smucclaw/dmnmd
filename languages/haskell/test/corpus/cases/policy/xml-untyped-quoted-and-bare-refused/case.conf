TITLE='an untyped XML input column mixing the string "2020" with the number 2021 is refused, not read as all-Number'
WHY='A column has one type, so a document that mixes a FEEL string literal ("2020") with a number (2021) in one untyped column is not describing one. D-2 refuses a column whose cells disagree (VConflict), and it can only do that if it sees the quotes. The XML inference pre-pass used to strip them first, so "2020" and 2021 were the same evidence, the column was quietly Number, and the string 2020 was rewritten as the number 2020 at exit 0: year === 2020.0 where the document says year === "2020". Two places had to change for the refusal to appear, and the second is the easy one to miss: the pre-pass now grades the cells with their quotes, and the cells of a column it could not settle are built with their quotes too (XmlToDmnmd.resolveColumn, cellsAt), because tableErrors asks columnVerdict the same question of the BUILT cells, and built without quotes they read as two numerals and the conflict went unreported. What is pinned: exit 1, nothing emitted, the D-2 error naming both cells.'
SOURCE='src/DMN/XML/XmlToDmnmd.hs resolveColumn (firstPass, cellsAt); src/DMN/DecisionTable.hs mkFsKeepingQuotes, columnVerdict, inferenceErrors; audit 2026-09-26 finding f4'
ARGS='-f xml --to=ts input.dmn'
