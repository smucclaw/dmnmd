TITLE='`Infinity` is refused, and located -- rule 31 has no such literal'
WHY='The most dangerous of the rule-31 family, because the old behaviour was not a crash. `Infinity` was emitted verbatim into the JavaScript guard at exit 0, where it happens to MEAN something, so the generated code compiled and ran and simply was not DMN; the same cell emitted a bare undefined name in Python. FEEL has no infinity literal, so dmnmd refuses the cell. Pinned: refuse, exit 1, emit nothing, and locate -- `table "Inf": column "X": row 1`. A backend that silently agrees with the host language is exactly the class of wrong answer this project refuses to ship.'
SOURCE='src/DMN/ParseCell.hs numericLiteral; located by DMN.DecisionTable.mkFsAt'
ARGS='--to=ts input.md'
