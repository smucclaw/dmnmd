TITLE='--asserts with any output format but l4 is refused up front, not ignored'
WHY='--asserts writes #ASSERT lines into L4 output and means nothing for any other format.
A flag that is accepted and does nothing reads as a check that ran, so it is refused before anything is read, with a message naming what it needs.
Under -q, which writes nothing, it is refused with the same message; with no --to at all the older unsupported-format refusal comes first.
ASSUMED, NOT RULED (D-21 step 2): the flag name and the refusal are choices, made in one commit that touches only app/.'
SOURCE='app/Main.hs main; DECISIONS.md D-21 Implementation step 2'
ARGS='--to=ts --asserts input.md'
