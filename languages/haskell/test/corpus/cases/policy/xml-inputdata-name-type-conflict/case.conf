TITLE='two tables whose same-named input columns have different types are warned, because DMN gives them one <inputData>'
WHY='WHAT IT DOES: table A has x : Number and table B has x : String. The emitted document has ONE <inputData name="x"> whose <variable> carries typeRef="number", and BOTH decisions href it, while table Bs own <inputExpression> says typeRef="string". A warning now names the column, both types and both tables. WHY A WARNING AND NOT A REFUSAL: each table is individually fine, and the emission is the best available reading -- refusing would block a document whose tables merely reuse a common word like amount or date. But the author has to hear it, because the document asserts something the source did not. THE UNDERLYING MISMATCH: the markdown surface has NO global variable scope. Two tables with a column called x are two unrelated columns and nothing in a .md file says otherwise. A DMN document does have one, so definitionsOf dedupes <inputData> by NAME and the emitter necessarily invents an identification the author never made. Fine when the types agree; a contradiction when they do not. WHY THE ROUND TRIP CANNOT SEE THIS: dmnmds reader ignores the DRG entirely (D-6), so md -> XML -> ts is clean either way. The same blind spot hid the duplicate-xsd:ID defect that had to be found by running xmllint by hand. Two independent defects from one gap is the argument for this case existing.'
SOURCE='src/DMN/Translate/XML.hs, crossTableDiags and definitionsOf; DECISIONS.md D-8, D-6'
ARGS='--to=xml input.md'
