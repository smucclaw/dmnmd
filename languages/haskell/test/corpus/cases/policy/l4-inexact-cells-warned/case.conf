TITLE='an output cell whose L4 value dmnmd cannot show to be the DMN one is warned about on stderr and commented above the function, once per cell'
WHY='DMN numbers are decimal128, so a quotient that does not terminate is rounded to 34 significant digits, and L4 divides exactly (D-1).
L4 computes a power with a negative, fractional or non-literal exponent in binary floating point: measured with l4 on 2026-10-15, (EXPONENT 3 (-1)) * 3 EQUALS 1 is false and (EXPONENT 2 0.5) EQUALS 1.4142135623730951 is false.
DECISIONS.md D-24 (FOGHORN, Meng 2026-10-15, option B): --to=l4 keeps emitting, exit 0, but for every such cell it prints a located warning on stderr and writes a comment above the function that says L4 and DMN can differ; the comment names the column and the expression and no row, because the XML round trip moves a trailing catch-all row into a default output value.
Here row 1 divides by 4, which terminates, and is silent; row 2 takes a fractional power and row 3 a power whose exponent is the expression 0 - 1, and each is warned about once, at its row.
The power sentence says floating point, not exact: the sentence for a quotient would be false of a power.
The emitted code is otherwise the code it was before, apart from the exponent being spelled EXPONENT (policy/l4-exponent-prefix-call).'
SOURCE='src/DMN/Translate/L4.hs inexactCells inexactComments inexactDiagnostics; DECISIONS.md D-24'
ARGS='--to=l4 input.md'
