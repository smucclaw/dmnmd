TITLE='a U table over a collection column is not analysed for conflicts, keeps its warning, and still refuses a conflict at run time'
WHY='D-22 keeps the overlap warning for collection-input U and A tables until regions model membership, so `regionMap` declines this table and the reader accepts it, with the warning on stderr. Rules `5` and `7` test membership, so a collection holding both matches both, and the -q interpreter refuses that input at run time: multiple rows returned. A collection holding only 5 answers pass. Since D-22 part 2 every U table the region checker can analyse is refused when it is read if two rules can both match, which is how `policy/md-eval-unique-conflict` stopped reaching the run-time refusal. This case is what still reaches the HP_Unique conflict arm of evalTable through the binary.'
SOURCE='src/DMN/DecisionTable.hs evalTable HP_Unique arm, tableWarnings; src/DMN/Regions.hs CollectionColumn; DECISIONS.md D-22'
ARGS='-q -t ts input.md'
STDIN_FILE='stdin'
