TITLE='<typeConstraint> on an <itemDefinition> is refused by name, not silently dropped'
WHY='DMN 1.5 adds <typeConstraint> (tUnaryTests) to tItemDefinition — the only structural change between DMN 1.4 and 1.5, at DMN15.xsd:239. It is not legal in DMN 1.3 at all, and dmnmd models it in no release. Until the 1.4/1.5 namespace work it was neither honoured nor rejected but SILENTLY DELETED: ItemDefinition''s pickler applies xpFilterCont with a NAME FILTER (the list is itemDefElems), and a name filter deletes every child it does not list, so the element was gone before xpCheckEmptyContents could notice it. In this input <allowedValues> permits "admin", "clerk" and "teller" while <typeConstraint> narrows the type to "admin" alone; dmnmd honoured the first (domainErrors enforces it), discarded the second, and emitted a rule matching "clerk" — a value the document forbids — at exit 0. That is accepting input and quietly giving a different answer, which CLAUDE.md''s governing rule calls strictly worse than rejecting it. This case was recorded as symptom/xml-typeconstraint-dropped-silently against the pre-change binary and moved here once refuseUnmodelled made the refusal named and located, so the recording is evidence that the behaviour changed rather than an assertion that it did. Note that the message says the document declares DMN 1.3 while the element arrived in DMN 1.5: both halves are true and a reader needs both. No TCK model uses <typeConstraint> anywhere, so this and test/dmn15/bad-typeconstraint.dmn are the whole of its coverage.'
SOURCE='src/DMN/XML/ParseDMN.hs refuseUnmodelled / unmodelledConstructs; DMN15.xsd:239; test/dmn15/README.md'
ARGS='-f xml --to=ts input.dmn'
