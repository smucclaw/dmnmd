TITLE='a column of nothing but wildcards stays untyped and stays SILENT -- it is a legitimate shape, not a failed inference'
WHY='The predicate guard for D-2, and the single most dangerous thing to get wrong about it. "The column has no type" and "the column has conflicting types" are both spelled vartype = Nothing after inference, and a refusal keyed on the former instead of the latter would refuse every all-wildcard column in existence -- a common, correct shape -- while nothing in the tree turned red, because before this case no hspec expectation and no corpus recording covered one. It had to be constructed to prove it exists. inferenceErrors therefore reports VConflict and VAmbiguous and says nothing about VNone.'
SOURCE='src/DMN/DecisionTable.hs columnVerdict VNone / inferenceErrors; DECISIONS.md D-2'
ARGS='--to=ts input.md'
