TITLE='a cent-precision payout reaches the emitted code with its cents intact'
WHY='WHAT IT DOES: the output cell reads 1234567.89 and the emitted TypeScript returns 1234567.89, at exit 0 with nothing on stderr. WHY THAT IS RIGHT: this is the case the whole numeric representation is aimed at. A payout figure has to leave dmnmd as the figure the table states, because the difference between what a policy says and what a generated system pays is the entire liability. VN is a Scientific, so 1234567.89 is held as the exact decimal it is written as, not as the nearest value of some binary format. WHAT THIS CASE IS PROTECTING: it was recorded as symptom/num-float32-cent-rounding against the binary that spelled VN as Float. binary32 carries roughly seven significant decimal digits and this figure needs nine, so the cent field was rounded away at PARSE time -- before any backend saw it -- and the emitted code returned 1234567.9. The table said one thing, the generated system paid another, and nothing on stderr said so. DECISIONS.md D-1 required the recording first; it is promoted here because the number is now correct. A diff that merely moved the rounding to a different digit would be a new bug, not a re-record. The guard column is a String on purpose, so the only number in the whole recording is the one under test; a Number guard added a stray comparison against 1.0. Both columns are explicitly typed so the case does not also depend on inference.'
SOURCE='src/DMN/Types.hs, the VN Scientific constructor; src/DMN/Number.hs; DECISIONS.md D-1'
ARGS='--to=ts input.md'
