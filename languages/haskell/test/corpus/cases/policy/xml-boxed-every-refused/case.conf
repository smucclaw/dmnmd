TITLE='a boxed quantifier <every> is refused by name too, not just <conditional>'
WHY='The second of the five DMN 1.4 boxed expressions to be pinned here, so that a change which collapses the refusal to a single hardcoded element name cannot pass. <every> and <some> share complexType tQuantified but are distinct global elements, and both must be refused under their own name — the message says <every>, not <quantified>, because tQuantified is abstract and <quantified> is not spellable in a document. Together with xml-boxed-conditional-refused this pins both the list lookup and the per-element rendering; <for>, <some> and <filter> are covered by test/dmn15/ and by DmnXmlSpec, which asserts on each of the five by name.'
SOURCE='src/DMN/XML/ParseDMN.hs unmodelledConstructs; DMN15.xsd:558-559; test/dmn15/README.md'
ARGS='-f xml --to=ts input.dmn'
