TITLE='a U table with no input column and one rule is accepted: it is a constant, and nothing overlaps'
WHY='The negative control for md-zero-input-unique-refused. DMN allows a decision table with no input (tDecisionTable has input*, output+), and a single rule of such a table overlaps nothing, so the refusal must not reach it. ts emits a function that takes no argument and returns the one rule output, and the L4 backend renders it as a bare BRANCH with only an OTHERWISE. If the zero-input refusal were widened to every input-less table, this case would fail.'
SOURCE='src/DMN/DecisionTable.hs uniqueCatchAll; src/DMN/Regions.hs conflictErrors; audit 10 finding f8'
ARGS='--to=ts input.md'
