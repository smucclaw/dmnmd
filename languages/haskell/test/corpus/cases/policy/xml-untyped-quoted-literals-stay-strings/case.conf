TITLE='an untyped XML column of FEEL string literals "2020" and "yes" is a String column, not Number and Boolean'
WHY='In DMN XML a string is written with its quotes: "2020" is a string and 2020 is the number, and the quotes are the only thing that tells them apart. The input column has no typeRef (the XSD makes it optional) and neither the output clause nor the decision variable carries one (section 8.3.2 bars the clause), so dmnmd infers both types from their cells. It used to read the cells without their quotes: XmlToDmnmd.resolveColumn built its inference pre-pass with mkFsEither, and mkFsEither runs unquoteCell before any evidence is taken, so "2020" was graded exactly like 2020 and "yes" like the boolean word yes. The guard came out as year === 2020.0 where the document says year === "2020", and the output "yes" came back as the boolean true, at exit 0 with no diagnostic. The pre-pass now uses mkFsKeepingQuotes, so a quoted fragment is hard String evidence whatever is inside the quotes. What is pinned: the parameter is year : string, the guards compare against "2020" and "2021", and the outputs are the strings "yes" and "no". The control is policy/xml-untyped-bare-literals-stay-typed, which must keep 2020 a Number and true a Boolean. The markdown reader has the same defect and is NOT fixed: symptom/md-quoted-literal-inferred-by-content.'
SOURCE='src/DMN/XML/XmlToDmnmd.hs resolveColumn (firstPass, cellsAt); src/DMN/DecisionTable.hs mkFsKeepingQuotes, inferEvidence; audit 2026-09-26 finding f4'
ARGS='-f xml --to=ts input.dmn'
