TITLE='an undeclared markdown column of double-quoted literals "2020" and "yes" is inferred String, input and output alike'
WHY='The markdown twin of policy/xml-untyped-quoted-literals-stay-strings. A double-quoted cell is a string literal (CLAUDE.md), and the quotes are the only thing that tells the string "2020" from the number 2020 or "yes" from the boolean word yes. Pass 1 used to unquote a well-formed cell (unquoteCell) before type inference graded it, so inferEvidence never saw the quotes and the column typed as Number (Year === 2020.0) and the outputs as Boolean (true and false), at exit 0. Data cells of a column that declares no type now keep their quotes through inference (mkDataFsAt, which defers to mkFsKeepingQuotes), and reprocessRows strips them once the column is settled (unquoteBuilt). So Year is a string, the guards compare against "2020" and "2021", and the results are the strings "yes" and "no". A declared column is unchanged: Year : Number still reads "2020" as the number. Same table as policy/md-quoted-literals-are-strings-l4.'
SOURCE='src/DMN/DecisionTable.hs mkDataFsAt, unquoteBuilt, reprocessRows; src/DMN/ParseTable.hs mkFEELCol'
ARGS='--to=ts input.md'
