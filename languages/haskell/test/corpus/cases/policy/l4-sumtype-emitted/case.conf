TITLE='a domained output column emits a real L4 sum type, and the emission typechecks'
WHY='A column whose sub-header row declares its permitted values is not a STRING
that happens to hold three values - it is a three-constructor type. Emitting
DECLARE ... IS ONE OF puts the constraint in the L4 where l4 own typechecker
enforces it, instead of leaving it enforced only on dmnmd side.

Four properties are pinned, and each was verified against the real l4 binary:

1. The DECLARE precedes GIVEN, and GIVETH names the sum type rather than STRING.
2. Arm results are CONSTRUCTORS, backticked.
3. THE DITTO GRID IS UNCHANGED. This is the load-bearing one and it is why
   constructors are ALWAYS backticked and never emitted bare. "PRVI" and `PRVI`
   are both 6 display columns; a bare PRVI would be 4 and would shift every
   caret to its right. renderDittoGrid resolves ^ by ABSOLUTE SOURCE COLUMN, so
   that drift makes a caret silently copy the wrong token - the quietest way
   this backend can be wrong. Compare the ^ alignment in the recorded stdout
   against any non-enum table.
4. `Woman'\''s World` survives as a constructor despite the apostrophe, which is
   l4 field-access operator.

THE GATE WAS TWO CONDITIONS WHEN THIS CASE WAS RECORDED, and both were about the
OTHERWISE, not the type: the table had to have an explicit catch-all row, and no
cell in the column could be a wildcard. A sum type has no natural zero, and
`OTHERWISE ""` against a sum-typed GIVETH is a CHECK ERROR (re-checked with
l4 check on 2026-10-08: THEN and ELSE must have the same type). Only the second
condition remains, in enumOutsOf. The first is gone: a table with no catch-all
row now emits MAYBE where an input may match no rule (D-22 part 3), and a bare
result whose last arm is the OTHERWISE where the table is total (D-22 part 4).
This table ends in a catch-all row, so neither changes it.

Companion: policy/l4-sumtype-gate-declines pins that a table failing the gate
still emits exactly what it emitted before.'
SOURCE='src/DMN/Translate/L4.hs enumCtorsOf/ctorL4/enumOuts; BUILD-SPEC-dmnmd-l4-sumtype.md sections A.2-A.5'
ARGS='--to=l4 input.md'
