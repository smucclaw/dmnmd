TITLE='a partial table whose result is a sum type keeps its MAYBE: no arm may be promoted to the OTHERWISE'
WHY='The negative control for policy/l4-sumtype-total-bare. It is that table without its Winter row. The declared domain of season still has four members, so Winter matches no rule, DMN.Regions reports a no-match region, and the result stays GIVETH A MAYBE Dish with OTHERWISE NOTHING.

What this guards is the other half of D-22 rule 3 and of D-22 part 4. A bare result on a table with a no-match region is the defect the rule exists to remove: it would answer Winter with a value the table never gives, at exit 0. Promoting the last arm to the OTHERWISE is only sound when the table is proven total, so a change that promoted it here would print OTHERWISE Roast, and this recording would catch it.

The same table with the Winter row restored is policy/l4-sumtype-total-bare. The two recordings differ in the GIVETH line, the JUST wrappers and the OTHERWISE, and have the same two guard lines.'
SOURCE='src/DMN/Translate/L4.hs toL4, maybeResult and noRuleMayMatch; DECISIONS.md D-22 part 4'
ARGS='--to=l4 input.md'
