TITLE='an asserted quotient that does not terminate is not asserted: the check abstains and says why, in the words of the comment above the function'
WHY='A quotient that does not terminate is rounded by dmnmd to 34 significant digits (divideFeel, DECISIONS.md D-1), because FEEL numbers are decimal128, and l4 divides exactly: measured with l4, 1 / 3 EQUALS 0.3333333333333333 is false while 1 / 3 * 3 EQUALS 1 is true.
So an #ASSERT of the interpreter answer for 10 / d at d = 3 is reported false by l4 run, on a table whose logic is right, and this case recorded exactly that as a symptom until DECISIONS.md D-24 (FOGHORN, Meng 2026-10-15, option B).
Now the emitter warns on stderr and puts a comment above the function, and --asserts writes no assertion for a region whose answer comes from such a cell: it says region 1 is not asserted and why, and the other regions, which answer NOTHING, are still asserted.
Neither side is wrong about the table; they disagree about what a number is, and the check no longer reports that disagreement as a failure of the emitter.
Only the answer is skipped: under F, U and A the answer is the first live rule, so a later inexact rule does not silence an exact earlier one (EmitAssertsSpec pins it).'
SOURCE='src/DMN/Translate/L4.hs assertLines inexactAnswer inexactNodes; DECISIONS.md D-24'
ARGS='--to=l4 --asserts input.md'
