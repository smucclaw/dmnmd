TITLE='a <decisionTable typeRef> that contradicts the decision variable is refused, quoting both'
WHY='DMN 1.3 section 7.3.1: if an Expression that defines the output of a Decision includes a typeRef, the referenced type SHALL be the same as the type of the containing Decision. The decision type is what its <variable> declares (section 6.3.7). This document breaks the SHALL: the variable says number and the <decisionTable> says string. dmnmd used to ignore the table typeRef, and once it read it, used the variable and never compared the two, so the outputs 1 and 2 came out as 1.0 and 2.0 at exit 0 on the strength of an undeclared preference. Either silent pick would be the same defect, so the table is refused with a located error that quotes both statements and the SHALL, nothing is emitted, and the exit status is 1. The comparison is made on RESOLVED types, so number against integer is not a disagreement (policy/xml-decision-table-typeref-types-single-output covers the single-statement case; DmnXmlSpec covers the spellings, typeRef Any, which yields to a concrete statement, collections compared by element type, and C#, where neither is applied and nothing is compared). The choice to refuse rather than prefer one is assumed, not ruled.'
SOURCE='src/DMN/XML/XmlToDmnmd.hs resultColumnType (reconcile); audit 2026-09-26 finding f3'
ARGS='-f xml --to=ts input.dmn'
