TITLE='a zero-byte markdown file exits 0 and emits nothing'
WHY='The degenerate end of the exit-status table: an empty file is a well-formed document that happens to contain no decision tables, so it is not a read failure. The row relied on is markdown with no decision tables - prose, or prose pipe tables - status 0. policy/md-no-tables-at-all-exits-zero covers prose with a heading and a bullet list; this covers the case where there is not a single byte, which is the one that reaches grepMarkdown with an empty input and depends on grepMarkdown using many rather than many1. ParseMarkdown.hs comments that requiring at least one table is what made every prose file in this repo exit 1, so the zero-length input is the sharpest test of that fix. It is worth having because it is also the shape produced by a shell redirect from an empty pipeline, and because a parser rewrite that reintroduces a mandatory first token turns every empty input into a spurious exit 1.'
SOURCE='app/ParseMarkdown.hs grepMarkdown (many, not many1) and its comment; app/Main.hs parseTables Md branch'
ARGS='--to=ts input.md'
