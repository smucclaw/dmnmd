TITLE='negation in an OUTPUT cell is refused: it selects a set, and an output column must name one value'
WHY='D-9 makes not(...) build an FNot instead of being refused by the cell parser.
That parser cannot tell an input cell from an output cell, so the refusal it used
to provide for BOTH positions had to be replaced in the output position or D-9
would have converted a located exit-1 refusal into a crash. This case is that
replacement, and it is the reason the check lives in structuralErrors, which
walks allrows and therefore knows which column a cell is in.

WHY IT MUST BE REFUSED: negation is a unary test (DMN 1.3 §9.2 rule 12.b). It
denotes a SET of values -- everything outside [1..5] -- and an output column has
to return exactly one. There is nothing for a backend to emit. Without this arm
the cell would reach DMN.Translate.FEELhelpers.showFeel for js/ts/py and hit its
error catch-all, and reach showFeelL4 for L4, which would have to invent a value.
A crash in a backend is strictly worse than a located refusal naming the table,
the column and the row.

Mirrors policy/md-arith-output and the inputArithErrs refusal, which are the same
argument the other way up: arithmetic is a rule 3 simple expression and is legal
only in an OUTPUT cell, negation only in an INPUT one. The two together say that
dmnmd knows which side of the table it is on, which the cell parser alone cannot.

The Band column is declared Number so that the cell reaches parseNumberCell at
all; with no declaration the column would be refused earlier, by inference, and
the recording would not exercise the output check.'
SOURCE='src/DMN/DecisionTable.hs structuralErrors outputNegationErrs; the unreachable FNot arm of DMN.Translate.L4.showFeelL4. DECISIONS.md D-9'
ARGS='--to=ts input.md'
