TITLE='a data row with a cell past the last column is refused, located at the row the author wrote'
WHY='A GFM renderer ignores the cells of a row past the header last column (If there are greater, the excess is ignored), and so did dmnmd, silently: row 2 here read as Winter giving Stew, with no trace of Extra, at exit 0. The author may have meant another column, or a stray pipe may have split a cell, and either way a cell they wrote vanished. It is now exit 1 with nothing emitted and one error naming the table and the row number the author wrote. The short-row refusal (policy/struct-short-row-refused) is the mirror image. A surplus of BLANK cells is not refused: see policy/md-surplus-blank-cell-accepted. Ruled: DECISIONS.md D-23 (smucclaw/dmnmd#71 section 2).'
SOURCE='src/DMN/ParseTable.hs rowArityDiags'
ARGS='--to=ts input.md'
