TITLE='a domained INPUT column gets the sum type too, so one tables output composes with the nexts input'
WHY='Categorize takes a STRING merchant and returns a Category. CardToUse takes a
Category and returns a Card. Both `category` columns declare {Dining, Grocery},
so both refer to ONE DECLARE Category - and the composition typechecks with the
two sides RELATED rather than being unrelated STRINGs:

  $ l4 check out.l4                                            -> exit 0
  #ASSERT (CardToUse (Categorize "foodpanda")) EQUALS `PRVI`  -> satisfied
  #ASSERT (CardToUse (Categorize "nfmart"))    EQUALS `Amex`  -> satisfied

This is the payoff BUILD-SPEC-dmnmd-l4-sumtype.md sectionA.6 was written for, and
it needs all three earlier pieces at once: the sum type (#30), the file-level
entry point (#33), and the shared DECLARE (#35). Inputs are the last one.

NOTE WHY CATEGORIZE HAS A CATCH-ALL ROW. That is load-bearing, not incidental.
Its merchant column is an open STRING, so only a catch-all row makes the table
total, and a table that some input can fall through gets GIVETH A MAYBE T.
`CardToUse (Categorize ...)` would then be MAYBE Category passed where Category is
wanted - a loud exit-1 mismatch. The shortest fix is ZERO GLUE when the upstream
table is total, which is why Categorize row 3 is `-`. If dmnmd ever synthesises a
CONSIDER to unwrap a MAYBE instead, note that l4 does NOT exhaustiveness-check
CONSIDER: a missing arm passes `l4 check` in silence and fails at runtime with
exit 0.

CARDTOUSE HAS NO CATCH-ALL ROW AND IS BARE ANYWAY. Its category column declares
{Dining, Grocery} and its two rules cover both, so DMN.Regions finds no no-match
region. Its result is a sum type, which has no sentinel for the dead OTHERWISE,
so since D-22 part 4 the last arm supplies it and loses its guard:
OTHERWISE `Amex`. Before that this recording read GIVETH A MAYBE Card, with JUST
arms and OTHERWISE NOTHING, whose NOTHING could never happen; the two #ASSERT
lines above then compared against JUST `PRVI` and JUST `Amex`. Re-measured with the
l4 on PATH for D-22 part 4: l4 check succeeds on this output, and the two bare
asserts above are satisfied.

Typing inputs also buys something independent of composition: `EQUALS "Dining"` -
a bare string tested against a domained column - stops compiling. Today that
mistake is invisible.'
SOURCE='src/DMN/Translate/L4.hs enumInsOf / givenBlock / showValIn; BUILD-SPEC-dmnmd-l4-sumtype.md sectionA.6'
ARGS='--to=l4 input.md'
