TITLE='a # -prefixed annotation column is excluded from guards and output, and the rightmost non-annotation column becomes the output'
WHY='The repo README states both rules: annotation columns are prefixed with a #,
and the rightmost column is taken to be the output, leaving out annotation columns.
Only the (comment) label form was covered (policy/md-comment-column); # is a
distinct syntax reaching the same place, and a rewrite could plausibly let it become
a guard, or make it the output column because it is rightmost.

Also pins the space-to-underscore parameter mangling: the column "Guest Count"
becomes the emitted parameter Guest_Count. That transformation was otherwise
recorded only inside symptom cases, where a change reads as progress — so it could
have changed while the runner stayed green.'
SOURCE='README.md, the annotation-column and rightmost-output rules; src/DMN/ParseTable.hs'
ARGS='--to=ts input.md'
