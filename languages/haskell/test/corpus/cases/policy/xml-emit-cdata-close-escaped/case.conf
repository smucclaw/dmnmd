TITLE='a cell containing ]]> is escaped, because otherwise the emitted file is not well-formed XML'
WHY='WHAT IT DOES: a String cell reading a]]>b emits as a]]&gt;b, and the document is well-formed and XSD-valid and reads back with the cell intact. WHY THAT IS RIGHT: XML 1.0 §2.4 forbids the sequence ]]> in character data except when closing a CDATA section. hxts escapeXmlRefs -- the table this backend borrows so it can stay a pure String function rather than becoming IO -- escapes < and & only, NOT >. So the raw sequence went straight into <text> and produced a file that xmllint --noout rejects on WELL-FORMEDNESS alone, before any schema is consulted, and that dmnmds own reader then refuses. At exit 0. WHAT THIS CASE IS PROTECTING: that is the worst outcome available to an emitter and the one the ruling names explicitly -- dmnmd claiming to have written a DMN document and having written something no parser will accept. The fix escapes every > unconditionally, which is always legal, is what mainstream serializers do, and needs no lookahead for the two-character prefix. NOT CAUGHT BY THE ROUND-TRIP HARNESS OR THE XSD CHECK, because no fixture in the tree contains ]]> -- it was found by probing the escaping rule by hand rather than by running the suite. That is the same lesson as the two rulings before it: a green suite is evidence about the inputs it holds and nothing else.'
SOURCE='src/DMN/Translate/XML.hs, escapeTree; XML 1.0 §2.4; DECISIONS.md D-8'
ARGS='--to=xml input.md'
