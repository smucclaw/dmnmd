TITLE='a test cell is not checked against the domain, but a numeric domain does constrain plain numbers'
WHY='A test is not a member of the domain - it SELECTS A SUBSET of it. So `< 18`,
`[18..65]`, `> 65` and `-` in a column whose domain is `[0..150]` are all correct
input and must be accepted. Checking them against a list of permitted values
would be a category error, and it would make declared domains unusable on every
numeric column, which is most of them.

This is the companion to policy/enum-domain-violation-refused. Together they
pin the boundary: PLAIN VALUES are checked, TESTS are not. Get that boundary
wrong in either direction and E4 is useless - too strict and no real table
passes, too loose and the typo in the other case gets through.

Membership is decided by fEval, the same function that decides whether a rule
matches at run time. That is deliberate and worth preserving: it means a
declared numeric range constrains plain numeric cells for free, and it means the
domain check can never disagree with what matching actually does. A hand-written
membership test would be a second implementation of the same idea, and the two
would drift.

Row 1 also pins that `-` (FAnything) is exempt - a wildcard is not a value.'
SOURCE='src/DMN/DecisionTable.hs domainErrors, the FNullary guard; BUILD-SPEC-dmnmd-e4.md section 8'
ARGS='--to=ts input.md'
