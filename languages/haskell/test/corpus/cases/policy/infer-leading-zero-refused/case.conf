TITLE='a padded product code 007 is REFUSED as ambiguous between the number 7 and an identifier'
WHY='D-2, the one policy ADDITION the ruling did not contain. 007 is a legal FEEL number (rule 31 admits it) denoting 7, and is also exactly how product codes, postcodes and flight numbers are written; dmnmd used to silently choose the number and emit `Code === 7.0`, comparing a numeric 7 against a real-world string key "007". No numeric representation can fix that -- only refusing to choose can. Deliberately NARROWER than the general rule "the source text is not the canonical spelling of the value it denotes": that rule also catches 1.10 (which would be nice, see symptom/infer-version-float-collapse) but catches 10.50 and 2.0 with it, and refusing a money column for writing cents is a worse outcome than the defect it fixes. A redundant TRAILING zero is ordinary decimal notation; a redundant LEADING zero is not notation at all. 0.5 is not caught.'
SOURCE='src/DMN/DecisionTable.hs redundantLeadingZero / columnVerdict VAmbiguous; DECISIONS.md D-2'
ARGS='--to=ts input.md'
