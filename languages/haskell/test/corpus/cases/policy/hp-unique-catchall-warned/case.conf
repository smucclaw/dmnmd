TITLE='emitting a U table with an all-wildcard catch-all row WARNS, does not refuse, and still exits 0'
WHY='D-16 phase 1. A row with `-` in every input column matches everything, so under hit policy Unique it overlaps every other rule -- the one thing DMN 1.3 §8.2.10 says a U table must not contain. The strict reading refuses such a table. dmnmd deliberately does not, and this case pins that choice. Refusing would refuse the README example this fixture is copied from, which is also a live test fixture; the shape is what real authors write and dmnmd exists to formalize documents AS AUTHORED; and nothing dmnmd itself answers is wrong, because evalTable is first-match and --to=l4 renders the row as OTHERWISE -- measured by running the emitted js under node, where Summer/20 returns "Takeaway", not by reading it. The hazard is real but EXCLUSIVE TO THIS BACKEND: under U a conforming engine may evaluate rules in any order, so a foreign engine reading our emitted DMN may return this row instead of a more specific one, which is a wrong answer at exit 0 in the one backend whose output is read by something other than a language toolchain. That is why the warning lives in Translate/XML.hs fidelityDiags and not in DecisionTable.tableWarnings. The reader-side version was built and measured first: the shape is in 40 of 221 corpus fixtures, so it added a paragraph to 33 policy recordings about a problem those runs did not have -- a warning firing on a fifth of all input teaches people to ignore it. DMN spells the intent as a default output value (§8.2.11), which DecisionTable has no slot for; that same absent field is why the XML READER drops a declared <defaultOutputEntry> with a warning, and D-16 phase 2 adds it to close both directions at once. Both repairs the message offers were run rather than reasoned about: F and P each silence the warning and each still return "Takeaway" under node. (They differ in shape -- F folds the row into OTHERWISE, P emits an explicit IF TRUE arm plus a dead OTHERWISE "" -- but not in meaning. An earlier read of the P output mistook that dead arm for a lost default.) What is pinned: warn, exit 0, emit the document anyway, and name the row the way the author numbered it.'
SOURCE='src/DMN/Translate/XML.hs fidelityDiags uniqueCatchAllWarns; DECISIONS.md D-16'
ARGS='--to=xml input.md'
