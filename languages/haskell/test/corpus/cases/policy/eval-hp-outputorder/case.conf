TITLE='hit policy O returns every match, ordered by the output enums rather than by rule number'
WHY='The control for eval-hp-ruleorder: same rows, same input, but O must emit
Stew/Spareribs/kids (enum order) where R emits kids/Spareribs/Stew (rule order).
Holding both means a rewrite cannot collapse the two policies into one without
a diff. The enum subhead row form is documented in the repo README under hit
policy O, so this also pins that surface.'
SOURCE='src/DMN/DecisionTable.hs evalTable HP_OutputOrder arm; outputOrder/mySort'
ARGS='-q -t ts input.md'
STDIN_FILE='stdin'
