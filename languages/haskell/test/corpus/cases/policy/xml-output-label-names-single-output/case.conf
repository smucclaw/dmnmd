TITLE='a single-output column with no name on its <output> clause is named from decisionTable/@outputLabel, and typed from the decision <variable>'
WHY='DMN 1.3 section 8.3.2, Table 34: the OutputClause of a single-output decision table SHALL NOT specify a name, and SHALL NOT specify a typeRef. So a conformant document states that column NAME on decisionTable/@outputLabel (Table 32: a description of the decision table output, often the same as the name of the InformationItem) and its TYPE on the decision variable (D-17). This is the shape the l4-ide exporter writes and the shape of the OMG Chapter 11 examples, and since this change it is the shape dmnmd writes itself. dmnmd used to ignore @outputLabel -- the pickler consumed it with xpIgnoredAttrs -- so every such column came back named "output1", and a dmnmd round trip would have renamed every single-output column the same way. Both halves discriminate here. The outputLabel is "band", deliberately not the decision name "Band"; ignore it and the key is "output1". The cells are bare numerals under a string variable; ignore the variable and they come back as the numbers 1.0 and 2.0. What is pinned: the ts output returns {"band":"1"} and {"band":"2"}, the key taken from outputLabel and the values quoted.'
SOURCE='src/DMN/XML/ParseDMN.hs DecisionTable dtOutputLabel; src/DMN/XML/XmlToDmnmd.hs convTable / convOutputCol naming precedence'
ARGS='-f xml --to=ts input.dmn'
