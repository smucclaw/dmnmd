TITLE='explicit `: String` and `: Boolean` column headers are honoured'
WHY='policy/md-explicit-number-header covers the `: Number` case; these two type
names appeared nowhere in the corpus except inside symptom cases, so there was
no recording of either working. An explicit header short-circuits inference
(CLAUDE.md, "Type inference is a second pass"), which makes these the cases that
must keep working when inference is replaced — they are the escape hatch the
rewrite will tell people to use.'
SOURCE='src/DMN/ParseTable.hs columnSigs; src/DMN/DecisionTable.hs mkDTable'
ARGS='--to=ts input.md'
