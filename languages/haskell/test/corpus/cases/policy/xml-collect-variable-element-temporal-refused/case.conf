TITLE='under COLLECT, a <variable> typed as a collection of dates is refused, as a FIRST table with a date variable is'
WHY='Under a list-valued hit policy the output column takes the ELEMENT type of the decision variable, and dmnmd has no temporal type, so the temporal refusal applies exactly as it does under FIRST. The ResultIsListOfColumn arm used to end in a catch-all that returned no type AND no diagnostics, discarding the element type error along with the variable: the column was inferred from its cells and the date was emitted as the string "2020-01-01" at exit 0 with an empty stderr, on trunk 18481de and on 2c64890 alike. Found by the audit of docket queue item #10, by the same shape as policy/xml-collection-of-any. What is pinned: the refusal names typeRef "date" and nothing is emitted.'
SOURCE='src/DMN/XML/XmlToDmnmd.hs resolveElementType, resolveTypeRefFrom'
ARGS='-f xml --to=ts input.dmn'
