TITLE='the XML reader refuses a UNIQUE table with two identical rules, and refuses only that table'
WHY='D-13. `uniquenessErrors` is a summand of `tableErrors`, which `DMN.XML.XmlToDmnmd` calls directly, so the check reaches the XML reader with no extra wiring — deliberately: a DMN document with a duplicate rule in a UNIQUE table is exactly as broken as a markdown one. Two things this pins that the markdown case cannot. First, the document carries NO hitPolicy attribute: the XSD defaults it to UNIQUE (DMN 1.3 §8.2.10, "The hit policy SHALL default to Unique") and so does ParseDMN (`xpDefault HP_Unique`), so a silent default puts most real DMN documents in scope for this check. Second, the diagnostic shape: the XML path locates and refuses ONE table rather than aborting through `error`, and prints no Haskell CallStack. Note "row 1" here is a 1-based index the reader assigned, not a number the author wrote — the two readers mean different things by "row", which is the existing documented divergence rather than a new one.'
SOURCE='src/DMN/DecisionTable.hs uniquenessErrors; src/DMN/XML/XmlToDmnmd.hs tableErrors; src/DMN/XML/ParseDMN.hs xpDefault HP_Unique; DECISIONS.md D-13'
ARGS='-f xml --to=ts input.dmn'
