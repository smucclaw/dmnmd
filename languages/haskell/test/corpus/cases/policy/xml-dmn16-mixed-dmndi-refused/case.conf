TITLE='a DMN 1.6 document with a DMN 1.3 diagram namespace is refused, naming both'
WHY='A DMN 1.6 document has exactly one legal DMNDI namespace, .../20230324/DMNDI/, which it shares with DMN 1.5 (DMN16.xsd imports DMNDI15.xsd; there is no DMNDI16.xsd). This input puts its <dmndi:DMNDI> in .../20191111/DMNDI/, the namespace DMN 1.3 and 1.4 use. That is a DMNDI namespace dmnmd reads, but for other releases, and a reader that accepted the DMNDI namespace of any readable release at any position would take this file and thereby invent a dialect no validator implements. The release is resolved once from the root, so the stray subtree is refused by name, and the message says which release the stray namespace belongs to. Note that DMNDI namespaces are not one-to-one with releases: 20191111 serves 1.3 and 1.4, and 20230324 serves 1.5 and 1.6, so the name reported is the first release that declares it.'
SOURCE='src/DMN/XML/ParseDMN.hs refuseUnmodelled (strayNS), releaseNameOfNamespace; test/dmn16/README.md'
ARGS='-f xml --to=ts input.dmn'
