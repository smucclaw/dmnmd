TITLE='when one decision table in a DMN file is refused, the ones that converted are withheld too, and the run exits 1'
WHY='This is the XML half of the invariant that policy/md-partial-failure-emits-nothing pins for markdown, and nothing pinned it until now: every existing xml-*-refused case has exactly one decision in the file, so all of them would still pass if the reader started emitting the good tables alongside the error. Here the file has two decisions, only the second of which is malformed (a rule with two <inputEntry> elements against a one-column table). Nothing at all reaches stdout -- not even the perfectly good Band function -- and the exit status is 1. That is the whole point of the contract: a partial answer presented as a whole one is the failure this is here to prevent, and it is easy to regress by moving the `any isError diags` check after the emit or by making convertAll drop failed tables and carry on. Note the second stderr line says "nothing was emitted for them", which slightly undersells what happened -- nothing was emitted at all.'
SOURCE='app/Main.hs parseDmnXml (the `when (any isError diags) ... exitFailure` before any table is returned); src/DMN/XML/XmlToDmnmd.hs convTable arityDiags'
ARGS='-f xml --to=ts input.dmn'
