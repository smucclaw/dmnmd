TITLE='a reversed range [8..5] keeps its bounds in source order, producing the empty interval FEEL defines'
WHY='FEEL defines [a..b] as {x | a <= x <= b}, so [8..5] is the EMPTY interval and
the emitted 8.0 <= Age && Age <= 5.0 is exactly right. The row can never fire, which
is the correct answer to a probably-mistyped question.

This is policy because the plausible way to get it wrong is silent and severe. A
grammar that normalises ranges - taking min and max of the bounds, which looks like
a helpful tidy-up - turns an empty set into a live 5-to-8 interval, and the row
starts firing. That is a wrong answer, not a fix, and it is invisible in any output
that does not include this exact shape. Filed as a symptom it would have read as
progress and passed.

What is NOT asserted, and is a genuine defect: dmnmd says nothing. A permanently
dead row is almost certainly a transposition typo and this exits 0 with empty
stderr. The right fix is a WARNING, not a rejection - the answer is correct, it is
the intent that is doubtful - and when that warning lands, this recording changes.
That is the one case in this corpus where a policy diff is expected to be an
improvement: read the diff, confirm the GUARD is still an empty interval and only
stderr moved, then re-record and say so in the commit message.

The reason this could not simply be split into a policy case for the emission and a
symptom case for the silence is that both claims live in one run of one input, so
the two cases would diverge together and the split would buy nothing.'
SOURCE='src/DMN/DecisionTable.hs mkFEither, the FInRange arm; audit lens "numeric cell parsing", finding 12'
ARGS='--to=ts input.md'
