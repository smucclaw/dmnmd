TITLE='an extra namespace declaration on <definitions> is accepted, not treated as a foreign element'
WHY='Real DMN files from real tools carry vendor namespace declarations —
camunda, signavio, trisotech. An earlier reader rejected the document outright
for carrying one, which made it refuse most files anyone would actually feed it.
PR #17 fixed that. The emitted TypeScript here is byte-identical to
policy/xml-baseline-13, which is the assertion: an unrecognised xmlns changes
nothing. This was one of two CONFIRMED reproductions in the E0 audit and it had
no case until now, on the very branch that fixed it.'
SOURCE='src/DMN/XML/ParseDMN.hs; E0 audit finding E0b-namespace-strictness'
ARGS='-f xml --to=ts input.dmn'
