TITLE='a markdown file holding three decision tables emits all three, in file order, and exits 0'
WHY='CLAUDE.md says multi-table markdown works and that test/safe.md is a bad fixture rather than a chunking limit, but the corpus has no case that actually pins the happy path: every existing multi-table case is about something going wrong (struct-tablename-collision, struct-no-heading-default-name, md-partial-failure-emits-nothing). This is the control. It pins three properties that the S-FEEL rewrite could break without any single-table case noticing: grepMarkdown slices a file into one InputChunk per run of pipe-prefixed lines and does not stop after the first; each chunk takes its name from the heading immediately above it rather than from the file; and the backend writes all of them to the same stream in source order with a blank line between. The fixture is deliberately all-string columns with plain equality cells, so that it depends on the chunker and the driver and not on numeric rendering or comparison parsing, which are the parts the rewrite is entitled to change. Exit-status row relied on: markdown with decision tables, status 0.'
SOURCE='app/ParseMarkdown.hs grepMarkdown and maybeHeaderLines and cleanTableName; app/Main.hs mapM_ over pickedTables'
ARGS='--to=ts input.md'
