TITLE='`[1.5..2.5]` is an interval with non-integral bounds'
WHY='The old interval recogniser was an unanchored PCRE hard-coding `(\d+)` for both bounds, so a decimal point failed the pattern and the cell fell through to the numeric literal parser, which then refused the whole `[1.5..2.5]` string. Nothing about DMN restricts interval endpoints to integers.'
SOURCE='src/DMN/ParseCell.hs interval, numericLiteral'
ARGS='--to=ts input.md'
