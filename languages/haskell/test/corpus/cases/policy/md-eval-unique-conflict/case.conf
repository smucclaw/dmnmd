TITLE='a Unique table whose rules genuinely overlap reports a conflict rather than picking one'
WHY='Reporting the conflict IS the hit policy. A rewrite that quietly returns the first match would turn a detectable authoring error into a silent wrong answer, which is the whole class of defect this corpus exists to prevent. Re-fixtured under DECISIONS.md D-22 rule 1. The table used to be `Fall, <= 8` plus a trailing all-wildcard row, queried with `Fall, 5`; D-22 reads that trailing catch-all as the §8.2.11 default output value, so the query now answers Spareribs, and that table moved to policy/md-eval-unique-catchall-default. This table overlaps with no catch-all at all: Guests=15 satisfies both `<= 20` and `>= 10`, which is a conflict under §8.2.10 on every reading. The refusal is at run time, after the input is known; D-22 rule 2 will refuse this table statically once a region enumerator exists, and this recording will move then.'
SOURCE='src/DMN/DecisionTable.hs evalTable, HP_Unique arm; DECISIONS.md D-22'
ARGS='-q -t ts input.md'
STDIN_FILE='stdin'
