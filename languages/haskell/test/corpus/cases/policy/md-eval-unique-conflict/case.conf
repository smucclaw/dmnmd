TITLE='a Unique table whose rules genuinely overlap is refused when it is read, before -q evaluates anything'
WHY='Reporting the conflict IS the hit policy. A rewrite that quietly returns the first match would turn a detectable authoring error into a silent wrong answer, which is the whole class of defect this corpus exists to prevent. Re-fixtured under DECISIONS.md D-22 rule 1. The table used to be `Fall, <= 8` plus a trailing all-wildcard row, queried with `Fall, 5`; D-22 reads that trailing catch-all as the §8.2.11 default output value, so the query now answers Spareribs, and that table moved to policy/md-eval-unique-catchall-default. This table overlaps with no catch-all at all: Guests=15 satisfies both `<= 20` and `>= 10`, which is a conflict under §8.2.10 on every reading. Since D-22 part 2 the refusal is static: the reader refuses the table when it is read, naming rows 1 and 2, the witness Season = "Fall", Guests = 10 and the overlap, and exits 1 before the -q interpreter reads the query. Until then it was refused at run time, for the input Fall, 15, at exit 0. The interpreter still refuses such an input at run time for a table the region checker cannot analyse; policy/eval-unique-collection-overlap-at-runtime pins that.'
SOURCE='src/DMN/Regions.hs conflicts, conflictErrors; src/DMN/DecisionTable.hs evalTable, HP_Unique arm; DECISIONS.md D-22'
ARGS='-q -t ts input.md'
STDIN_FILE='stdin'
