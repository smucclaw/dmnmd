TITLE='every dropped informationRequirement edge produces a Warning naming the decision, the edge and its target'
WHY='Fare requires Band through <requiredDecision>, and Band requires an
<inputData> through <requiredInput>. dmnmd does not model the decision
requirement graph, so what comes out is Band(age) and Fare(band) as two
independent TypeScript functions: nothing calls Band, and the band parameter of
Fare is a dangling reference to it. That is still true. What changed under D-6 is
that it is no longer SILENT -- one Warning per edge, naming the decision it sat
under, the edge id, which of requiredInput or requiredDecision it was, and the
href it pointed at, all taken from the author document rather than from a stock
example.

This is the one place XmlToDmnmd used to break its own governing rule, that
anything parsed but not honoured must produce a loud diagnostic and must never be
silently discarded. informationRequirement was parsed into the decInfoReq field
of Decision and then never mentioned in the converter -- written, asserted on by
DmnXmlSpec, and never read by any code in src. A generated function whose
parameter is silently a dangling reference is a plausible wrong answer at exit 0,
which CLAUDE.md calls strictly worse than a refusal.

A WARNING and not an error, deliberately. The emitted table is not wrong; it is
exactly the decision logic the document states. What is missing is the wiring,
which the caller can supply by hand, so exit status stays 0 and the tables are
still emitted. Actually modelling the graph is E1 and is not what D-6 ruled.

The consequence sentence differs by edge kind, which is the part most likely to
be flattened by a later edit: a requiredDecision tells you to run that decision
first and pass its result in, while a requiredInput tells you the inputData node
is not modelled and that any typeRef on its variable is not applied. Those are
different facts and a single generic sentence would be wrong for one of them.

Both edge kinds live in one fixture on purpose: they are the same single
omission, and a warning per edge makes both visible at once. Isolated from the
label/name precedence that policy/xml-baseline-13 and policy/xml-output-without-label
pin -- both <output>s here set name and label to the same string, and both
<input>s omit label entirely -- so a change to convOutputCol precedence cannot
perturb this recording.

For what D-6 named and this does NOT cover, see
symptom/xml-drg-siblings-dropped-silently.'
SOURCE='src/DMN/XML/XmlToDmnmd.hs drgEdgeDropped, called from convdec; the decInfoReq field of Decision in src/DMN/XML/ParseDMN.hs. DECISIONS.md D-6'
ARGS='-f xml --to=ts input.dmn'
