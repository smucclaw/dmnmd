TITLE='the same catch-all row under hit policy F emits SILENTLY -- the negative control for the U warning'
WHY='D-16 phase 1. Companion to policy/hp-unique-catchall-warned, and the case that gives that one its meaning: a warning that fires on everything teaches people to ignore it, which is exactly the measurement that moved this check out of the reader and into the XML backend. F (first match wins) permits overlapping rules by definition, so a catch-all is not merely tolerated under F but is the idiomatic way to write an else-rule -- which is why the U message names F as one of its two repairs, and why this case doubles as proof that the repair works. The guard is `hitpolicy dt /= HP_Unique`, so P, A, O, R and the Collect family are silent too. Two further silent shapes are checked at the hspec level in TranslateXMLSpec rather than here, because each needs a table this fixture format cannot vary cheaply: a U table with NO catch-all, and a U table whose row has `-` in ONE input column but not all of them. The second matters most -- a partial wildcard does not match everything, so it does not overlap every rule, and it is what an over-eager predicate gets wrong. What is pinned: no warning, exit 0, and a document that emits like any other F table. If this case ever starts warning, the predicate has widened past the shape it was written for.'
SOURCE='src/DMN/Translate/XML.hs fidelityDiags uniqueCatchAllWarns; DECISIONS.md D-16'
ARGS='--to=xml input.md'
