TITLE='the same catch-all row under hit policy F emits SILENTLY, as a rule -- the negative control for the U promotion'
WHY='D-16. Companion to policy/hp-unique-catchall-promoted, and the case that gives that one its meaning: a warning (or a promotion) that fires on everything teaches people to ignore it, which is exactly the measurement that moved this check out of the reader and into the XML backend in phase 1. F (first match wins) permits overlapping rules by definition, so a catch-all is not merely tolerated under F but is the idiomatic way to write an else-rule -- which is why the U message names F as one of its repairs. Phase 2 sharpened what this case controls for: under U the trailing catch-all is now PROMOTED to a default output value, and this case pins that under F it is NOT -- the row stays an ordinary <rule>, no <defaultOutputEntry> appears, and stderr stays empty. The guard is `hitpolicy dt == HP_Unique` in promoteTrailingCatchAll and `hitpolicy dt /= HP_Unique` in the leftover warning, so P, A, O, R and the Collect family are silent and unpromoted too. Two further silent shapes are checked at the hspec level in TranslateXMLSpec rather than here, because each needs a table this fixture format cannot vary cheaply: a U table with NO catch-all, and a U table whose row has `-` in ONE input column but not all of them. The second matters most -- a partial wildcard does not match everything, so it does not overlap every rule, and it is what an over-eager predicate gets wrong. What is pinned: no warning, no promotion, exit 0, and a document that emits like any other F table. If this case ever starts warning or growing a <defaultOutputEntry>, the predicate has widened past the shape it was written for.'
SOURCE='src/DMN/Translate/XML.hs promoteTrailingCatchAll, fidelityDiags uniqueCatchAllWarns; DECISIONS.md D-16'
ARGS='--to=xml input.md'
