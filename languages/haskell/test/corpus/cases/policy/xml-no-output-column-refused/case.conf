TITLE='a table with no output column is refused, because DMN tDecisionTable is output+ and no document expresses one'
WHY='The markdown grammar accepts a one-column table; symptom/struct-onecol-no-output records that it probably should not, and two more symptom cases reach the same shape. DMN does not: tDecisionTable requires at least one <output>, and dmnmd own reader picks it with xpList1.

Without this check the failure was `dmnmd: Prelude.tail: empty list` - the write half of xpList1 meeting an empty list - which names no table, no column and no reason. That is the exact opposite of the rule this backend is written to. Three of the 120 eligible round-trip fixtures hit it.

Refusing is the whole answer available. There is nothing to emit and nothing to warn about: a <decisionTable> with no <output> is not a document, so this is not a fidelity trade-off but an absence of any target to translate into.

Exit 1, and NOTHING is emitted for any table in the file, because a DMN document missing one of the decisions it was asked to carry is indistinguishable from a complete one - the same rule the L4 backend follows.'
SOURCE='src/DMN/Translate/XML.hs fidelityDiags noOutputErrs; DMN13.xsd tDecisionTable output+; DMN/XML/ParseDMN.hs DecisionTable dtOutput uses xpList1'
ARGS='--to=xml input.md'
