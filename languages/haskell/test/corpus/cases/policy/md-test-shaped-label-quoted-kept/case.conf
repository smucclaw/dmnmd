TITLE='negative control: a double-quoted cell that looks like a comparison is a string literal and is NOT refused'
WHY='The first of the two escape hatches the unreadable-test refusal names. A tenure column of band labels -- "<1 year", "1-5 years", ">5 years" -- is a legitimate shape, and two of its three labels begin with a comparison operator. Quoted, each cell is a string literal (unquoteCell, all or nothing), and the table emits three string equality tests at exit 0, exactly as it did before the refusal existed.

This is why the check runs on the RAW cell text in pass 1 of the markdown reader and not on the built table: unquoteCell strips the quotes in pass 1, and afterwards "<1 year" and <1 year are the same FNullary (VS "<1 year"). A check on the IR could not tell this case from policy/md-unreadable-comparison-refused.

Recorded before the refusal was implemented, so an unchanged recording is the evidence that the refusal left it alone.'
SOURCE='src/DMN/DecisionTable.hs mkInputFsAt and unquoteCell; src/DMN/ParseCell.hs unreadableTestShape'
ARGS='--to=ts input.md'
