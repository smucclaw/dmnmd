TITLE='hit policy F returns only the first matching row, not every match'
WHY='Guests=3 matches all three rows. F must return "kids" alone. This is the
distinguishing behaviour of First: if the arm ever returned every match, or the
last one, the answer would still look plausible, so it needs pinning. HP_First
consumes `matched = filter ((given_input `matches`) . row_inputs)`, the exact
FEELexp comparison layer the S-FEEL grammar replaces, so a change in how `<= 4`
is compiled shows up here.'
SOURCE='src/DMN/DecisionTable.hs evalTable, HP_First arm'
ARGS='-q -t ts input.md'
STDIN_FILE='stdin'
