TITLE='typeRef="Any" declares no restriction, so the column is INFERRED rather than refused'
WHY='Any is FEEL'"'"'s top type: every value conforms to it, so the attribute states exactly what an absent typeRef states. dmnmd used to route it to the unknown-typeRef refusal, whose reasoning does not reach it -- that refusal exists because a type dmnmd cannot model names a domain it would then silently misread (a date column read as a string turns every guard into a comparison that can never match), and Any names no domain. Refusing it meant refusing a document for saying "unconstrained" out loud instead of by silence. It only became reachable often once the decision <variable> stopped being ignored, and it is reached often: 136 of the 355 documents in one l4-ide corpus export declare typeRef="Any" on a decision variable, which is what that exporter writes wherever an L4 type has no DMN counterpart. What is pinned: exit 0, and numerals emitted UNQUOTED because the cells inferred Number. A refusal here means Any has been folded back into the unknown-type branch.'
SOURCE='src/DMN/XML/XmlToDmnmd.hs convertType, the "any" arm'
ARGS='-f xml --to=ts input.dmn'
