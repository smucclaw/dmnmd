TITLE='Collect Sum over cent-precision cells is exact decimal addition'
WHY='1234.56 + 78.9 + 0.05 is 1313.51, and that is what comes out. This is
arguably the single most valuable consequence of DECISIONS.md D-1 for the kind
of table dmnmd is aimed at, and the existing policy/eval-hp-collect-sum cannot
demonstrate it: its fixture sums 5, 10 and 20, which binary32 adds exactly, so
it recorded 35.0 before the change and 35.0 after. This one does not. Measured
on the pre-change binary, summing these three Float cells gives 1313.5101 -- an
error in the hundredth of a cent, at exit 0, from a column of figures a human
can add in their head and get right. Scientific addition aligns exponents and is
exact, so no rounding policy is involved here at all: unlike division, addition
of two terminating decimals is always a terminating decimal. Note the printed
scale is inherited from the widest cell, which is what SQL NUMERIC does.'
SOURCE='src/DMN/DecisionTable.hs evalTable, HP_Collect Collect_Sum; DECISIONS.md D-1'
ARGS='-q -t ts input.md'
STDIN_FILE='stdin'
