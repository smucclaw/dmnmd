TITLE='a DMN inputExpression with no typeRef goes through D-2 inference, and disagreeing cells are refused'
WHY='WHAT IT DOES: the XSD makes typeRef optional, so this is a valid DMN 1.3 document with an untyped input column. dmnmd must decide the type itself, which routes the XML reader through DecisionTable.inferTypes (XmlToDmnmd.hs:408) and therefore through D-2s inference refusal, because inferenceErrors lives inside tableErrors (XmlToDmnmd.hs:199). The two cells disagree -- 5 is a number, Blue is not -- so the column cannot be resolved, the table is refused with a located Error diagnostic naming both cells, and the run exits 1. WHY THAT IS RIGHT: on trunk this emitted `shade === "5"` at exit 0 -- a NUMBER cell read as literal text, so a caller passing the number 5 would not match the row written for it. That is the silent-wrong-answer class D-2 exists to remove, and it was reachable from XML as well as from markdown. Note the diagnostic here is a structured Diagnostic with the FILE NAME on it, not the markdown paths error/CallStack: the XML reader has a diagnostics channel and uses it, which is the shape CLAUDE.mds governing rule asks for. WHAT THIS CASE IS PROTECTING: no other fixture in the tree omits typeRef, so before this one NOTHING exercised the coupling between the XML reader and inference. CLAUDE.md described the XML reader as bypassing mkDTable on purpose and calling domainErrors directly, which understated it once D-2 put inferenceErrors inside tableErrors; the wording is corrected in the same commit that adds this case. A future change to inference that assumes it only affects markdown will turn this case red, which is the entire point.'
SOURCE='src/DMN/XML/XmlToDmnmd.hs:199 and :408; src/DMN/DecisionTable.hs inferenceErrors; DECISIONS.md D-2'
ARGS='-f xml --to=ts input.dmn'
