TITLE='DMN <inputValues> and <outputValues> are honoured: a rule outside either is refused'
WHY='<inputValues> and <outputValues> ARE a declared domain, and DMN XML is the
one place a domain arrives declared by the input format rather than inferred by
dmnmd. The reader already unpickled them and converted them into T.enums - and
then, for input columns, nobody read the result. Parsed, not honoured, silent:
the rule this module exists to enforce, broken inside the module itself. The
sibling case policy/xml-output-values still records the accepting side of that
same fixture.

Rule_3 in this fixture violates BOTH, which is the point of the case:

  <inputValues>[0..150]</inputValues>          vs an inputEntry of 200
  <outputValues>"minor","adult","senior"</...> vs an outputEntry of "pensioner"

Both are reported, each located to table, column and row, and the table is not
emitted. Exit 1.

Three things worth not breaking:

1. The numeric range constrains a plain number. That falls out of deciding
   membership with fEval - the same function that decides whether a rule matches
   at run time - rather than a hand-written list lookup. A separate membership
   test would drift from matching, and this is the case that would catch it.
2. The OTHER rules are untouched, and their inputEntries are tests (< 18,
   [18..65]), which are correctly exempt: a test selects a subset of the domain
   rather than being a member of it.
3. The domain and the cells are unquoted consistently. <outputValues> is written
   "minor","adult","senior" and the outputEntries are written "minor" etc; both
   go through the same S-FEEL literal unwrapping, so they compare equal. If only
   one side were unquoted, every rule in every XML file would violate its own
   declared domain - which is exactly the regression this pins.

The rule itself is DMN.DecisionTable.domainErrors, shared with the markdown
reader rather than reimplemented here; only the diagnostic framing is local. THE QUOTED DOMAIN AND CELL CHANGED, AND THAT IS THE POINT: this message used to render the declared domain as `{[0.0..150.0]}` and the offending cell as `200.0`, where the source document writes `<text>[0..150]</text>` and `<text>200</text>`. showDomainMember rendered numbers with show; it now renders through DMN.Number.showNumPlain over a Scientific, so the refusal quotes the document back verbatim. Note this is strictly a rendering correction -- WHICH rules are refused did not change.'
SOURCE='src/DMN/XML/XmlToDmnmd.hs convTable domainDiags; src/DMN/DecisionTable.hs domainErrors; BUILD-SPEC-dmnmd-e4.md sections 7 and 10 step 5'
ARGS='-f xml --to=ts input.dmn'
