TITLE='<inputData> carrying a child <variable> is accepted'
WHY='DMN 1.3 allows <inputData> to declare its type through a nested <variable>,
and most exporters emit one. The reader used to accept only the childless form,
so a document that said what type its input was got rejected while the vaguer
one passed. PR #17s blocker 1. Output is byte-identical to
policy/xml-baseline-13. Note what is NOT asserted: the typeRef on the
<variable> is not yet used to type the column — the type still comes from the
<inputExpression>. If a later change starts honouring it, this recording will
move, and that is a real behaviour change worth looking at rather than
re-recording past.'
SOURCE='src/DMN/XML/ParseDMN.hs; E0 audit finding E0-blocker1-variable-under-inputData'
ARGS='-f xml --to=ts input.dmn'
