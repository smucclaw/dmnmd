TITLE='a division by 4, by 0.25 and a power with a literal non-negative integral exponent are exact in l4 and in dmnmd, so nothing is said'
WHY='The negative control of policy/l4-inexact-cells-warned.
The quotient of a terminating decimal by a nonzero literal whose numerator, in lowest terms, has no prime factor but 2 and 5 terminates, so DMN has nothing to round and L4 divides exactly: d / 4 and d / 0.25 are silent.
d ** 2 has a non-negative integral literal exponent, which is exact in l4 (EXPONENT 10 20 is 10^20).
No warning, no comment above the function.
The test cannot see a width: a terminating quotient of more than 34 significant digits is rounded by DMN and exact in L4, and the emitter knows nothing about how many digits a runtime input has.
That is stated in DECISIONS.md D-24 and CLAUDE.md, and not pinned here.'
SOURCE='src/DMN/Translate/L4.hs terminatingDivisor exactExponent; DECISIONS.md D-24'
ARGS='--to=l4 input.md'
