TITLE='the L4 backend refuses an OutputOrder table rather than emitting a scalar BRANCH that drops matches'
WHY='Only Collect was pinned, by policy/md-l4-refuses-collect; the L4 backend refuses
four hit policies and the other three were uncovered. OutputOrder is list-valued -
it returns EVERY matching row, ordered by the output enum - so a scalar first-match
BRANCH would return one row and silently drop the rest, a cardinality mismatch.
Refusing is the load-bearing choice CLAUDE.md describes under Deliberate refusals:
fail rather than give a plausible wrong answer. Contrast
symptom/eval-hitpolicy-ignored-by-js, where the js and py backends do NOT refuse.

The recording also pins that the refusal exits 1 and emits nothing whatsoever on
stdout, so a redirect cannot leave a half-written file behind. That was true here
only because this case is single-table; see
policy/l4-multitable-refusal-emits-nothing-large for the case where it was false,
and for what makes it true now.

This WHY used to end "the source position in the CallStack is what separates this
recording from the RuleOrder one." That stopped being true when the refusal became
a Diagnostic: there is no CallStack any more. The discriminator is now the message
text itself, which names the hit policy AND the table - strictly better, because a
line number was never a fact about the users document, and this recording used to
go red whenever an unrelated edit moved L4.hs.'
SOURCE='src/DMN/Translate/L4.hs l4Refusal, the HP_OutputOrder arm; app/Main.hs outputToAll; BUILD-SPEC-dmnmd-to-l4.md section 9 item 4'
ARGS='--to=l4 input.md'
