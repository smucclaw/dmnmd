TITLE='the L4 backend refuses an OutputOrder table rather than emitting a scalar BRANCH that drops matches'
WHY='Only Collect was pinned, by policy/md-l4-refuses-collect; toL4 refuses four hit policies at four separate error sites and the other three were uncovered. OutputOrder is list-valued - it returns EVERY matching row, ordered by the output enum - so a scalar first-match BRANCH would return one row and silently drop the rest, a cardinality mismatch. Refusing is the load-bearing choice CLAUDE.md describes under Deliberate refusals: fail rather than give a plausible wrong answer. Contrast symptom/eval-hitpolicy-ignored-by-js, where the js and py backends do NOT refuse. The recording also pins that the refusal exits 1 and emits nothing whatsoever on stdout, so a redirect cannot leave a half-written file behind. The source position in the CallStack is what separates this recording from the RuleOrder one.'
SOURCE='src/DMN/Translate/L4.hs toL4, the HP_OutputOrder error arm (L4.hs:59); BUILD-SPEC-dmnmd-to-l4.md section 9 item 4'
ARGS='--to=l4 input.md'
