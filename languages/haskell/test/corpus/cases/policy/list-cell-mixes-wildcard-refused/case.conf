TITLE='R4: a collection cell mixing "-" with values is refused, because the "-" already matched everything'
WHY='`RED, -` in a collection column means "contains RED, or anything" - which
is just "anything". The other values cannot change the answer, so writing them
is either a mistake or a misunderstanding, and both want to be told.

The usual cause is a trailing or doubled comma: `RED, ` and `RED,, BLUE` both
split to a fragment that is the empty string, and mkFEither turns the empty
string into FAnything. That is the same one-character-typo class that
domainErrors emptyMemberMsg exists to catch on the sub-header row, arriving here
by a different route.

Refusing beats dropping the wildcard and keeping the rest, because we cannot
tell a typo from a deliberate "anything goes" and the two want opposite
treatment. Making the author say which costs them one character.'
SOURCE='src/DMN/DecisionTable.hs structuralErrors inputCellErrs'
ARGS='--to=ts input.md'
