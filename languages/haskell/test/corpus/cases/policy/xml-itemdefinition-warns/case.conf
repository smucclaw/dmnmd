TITLE='an <itemDefinition> dmnmd cannot honour warns and says exactly why - and the document is PREFIX-QUALIFIED'
WHY='Two itemDefinitions, treated differently, which is the whole content:

  tRouting  string + <allowedValues>   -> HONOURED, and therefore SILENT
  tDriver   <itemComponent> structure  -> refused, with a specific reason

Before tier 1 both warned with the same generic sentence, because the whole data
model was being discarded. A warning that fires on everything carries no
information; the reader cannot tell which declaration is the problem. Now
silence means "read and used" and a warning names one construct and why.

THE SECOND itemDefinition USED TO BE isCollection="true", AND THAT IS NO LONGER
A REASON TO REFUSE. The old recording carried a long message arguing that
mapping isCollection onto DMN_List would turn a loud refusal into a silent wrong
answer, because the cell layer read every cell of a collection column as a
scalar. That was true when it was written and is now false: the cell layer
honours collections, and isCollection is lifted to a real type - see
policy/xml-iscollection-membership.

The guarantee that message was protecting is kept, one level down. A collection
cell that is not a plain member is refused per RULE ID by structuralErrors R3,
so a <inputEntry> holding list contains(?, "RED") is still refused, by name.
What changed is that the refusal is about the CELL rather than about the type.

So the fixture now uses a STRUCTURED type instead, which is still genuinely
unhonourable - dmnmd decision table columns are scalars and there is nothing to
map a record onto. The case keeps testing what it was written to test.

THE PREFIX-QUALIFIED NAMESPACE IS MANDATORY, NOT INCIDENTAL. HXTs hasName compares
the QUALIFIED name, so a filter written hasName "typeRef" matches nothing against
<semantic:typeRef>, deletes the children the pickler exists to read, and leaves the
itemDefinition parsing as empty. The resulting diagnostic then contradicts the
document it is describing. Every name test in the ItemDefinition pickler goes
through hasNameWith (... . localPart); an unprefixed fixture would pass with the
bug present. The DMN specifications own Chapter 11 example is prefix-qualified.'
SOURCE='src/DMN/XML/XmlToDmnmd.hs itemDefDiags/unusable; src/DMN/XML/ParseDMN.hs itemDefElems; BUILD-SPEC-dmnmd-l4-sumtype.md sectionB.4'
ARGS='--from=xml --to=ts input.dmn'
