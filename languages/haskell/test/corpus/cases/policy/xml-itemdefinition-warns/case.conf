TITLE='a dropped <itemDefinition> warns, naming it — and the document is PREFIX-QUALIFIED'
WHY='<itemDefinition> is DMN data model: where allowedValues (an enum domain),
isCollection (a list type) and itemComponent (a structured type) are declared.
dmnmd models none of it, and used to discard the entire section via
xpIgnoredElems, which returns () - SILENTLY. That is precisely the rule
XmlToDmnmd own module header exists to enforce, broken one module upstream in
ParseDMN.

Warning, not Error, and the distinction is the usual one: nothing is being read
WRONGLY. A table using such a type still fails loudly later at convertType,
because the typeRef naming it is unknown. What was missing was the CONNECTION
between the two - a reader told a typeRef is unknown had no way to learn that
the document declares it and dmnmd dropped it.

THIS FIXTURE IS PREFIX-QUALIFIED ON PURPOSE, AND THAT IS THE POINT OF THE CASE.
Every element is semantic:-prefixed, as the DMN specification own Chapter 11
example is (it is checked in under test/examples/ with 1867 such elements). HXT
hasName compares the QUALIFIED name, so a filter written with hasName matches
nothing against this document: the itemDefinition would parse as EMPTY and the
diagnostic would be FALSE ABOUT THE DOCUMENT - reporting no typeRef while the
file has one on the next line. The pickler therefore uses
hasNameWith (... . localPart). An unprefixed fixture cannot catch that, which is
why this one is prefixed.

Also pinned: two itemDefinitions produce two warnings, in document order, each
naming its own; isCollection="true" on the second is dropped like everything
else; and the run still EXITS 0 and emits the table, because a warning must not
cost a document that is otherwise fine.

Honouring these is BUILD-SPEC-dmnmd-l4-sumtype.md Part B tiers 1-2 - where
isCollection finally answers what a declared domain on a list column means. When
that lands this recording changes and the message should stop saying "does not
model".'
SOURCE='src/DMN/XML/ParseDMN.hs xpPeekedElems/defItemDefNames; src/DMN/XML/XmlToDmnmd.hs itemDefDiags; BUILD-SPEC-dmnmd-l4-sumtype.md sections B.1-B.4'
ARGS='-f xml --to=ts input.dmn'
