TITLE='an untyped XML column of BARE literals 2020 and true is still inferred Number and Boolean'
WHY='The negative control for symptom/xml-untyped-quoted-literals-stay-strings. The same two untyped columns with the quotes taken off: 2020 is the number and true is the boolean, so inference must still call the columns Number and Boolean. The guard stays year === 2020.0 and the output stays the unquoted boolean true. If this case moves, reading a quoted cell as hard String evidence has swallowed the bare numerals, or inference has stopped recognising literals it should recognise, and every untyped XML column is being typed by something other than its cells.'
SOURCE='src/DMN/XML/XmlToDmnmd.hs resolveColumn firstPass; src/DMN/DecisionTable.hs inferEvidence'
ARGS='-f xml --to=ts input.dmn'
