TITLE='hit policy A, two matching rows with identical outputs: returns that output ONCE, not twice and not as an error'
WHY='Age 5 matches both rules and they carry byte-identical outputs, which is
precisely the situation DMN ANY exists to permit: several rules may match
provided they agree, and the table then has exactly one answer. It must print ok
once.

This is the case that pins BOTH halves of D-5, and it is the only ANY case that
can. The guard was not (null (nub …)) where it meant length (nub …) > 1, so an A
table always refused. Repairing only that guard would have left the success
branch as row_outputs <$> outputs -- one entry per matched row, the list-valued
shape HP_OutputOrder, HP_RuleOrder and HP_Collect_All use -- and app/Main.hs
prints one line per element, so this input would have printed ok TWICE at exit 0.
A one-row table cannot see that, which is why eval-hp-any-always-left is not
sufficient on its own. The arm now dispatches on the nub itself, so agreement and
single-hit-ness are decided by the same expression and cannot drift apart.

Two of the recordings this case used to carry were false in a way worth
remembering: the message claimed multiple DISTINCT rows when nub collapses these
two to one, and a control run with a genuinely different second output produced
identical text. The tool could not distinguish a correct refusal from a wrong
one. eval-hp-any-two-rows-disagree is now the control that keeps that honest.

Overlapping prefix comparisons were chosen over two wildcard rows because prefix
comparisons are already policy-correct in the corpus, so nothing else in the cell
layer is exercised, and the overlap is the kind ANY is for rather than a
degenerate duplicated rule. The -t ts flag keeps the unrelated
cli-showtojson-unknown-format defect out of the recording.'
SOURCE='src/DMN/DecisionTable.hs evalTable, the HP_Any arm; DECISIONS.md D-5'
ARGS='-q -t ts input.md'
STDIN_FILE='stdin'
