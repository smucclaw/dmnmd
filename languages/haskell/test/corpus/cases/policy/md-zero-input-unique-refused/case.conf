TITLE='a U table with no input column and two rules is refused, because both rules match every input'
WHY='Every column is marked (out), so the table has zero input columns and every rule is vacuously true for every call. Under hit policy U that is overlapping rules, which DMN 1.3 section 8.2.10 forbids. Until this was fixed the case was symptom/md-zero-input-unique-first-match: the reader refused the same table with three rows ("row 1 and row 2 both match every input", from DMN.Regions.conflictErrors) but accepted it with two, because uniqueCatchAll tested all (all (== FAnything)) over the last row input cells, which is vacuously true when there are none, so the last row was read as the trailing catch-all default and the first row answered every input. ts, js and py render a rule with no tests as if ("default"), a truthy string, so they took the first rule and the second was dead code; L4 emitted IF TRUE for the first and OTHERWISE for the second; --to=xml wrote both rules with no input entries; all at exit 0. Now uniqueCatchAll also asks for an input column to be a wildcard in, so both rules are live, the conflict is found, and the table is refused at exit 1 with nothing emitted. The message says there is no input column, and offers the two repairs that apply: add an input column that tells the rules apart, or make the hit policy F. D-13 had called this shape unreachable from markdown, and its correction of 2026-09-26 says otherwise. policy/md-zero-input-single-rule-accepted and policy/md-zero-input-first-hit-accepted pin what is still accepted.'
SOURCE='src/DMN/DecisionTable.hs uniqueCatchAll; src/DMN/Regions.hs conflictMessage; DECISIONS.md D-13 correction of 2026-09-26; audit 10 finding f8; chosen in the branch fix/audit10-parser-silent-drops (assumed, not ruled)'
ARGS='--to=ts input.md'
