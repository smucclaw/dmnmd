TITLE='two rows of a U table with identical guards are refused, naming both rows'
WHY='D-13. `1.1` and `1.10` are both genuine FEEL numbers, so anchored inference (D-2) resolves the column and has nothing to refuse -- but Scientific compares on value and ignores scale, so the parser builds the same FNullary (VN 1.1) for both cells and every backend used to emit `if (Version === 1.1)` twice, at exit 0, with row 2 permanently dead. `uniquenessErrors` refuses it: a Unique table promises its rules are disjoint (DMN 1.3 §8.2.10) and dmnmd now checks that promise statically, because the transpilers do not implement hit policies at all and would never have reported the collision at run time. The guarantee this pins is narrow ON PURPOSE: EXACT duplication, U tables only. Overlap without identity (`<= 20` versus `>= 10`) was not refused by D-13. Since D-22 part 2 a separate check, conflictErrors, refuses it (policy/l4-hitpolicy-unique-silently-first), and leaves this table to the D-13 message, which says more about it: that row 2 can never match, and that the values are compared, not the text. So this recording did not move. Comparison is on the PARSED cells, which is why this case works at all -- comparing source text would see `1.1` and `1.10` as different and miss it. This case was `symptom/infer-version-float-collapse` until the check landed; the old name described the mechanism (and mis-described it, since D-1 removed the Float) rather than the guarantee.'
SOURCE='src/DMN/DecisionTable.hs uniquenessErrors; DECISIONS.md D-13'
ARGS='--to=ts input.md'
