TITLE='an untyped XML output column of FEEL strings "007" and "008" is a String column and is accepted'
WHY='The same root cause as policy/xml-untyped-quoted-literals-stay-strings, in its loud form. dmnmd refuses a BARE 007 in an undeclared column because it cannot tell the number 7 from an identifier that happens to be digits (VAmbiguous, D-2). A QUOTED "007" has already said which it is: it is a FEEL string literal. The XML inference pre-pass used to strip the quotes before grading the cell, so the string was refused as if it were an unquoted numeral, at exit 1, with advice (declare the column, output1 : String) that is markdown header syntax and means nothing in a DMN document. The document was perfectly clear and was refused. What is pinned: exit 0 and the outputs "007" and "008" as strings. The bare form is still refused, which DmnXmlSpec pins from the other side.'
SOURCE='src/DMN/XML/XmlToDmnmd.hs resolveColumn; src/DMN/DecisionTable.hs mkFsKeepingQuotes, inferEvidence, redundantLeadingZero; audit 2026-09-26 finding f4'
ARGS='-f xml --to=ts input.dmn'
