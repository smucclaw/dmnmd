TITLE='R1: a nested collection column ([[T]]) is refused, and the message names the flattened repair'
WHY='DMN isCollection is a FLAG, not a depth (DMN 1.3 Table 26) - there is no
way to say "list of lists" in DMN, and dmnmd has no cell syntax for one either.
parseType accepts the nesting because it recurses, so without this check a
[[Number]] column reached the cell layer of a plain Number and every guard was
built at the wrong type.

Column-level, not cell-level, so an all-wildcard nested column is refused too -
a column whose type has no meaning has no meaning even when no row uses it.

The message suggests the INNERMOST scalar wrapped once (": [Number]"), not the
type it just rejected. An earlier draft echoed [[Number]] straight back as the
repair, which is a diagnostic that tells you to write what you already wrote.'
SOURCE='src/DMN/DecisionTable.hs structuralErrors nestedCols'
ARGS='--to=ts input.md'
