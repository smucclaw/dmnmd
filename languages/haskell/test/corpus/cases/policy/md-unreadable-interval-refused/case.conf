TITLE='an interval whose endpoints dmnmd cannot read (date literals) is refused, located, and nothing is emitted'
WHY='The interval half of policy/md-unreadable-comparison-refused. An input cell shaped like an S-FEEL interval -- an opening bracket from [ ( ], two endpoints separated by .., a closing bracket from ] ) [ -- whose endpoints are not number literals is refused at exit 1, located at its table, column and row.

WHAT IT USED TO DO: --to=ts emitted day === "[date(\"2026-09-24\")..date(\"2026-10-24\")]" at exit 0 with nothing on stderr. A date range that could never match any date.

THE SHAPE IS NARROWER THAN IT LOOKS, on purpose. The text between the brackets must contain no square bracket, so a markdown link [notes](../notes.md) is not an interval, and neither is [1..5] [10..20] -- two intervals with no comma between them, whose column-level refusal policy/num-negation-is-numeric-evidence pins and which a cell-level refusal here would pre-empt. Both endpoints must be present and must not be dots alone, so [...] and (etc..) stay text. The range written with a double dash, [24 Sep 2026 -- 24 Oct 2026], is deliberately NOT caught: it has no .. separator, and is recorded as symptom/md-dash-written-interval-silent.'
SOURCE='src/DMN/ParseCell.hs unreadableTestShape; src/DMN/DecisionTable.hs mkInputFsAt; src/DMN/ParseTable.hs mkFEELCol'
ARGS='--to=ts input.md'
