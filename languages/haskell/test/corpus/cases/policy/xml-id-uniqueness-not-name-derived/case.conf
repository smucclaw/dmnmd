TITLE='xsd:IDs are positional, not derived from column names, because slugging two different names can produce one id'
WHY='An xsd:ID must be unique across a DMN document, and every id dmnmd writes is built in one place so that uniqueness is a property of the construction rather than a hope.

The first version derived the <inputData> id from the column name through a slug that mapped anything outside [A-Za-z0-9_] to _. That slug is NOT injective, and the markdown identifier grammar admits both a space and an underscore in a column name (DMN/ParseFEEL.hs parseVarname), so `a b` and `a_b` BOTH became inputData_a_b. The result was two elements sharing one id and an <informationRequirement> href pointing at both: a document that xmllint refuses -

  attribute id: inputData_a_b is not a valid value of the atomic type xs:ID

- emitted at EXIT 0. A well-formed document that is invalid and ambiguous, produced silently, which is the one failure mode a writer has that a reader does not and the reason DECISIONS.md D-8 is written the way it is.

It was found by probing xmllint with a hand-built two-column table, NOT by any fixture and NOT by the round-trip harness: dmnmd own reader never looks at an <inputData> id (D-6 - the whole DRG is parsed and ignored), so the round trip was and remains clean on this input. That is worth remembering about the harness generally. It answers "did the meaning survive dmnmd", not "is this a valid DMN document"; only --xsd answers the second, and only for the constructs a schema can express.

This case pins the shape: sequential ids over the deduplicated list of input names, with the href computed from the same list, so the two cannot disagree. The column NAMES still appear, unaltered, on @name - which is where a human reads them.'
SOURCE='src/DMN/Translate/XML.hs definitionsOf (inputVars / inputDataId / position); DMN13.xsd tDMNElement @id is xsd:ID; DMN/ParseFEEL.hs parseVarname admits space and underscore'
ARGS='--to=xml input.md'
