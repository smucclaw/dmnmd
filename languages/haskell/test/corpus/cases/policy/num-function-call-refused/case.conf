TITLE='`floor(Amount / 5)` is refused BY NAME, located, rather than by a parser complaint'
WHY='Invocation is outside S-FEEL entirely: DMN 1.3 §9.2 rules 1-38 contain no invocation production, and the only parenthesised forms in the whole grammar are not(...) and the date/time/duration literals of rule 34. So this refusal is the destination and not a stage -- implementing builtins would mean a roster duplicated across fNEval, the JS and PY maps, and L4. What is pinned: the message names the called function, cites the absence of the production, and prints the repair (compute it in a preceding decision and pass it in as a column); the location names table, column and rule number; exit 1 and nothing is emitted. It used to be a bare megaparsec `1:2: unexpected l`, a column-2 grumble about the second character of `floor`. IF dmnmd ever does implement FEEL builtins this recording changes, and that is a scope decision rather than a regression -- say so in the commit message.'
SOURCE='src/DMN/ParseCell.hs callName, invocationMsg; located by DMN.DecisionTable.mkFsAt'
ARGS='--to=ts input.md'
