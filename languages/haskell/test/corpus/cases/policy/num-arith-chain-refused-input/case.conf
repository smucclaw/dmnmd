TITLE='`Age * 2 + 1` in an INPUT cell is refused by the SAME message as the output cell, not by inputArithErrs'
WHY='D-15, and the twin of num-arith-chain-refused-output. The ruling recorded these two positions as producing different messages; they do not. A chained cell never parses, so no FFunction is ever built, so inputArithErrs -- which matches on FFunction in row_inputs -- never sees it, and both positions reach notATestMsg. The recordings differ only in the located site (column "Age" here, column "Result" there). This pair is what makes the difference visible if either path is ever changed alone, and it is why a D-15 fix confined to inputArithErrs would not have touched a single `Age * 2 + 1` author. inputArithErrs IS reached by the parenthesised form in an input cell -- `(Age * 2) + 1` -- because that one parses; see policy/num-dash-range-refused for that path. Note the consequence of getting the position wrong: arithmetic in an input cell can never match, since fEval has no FFunction arm.'
SOURCE='src/DMN/ParseFEEL.hs parseFNF3; src/DMN/ParseCell.hs notATestMsg'
ARGS='--to=ts input.md'
