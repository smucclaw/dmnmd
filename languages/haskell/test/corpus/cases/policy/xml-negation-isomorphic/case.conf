TITLE='FEEL negation survives --to=xml unchanged, because DMN spells it the same way dmnmd does'
WHY='WHAT IT DOES: an input cell reading not([1..5]) emits as <text>not([1..5])</text>, the document is XSD-valid, and md -> XML -> ts is byte-identical to md -> ts. WHY THAT IS RIGHT: negation is DMN 1.3 §9.2 rule 12.b and dmnmd adopted the same surface syntax under D-9, so this is one of the rare constructs that is isomorphic in BOTH directions -- unlike the suffix comparison (D-11, mirrored on the way in and unrecoverable), the "=" test (no DMN operator, so it flattens to a bare value) or an authored rule number (no DMN field at all). Nothing has to be warned or refused here. WHAT THIS CASE IS PROTECTING, and why it exists at all: FNot and --to=xml were built on two branches at the same time off one base. When they met, showFeelXML had no FNot arm and -Werror=incomplete-patterns turned that into a COMPILE ERROR on CI rather than an unhandled cell. That is the argument for making an IR extension a TYPE change, and the reason the flag sits on the library stanza -- app/ is not covered, and a gap there would have been a run-time crash instead. This case pins the arm that resolved it, so a later refactor cannot quietly drop negation from the emitter and still pass the other XML recordings, none of which contain a not().'
SOURCE='src/DMN/Translate/XML.hs, showFeelXML; DECISIONS.md D-8, D-9'
ARGS='--to=xml input.md'
