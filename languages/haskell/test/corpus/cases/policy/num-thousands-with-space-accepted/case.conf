TITLE='`1, 000` — one space — is accepted as two alternatives, and that space is the promised escape hatch'
WHY='The thousands refusal discriminates on WHITESPACE: a thousands separator is conventionally written without a space and a multi-value list with one, so `1,000` is refused and `1, 000` is not. That convention is the entire discriminator, which makes it fragile in a specific way: someone tidying up `thousandsGrouped` to "ignore whitespace" would silently break the repair the refusal message promises, and every test would still pass. This case is what stops that. It is the paired control to policy/num-multivalue-numeric-preserved, which covers the other escape route (group size: `4111, 4112` has four-digit groups and cannot match at all).'
SOURCE='src/DMN/ParseCell.hs thousandsGrouped; src/DMN/DecisionTable.hs mkFsEither'
ARGS='--to=ts input.md'
