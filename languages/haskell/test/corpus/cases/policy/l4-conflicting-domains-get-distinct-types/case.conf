TITLE='two columns named alike with DIFFERENT domains become two L4 types, never one merged type'
WHY='Both tables have a `category` column, but one declares {Dining, Grocery} and the
other {Dining, Travel}. They are not the same type, so they do not get the same
name: Category and Category_2, with a warning naming the rename.

MERGING WAS MEASURED AND IS A SILENT WRONG ANSWER. Give the two a single type
holding the union and l4 check passes, l4 run exits 0, and the second table
confidently accepts a Grocery it declared it would not - assertion "satisfied".
A widened domain is invisible to l4 because after the merge it IS the declared
domain. That is the exact defect DecisionTable.domainErrors exists to refuse, and
it would have been reintroduced downstream, inside the emitted L4, where dmnmds
own checks can no longer see it.

Two distinct types are the honest option, and they work:

  $ l4 check out.l4  -> exit 0
  #ASSERT (Categorize "nfmart") EQUALS JUST `Grocery`  -> satisfied
  #ASSERT (Reclassify "uber")   EQUALS JUST `Travel`   -> satisfied
  #ASSERT (Reclassify "fair")   EQUALS JUST `Dining`   -> satisfied

Note the third assertion. `Dining` is a constructor of BOTH types, and l4 resolves
it type-directedly at the use site rather than complaining - which is why keeping
both types is viable at all. That was measured, not assumed; the design document
had assumed overlapping constructors would collide.

The warning is not optional decoration. Category_2 appears in no input file, so a
reader looking for where it came from has nothing to grep unless dmnmd says so.

The pairing case is policy/l4-shared-declare-across-tables, where the domains DO
agree and one type is emitted. Read them together.'
SOURCE='src/DMN/Translate/L4.hs assignEnumNames (keyed on the (name, members) PAIR) and its renameDiags'
ARGS='--to=l4 input.md'
