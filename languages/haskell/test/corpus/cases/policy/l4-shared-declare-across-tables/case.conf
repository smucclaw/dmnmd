TITLE='two tables declaring the same domain share ONE L4 sum type, and the file typechecks'
WHY='Both tables have a `category` column over {Dining, Grocery}. One DECLARE
Category is emitted in a file-level preamble and both functions use it.

  $ l4 check out.l4     -> exit 0
  #ASSERT (Categorize "foodpanda") EQUALS JUST `Dining`   -> satisfied
  #ASSERT (Recategorize "fair")    EQUALS JUST `Grocery`  -> satisfied

This was symptom/l4-duplicate-declare-across-tables, a regression from PR #30:
each table emitted its own DECLARE Category, l4 rejected the pair with "multiple
definitions for the identifier Grocery", and dmnmd exited 0 - the tool reporting
success while handing over a file its own downstream compiler refuses.

SHARING IS THE POINT, NOT A WORKAROUND FOR THE DUPLICATE. Two tables that declare
the same domain are talking about the same type, and now the emitted L4 says so:
CardToUse (Categorize "foodpanda") typechecks with the two sides RELATED, where
before sum types they were unrelated STRINGs and before this commit they were two
incompatible types with the same name. That composition is the whole reason
BUILD-SPEC-dmnmd-l4-sumtype.md sectionA.6 asked for a file-level entry point.

The pairing case is policy/l4-conflicting-domains-get-distinct-types, where the
names match but the domains do not. Read them together: the key is the PAIR
(name, members), and these two cases are its two branches.'
SOURCE='src/DMN/Translate/L4.hs toL4File / assignEnumNames / enumTypeNameOf; BUILD-SPEC-dmnmd-l4-sumtype.md sectionA.6'
ARGS='--to=l4 input.md'
