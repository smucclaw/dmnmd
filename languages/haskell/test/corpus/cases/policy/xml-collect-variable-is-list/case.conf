TITLE='under a list-valued hit policy the decision <variable> types the RESULT LIST, not the output column'
WHY='The second regression adversarial review found in D-17. Under C (no aggregation), RULE ORDER or OUTPUT ORDER the decision result IS a list, so the variable describes the collection of results ACROSS RULES, not the output column, whose cells are each one scalar. D-17 applied it to the column anyway and double-counted the list-ness: the cell "gold" was emitted as ["gold"], a value the document never states, at exit 0 with no diagnostic. The guard is narrow on purpose -- U, A, P and F each yield ONE value, so for those the variable does describe the output column and the fallback is right; and the four Collect AGGREGATIONS are single-valued too (C+ / C< / C> reduce to one value of the column type, C# counts), so only bare COLLECT, RULE ORDER and OUTPUT ORDER are excluded. What is pinned: the emitted cells are the scalars "gold" and "silver", NOT ["gold"] and ["silver"].'
SOURCE='src/DMN/XML/XmlToDmnmd.hs convTable outFallback / listValuedHitPolicy'
ARGS='-f xml --to=ts input.dmn'
