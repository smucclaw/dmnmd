TITLE='under a list-valued hit policy the decision <variable> types the RESULT LIST, not the output column'
WHY='The second regression adversarial review found in D-17. Under C (no aggregation), RULE ORDER or OUTPUT ORDER the decision result IS a list, so the variable describes the collection of results ACROSS RULES, not the output column, whose cells are each one scalar. D-17 applied it to the column anyway and double-counted the list-ness: the cell "gold" was emitted as ["gold"], a value the document never states, at exit 0 with no diagnostic. The guard is narrow on purpose -- U, A, P and F each yield ONE value, so for those the variable does describe the output column and the fallback is right; and the Collect AGGREGATIONS + < > are single-valued too, reducing to one value of the column type. COLLECT COUNT is single-valued but is not the column type: DMN 1.3 section 8.2.10 says "# (count): the result of the decision table is the number of outputs", so under C# the variable types the count and is not applied to the column at all (policy/xml-count-variable-number-column-inferred). Only bare COLLECT, RULE ORDER and OUTPUT ORDER read the variable as a list. Since the section 8.3.2 follow-up to D-17 they do not ignore it: the column takes the ELEMENT type of a collection variable -- here BandList, a collection of string, so the column is the scalar string -- and a variable that is not a collection is still not applied. (Before that follow-up the reader ignored the variable under those three outright, and under all four aggregations as well, although this WHY said the aggregations kept it: its predicate matched every HP_Collect. Reader and writer now share one classifier, DMN.Types.resultShape.) What is pinned: the emitted cells are the scalars "gold" and "silver", NOT ["gold"] and ["silver"].'
SOURCE='src/DMN/XML/XmlToDmnmd.hs convOutputCol; src/DMN/Types.hs resultShape'
ARGS='-f xml --to=ts input.dmn'
