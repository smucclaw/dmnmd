TITLE='under a list-valued hit policy the decision <variable> names a LIST of the output column type, declared as a synthesised <itemDefinition>'
WHY='DMN 1.3 section 8.3.2, Table 34 bars a typeRef from the <output> clause of a single-output table, so the decision <variable> is the only place left that states the column type. Under bare COLLECT, RULE ORDER or OUTPUT ORDER the decision result is a LIST, so a scalar typeRef on the variable would tell a conformant consumer the decision returns a string when it returns a list of strings -- which is why D-17 wrote NO typeRef there. That was harmless while the clause repeated the column type, and loses the type outright once the clause may not. So the variable names dmnmd_list_of_string, collectionItemDefs declares it (isCollection, element type string) because it walks the result type as well as the columns, and the reader recovers the column type as that collection element type. Nothing in the round-trip harness can see this: the ts and l4 surfaces never show the variable, and when the column type is lost the cells usually let inference recover it anyway -- measured: with the writer half alone the harness stayed at 131 pass while hspec round trips lost the type under all seven aggregation and list-valued policies (C# has since left that promise on purpose: under COLLECT COUNT the variable types the count, so the column is inferred). What is pinned: the variable says typeRef="dmnmd_list_of_string", that itemDefinition is declared, the <output> clause carries only id and label, and decisionTable carries outputLabel="perk".'
SOURCE='src/DMN/Translate/XML.hs resultTypeOf, decisionOf, collectionItemDefs, outputClauseOf; src/DMN/Types.hs resultShape'
ARGS='--to=xml input.md'
