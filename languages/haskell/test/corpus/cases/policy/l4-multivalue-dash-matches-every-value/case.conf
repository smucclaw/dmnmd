TITLE='--to=l4 renders a multi-value cell that holds a dash, `4, -`, as no conjunct at all, because the cell matches every Guest Count'
WHY='The interpreter (fEvals is or . map fEval, and fEval FAnything is True) reads a multi-value cell holding a dash as matching everything, and so does --to=ts, which renders it as (Guest_Count === 4.0 || (true||Guest_Count)): see policy/md-multivalue-dash-reprocessed. The L4 backend used to filter the dash out of the cell and render what was left, so row 1 read Guest Count EQUALS 4 AND Season EQUALS Fall, and a Fall party of 8 got NOTHING from the emitted L4 where dmnmd -q answers Spareribs, at exit 0 (smucclaw/dmnmd#70). isWildCell is the one predicate now, used by feel2l4In, conjSubCells and armCells, so a cell holding the wildcard anywhere renders as no conjunct and the AND connectors stay in step. Same table as policy/md-multivalue-dash-reprocessed. A multi-value cell WITHOUT a dash still narrows, which the TranslateL4Spec negative control pins.'
SOURCE='src/DMN/Translate/L4.hs isWildCell, feel2l4In, conjSubCells, armCells; found by the emitAsserts cross-check (D-21 step 2)'
ARGS='--to=l4 input.md'
