TITLE='`5 <=` is the MIRROR of `<= 5`, i.e. the input is at least 5'
WHY='dmnmd`s suffix comparison is an operator SECTION over the elided input: `5 <= ?` means `input >= 5`. That is the mirror of the prefix form, and it is what fEval`s own comment always claimed ("we canonicalize order to `op val`"). What shipped was the NEGATION of the mirror, so `5 <=` excluded 5 -- an exit-0 wrong answer. NOT S-FEEL: rule 5`s operator slot is prefix-only with no mirror production, and l4-ide`s independently written IR.hs has no suffix constructor. Kept deliberately, documented in README as a non-conformant extension, because after mirroring the IR holds a conformant prefix comparison and so emits legal S-FEEL (`>= 5`) -- the non-conformance is confined to dmnmd`s own markdown surface, where the test is "would a lawyer still recognise this as a table?"'
SOURCE='src/DMN/ParseCell.hs suffixCmp'
ARGS='--to=ts input.md'
