TITLE='an input column sharing the tables name is renamed, because l4 rejects a parameter spelled like its own function'
WHY='The table is named tier and its first input column is also named tier, so the
naive emission is `tier tier cat MEANS`. l4 refuses it:

  $ l4 check
  The names in a type signature must match those in the definition.
  However, this name `cat` appears in the signature,
  and the corresponding name in the definition is tier
  exit 1

The parameter is renamed to tier_ and it is exit 0 with the assertion satisfied.

THIS IS A PRE-EXISTING DEFECT, not a consequence of the sum types it shipped with.
Any table whose input column happens to share the table name emitted L4 that does
not typecheck, since the first --to=l4 output existed. It was caught only because
the same freshness loop that prevents constructor capture also seeds its avoid-set
with the function name - a case the design document listed as unnecessary
("function names when arities differ") and which turns out to be both necessary
and unrelated to arity.

The hspec suite had FROZEN the broken form: four expectations in TranslateL4Spec
asserted `IF tier EQUALS ...` against an emission l4 rejects. They were tests
pinning a defect, which is exactly why test/corpus/ exists and why a green hspec
run is not evidence about this layer. Compare the note at the top of
test/corpus/README.md.

Contrast policy/l4-param-renamed-to-avoid-capture, the other half of the same
mechanism: that one is SILENT (exit 0, wrong answer) and this one is LOUD (exit 1).
Both are fixed by the same rename, which is why they share it - but only the silent
one needed measuring to discover.'
SOURCE='src/DMN/Translate/L4.hs renameParams, the fnName seed of the avoid-set; test/TranslateL4Spec.hs, whose ditto expectations pinned the broken form'
ARGS='--to=l4 input.md'
