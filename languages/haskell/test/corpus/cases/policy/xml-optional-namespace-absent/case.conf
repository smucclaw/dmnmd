TITLE='a DMN document that omits an optional namespace declaration is accepted'
WHY='The other half of the namespace-strictness fix. xmlns:dc is only needed by
the diagram-interchange elements; a document with no DMNDI section has no reason
to declare it, and many exporters do not. Requiring it rejected valid documents.
Output is byte-identical to policy/xml-baseline-13 — that identity is the
assertion. Second of the two CONFIRMED E0 reproductions that had no case.'
SOURCE='src/DMN/XML/ParseDMN.hs; E0 audit finding E0b-namespace-strictness'
ARGS='-f xml --to=ts input.dmn'
