TITLE='annotation column names are warned about as dropped, and the table is still emitted'
WHY='The <annotation> COLUMN NAMES have nowhere to go in dmnmd - a markdown
(comment) column carries no name - so they are dropped, and CLAUDE.md requires that
a drop be announced rather than silent. This case pins the announcement, that the
table is still emitted, and that the run exits 0.

The fixture gives every rule EXACTLY ONE comment, deliberately. It originally gave
rule 1 both a <description> and an <annotationEntry>, and that rule then emitted no
comment at all - so the recording froze a silent discard, while the stderr warning
on the same run promised the text "is kept, as a row comment". A policy case that
freezes a bug makes the eventual fix look like a regression, which is the more
expensive of the two ways to misclassify. The two-comment behaviour now lives in
symptom/xml-multiple-row-comments-dropped, where a diff reads as progress.'
SOURCE='src/DMN/XML/XmlToDmnmd.hs; CLAUDE.md "Diagnostics and exit status"'
ARGS='-f xml --to=ts input.dmn'
