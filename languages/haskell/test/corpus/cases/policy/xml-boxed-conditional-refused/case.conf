TITLE='a <conditional> as decision logic is refused by name, naming the release and the decision'
WHY='DMN 1.4 added five boxed expressions in substitutionGroup="expression" — <conditional>, <for>, <some>, <every>, <filter> — and a DMN 1.5 document inherits them. dmnmd models <decisionTable> only. The governing rule in CLAUDE.md says anything we parse but do not honour must produce a loud, LOCATED diagnostic, and the whole point of this change is that these do not arrive as "xpCheckEmptyContents: unprocessed XML content", which names the PARENT element and dumps eighty bytes of the child. refuseUnmodelled scans the tree before unpickling and names the element, what it is, the release that introduced it (1.4, not 1.5 — DMN14.xsd and DMN15.xsd have an identical set of 50 complexTypes) and the <decision> it sits under. Five names and not seven: tIterator and tQuantified are abstract bases and tChildExpression/tTypedChildExpression have no global element, so <iterator> and <quantified> cannot be written in a document. <every> is recorded separately as the quantifier arm; the other three are covered by test/dmn15/ and DmnXmlSpec.'
SOURCE='src/DMN/XML/ParseDMN.hs refuseUnmodelled / unmodelledConstructs; DMN15.xsd:548-581; test/dmn15/README.md'
ARGS='-f xml --to=ts input.dmn'
