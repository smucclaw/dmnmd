TITLE='the ditto grid measures wide characters in L4 lexer column units, so every ^ sits under its referent'
WHY='CLAUDE.md: "the L4 lexer resolves ^ by absolute source column, so widths must be
measured with displayWidth, which defers to megaparsec isWideChar ... Do not
substitute a hand-rolled East-Asian-Width table; a one-column drift makes a caret
copy the wrong token silently."

Silently is the operative word, and until this case there was not one non-ASCII byte
in any recording in the corpus - every other input is pure ASCII, where displayWidth
and plain length agree, so none of them could detect a wrong width table at all.

The three glyphs are chosen to catch three different mistakes:
  中  a plain code-point count (it is one code point, two columns)
  ⌚  a width table older or narrower than megaparsec isWideChar - the BMP
      pictograph class is exactly what a hand-rolled table tends to miss
  ❤  U+2764, which megaparsec counts as width ONE. This catches the opposite
      error, a table that assumes anything emoji-adjacent is wide.

Verified beyond the bytes: real l4 check succeeds on this output, and #EVAL gives
30 for ("Ac❤", 20), 10 for ("中村⌚", 3), 20 for ("中村⌚", 99) and 40 for the
catch-all - so the carets resolve to the tokens they appear to point at.

Keep the column NAMES ASCII. The GIVEN/DECLARE block is padded with rpad, which is
code-point based by design, so a wide character in a column name would freeze a
cosmetic alignment accident as policy.'
SOURCE='src/DMN/Translate/L4.hs renderDittoGrid/displayWidth; CLAUDE.md "The ditto grid is column-alignment-critical"'
ARGS='--to=l4 input.md'
