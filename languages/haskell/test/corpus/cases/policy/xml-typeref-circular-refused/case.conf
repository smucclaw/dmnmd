TITLE='a cycle in the <itemDefinition> graph is reported with the cycle spelled out, not hung on'
WHY='tRouting derives from tOther which derives from tRouting. Nothing in the DMN
XSD forbids this - tItemDefinition is recursive by construction and the schema
constrains shape, not acyclicity - so a document can be schema-valid and still
have no fixpoint.

resolveTypeRef carries a visited list for this reason. Without it the resolver
recurses forever and dmnmd hangs, which is the worst failure mode available: no
output, no diagnostic, no exit status, and nothing to grep. A test suite with a
timeout reports it as a timeout rather than as the bug it is.

The message prints the path (tRouting -> tOther -> tRouting) rather than just
saying "circular", because with three or more types in the chain the cycle is not
obvious from the file.

Filed as policy because refusing IS the right answer here. There is no reading of
a cyclic type definition that dmnmd could honour.'
SOURCE='src/DMN/XML/XmlToDmnmd.hs resolveTypeRef, the seen list'
ARGS='--from=xml --to=l4 input.dmn'
