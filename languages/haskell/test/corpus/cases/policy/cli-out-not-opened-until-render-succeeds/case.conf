TITLE='the -o destination is not opened until the whole run has produced text, so a failing run leaves the previous contents alone'
WHY='This was symptom/cli-out-opened-before-input-read. main called myOutHandle (out opts) BEFORE parseTables, and openFile ... WriteMode truncates, so dmnmd destroyed the contents of the -o file before it knew whether it could read the input, whether the tables parsed, or whether it could even write the requested format. Main.hs prints, in that very failure, that it is refusing to emit the tables it COULD read because partial output is indistinguishable from complete output - and the -o file was already empty with a fresh mtime, which under make reads as up to date. The guarantee CLAUDE.md states was defeated for every -o user.

main now renders the whole output into a String first (renderAll) and opens the destination only to write it (withOutHandle). This case makes the new ordering visible on stderr alone, with no file side effect: give it an output destination that cannot be opened (a directory) AND an input file that does not exist. The message must name nosuch.md, the input - naming the directory instead can only happen if the destination is opened first.

The consequence this recording cannot show was checked directly at the same commit. With the bytes PRECIOUS DATA on disk in f, `dmnmd -f xml -t ts test/dmn13/temporal-type.dmn -o f` exits 1, prints the temporal refusal, and leaves f holding PRECIOUS DATA. Before the fix it left f at zero bytes.

A diff here is a regression to the destructive ordering. Note this case does NOT pin the wording of the openFile failure, which is the OS message - only which file it names.'
SOURCE='app/Main.hs main: renderAll runs to completion before withOutHandle opens anything. DECISIONS.md D-8, which records the zero-byte file as part of the --to=xml ruling; CLAUDE.md, Diagnostics and exit status'
ARGS='--to=ts -o . nosuch.md'
