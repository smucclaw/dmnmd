TITLE='an OUTPUT cell may not hold a half-open range — an excluded endpoint has no value to name'
WHY='README "Extensions" permits a range in an output cell, and DMN.Translate.L4.showFeelL4 renders one by emitting its lower bound. That is already wrong for a CLOSED range (recorded as symptom/l4-output-range-upper-bound-dropped, deliberately out of scope here); for an OPEN lower bound it would emit a value that is not even IN the interval. Refused in structuralErrors rather than in showFeelL4, because showFeelL4 returns a String and has no way to express a refusal — which is the general shape of this repo`s diagnostics rule: the refusal belongs where the row number and column name are in scope, so it can be located. THE QUOTED CELL CHANGED, AND THAT IS THE POINT: this message used to read `"[1.0..5.0)"` for a cell the author wrote as `[1..5)`. showDomainMember rendered numbers with show; it now renders through DMN.Number.showNumPlain over a Scientific, so the refusal quotes the table back verbatim.'
SOURCE='src/DMN/DecisionTable.hs structuralErrors, openRangeOutErrs'
ARGS='--to=ts input.md'
