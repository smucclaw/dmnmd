TITLE='a repeating quotient is rounded to 34 significant digits, not crashed on'
WHY='1 / 3 has no terminating decimal expansion, and a Scientific is a terminating
decimal by construction. Data.Scientific offers a Fractional instance that is a
trap here: (1 :: Scientific) / 3 raises a bare library error reading "fromRational
has been applied to a repeating decimal which can Not be represented as a
Scientific!", carrying a Data/Scientific.hs call stack rather than anything an
author of a decision table could act on -- and carrying a build-specific package
hash that the corpus normalizer does not strip. So DMN.Number.divideFeel does not
use it: the quotient is computed exactly as a Rational and then rounded, half to
even, to 34 significant digits. That is decimal128 (DMN 1.3 section 10.3.2.3.1),
which is what FEEL numbers ARE, and D-1 says being more exact than the standard
is not more correct. Under Float this printed 0.33333334 -- eight digits, silently.
The digit count in the expected output is load-bearing: it is the stated precision,
and a diff in its length is a change of rounding policy, not a rounding detail.'
SOURCE='src/DMN/Number.hs divideFeel and feelPrecision; DECISIONS.md D-1'
ARGS='-q -t ts input.md'
STDIN_FILE='stdin'
