TITLE='prose containing `>` is a STRING column: the same anchoring through a different old alternative'
WHY='The twin of infer-prose-with-dots-is-string, through the ">" alternative of the old unanchored substring test rather than the ".." one. A hierarchy label `L1 > L2` is ordinary prose. Kept as a separate case because the two alternatives were separate guards and a partial re-anchoring could fix one and not the other. Watch: anchoring must still accept genuine arithmetic in an OUTPUT cell -- parseNumberCell accepts `age * 100` -- which is why arithmetic survives as evidence of last resort rather than being dropped.'
