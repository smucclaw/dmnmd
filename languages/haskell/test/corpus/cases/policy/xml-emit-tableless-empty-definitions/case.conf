TITLE='--to=xml on an input with no decision table writes an empty <definitions/>, at exit 0'
WHY='This was symptom/cli-to-xml-succeeds-on-tableless-input, and it was the case that settled the classification of the whole --to=xml refusal. dmnmd could not write XML at all, but the refusal lived inside the per-table output loop, so a prose file ran the loop zero times: the same flag was a hard error on one file and a silent exit 0 on another. A refusal contingent on the input is an unimplemented branch, not a decision.

Both halves are now fixed and they are fixed differently. The format check moved up front (policy/cli-to-md-refused-up-front pins that), and xml stopped needing it because the writer exists.

What it writes here is a well-formed DMN document carrying no decisions, and exit 0 is the right status by dmnmd own rule: the exit status answers only "did something we were asked to read fail to read?", and prose markdown is a legitimate input. It is also symmetric with the reading direction - test/simple.dmn is valid DMN with no <decision> and dmnmd reads it at exit 0.

Note this is emphatically NOT the old zero-byte file. That was a truncated destination left behind by a failing run (policy/cli-out-not-opened-until-render-succeeds); this is a complete, parseable document that happens to be empty of decisions, and feeding it back to dmnmd yields no tables and exit 0.'
SOURCE='src/DMN/Translate/XML.hs definitionsOf over an empty table list; app/Main.hs renderAll Xml; CLAUDE.md, Diagnostics and exit status'
ARGS='--to=xml input.md'
