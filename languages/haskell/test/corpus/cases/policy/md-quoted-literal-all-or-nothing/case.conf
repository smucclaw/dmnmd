TITLE='a cell is unquoted only when every comma-fragment is a well-formed literal'
WHY='mkFsEither splits a cell on commas BEFORE anything looks at what the cell
means. So the single FEEL negation not("Fall", "Winter", "Spring", "Summer")
arrives at the unquoting step already shredded into four fragments, of which the
middle two happen to be well-formed literals and the outer two carry unbalanced
quotes and parentheses.

Unquoting each fragment on its own merits would yield
  not("Fall / Winter / Spring / "Summer")
a mixture that is neither the source text nor a parse of it, and that reads as
half-parsed. That was tried and reverted once before this fix; the warning is
recorded in test/DmnXmlSpec.hs above the frozen expectation for that cell.

So the rule is ALL OR NOTHING per cell, and this case pins the four behaviours
that follow from it:

  row 1  "Fall", "Winter"   both fragments are literals -> both unquoted.
                            A genuine multi-value cell keeps working.
  row 2  "Spring"           the single-fragment case.
  row 3  5'' 10"            ends with a quote but does not start with one, so it
                            is not a literal and is left exactly as written.
  row 4  Non-Participating  no quotes at all - untouched. Guards against a rule
                            that only looks at the first or last character.

The case that proves the negative half is symptom/xml-comma-split-negation: it
must stay unchanged by this fix, and it does. If someone later "simplifies"
unquoteCell to work per fragment, that symptom case moves and this policy case
stays green - so read both together.'
SOURCE='src/DMN/DecisionTable.hs unquoteCell / isSFeelLiteral; test/DmnXmlSpec.hs:344-363'
ARGS='--to=js input.md'
