TITLE='a data row that misses an output cell as well as the annotation cell is refused, naming the output column'
WHY='The negative control for md-short-row-annotation-only-accepted. Row 2 stops after Colour, so it does not reach Price (an output) or Annotation (a comment). Tolerating a missing comment cell must not tolerate a missing output cell, which would give an empty answer, so the row is refused at exit 1 with nothing emitted. The error names the first column the row does not reach that is an input or an output, here Price, and gives the reason that is true of an output cell. It says nothing about the annotation column after it.'
SOURCE='src/DMN/ParseTable.hs rowArityDiags; audit 10 finding f2'
ARGS='--to=ts input.md'
