TITLE='a column of double-quoted leading-zero numerals "007" is accepted as strings, input and output alike'
WHY='dmnmd refuses a BARE 007 in an undeclared column because it cannot tell the number 7 from an identifier that happens to be digits (VAmbiguous, D-2). A QUOTED "007" has already said which it is: a string literal. Pass 1 used to unquote the cell first, so inference graded 007 and refused the string as if it were an unquoted numeral, at exit 1, with advice (declare the column Code : String) the author had in effect already followed by writing the quotes. The quotes now reach inference, so Code is a string and the results are the strings "0001" and "0002". The bare form is still refused as ambiguous, which an hspec example in Spec.hs pins as the negative control. The XML reader accepts the same cells (policy/xml-untyped-quoted-leading-zero-accepted).'
SOURCE='src/DMN/DecisionTable.hs mkDataFsAt; src/DMN/ParseTable.hs mkFEELCol'
ARGS='--to=ts input.md'
