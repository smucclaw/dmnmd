TITLE='the multi-table refusal emits nothing at a size the stdout buffer cannot hide - this is the case that proves the promise'
WHY='This is policy/l4-multitable-refusal-emits-nothing with ONE difference: table
Good is 45 rows instead of 1, so its emission would exceed the output handle chunk
size. The small case CANNOT distinguish "dmnmd emitted nothing" from "dmnmd
emitted less than one buffer chunk and the process died before it flushed", and
those are not the same promise. THIS case can.

Measured on this exact fixture family before the fix, varying only the row count:

  rows   input bytes   bytes reaching stdout on the refused run
    1        ~180                 0
   20         615                 0
   30         825              2047
   45        1140              4094
   90        2085              8188
  400        7900             18423

The boundary is a 2048-char buffer chunk, and everything committed before the
error survived. So the one-row case was quiet by accident, and a change that made
only IT go quiet would have read as a fix while every real table still leaked.
That is not hypothetical: during development, moving to a single hPutStr made the
one-row case go green while 4KB still leaked here.

45 rows is deliberate: comfortably past the ~30-row boundary so the old leak was
robust rather than marginal, and small enough to keep the fixture at 1.1KB. The
long input column name does the amplification - it is re-emitted (or dittoed to a
same-width caret) on every arm, so 1.1KB of markdown becomes 4.3KB of L4.

Now zero at every size, because toL4File decides refusal for the whole file before
rendering anything, rather than relying on nothing having been flushed yet.

DO NOT DELETE THIS AS A DUPLICATE of the one-row case. It is the control that
makes the one-row case mean anything.'
SOURCE='src/DMN/Translate/L4.hs toL4File / l4Refusal; app/Main.hs outputToAll; policy/l4-refuses-outputorder for the promise this holds down'
ARGS='--to=l4 input.md'
