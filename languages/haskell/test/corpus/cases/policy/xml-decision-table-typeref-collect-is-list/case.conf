TITLE='under a list-valued hit policy a <decisionTable typeRef> types the RESULT LIST, so the column takes its element type'
WHY='A COLLECT table whose <decisionTable> typeRef is BandList, an isCollection itemDefinition over string, and whose <variable> carries no typeRef. By section 7.3.1 the table typeRef is the same statement as the decision variable, and under bare C, R or O the decision result is a list, so the typeRef describes the list across rules and the column takes the ELEMENT type, string (the same rule policy/xml-collect-variable-is-list pins for the variable). dmnmd used to ignore the table typeRef, so the column was inferred from its bare numeral cells 1 and 2 and the outputs came out as the numbers 1.0 and 2.0 at exit 0. What is pinned: the ts output returns "1" and "2" quoted, scalars rather than lists. If they come back as 1.0 and 2.0 the attribute is being ignored again; if they came back as lists the list-ness would be applied to the column as well as to the result, which is the double-count policy/xml-collect-variable-is-list guards against.'
SOURCE='src/DMN/XML/XmlToDmnmd.hs resultColumnType and resolveElementType; src/DMN/Types.hs resultShape; audit 2026-09-26 finding f3'
ARGS='-f xml --to=ts input.dmn'
