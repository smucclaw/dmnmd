TITLE='a decision <variable typeRef> is NOT applied to the columns of a MULTI-output table'
WHY='The negative control for policy/xml-decision-variable-types-single-output, and the reason that case is guarded on the output count rather than written as a plain fallback. DMN puts the result type on the decision variable only when the table has one output; with two or more, each <output> is keyed by name and carries its own typeRef, and the variable names the composite whose type is an <itemDefinition> -- not any one column. So here "rank", which declares no typeRef, must still be INFERRED, and its bare numerals make it Number: the ts output is 7.0 and 8.0, unquoted. If they come back as "7" and "8" the guard has been dropped and every untyped column in every multi-output table is now taking the composite'"'"'s type, which is a silent wrong answer at exit 0 in the opposite direction from the defect the sibling case fixes.'
SOURCE='src/DMN/XML/XmlToDmnmd.hs convTable outFallback (the `case dtOutput of [_] -> decVarType; _ -> Nothing` guard)'
ARGS='-f xml --to=ts input.dmn'
