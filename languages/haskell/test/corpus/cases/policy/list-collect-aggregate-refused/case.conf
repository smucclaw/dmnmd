TITLE='R7: Collect Sum/Min/Max/Count over a collection output column is refused'
WHY='evalTable implements Collect Sum as
  sum [ x | FNullary (VN x) <- concat (concat (row_outputs <$> outputs)) ]
- a comprehension over a FLATTENED list of cells. With a scalar output column
that is the intended "one number per matching row". With a COLLECTION output
column every element of every matching row falls into the same sum, so
[1,2] and [3] over two rows silently becomes 6, with no diagnostic and no way
for the caller to know the nesting was lost.

Collect All is unaffected and is the escape hatch the message names: it returns
the matching rows as they are, so a collection stays a collection.'
SOURCE='src/DMN/DecisionTable.hs structuralErrors hitPolicyErrs; src/DMN/DecisionTable.hs:48-50 evalTable HP_Collect'
ARGS='--to=ts input.md'
