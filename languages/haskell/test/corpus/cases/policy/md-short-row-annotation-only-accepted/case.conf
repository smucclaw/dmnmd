TITLE='a data row that stops before a trailing annotation column is accepted, and padded with an empty cell'
WHY='Restores what trunk did before ParseTable.rowArityDiags. A row short ONLY in comment columns (labels #, // or (comment)) was accepted and answered correctly: on trunk, ts, js, py, l4 and xml print exactly what they print for the same table with the trailing cell written as an empty one. The arity check then refused it with a reason that is false for a comment, because a comment cell cannot change any answer and so cannot widen a rule, and a GFM renderer shows the missing cell as an empty one. Now rowArityDiags refuses a row only when some column it does not reach is an input or an output, and parseDataRow pads the cells it does not reach with empty ones, so the table is the same table as md-blank-annotation-cell-accepted, whose output this case matches byte for byte. policy/md-short-row-annotation-and-output-refused is the other side of the boundary. The test is on the column kind, DTCH_Comment, which labelKind derives from the label, not on the label text.'
SOURCE='src/DMN/ParseTable.hs rowArityDiags and parseDataRow; audit 10 finding f2'
ARGS='--to=ts input.md'
