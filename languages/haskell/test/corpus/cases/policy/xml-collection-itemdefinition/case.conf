TITLE='a collection column forces dmnmd to synthesize an <itemDefinition>, because DMN has no column-level spelling for isCollection'
WHY='This is the one element in the emitted document with no markdown counterpart, and it is not optional. DMN isCollection is an attribute of <itemDefinition>; there is no such attribute on tInputClause, tOutputClause or tLiteralExpression. So a `roles : [String]` column can only be expressed by declaring a named type and pointing the column typeRef at it.

The invention is confined to the NAME. The isCollection flag and the base type are both read straight off the column, and the name is a fixed function of the element type (dmnmd_list_of_string), so there are at most three of them in any document and none can collide with a user type coming the other way.

The warning is inherited from the reader and is worth repeating on the way out, because the document leaves dmnmd control. dmnmd reads a plain value in a collection column as MEMBERSHIP - policy/xml-iscollection-membership pins that - while FEEL rules 12-13 read the same unary test as equality against the whole list, which is false for any non-singleton. The emitted document is self-consistent for dmnmd and divergent for a conformant engine, and saying so is the difference between a documented divergence and a silent one.

Round-trips clean: resolveTypeRef follows the itemDefinition, isCollectionOf wraps the base in DMN_List, and the cells are parsed at the element type exactly as they were written.'
SOURCE='src/DMN/Translate/XML.hs collectionItemDefs / typeRefName / fidelityDiags collectionWarns; DMN/XML/XmlToDmnmd.hs resolveTypeRef, isCollectionOf; DMN 1.3 Table 26'
ARGS='--to=xml input.md'
