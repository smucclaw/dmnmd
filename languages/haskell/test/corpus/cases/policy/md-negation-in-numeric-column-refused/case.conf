TITLE='the NAMED negation refusal survives anchoring: a not(...) cell in an otherwise numeric column still says "negation"'
WHY='New coverage, added by D-2 and needed by it. Anchoring asks DMN.ParseCell.parseNumberCell whether a cell is numeric evidence, and a Left from there normally means "not a number" -- but for the two NAMED refusals (FEEL negation, and invocation) it means "unmistakably a numeric construct dmnmd does not implement". Read the wrong way, not([1..5]) stops being numeric evidence, its column types String, and the refusal degrades into an equality test against the literal text at exit 0 -- the exact failure D-2 exists to remove, reintroduced by D-2. That happened in a draft and was caught by the corpus. symptom/num-negation-not-implemented no longer pins this message, because its own second row is ALSO malformed and now trips the column-level refusal first; this case is the well-formed-column version, and it is the one that guards DMN.ParseCell.namedRefusal.'
SOURCE='src/DMN/ParseCell.hs namedRefusal / peelNot; src/DMN/DecisionTable.hs inferEvidence; DECISIONS.md D-2'
ARGS='--to=ts input.md'
