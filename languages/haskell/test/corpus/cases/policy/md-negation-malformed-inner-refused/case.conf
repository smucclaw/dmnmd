TITLE='not(not(...)) is refused: rule 12.b admits simple POSITIVE unary tests, so a negation does not nest'
WHY='D-9 implements rule 12.b, and rule 12.b is "not", "(", simple positive unary
tests, ")". The word positive is load-bearing: the contents are a value, a
comparison or an interval, and NOT another negation. dmnmd gets this for free by
parsing the inner text as a numericCell rather than by recursing through
parseNumberCell -- so nesting and invocation are both out by construction rather
than by an explicit check that could be forgotten.

This case exists because implementing a construct is exactly when its boundary
stops being tested. Before D-9 every not(...) was refused, so the boundary was
free; now only the ill-formed ones are, and nothing else in the corpus holds one.

The message says dmnmd IMPLEMENTS negation and then names what is wrong with this
particular inner text. That distinction matters and was got wrong once during
implementation: the multi-test form not(a, b) reaches the parser as the fragment
not(a, because cells are split on commas first, and it was answered with the
generic invocation message -- telling the author that dmnmd does not implement
the function call not(), which since D-9 is false and points at the wrong repair.
It now has its own message naming the comma split as the cause.'
SOURCE='src/DMN/ParseCell.hs parseNumberCell peelNot arm, negationMsg, splitNegationMsg. DECISIONS.md D-9'
ARGS='--to=ts input.md'
