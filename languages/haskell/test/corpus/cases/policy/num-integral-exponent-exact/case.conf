TITLE='an integral exponent is computed exactly'
WHY='The other half of the powerFeel ruling, and the reason the refusal in
num-fractional-exponent-refused is a policy about fractional exponents rather
than a removal of ** altogether. 2 ** 10 is a decimal number, so it has an exact
answer and gets one: powerFeel dispatches to (^) at an Integer exponent, which
over a Scientific is exact for any size of result the magnitude guard admits.
The guard bounds the EXPONENT before the power is taken, not the result after:
10 ** 1000000000 is not a big number, it is an out-of-memory, and Float used to
hide that behind Infinity.'
SOURCE='src/DMN/Number.hs powerFeel and maxBase10Exponent'
ARGS='-q -t ts input.md'
STDIN_FILE='stdin'
