TITLE='`.5` is a number -- rule 31 admits the leading-dot form'
WHY='The old fallthrough was Haskell`s `read`, whose grammar is not rule 31. It was wrong in BOTH directions: it accepted 0x10, 0o17, 1e5, Infinity and NaN, which rule 31 excludes, and it rejected `.5`, which rule 31 explicitly admits -- the production is [ "-" ] , ( digits , [ "." , digits ] | "." , digits ). This case pins the direction that was a false refusal; the four sibling symptom/num-nonsfeel-* cases pin the false acceptances.'
SOURCE='src/DMN/ParseCell.hs numericLiteral, the withoutIntPart alternative'
ARGS='--to=ts input.md'
