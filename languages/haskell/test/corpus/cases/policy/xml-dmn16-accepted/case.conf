TITLE='a DMN 1.6 document reads, emits what the DMN 1.3 baseline emits, and its DMNDI namespace is DMN 1.5'"'"'s'
WHY='DMN 1.6 is readable because the schema says nothing changed that the reader models: every one of the 94 top-level declarations in DMN15.xsd and DMN16.xsd was extracted as source text and compared byte for byte, and the only two that differ are tDefinitions (the FEEL URI defaults of expressionLanguage and typeLanguage, both consumed and dropped) and tFunctionKind (gains ONNX, on an element already refused). This input is test/dmn13/baseline.dmn in DMN 1.6 and nothing else changed, and its expected/stdout is byte-identical to policy/xml-dmn15-accepted. THAT IDENTITY IS THE ASSERTION. The second thing this case guards is the DMNDI pairing. DMN16.xsd declares the model namespace .../20240513/MODEL/ and imports .../20230324/DMNDI/ from DMNDI15.xsd; the OMG publishes no DMNDI16.xsd. So 1.6, like 1.4, pairs its model namespace with the DMNDI namespace of an OLDER release, and the date-template guess .../20240513/DMNDI/ is wrong. Because relDmndiNS is a String, that guess compiles, matches nothing, and refuses this correct input, naming its diagram as a stray "(DMN 1.5 DMNDI)" namespace. Verified by introducing the guess: this case goes red, and among hspec examples only the one over the same fixture. 1.4 and 1.6 are the only releases whose DMNDI date differs from their model date, so this case and policy/xml-dmn14-accepted are the only ones that can see the mistake. Keep the <dmndi:DMNDI> element: the pickler is xpOption, and without it any URI is accepted.'
SOURCE='src/DMN/XML/ParseDMN.hs dmn16 / readableReleases / DmnRelease; DMN16.xsd (not vendored, D-4); test/dmn16/README.md'
ARGS='-f xml --to=ts input.dmn'
