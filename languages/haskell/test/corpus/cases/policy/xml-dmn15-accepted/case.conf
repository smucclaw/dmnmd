TITLE='a DMN 1.5 document reads, and emits exactly what the DMN 1.3 baseline emits'
WHY='Until this change dmnmd read DMN 1.3 only, so it scored zero on every model any current tool emits — all 154 DMN TCK models declare the 1.5 model namespace. The namespace is now a parameter (DmnRelease), resolved once from the root element and threaded through the pickler tree, rather than a constant. This input is test/dmn13/baseline.dmn with the 1.5 MODEL and DMNDI namespaces and nothing else changed, and its expected/stdout is byte-identical to policy/xml-baseline-13 modulo the backend chosen here. THAT IDENTITY IS THE ASSERTION: the delta from 1.3 to 1.5 is additive, and tDecisionTable, tInputClause, tOutputClause, tDecisionRule, tUnaryTests and tLiteralExpression are byte-identical in DMN13.xsd and DMN15.xsd, so a decision table means the same thing in both. If this case ever diverges from the 1.3 baseline, either that assumption has stopped holding or the release parameter has leaked into somewhere it should not have.'
SOURCE='src/DMN/XML/ParseDMN.hs DmnRelease / readableReleases / checkDmnRoot; test/dmn15/README.md; DECISIONS.md D-4'
ARGS='-f xml --to=ts input.dmn'
