TITLE='a model declaring B-FEEL as its expression language is refused by name, not read as FEEL'
WHY='B-FEEL (DMN 1.6 clause 11, absent from the 1.3 and 1.5 texts) keeps the grammar of FEEL and changes its meaning: where FEEL answers null, B-FEEL answers false, 0 or an empty string, so "a" != 1 is true, sum([]) is 0, and the specification notes that a C+ decision table sums differently. The only way to select it is expressionLanguage="https://www.omg.org/spec/DMN/20240513/B-FEEL/", on <definitions> or on any single literal expression or unary test. No XSD can express that: the attribute is xsd:anyURI in every release, so the schema measurement that admitted DMN 1.6 found nothing to refuse. The reader never acts on expressionLanguage (some positions drop it while parsing, the rest keep it in a field the converter never reads), so without this refusal the document reads at exit 0 and is evaluated as FEEL: the same text, a different answer, which is the case the governing rule in CLAUDE.md calls strictly worse than rejection. Before DMN 1.6 was readable, a 1.6 input was refused by namespace; the same document with the 1.5 model namespace was measured at exit 0 with no diagnostic about the language. The refusal names the URI, what it selects, the release that introduced it, and the element it sits under. It is a deny-list of one: any other non-FEEL language, such as expressionLanguage="python", is still read as FEEL, which is a separate question for a ruling.'
SOURCE='src/DMN/XML/ParseDMN.hs unmodelledExpressionLanguages / refuseUnmodelled; DMN 1.6 clause 11; test/dmn16/README.md'
ARGS='-f xml --to=ts input.dmn'
