TITLE='a prefix label and a post label that disagree are refused, where the prefix label used to win and the post label was discarded'
WHY='Until this was fixed the case was symptom/struct-label-pre-wins: mkHeaderLabel pattern-matched the prefix label first and ignored the post label entirely on those branches, so a column the author explicitly marked (comment) but prefixed with > was compiled as an output with no diagnostic, because parseLabelPre and parseLabelPost are independent optionals. Now parseColHeaderL returns every label written on the header and labelClash refuses a column whose labels name more than one of input, output and comment, whichever side of the name they sit on: exit 1, nothing emitted, one error naming the table, the column and both labels. policy/md-header-in-and-out-refused is the sibling in which two post labels disagree, and policy/md-header-agreeing-labels-accepted pins that labels which agree are still accepted.'
SOURCE='src/DMN/ParseTable.hs parseColHeaderL, labelClash; audit lens "table structure", finding 34; audit 10 finding f7; chosen in the branch fix/audit10-parser-silent-drops (assumed, not ruled)'
ARGS='--to=ts input.md'
