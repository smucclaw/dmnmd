TITLE='labels on one column header that agree are accepted, whichever side of the name they sit on'
WHY='The negative control for md-header-in-and-out-refused and struct-label-pre-post-clash-refused. Dish carries a prefix > and a post (out), Price carries (out) on both sides of its type declaration, and the comment column carries a prefix // and a post (comment). Every pair says the same thing twice, so none is a clash: the table is read as it was before labelClash existed, Season the only input, Dish and Price outputs, Note a comment, at exit 0. If the clash check were widened to refuse any column with more than one label, this case would fail. It has one comment column on purpose: an earlier draft with two differed after the --to=xml round trip (4 changed TS lines), and a rule with more than one comment is the shape symptom/xml-multiple-row-comments-dropped records, which has nothing to do with labels.'
SOURCE='src/DMN/ParseTable.hs labelClash (nub of the kinds, not of the literals); audit 10 finding f7'
ARGS='--to=ts input.md'
