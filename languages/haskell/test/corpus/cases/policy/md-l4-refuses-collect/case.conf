TITLE='the L4 backend refuses a Collect table rather than silently dropping matches'
WHY='Collect/Aggregate/OutputOrder/RuleOrder are list-valued; a scalar BRANCH would
silently drop matches, so the L4 backend refuses them. That refusal is intended
behaviour and must survive. Contrast symptom/eval-hitpolicy-ignored-by-js, where
js/py do NOT refuse.

The refusal used to be a bare `error` raised part-way through rendering, so the
recorded stderr was a Haskell CallStack naming a line in L4.hs. It is now a
Diagnostic that names the table, asked BEFORE anything is rendered - which is what
lets policy/l4-multitable-refusal-emits-nothing keep its promise. A line number was
never a fact about the users document; it is not missed.'
SOURCE='src/DMN/Translate/L4.hs l4Refusal, the HP_Collect arm; app/Main.hs outputToAll'
ARGS='--to=l4 input.md'
