TITLE='a domained column with no catch-all row gets a sum type wrapped in MAYBE, with OTHERWISE NOTHING'
WHY='Same shape as policy/l4-sumtype-emitted, minus the catch-all row, and the
difference is entirely in the OTHERWISE.

A sum type has no natural zero. `OTHERWISE ""` against a sum-typed GIVETH is a
CHECK ERROR and omitting OTHERWISE is a PARSE ERROR - both verified against the
real l4 binary. So a table with nothing to fall back on emits `GIVETH A MAYBE
Card`, arms `THEN JUST <ctor>`, and `OTHERWISE NOTHING`. "No rule matched" is
then representable instead of fabricated.

The alternatives were considered and rejected:
  - falling back to the first constructor invents a domain member for input no
    rule covers, which CLAUDE.md forbids outright;
  - adding a sentinel to the enum is worse, because where one table output
    domain is another table INPUT domain the sentinel silently widens the OTHER
    table declared domain - reintroducing, inside the emitted L4, the very
    defect domainErrors exists to refuse.

WHAT THIS CASE GUARDS. The result must be MAYBE whenever an input may reach the
OTHERWISE, because the only value otherwiseExpr could put there is the typed
sentinel, and for a sum type that is the ill-typed "". Since D-22 the test is
noRuleMayMatch: a default row, then an all-wildcard arm anywhere among the arms,
then DMN.Regions. It is no longer catchAll alone, and a trailing catch-all row is
only one way for a table to be total. An earlier version keyed on the rows, to
spare HP_Priority a MAYBE it arguably does not need, and produced
`OTHERWISE ""` under `GIVETH A Dish` - caught by policy/l4-priority-reorders-arms.

KNOWN COST, removed by D-22 part 4: a TOTAL table with a sum-typed result used to
get MAYBE too, so callers unwrapped a result that could never be NOTHING.
It is bare now, because the last arm supplies the dead OTHERWISE. THIS table is
not total (cat is an open STRING, so any other category matches no rule), which is
why it keeps its MAYBE; policy/l4-sumtype-total-bare and
policy/l4-sumtype-partial-maybe pin the two sides of that line.

This case was previously recorded as the DECLINE path, when the gate still
required a catch-all row. Its own WHY predicted it would change when MAYBE
landed. It did.'
SOURCE='src/DMN/Translate/L4.hs enumOuts, the isJust catchAll condition'
ARGS='--to=l4 input.md'
