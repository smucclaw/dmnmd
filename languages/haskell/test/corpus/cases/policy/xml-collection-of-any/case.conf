TITLE='a collection <itemDefinition> whose element type is Any is REFUSED, not silently flattened to a scalar'
WHY='Found by adversarial review of D-17 after it landed, by four independent lenses, none of which could refute it -- and by nothing in the suite, the corpus or the round trip, all three of which were green. resolveTypeRef wraps a collection element type with `DMN_List <$> ty`, which is safe only while every Nothing carries a diagnostic. D-17 taught convertType to read typeRef="Any" as "no restriction, infer", producing the FIRST diagnostic-free Nothing, and fmap over Nothing silently dropped the DMN_List: the column stopped being a collection with no warning at exit 0, and every membership cell was emitted as an EQUALITY test against the whole list -- roles === "admin" against an array, false for every input, so every rule in the column became unreachable. Trunk refused this document (Any was an unknown typeRef), so D-17 turned a loud refusal into a silent wrong answer, which is precisely the failure the XML backend exists to prevent. Refusing is the fix rather than guessing, for the reason convertType s unknown-typeRef branch already gives: inference runs per COLUMN and yields SCALARS, so nothing here can supply an ELEMENT type. What is pinned: exit 1, and an error naming isCollection and the offending element typeRef. If this ever exits 0 again, check whether the emitted guard is === or .includes() before believing it is fixed.'
SOURCE='src/DMN/XML/XmlToDmnmd.hs resolveTypeRef collectionOfUnknown'
ARGS='-f xml --to=ts input.dmn'
