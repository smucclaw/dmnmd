TITLE='a decision table that does not parse exits 1 with a located diagnostic and emits nothing'
WHY='The exit status answers exactly one question: did something we were asked to read fail to read? A table that did not parse is nonzero. NOTE: the audit recorded this as exit 0 with empty stdout; PR #17 changed it. This case pins the NEW behaviour so it cannot regress to the old one.

  A caveat this case does NOT assert. The `1:13` in the recording is
  CHUNK-relative, not file-relative, so as a file position it is wrong: the offending header is on file line 3, not line 1.
  `symptom/md-error-position-misreported` files a misreported position as a defect,
  so the corpus would otherwise be claiming in one class that positions must improve
  and in the other that they must not move. What is pinned here is the EXIT STATUS
  and the emit-nothing rule; the position and the megaparsec `expecting` list are
  incidental. If a fix makes positions absolute, read the diff and re-record.

  Note also that the vehicle is fragile in a second way: `Age : Integer` is a
  spelling that the XML reader of dmnmd itself accepts (`typeRef="integer"` maps to DMN_Number,
  exit 0), and lowercase `number` - the S-FEEL spelling - is likewise rejected only
  on the markdown side. A grammar rewrite that widens the type-name whitelist will
  change this recording, and that is progress, not regression.'
SOURCE='app/Main.hs parseTables; CLAUDE.md exit-status table'
ARGS='--to=ts input.md'
