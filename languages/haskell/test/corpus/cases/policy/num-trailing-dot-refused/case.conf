TITLE='`5.` is refused, and located -- rule 31 wants a digit after the point'
WHY='Rule 31 reads digits, [".", digits] -- the fractional part is optional but, once the point is written, the digits after it are not. So `5.` is refused. This verdict was already right before the cell layer was rewritten; what is pinned now is the MESSAGE, which cites the rule and lists the accepted forms, and the LOCATION -- `table "TrailingDot": column "X": row 1`. Read this together with its mirror image, policy/num-leading-dot-accepted: rule 31 DOES admit `.5`, which dmnmd used to refuse. The pair is the assertion; either one alone would be satisfied by a grammar that was simply too strict or simply too loose.'
SOURCE='src/DMN/ParseCell.hs numericLiteral; located by DMN.DecisionTable.mkFsAt'
ARGS='--to=ts input.md'
