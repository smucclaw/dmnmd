TITLE='a not(...) cell is NUMBER evidence for an undeclared column, so a column mixing it with unreadable text is refused rather than silently typed String'
WHY='This case used to be symptom/num-negation-not-implemented, and it did NOT
change one byte when D-9 landed. That is worth writing down, because the ruling
named it as the destination for the fix and it is not one.

Its refusal is COLUMN-level, not cell-level, and it is driven by row 2. The cell
reads [1..5] [10..20] -- two intervals with no comma between them -- which is
genuinely malformed and reads as String, while row 1 reads as Number. An
undeclared column has to agree with itself, so inference refuses and names both
dissenting cells. Every word of that is still true after negation is implemented,
so the recorded text is identical either side of D-9.

Reclassified symptom -> policy anyway, and renamed, because what it actually
pins is worth protecting and nothing else pins it: that not([1..5]) is NUMBER
evidence. Before D-2 this was the case that caught the opposite reading -- when
a Left from the cell parser was taken to mean "not a number", this column typed
String and the whole thing compiled to Age === "not([1..5])" at exit 0. After D-9
the evidence arrives by a different route (the cell parses, rather than being
refused by name through namedRefusal) and must still come out Number. Two
mechanisms, one verdict, and this recording is what holds them to it.

policy/infer-mixed-column-refused is the general control for mixed inference and
uses ordinary cells; this one is specifically about a negation being on the
numeric side of the disagreement.

Do NOT repair row 2 to make this case exercise negation end to end. That is what
policy/md-negation-in-numeric-column-emitted is for, and a fixture that agrees
with itself would stop testing the property named above.'
SOURCE='src/DMN/DecisionTable.hs inferEvidence, the FNot and namedRefusal paths; inferenceErrors. DECISIONS.md D-2 and D-9'
ARGS='--to=ts input.md'
