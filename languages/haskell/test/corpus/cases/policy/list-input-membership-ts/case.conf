TITLE='the same membership semantics in TypeScript: .includes, not ==='
WHY='WAS symptom/md-list-input-cells-are-scalars-ts, the QUIET half of the
list-input defect.

Before: `function Scores ( tags : number[] )` and then `if (tags === 5.0)`. tsc
would reject that, but dmnmd does not compile what it emits, so what shipped was
a comparison that is never true - every row fell through and the function
returned undefined, exit 0.

Now: `if (tags.includes(5.0))`. `.includes` uses SameValueZero, so
`[10].includes(10.0)` is true and the numeric case works without a tolerance
argument.

Kept as a SEPARATE case from the L4 one on purpose. The two used to fail in
opposite ways - L4 loudly, TypeScript silently - and a fix that only satisfied
the l4 typechecker would have left this one standing with nothing to notice.

VERIFIED BY EXECUTION, not by reading. The emitted JS was run in node and the
emitted Python in python3, against the same six inputs, and both agree with l4:

    ["admin"]          -> full     []          -> none
    ["clerk","x"]      -> read     ["nobody"]  -> none
    ["teller"]         -> read     ["admin","clerk"] -> full  (hit policy F)'
SOURCE='src/DMN/Translate/JS.hs fexp2js memberJs; src/DMN/Translate/PY.hs fexp2js memberPy'
ARGS='--to=ts input.md'
