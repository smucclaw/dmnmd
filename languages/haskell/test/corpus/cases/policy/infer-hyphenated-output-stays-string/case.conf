TITLE='a hyphenated word in an OUTPUT cell stays a string literal, and does not become subtraction'
WHY='WHAT IT DOES: the output column holds Non-Participating and Fully-Paid, no cell contains a digit, and the emitted TypeScript returns the string literals "Non-Participating" and "Fully-Paid" at exit 0. WHY THAT IS RIGHT: DMN 1.3 §9.2 rule 27 puts . / - and + INSIDE legal FEEL names, so ParseCell.parseNumberCell reads Non-Participating as a subtraction over two bare names. It parses. It is arithmetic that contains no number at all, and reading it as evidence of a numeric column is the mistake this case pins. WHAT THIS CASE IS PROTECTING, and it is not hypothetical: at the point D-2 was first implemented, this exact input emitted `return {"Status":(Non - Participating)};` -- TypeScript naming two variables that do not exist -- at exit 0 with nothing on stderr. Trunk emitted the correct string literal, so D-2 turned a right answer into a wrong one, silently, in the OUTPUT position where arithmetic is legal and therefore no refusal can fire. That is the silent-wrong-answer class D-2 exists to remove, reintroduced by D-2. It was found by a verify lens running the emitted code, NOT by the corpus: 189 cases were unchanged across the defect and across its fix, because no recording held a digitless hyphenated word. THE FIX IT PINS: inferEvidence counts arithmetic as evidence of a NUMBER only when a digit appears in the cell text. Both halves of the class are pinned; see policy/infer-hyphenated-words-stay-string for the input-column half, which fails loudly rather than silently. DO NOT fix a future problem here by widening the arithmetic tier again without checking BOTH cases.'
SOURCE='src/DMN/DecisionTable.hs, inferEvidence; DECISIONS.md D-2'
ARGS='--to=ts input.md'
