TITLE='negative control: a column DECLARED String keeps a label like <1 year or >5 years as written, unquoted'
WHY='The second escape hatch the unreadable-test refusal names. Declaring "tenure : String" is the author saying these cells are text, and the refusal only ever looks at columns that declare no type -- so <1 year and >5 years are string equality tests at exit 0, exactly as they were before the refusal existed.

This is the documented meaning of a String declaration: the VConflict message of D-2 tells an author that "C : String" reads every cell as the text the author wrote, and VAmbiguous hands out the same repair for 007. Refusing test-shaped cells in a declared String column would make both of those messages false and leave a band label writable only by quoting.

What this deliberately does NOT settle: whether a declared String column should eventually read an unquoted cell as a unary test, with quoting as the literal escape. symptom/md-negation-in-string-column-silent holds that question for not(...), and says it belongs with the quoting rule. If that ruling is ever made, this case changes on purpose and is reclassified with it.

Recorded before the refusal was implemented, so an unchanged recording is the evidence that the refusal left it alone.'
SOURCE='src/DMN/DecisionTable.hs mkInputFsAt (the Nothing guard); src/DMN/ParseTable.hs mkFEELCol'
ARGS='--to=ts input.md'
