TITLE='an ANY table whose identical rules DISAGREE on output is refused'
WHY='FIXED by D-22 part 2, and moved from symptom/ under its old slug, which names the defect it used to record. WHAT IT DID: hit policy A, two rows with the byte-identical guard x = 5, returning alpha and beta. The emitted TypeScript contained both branches, the second unreachable, at exit 0 with nothing on stderr. DMN 1.3 §8.2.10 lets ANY rules overlap only if they produce the same output. D-13 did not catch it, because Meng scoped D-13 to U tables only. WHAT IT DOES NOW: the conflict check of D-22 rule 2 covers A as well as U, comparing the outputs as the cells state them, so the reader refuses the table, naming both rows, the witness x = 5 and the outputs that disagree, and exits 1 with nothing emitted. It names no wider overlap because the overlap is that one input. D-13 still says nothing here, and need not: under A identical guards are just the smallest overlap, and the output side decides whether it is a conflict.'
SOURCE='src/DMN/Regions.hs conflicts, conflictErrors; DECISIONS.md D-13, D-22'
ARGS='--to=ts input.md'
