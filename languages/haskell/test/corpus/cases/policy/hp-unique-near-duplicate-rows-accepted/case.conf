TITLE='a U table whose rows are similar but distinct still parses — the negative case for D-13'
WHY='D-13. `uniquenessErrors` refuses two rows of a Unique table with identical guards, and the expensive way for that check to be wrong is a FALSE refusal: it refuses tables that parsed yesterday. This case is the guard against that, and every pair in it is one of the ways two rows can come close without colliding. Rows 1/2 differ only in a number that is genuinely a different number (1.1 vs 1.2 — as opposed to 1.1 vs 1.10, which ARE the same number and are refused by the sibling case). Rows 2/3 agree in every input column but one, which is not a duplicate: a guard is the whole input side conjoined. Rows 3/4 differ only in one member of a multi-value cell, which is compared as a SET (`fEvals` is an OR) — so different members mean different rows even though `Winter` appears in both. Row 5 is an all-wildcard catch-all after four specific rows, the ordinary idiom four `policy/l4-*` recordings depend on; it is refused only against ANOTHER all-wildcard row. If this case ever starts refusing, the check has been widened past Meng`s ruling.'
SOURCE='src/DMN/DecisionTable.hs uniquenessErrors; DECISIONS.md D-13'
ARGS='--to=ts input.md'
