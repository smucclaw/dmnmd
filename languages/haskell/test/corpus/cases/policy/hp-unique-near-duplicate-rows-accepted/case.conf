TITLE='a U table whose rows are similar but distinct still parses — the negative case for D-13 and D-22'
WHY='D-13. `uniquenessErrors` refuses two rows of a Unique table with identical guards, and D-22 part 2 widened the refusal to any two rules that can both match (`conflictErrors`). The expensive way for either check to be wrong is a FALSE refusal: it refuses tables that parsed yesterday. This case is the guard against that, and every pair in it is one of the ways two rows can come close without overlapping. Rows 1/2 differ only in a number that is genuinely a different number (1.1 vs 1.2 — as opposed to 1.1 vs 1.10, which ARE the same number and are refused by the sibling case). Rows 2/3 agree in every input column but one, which is not a duplicate: a guard is the whole input side conjoined. Rows 3/4 differ only in a multi-value cell, which is compared as a SET (`fEvals` is an OR), and whose members are disjoint. Row 5 is an all-wildcard catch-all after four specific rows, the ordinary idiom four `policy/l4-*` recordings depend on; D-22 rule 1 reads it as the default output value, so it overlaps nothing, and D-13 refuses it only against ANOTHER all-wildcard row. RE-FIXTURED under D-22 part 2. Row 4 was `Spring, Winter`, which shares Winter with row 3, so rows 3 and 4 both matched Version 1.2, premium, Winter. That is an overlap, which D-22 refuses, so row 4 is now `Spring, Summer`, and the old table is `policy/hp-unique-overlap-shared-member-refused`. If this case ever starts refusing, a check has been widened past the rulings.'
SOURCE='src/DMN/DecisionTable.hs uniquenessErrors; src/DMN/Regions.hs conflictErrors; DECISIONS.md D-13, D-22'
ARGS='--to=ts input.md'
