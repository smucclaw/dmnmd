TITLE='under COLLECT COUNT the decision <variable> types the COUNT, so a number variable over a string column is read, and the column is inferred'
WHY='DMN 1.3 section 8.2.10: "# (count): the result of the decision table is the number of outputs". Section 6.3.7 makes the decision variable "the instance of InformationItem that stores the result of this Decision". So under C# the variable is a number whatever the output column holds, and says nothing about that column. The output clause carries no typeRef, as section 8.3.2 requires of a single-output table, so the column type is inferred from its cells, here the string literals "vip" and "member". An earlier version of the section 8.3.2 follow-up to D-17 read the variable as the column type under all four aggregations, C# included, and refused this valid document one cell at a time at exit 1, because "vip" is not a number. What is pinned: exit 0, empty stderr, and the ts output returns the QUOTED strings "vip" and "member" under the key "flag", which comes from decisionTable/@outputLabel. A refusal here means the variable is being applied to the column under C# again.'
SOURCE='src/DMN/Types.hs resultShape (ResultIsCount); src/DMN/XML/XmlToDmnmd.hs convOutputCol'
ARGS='-f xml --to=ts input.dmn'
