TITLE='a collection OUTPUT cell emits a real L4 list literal, and the wildcard row emits EMPTY'
WHY='WAS symptom/md-list-output-l4-truncates.

Before: `fries, slaw` in a `sides : [String] (out)` column emitted
`THEN "fries"` under `GIVETH A LIST OF STRING` - the tail silently dropped AND
the value not even of the declared type.

Now: `THEN LIST "fries", "slaw"`, and `OTHERWISE EMPTY`. l4 check succeeds.

TWO ORDERING HAZARDS ARE PINNED HERE.

1. In renderOutCell the list arm must come BEFORE the enum-constructor arm. That
   arm matches `(FNullary (VS s) : _)` - head-only - so if it ran first on a
   domained collection column it would win and drop every member after the
   first, which is the exact bug this case was recorded for, reintroduced one
   level up.

2. The INPUT column here still dittos (`IF ^ ^ "Spring"`). Collection columns
   deliberately do not ditto, and this fixture shows the two coexisting: the
   scalar input column keeps its caret grid while the collection output column
   renders a full literal. If a change makes the carets disappear here, ditto
   has been switched off too broadly.'
SOURCE='src/DMN/Translate/L4.hs renderOutCell list arm; typeDefaultScalar DMN_List -> EMPTY'
ARGS='--to=l4 input.md'
