TITLE='a collection OUTPUT cell emits a real L4 list literal, wrapped in JUST where no rule may match'
WHY='WAS symptom/md-list-output-l4-truncates.

Before: `fries, slaw` in a `sides : [String] (out)` column emitted
`THEN "fries"` under `GIVETH A LIST OF STRING` - the tail silently dropped AND
the value not even of the declared type.

Then: `THEN LIST "fries", "slaw"`, and `OTHERWISE EMPTY`.

Now (D-22 part 3): `THEN JUST (LIST "fries", "slaw")` under
`GIVETH A MAYBE (LIST OF STRING)`, and `OTHERWISE NOTHING`. A season other than
Fall or Spring matches no rule, so the table has a no-match region and no
default, and DECISIONS.md D-22 rule 3 names this case. The old `OTHERWISE EMPTY`
was the typed sentinel for a list, which answered the empty list for a Winter
input the table says nothing about. EMPTY for a wildcard output cell in a
catch-all row is still pinned, in TranslateL4Spec (collection columns).

The parentheses around the list type are load-bearing: `MAYBE LIST OF STRING`
is a parse error in l4 (unexpected LIST), measured 2026-09-29. With the l4 on
PATH, l4 check succeeds on this output, and l4 run satisfies
Sides "Fall" EQUALS JUST (LIST "fries", "slaw") and Sides "Winter" EQUALS NOTHING.

TWO ORDERING HAZARDS ARE PINNED HERE.

1. In renderOutCell the list arm must come BEFORE the enum-constructor arm. That
   arm matches `(FNullary (VS s) : _)` - head-only - so if it ran first on a
   domained collection column it would win and drop every member after the
   first, which is the exact bug this case was recorded for, reintroduced one
   level up.

2. The INPUT column here still dittos (`IF ^ ^ "Spring"`). Collection columns
   deliberately do not ditto, and this fixture shows the two coexisting: the
   scalar input column keeps its caret grid while the collection output column
   renders a full literal. If a change makes the carets disappear here, ditto
   has been switched off too broadly.'
SOURCE='src/DMN/Translate/L4.hs renderOutCell list arm; typeAtom; noRuleMayMatch'
ARGS='--to=l4 input.md'
