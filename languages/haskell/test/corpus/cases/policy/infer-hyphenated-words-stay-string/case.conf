TITLE='a column of hyphenated words infers String, and is not refused as an unresolvable number'
WHY='WHAT IT DOES: the undeclared input column holds Full-Time and Part-Time, neither containing a digit, and the table parses and emits Employment === "Full-Time" at exit 0 -- byte-identical to what trunk emitted before D-2. WHY THAT IS RIGHT: these are strings and always were. DMN 1.3 §9.2 rule 27 makes them parse as subtraction over bare FEEL names, but arithmetic with no digit in it is not evidence of a numeric column. WHAT THIS CASE IS PROTECTING: when D-2 first landed, arithmetic was weak evidence that decided a column whenever nothing harder spoke -- which is exactly the situation in a column where EVERY cell is a hyphenated word. The column typed Number and the table was refused at exit 1. D-2 accepts that some tables which parse today will start refusing, and that cost is real and intended; it does NOT extend to refusing a column of ordinary English compound words, which is a false refusal against a document that was correct. D-2s own last-resort mitigation does not help here: it rescues a MIXED column, where one ordinary word outvotes the arithmetic, and this is the pure case, which is the likelier one. Employment status, payment terms, and n/a all live in this class. THE FIX IT PINS: inferEvidence counts arithmetic as evidence of a NUMBER only when a digit appears in the cell text. The digit test is what keeps the tier safe rather than merely narrow -- 40 - 50 still speaks, and is the only informative cell in policy/num-dash-range-refused, which is why the tier cannot simply be deleted. The silent half of the same class is policy/infer-hyphenated-output-stays-string, and it is the more dangerous of the two.'
SOURCE='src/DMN/DecisionTable.hs, inferEvidence; DECISIONS.md D-2'
ARGS='--to=ts input.md'
