TITLE='an F table with no input column and two rules is accepted, and the first rule answers'
WHY='The second negative control for md-zero-input-unique-refused. Under hit policy F the first matching rule answers and later rules that also match are meant to be dead, so two rules with no input column are not an overlap to refuse: every rule matches every input, and the first one answers. ts emits if ("default") for each rule and takes the first; the L4 backend renders IF TRUE for the first and OTHERWISE for the second, which is the same answer. The refusal is about hit policy U, whose rules must not overlap (DMN 1.3 section 8.2.10), and this case fails if it is widened to F.'
SOURCE='src/DMN/Regions.hs conflictErrors, which speaks only for U and A; audit 10 finding f8'
ARGS='--to=ts input.md'
