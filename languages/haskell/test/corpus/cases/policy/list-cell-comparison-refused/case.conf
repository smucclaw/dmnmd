TITLE='R2: a comparison, range or arithmetic cell in a collection INPUT column is refused, naming both readings'
WHY='WAS symptom/md-list-input-comparison-ts-nonsense. Now fixed, so it moves
here - a fixed symptom left under symptom/ is unprotected, and a later diff
would read as progress rather than as the regression it would be.

What it used to do, and why it was the worst of the list defects. `tags :
[Number]` with a cell `> 3` emitted `if (tags > 3.0)` against a `number[]`, and
"it just never matches" is the comforting assumption. MEASURED in node:

    [5]   > 3  ->  true
    [10]  > 3  ->  true
    [1,2] > 3  ->  false
    []    > 3  ->  false

JS stringifies the array and then coerces, so [5] becomes "5" becomes 5 and the
guard fires, while [1,2] becomes "1,2" which is NaN and it does not. The rule
therefore fired on SOME collections containing an element over 3 and not others,
with no relationship to what the table said. Strictly worse than always-false,
because a test suite over single-element lists would have passed.

WHY REFUSED RATHER THAN REPAIRED. The obvious repair is to pick a quantifier and
emit tags.some(x => x > 3). dmnmd will not, because "some element > 3" and
"every element > 3" are different rules and nothing in the table says which:

  * DMN gives the construct no meaning at all. Section 10.3.2.10 defines
    input-entry satisfaction by reduction to FEEL(e in (t)), and Table 54
    defines < and > over scalars, so a conformant engine yields null and the
    rule never fires.
  * Guessing would put a silent wrong answer where a loud refusal can go, which
    is the one trade this project does not make.

So the cell is refused, exit 1, and the message names both readings and offers
two repairs: aggregate the collection to a scalar before the table, or split the
column. A plain value is still accepted and means membership; that is the
unambiguous case, and it is what a collection column is actually for.

The same refusal covers a range ([18..65]) and an arithmetic expression
(age * 2) in a collection input cell, for the same reason. THE QUOTED CELL CHANGED, AND THAT IS THE POINT: this message used to read `"> 3.0"` three times in one sentence for a cell the author wrote as `> 3`. showDomainMember rendered numbers with show, and `show @Float` has no way to spell a number that is not a float. It now renders through DMN.Number.showNumPlain over a Scientific, so the refusal quotes the table back verbatim, which is what the haddock of that function has always promised.'
SOURCE='src/DMN/DecisionTable.hs structuralErrors ambiguousMsg; BUILD-SPEC-dmnmd-l4-sumtype.md B.3 tier 2'
ARGS='--to=ts input.md'
