TITLE='an integer beyond binary32 survives to every backend exactly as written'
WHY='WHAT IT DOES: the table writes 16777217 in both the guard and the output cell, and the emitted TypeScript compares against 16777217.0 and returns 16777217.0, at exit 0 with nothing on stderr. WHY THAT IS RIGHT: FEEL numbers are decimal128 (DMN 1.3 section 10.3.2.3.1), so a decision table means the number the author wrote and nothing near it. DMN.Types holds VN as a Scientific -- an arbitrary-precision decimal -- so the digits an author types are the digits every backend emits, and there is no significand width for them to fall off the end of. WHAT THIS CASE IS PROTECTING: it was recorded as symptom/num-float32-integer-identity-lost against the binary that spelled VN as Float, where binary32 has a 24-bit significand and every ODD integer above 16777216 was rounded to a representable neighbour before anything downstream saw it, so this table emitted a rule comparing against 1.6777216e7 that could never match the value it was written for -- at exit 0, with no diagnostic. DECISIONS.md D-1 required that recording to exist BEFORE the change, so the change would demonstrate an improvement rather than assert one. It is promoted here because the number is now correct; a future diff in the digits is a regression. TWO THINGS THE RECORDING DELIBERATELY DOES NOT PIN: the trailing .0 is the js/ts/py convention (DMN.Number.showNumFloatish), not a precision statement -- the L4 backend renders the same value 16777217 with no .0, because L4 has no float/int distinction to preserve and a lawyer reads that output. And exponent notation is gone from these backends entirely: show @Scientific would have spelled this 1.6777217e7, the right value with text the author never wrote, which is why the backends format rather than show. Both columns are explicitly typed, so this case does not also depend on inference, which D-2 is queued to change.'
SOURCE='src/DMN/Types.hs, the VN Scientific constructor; src/DMN/Number.hs, showNumFloatish; DECISIONS.md D-1'
ARGS='--to=ts input.md'
