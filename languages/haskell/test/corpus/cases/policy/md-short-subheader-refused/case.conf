TITLE='a sub-header row with fewer cells than the header is refused, naming the first column it does not reach'
WHY='A sub-header cell declares the domain of the column at its position, and the reader used to merge the sub-header into the header with zipWith, which stops at the shorter list: a sub-header with one cell for two columns deleted the Price column from the table (ts emitted rules that return {} at exit 0, and --to=xml refused with a diagnosis, "no output column", that was not the author mistake). Now ParseTable.subHeaderArityDiags compares the two widths and the table is refused at exit 1 with nothing emitted. The message names the table and the first column the row does not reach, and says the repair: write one cell per column, leaving the cell empty for a column with no declared domain, which policy/md-subheader-blank-cell-declares-no-domain pins as accepted. Refusing is the choice that invents no meaning, and it is the one that --to=xml and the XML reader already make for a data row with too few cells; padding the sub-header with empty cells would also have been defensible, because an empty sub-header cell means no domain. A sub-header longer than the header is refused the same way (test/Spec.hs, tableShapeSpec).'
SOURCE='src/DMN/ParseTable.hs subHeaderArityDiags, called from parseTableD; audit 10 finding f1; chosen in the branch fix/audit10-parser-silent-drops (assumed, not ruled)'
ARGS='--to=ts input.md'
