TITLE='a column typeRef naming an <itemDefinition> inherits that types <allowedValues> as its declared domain'
WHY='The output column carries typeRef="tRouting", and the document declares

  <semantic:itemDefinition name="tRouting">
    <semantic:typeRef>string</semantic:typeRef>
    <semantic:allowedValues><semantic:text>"DECLINE","REFER","ACCEPT"</semantic:text></semantic:allowedValues>
  </semantic:itemDefinition>

so the column is a string whose declared domain is those three values, and the L4
backend emits a real sum type for it. Before this, tRouting was an unknown typeRef
and the whole table was REFUSED - dmnmd could not read a DMN document that used
DMNs own data model, which is most real ones.

This is BUILD-SPEC-dmnmd-l4-sumtype.md Part B tier 1, and the direct answer to
"doesnt the DMN format include a data model section where user defined types are
given?" It does, and this is dmnmd reading it.

THE FIXTURE IS PREFIX-QUALIFIED (semantic:) AND THAT IS MANDATORY, NOT INCIDENTAL.
HXTs hasName compares the QUALIFIED name, so a content filter written
hasName "typeRef" matches nothing against <semantic:typeRef> and deletes the very
children the pickler exists to read - leaving the itemDefinition parsed as empty
and the diagnostic asserting it declares no typeRef while the file has one on the
next line. Every name test in the ItemDefinition pickler goes through
hasNameWith (... . localPart) for that reason. An unprefixed fixture would pass
with the bug present. The DMN specifications own Chapter 11 example is
prefix-qualified.

Note also what is NOT in the stderr: nothing. Before tier 1 every <itemDefinition>
warned that it was being dropped. A type dmnmd can now honour is silent, and the
warnings that remain (see policy/xml-itemdefinition-warns) are only the ones it
genuinely cannot.'
SOURCE='src/DMN/XML/ParseDMN.hs ItemDefinition + itemDefElems; src/DMN/XML/XmlToDmnmd.hs resolveTypeRef/pickDomain; BUILD-SPEC-dmnmd-l4-sumtype.md sectionB.3 tier1, sectionB.4'
ARGS='--from=xml --to=l4 input.dmn'
