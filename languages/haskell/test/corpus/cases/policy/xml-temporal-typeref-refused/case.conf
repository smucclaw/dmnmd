TITLE='a temporal typeRef is an Error: the table is refused and the run exits 1'
WHY='There is no dmnmd temporal type, and reading date as a string turns every guard into a never-matching string comparison. A table that can never match is a wrong answer that would otherwise exit 0.'
SOURCE='src/DMN/XML/XmlToDmnmd.hs; CLAUDE.md "Diagnostics and exit status"'
ARGS='-f xml --to=ts input.dmn'
