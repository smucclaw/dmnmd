TITLE='a plain value outside the declared domain is an Error: the table is refused and nothing is emitted'
WHY='The sub-header row declares what the column may hold. HIHG is a typo, not a
fourth risk category, and ACCEPTT is a typo, not a fourth routing. Before E4 both
were emitted verbatim, exit 0, producing rules that can never match - the exact
thing CLAUDE.md forbids: "Anything we parse but do not yet honour must produce a
loud, located diagnostic."

Four things are pinned here and each is load-bearing:

1. Exit 1. A table whose rules have been silently widened is a wrong answer that
   exits 0, and the exit status is the only thing a script can see.
2. NOTHING on stdout. The refusal happens in mkDTable, before any backend runs,
   so a shell redirect cannot leave a half-written file behind.
3. EVERY violation is reported, not just the first. Row 1 column Risk Category
   and row 2 column Routing both appear. A validator that stops at the first
   error makes the user re-run once per typo.
4. Each message is LOCATED - table, column, row - and quotes both the declared
   domain and the offending cell. "value outside the domain" without the domain
   is not actionable.

Chosen as Error rather than Warning deliberately, and the choice is recorded in
BUILD-SPEC-dmnmd-e4.md section 12 question 1. The cost is real: a table in the
wild that violates its own declared domain stops working. No case in this corpus
did, and README Example 3 - a live fixture with three declared domains - passes.'
SOURCE='src/DMN/DecisionTable.hs domainErrors; BUILD-SPEC-dmnmd-e4.md sections 8 and 12'
ARGS='--to=ts input.md'
