TITLE='`1e5` is refused, and located -- rule 31 has no exponent'
WHY='DMN 1.3 §9.2 rule 31 is optionally-signed digits with at most one decimal point. There is no exponent notation anywhere in rules 1-38, so 1e5 is not a number and dmnmd refuses it rather than reading it as 100000, which is what it silently did at exit 0 before the anchored grammar landed. Pinned: refuse, exit 1, emit nothing, and locate -- `table "Exponent": column "X": row 1`. Recorded as an acceptance one commit before the fix so that the change reads as a demonstrated improvement rather than an asserted one.'
SOURCE='src/DMN/ParseCell.hs numericLiteral; located by DMN.DecisionTable.mkFsAt'
ARGS='--to=ts input.md'
