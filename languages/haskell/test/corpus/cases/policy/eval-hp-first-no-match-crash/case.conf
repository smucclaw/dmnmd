TITLE='a First table with no matching row answers null, and the run goes on'
WHY='DECISIONS.md D-22 rule 3: the interpreter no-match is null, not an error and not a crash. DMN 1.3 §10.3.2.10 step 2 says that when no rule matches the result is the default output value, or null if none is specified, and a markdown table has no syntax for a default. Guests=99 matches nothing, so FirstEmpty answers null; the -q REPL prints it as the literal `null` whatever -t says, because the whole result is null and there is no output column to name, and exit is 0. Until D-22 this case was a symptom with the same slug, which names the defect it recorded: head0 raised an `error` from the HP_First arm, printed a CallStack and aborted the whole run at exit 1, and HP_Priority called head0 too. The slug is kept so that D-21 condition 2, which cites it as the gate before emitAsserts, still finds it. What is pinned: the literal null line, exit 0, nothing on stderr, and a prompt after the answer, so later queries still run. The other single-hit policies (U, A, P), and a declared default winning over null under P and F, are pinned in the hspec block `evalTable under D-22` in test/Spec.hs.'
SOURCE='src/DMN/DecisionTable.hs evalTable, HP_First arm (noMatch); app/Main.hs showResult; DECISIONS.md D-22'
ARGS='-q -t ts input.md'
STDIN_FILE='stdin'
