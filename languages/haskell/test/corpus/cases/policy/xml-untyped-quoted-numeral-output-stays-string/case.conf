TITLE='an untyped XML output column of FEEL string literals "5" and "6" is a String column, so the strings come back quoted'
WHY='The document states the strings "5" and "6" -- FEEL string literals, quotes included -- and dmnmd used to emit the numbers 5.0 and 6.0 at exit 0 with no diagnostic. The column has no typeRef, so XmlToDmnmd.resolveColumn infers one from a pre-pass over the cell texts, and two comments in the tree said that pre-pass keeps the quotes because they are "the only thing that distinguishes" a FEEL "2020" from 2020. It did not: the pre-pass called mkFsEither, and mkFsEither runs unquoteCell before any evidence is taken, so "5" was graded exactly like 5. It now calls mkFsKeepingQuotes. The defect predates the section 8.3.2 follow-up to D-17 (trunk 18481de gave the same output for an untyped column), but that follow-up made it reachable from dmnmd own output: under COLLECT COUNT the decision variable types the count (DMN 1.3 section 8.2.10), so a counted String column is written with no type anywhere and read back through inference. A markdown C# table with a declared String column holding 5 and 6 round-tripped --to=xml then --from=xml --to=ts as {"flag":5.0} where the direct --to=ts gives {"flag":"5"}. This input is that shape, written by hand. What is pinned: "5" and "6" come back quoted.'
SOURCE='src/DMN/XML/XmlToDmnmd.hs resolveColumn firstPass; src/DMN/DecisionTable.hs mkFsKeepingQuotes and inferEvidence (the quoted-string clause); audit 2026-09-26 finding f4'
ARGS='-f xml --to=ts input.dmn'
