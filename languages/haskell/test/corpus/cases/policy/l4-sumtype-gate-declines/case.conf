TITLE='a domained column with no catch-all row does NOT get a sum type, and emits exactly as before'
WHY='Same shape as policy/l4-sumtype-emitted, minus the catch-all row. The gate
declines, and the emission must be byte-for-byte what it was before sum types
existed: GIVETH A STRING, quoted string arms, OTHERWISE "".

This is the case that would catch a half-applied gate, which is not
hypothetical - the first implementation applied the gate to the DECLARE and the
GIVETH but not to the cell renderer, which consults enumCtorsOf directly. That
produced `GIVETH A STRING` with arms returning `Stew`: a mixture that does not
typecheck and that no amount of reading the diff makes obviously wrong. It was
caught by policy/l4-priority-reorders-arms going red, which is luck - that case
exists to test arm ORDERING and only noticed because backticks are visible.

So this case exists to make the decline path explicit rather than incidental.

WHY THE GATE DECLINES HERE: without a catch-all row the OTHERWISE has to be
synthesized, and there is no value of the sum type to synthesize. `OTHERWISE ""`
against a sum-typed GIVETH is a check error, and omitting OTHERWISE is a parse
error. The fix is MAYBE/JUST/NOTHING (BUILD-SPEC-dmnmd-l4-sumtype.md A.5), after
which THIS CASE SHOULD CHANGE and be re-recorded - it pins current correct
behaviour, not a permanent boundary.'
SOURCE='src/DMN/Translate/L4.hs enumOuts, the isJust catchAll condition'
ARGS='--to=l4 input.md'
