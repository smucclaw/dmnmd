TITLE='a declared `: Number` column holding `Fall` and `Winter` is refused, naming the file, the table, the column and EVERY offending rule'
WHY='A declared type is used by columnSigs and mkFsAt at initial parse, before inference runs at all, so the numeric reader is handed "Fall" and refuses it. The verdict was never in doubt; what was missing was the location. This case used to complain that the diagnostic quoted the cell text but named no file, table, column or row, which on a multi-table file gave the author nothing to go on. All four now arrive: `input.md: table "DeclaredNumber": column "Season": row 1`. (Two earlier retractions here are themselves retracted. The claim that three of four arrive and "the FILE still does not" was true only until D-7: ParseMarkdown.parseChunk has the file name and now adds it to the diagnostics it forwards, so the markdown path is no longer file-less and no longer differs from the XML reader on this point.) D-7 also changed WHAT IS REPORTED, not just how it is framed: `error` stopped at the first cell forced, so this recording named row 1 alone; a returned diagnostic list collects every bad cell, so rows 1 AND 2 are now reported. That is the same discipline tableErrors always followed. What is pinned: refuse, exit 1, emit nothing, and locate every offending cell to file, table, column and rule number.'
SOURCE='src/DMN/DecisionTable.hs mkFEither mkVN via ParseTable columnSigs; located by mkFsAt; audit lens "type inference" finding 20 and "table structure" finding 35'
ARGS='--to=ts input.md'
