TITLE='a declared `: Number` column holding `Fall` is refused, naming the table, the column and the rule'
WHY='A declared type is used by columnSigs and mkFsAt at initial parse, before inference runs at all, so the numeric reader is handed "Fall" and refuses it. The verdict was never in doubt; what was missing was the location. This case used to complain that the diagnostic quoted the cell text but named no file, table, column or row, which on a multi-table file gave the author nothing to go on. Three of those four now arrive: `table "DeclaredNumber": column "Season": row 1`. The FILE still does not, and that is a deferral rather than an oversight -- DMN.ParseTable.parseTable is not given one, though ParseMarkdown.parseChunk has it and prints it in the sibling diagnostics either side of the call. The markdown path therefore stays file-less, matching every other table-scoped refusal in cases/policy/, while the XML reader does print one; see the CellSite haddock. What is pinned: refuse, exit 1, emit nothing, and locate to table, column and rule number.'
SOURCE='src/DMN/DecisionTable.hs mkFEither mkVN via ParseTable columnSigs; located by mkFsAt; audit lens "type inference" finding 20 and "table structure" finding 35'
ARGS='--to=ts input.md'
