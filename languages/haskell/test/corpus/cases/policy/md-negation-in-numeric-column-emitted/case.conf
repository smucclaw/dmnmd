TITLE='not([1..5]) in a numeric column compiles to the negated guard, in all four backends'
WHY='D-9. Rule 12.b of DMN 1.3 §9.2 is "not", "(", simple positive unary tests,
")", and dmnmd now implements it for the single-test form: the cell builds an
FNot and every backend renders it. TypeScript and JavaScript emit
!((1.0 <= Age && Age <= 5.0)), Python not  ((1.0 <= Age and Age <= 5.0)), L4
NOT ((Age >= 1 AND Age <= 5)).

THIS CASE WAS RE-RECORDED AS A DELIBERATE POLICY CHANGE, and the directory was
renamed from md-negation-in-numeric-column-refused because the old name asserts
the opposite of what the tool now does. The old recording pinned a located exit-1
refusal, and that refusal was RIGHT for as long as there was no IR for negation:
before it, the unanchored interval search matched [1..5] inside not([1..5]) and
threw the not away, compiling the cell to its own exact logical complement at
exit 0. Refusing was the correct intermediate state. Implementing it is the
correct final one, so what changed is what the project promises, not whether the
old recording was accurate.

The parentheses around the inner guard are the part most likely to be broken by a
later edit, and they are not decoration. wrapParen returns a ONE-element list
unbracketed, so building this as "!" ++ wrapParen … would emit !Age < 5.0, which
JavaScript parses as (!Age) < 5.0. That form was executed under node during
review and returns the SAME answer for every input -- a totally inverted guard at
exit 0, which is the defect class D-9 exists to remove. Python has the same trap
with not binding tighter than and. Both backends therefore force their own
parentheses rather than delegating.

The emitted JavaScript was run under node against this exact fixture. Age outside
[1..5] gives outside; Age inside gives no match at all, because row 2 requires
[10..20] and the two ranges are disjoint. Falling through to undefined is the
honest answer for an unmatched U table, and it is what the recording shows.

Negation in an OUTPUT cell is a different question and is refused; see
policy/md-negation-in-output-cell-refused.'
SOURCE='src/DMN/ParseCell.hs parseNumberCell peelNot arm; DMN/Types.hs FNot; the FNot arms in JS.hs, PY.hs and L4.hs oneFeel. DECISIONS.md D-9'
ARGS='--to=ts input.md'
