TITLE='a cell outside the domain the columns typeRef inherits is refused, exactly as an inline <outputValues> would be'
WHY='Identical to policy/xml-typeref-inherits-allowedvalues except that rule r2
outputs "ACCEPTT" - a typo for the declared "ACCEPT". The domain arrives from the
named type rather than from an inline <outputValues>, and the check is the same
one: DecisionTable.domainErrors, shared with the markdown reader rather than
reimplemented.

That sharing is the point. An inherited domain that were checked by different code
than a declared one would drift, and the two would disagree about what counts as a
member. Compare policy/enum-domain-violation-refused (markdown) and
policy/xml-declared-values-honoured (inline <outputValues>): three routes into the
same rule.

Exit 1 and nothing emitted, because a table whose rules have been silently widened
is a wrong answer that exits 0.'
SOURCE='src/DMN/XML/XmlToDmnmd.hs resolveTypeRef -> Col.colValuesText -> domainErrors; src/DMN/DecisionTable.hs domainErrors'
ARGS='--from=xml --to=l4 input.dmn'
