TITLE='`0x10` in a Number column is refused, and the refusal says which table, column and rule'
WHY='A base prefix is not a FEEL number. DMN 1.3 §9.2 rule 31 is optionally-signed digits with at most one decimal point, and nothing in rules 1-38 admits 0x, so dmnmd refuses the cell rather than guessing at it. This must not become an acceptance again: it WAS one, silently reading 0x10 as 16 at exit 0, because the numeric fallthrough was the Haskell `read` instance rather than rule 31. Two things are pinned here. The VERDICT: refuse, exit 1, emit nothing. And the LOCATION: `table "HexLiteral": column "Code": row 1`, naming the table, the column and the rule number AS THE AUTHOR WROTE THEM in the leftmost cell -- not a 0-based index, which is why a table numbered 1, 2, 5 reports row 5. None of the three is checked for uniqueness; see the CellSite haddock. The octal sibling is num-nonsfeel-octal-refused, and one anchored grammar has to close both.'
SOURCE='src/DMN/ParseCell.hs numericLiteral, anchored by runAnchored`s eof; located by DMN.DecisionTable.mkFsAt'
ARGS='--to=ts input.md'
