TITLE='a <decisionService> is dropped with a warning; the document still reads'
WHY='A decision service is DRG PACKAGING, not decision logic: every child of tDecisionService is a tDMNElementReference, a bare href, so it names decisions the document already states in full and contributes nothing of its own. Dropping it loses the wiring and nothing else, which is exactly the trade drgEdgeDropped already makes for <informationRequirement> (D-6) and warns about the same way. It used to be listed in unmodelledDrgElements, which cost the WHOLE DOCUMENT -- a file dmnmd could read perfectly well produced nothing at all, at exit 1. Measured on 355 DMN documents exported from legalese/l4-ide: 36 failed for decisionService alone, and stripping the element made 25 of those 36 fully readable with no other change; end to end, with D-17 also in place, readable documents went 253 to 280. What is pinned: exit 0, a Warning naming the service, and the SAME TypeScript baseline.dmn gives, because this fixture is baseline.dmn plus the element and nothing else. The companion case policy/xml-unsupported-drgelement-rejected pins the other half of the asymmetry: <businessKnowledgeModel> carries <encapsulatedLogic>, so it IS a definition, and consuming one wholesale would silently discard logic the document may invoke -- it stays a refusal.'
SOURCE='src/DMN/XML/ParseDMN.hs DecisionService/DrgSvc and unmodelledDrgElements; src/DMN/XML/XmlToDmnmd.hs decisionServiceDiags'
ARGS='-f xml --to=ts input.dmn'
