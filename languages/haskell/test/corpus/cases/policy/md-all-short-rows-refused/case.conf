TITLE='when every data row is short the table is refused, where its output column used to vanish and the rules returned nothing'
WHY='The sibling of struct-short-row-refused, which has one short row. With one short row among full ones the longest row kept mkDTable transpose as wide as the header and every header survived, so the table was truncated but kept its output column. With every row short no row reached the Dish column, mkDTable zipped the headers with a one-column transpose and zipWith deleted the Dish header: ts, js and py emitted rules that return {}, and L4 emitted GIVETH A MAYBE AllShort with no declaration of that type, all at exit 0, while --to=xml refused with the diagnosis "no output column", which was not what the author did wrong. Now each short row is refused where it is read (ParseTable.rowArityDiags), once per row, naming the Dish column and the row number, so mkDTable never sees it. This was the f2 finding of audit 10.'
SOURCE='src/DMN/ParseTable.hs rowArityDiags; src/DMN/BuildTable.hs mkDTable, zipWith inferTypes over the headers and the transpose of the rows; audit 10 finding f2; chosen in the branch fix/audit10-parser-silent-drops (assumed, not ruled)'
ARGS='--to=ts input.md'
