TITLE='a markdown row with fewer cells than there are columns is refused rather than padded, because DMN requires one entry per column'
WHY='DMN tDecisionRule has no short rule, and padding the row with "-" would make the rule match every value of the missing column: a WIDER rule than the author wrote, in a well-formed document, at exit 0. That is the failure mode the XML backend exists to prevent. Until the markdown reader refused a short row itself (policy/struct-short-row-refused) the table reached the XML emitter, and this case recorded the emitter refusal: one error per missing side of rule 2, "has 1 input cell but the table declares 2 input columns" and "has 0 output cells but the table declares 1 output column". Now the reader refuses first, with one located error naming the Guests column and row 2, and --to=xml is never reached. What this case pins is unchanged: a short row is not padded, the run exits 1, and nothing is emitted for any table. The emitter own refusal (XML.hs ruleArityErrs) and the XML reader (XmlToDmnmd checkArity, which calls it an XSD violation) remain for a table built any other way, and are exercised by test/TranslateXMLSpec.hs and test/DmnXmlSpec.hs.'
SOURCE='src/DMN/ParseTable.hs rowArityDiags; src/DMN/Translate/XML.hs fidelityDiags ruleArityErrs; DMN/XML/XmlToDmnmd.hs checkArity; DMN13.xsd tDecisionRule'
ARGS='--to=xml input.md'
