TITLE='a markdown row with fewer cells than there are columns is refused rather than padded, because DMN requires one entry per column'
WHY='The markdown parser accepts a short row and the other backends read the missing cells as absent - symptom/struct-short-row-truncated records that behaviour. DMN tDecisionRule has no such shape, and dmnmd own XML reader refuses a document that breaks the arity (XmlToDmnmd checkArity, which calls it an XSD violation rather than a degradation).

So there are exactly two things the emitter could do and one of them is forbidden. Padding the row with "-" would make the rule match every value of the missing column: a WIDER rule than the author wrote, in a well-formed document, at exit 0. That is the failure mode this backend exists to prevent, and it is worse than any refusal. Writing the short rule instead produces a document nothing - including dmnmd - can read.

Refusing names the rule by the number the author wrote, the direction (input or output), and both counts.'
SOURCE='src/DMN/Translate/XML.hs fidelityDiags ruleArityErrs; DMN/XML/XmlToDmnmd.hs checkArity; DMN13.xsd tDecisionRule'
ARGS='--to=xml input.md'
