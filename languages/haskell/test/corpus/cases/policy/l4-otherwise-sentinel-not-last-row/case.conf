TITLE='with no catch-all row and a no-match region, the result is MAYBE and the OTHERWISE is NOTHING, not the last data row output'
WHY='DECISIONS.md D-22 rule 3 names this case. The table has two rows and no catch-all, and every Age from 18 to 60 matches neither, so it has a no-match region and no default. The synthesized OTHERWISE is reachable, and it now says NOTHING under GIVETH A MAYBE NUMBER, with each arm wrapped in JUST.

Before D-22 part 3 it returned the typed sentinel 0 under GIVETH A NUMBER, an answer the table never gave, at exit 0. This case was recorded to pin that sentinel against the single most plausible wrong answer, reusing the last data row output (20). Both are now ruled out: the recording contains neither OTHERWISE 0 nor OTHERWISE 20. The old WHY called the sentinel a design choice rather than the DMN null and named wrapMaybe as the faithful rendering; D-22 made that rendering the default and the option is gone.

What still holds: CLAUDE.md says OTHERWISE must not reuse the last data row output. A total table with no catch-all row stays bare and keeps its sentinel, because there its OTHERWISE is dead (TranslateL4Spec, leaves a total table with no catch-all row bare).

Measured 2026-09-29 with the l4 on PATH: l4 check succeeds on this output, and l4 run satisfies NoCatchAll 10 EQUALS JUST 5, NoCatchAll 70 EQUALS JUST 20 and NoCatchAll 30 EQUALS NOTHING.'
