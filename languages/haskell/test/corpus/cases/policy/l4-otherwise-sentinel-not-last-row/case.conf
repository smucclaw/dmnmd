TITLE='with no catch-all row the synthesized OTHERWISE returns the type sentinel, not the last data row output'
WHY='CLAUDE.md: with no all-wildcard catch-all row, OTHERWISE must NOT reuse the last data row output - it falls back to defaultResult or a typed sentinel. Every other L4 recording in the corpus ends in a trailing all-wildcard row, so this fallback branch of otherwiseExpr had never been exercised. This table has two rows and no catch-all; the last data row returns 20 and the OTHERWISE returns 0, so the recording distinguishes the correct behaviour from the single most plausible wrong one. It also pins that the sentinel is type-directed rather than the empty string typeDefaultScalar falls back to: under GIVETH A NUMBER an OTHERWISE of the empty string would be ill-typed, and real l4 check succeeds on this output, exit 0. Note what this case does NOT claim: 0 for an unmatched input is a design choice recorded in BUILD-SPEC section 4.3, not a semantic equivalent of the DMN null. The faithful rendering is the wrapMaybe option, which the CLI exposes no flag for - app/Main.hs passes defaultL4Opts unconditionally.'
SOURCE='src/DMN/Translate/L4.hs otherwiseExpr / typeDefaultL4 / typeDefaultScalar; CLAUDE.md '"'"'With no all-wildcard catch-all row, OTHERWISE must not reuse the last data row output'"'"''
ARGS='--to=l4 input.md'
