TITLE='under U, a trailing catch-all row answers only when no other rule matches'
WHY='DECISIONS.md D-22 rule 1. A row with `-` in every input column matches every input, so under Unique it would overlap every other rule. D-22 accepts the shape as an idiom when it is the LAST row, and reads it as the §8.2.11 default output value, in the interpreter as on every other route. `Fall, 5` matches row 1 and the catch-all; the answer is Spareribs, not a conflict. `Winter, 5` matches only the catch-all, which answers Takeaway. Before D-22 the interpreter reported the first query as "multiple rows returned" while --to=l4 and js/ts/py took the first match, --to=xml promoted the row to a <defaultOutputEntry>, and that XML read back answered Spareribs: four readings of one table. This input is the one policy/md-eval-unique-conflict used to carry, byte for byte. What stays refused, and is pinned elsewhere: two rules that genuinely overlap (policy/md-eval-unique-conflict), and an all-wildcard row that is not the last row or sits under another hit policy (the hspec block `evalTable under D-22` in test/Spec.hs).'
SOURCE='src/DMN/DecisionTable.hs uniqueCatchAll, evalTable; DECISIONS.md D-22'
ARGS='-q -t ts input.md'
STDIN_FILE='stdin'
