TITLE='R8: a test in a collection OUTPUT cell is refused - an output produces a value, and a range is not one'
WHY='An input cell is a TEST and an output cell is a VALUE. In a collection
output column the value is a comma-separated list of members, so `[5..7]` is a
category error: it is an FInRange, which the backends render as a lambda
(`[(x)=> 5.0 <= x && x <= 7.0]` in TS), producing a one-element array holding a
FUNCTION where the signature promises numbers.

Scoped to LIST-typed output columns only. README documents ranges in scalar
output columns, and that is untouched - this refusal fires only where the
column type says collection.'
SOURCE='src/DMN/DecisionTable.hs structuralErrors listOutputErrs'
ARGS='--to=ts input.md'
