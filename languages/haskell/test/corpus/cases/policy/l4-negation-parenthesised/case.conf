TITLE='a negated guard is wrapped in its own parentheses, because L4 NOT binds looser than AND'
WHY='WHAT IT DOES: a row with a negated input cell AND a second input column emits `IF (NOT (Age > 3))   AND Tier EQUALS "Gold" THEN "hit"`. The OUTER parentheses around the whole NOT are the subject of this case. WHY THAT IS RIGHT, measured rather than reasoned: in L4, NOT binds LOOSER than AND. Two definitions settle it -- `loose MEANS NOT (a) AND b` returns TRUE for a=FALSE b=FALSE, while `tight MEANS (NOT (a)) AND b` returns FALSE for the same inputs. So an unparenthesised `NOT (...) AND rest` parses as `NOT (... AND rest)` and swallows every conjunct to its right. WHAT THIS CASE IS PROTECTING: D-9 first shipped with only the INNER parentheses and a comment asserting the opposite precedence. The emitted L4 typechecked, `l4 check` succeeded, and the row matched inputs it must not: the probe here returned "hit" for Age=10 Tier=Silver where dmnmds own interpreter and the emitted JavaScript both returned "miss". A silently inverted guard at exit 0, in the one backend nothing in the tree executes. THE TRAP THIS CASE EXISTS TO CATCH: `l4 check` CANNOT detect it, because both forms typecheck. Only `l4 run` or a text assertion on the emitted shape can. TranslateL4Spec does run `l4 run`, but it finds l4 via $L4_BIN or PATH and marks examples PENDING when neither yields anything -- and l4 is not a build dependency and does not exist on the CI runner. So on CI the semantic gate is silent and THIS recording, which is pure text comparison, is the only thing standing between a precedence regression and a green build. Do not delete it in favour of an hspec case unless l4 becomes a CI dependency. The inner parentheses matter too, for the opposite reason: FInRange expands to an AND chain and the operand must not be split.'
SOURCE='src/DMN/Translate/L4.hs, the FNot arm of oneFeel; DECISIONS.md D-9'
ARGS='--to=l4 input.md'
