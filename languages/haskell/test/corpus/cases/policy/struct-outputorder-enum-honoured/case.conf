TITLE='an output domain declared on an untyped column drives hit policy O, in domain order'
WHY='Hit policy O returns every matching row, ordered by the output column enums
rather than by row order. This table declares `30, 10, 20` in the sub-header row
of an UNTYPED output column, and the three data rows supply 10, 30, 20. The
correct answer is the declared order: 30, 10, 20.

It used to emit 10, 30, 20 - row order - and silently.

parseTable builds enums from the sub-header using the type AS WRITTEN in the
header, which for an undeclared column is Nothing, so the domain became a list
of STRINGS. Type inference then ran later, in mkDTable, and reprocessRows
re-typed only the data cells. The domain was never revisited. So numeric cells
were compared against string domain members, elemIndex returned Nothing for
every one of them, and O degraded to row order with nothing reported.

mkDTable now runs retypeEnums over the post-inference headers, which reuses
reprocessRows so that the domain and the cells are re-typed by the same code
under the same guard.

Why this recording is worth keeping as policy: the failure it pins is invisible.
Both the old and the new output are three plausible rows in some order, exit 0,
no diagnostic - so nothing but a recorded expectation distinguishes "O works" from
"O silently became R". The numbers were chosen so the domain order (30, 10, 20)
and the row order (10, 30, 20) differ; if someone renumbers this fixture so they
coincide, the case stops testing anything.

Related: symptom/enum-domain-multirow-joined, where a domain split over two
sub-header rows is space-joined and lands back in exactly this failure mode.'
SOURCE='src/DMN/DecisionTable.hs retypeEnums; BUILD-SPEC-dmnmd-e4.md section 10 step 3'
ARGS='-q -t ts input.md'
STDIN_FILE='stdin'
