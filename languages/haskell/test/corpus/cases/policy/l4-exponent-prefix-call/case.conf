TITLE='an exponent in an output cell is emitted as the prefix call EXPONENT, which l4 parses, and not as a caret'
WHY='fnOp2l4 used to render FNExp as a caret.
In L4 a caret is the ditto marker, so (x ^ 2) is a parse error: l4 check reported unexpected ^ and exited 1, and the emitter wrote a file that could not be used.
What L4 offers instead is the built-in EXPONENT, a prefix function (EXPONENT base power).
Checked against the installed l4 on 2026-10-13 and again 2026-10-15: the prefix form (EXPONENT x 2) passes l4 check and gives 9 at 3, 4 at -2, 6.25 at 2.5 and exactly 100000000000000000000 for EXPONENT 10 20.
The INFIX form with a variable base, (x EXPONENT 2), is rejected, so only the prefix form is safe for generated code.
x ** 2 has a non-negative integral literal exponent, which is exact in l4, so this case is silent; a power with a fractional, negative or non-literal exponent is warned about, see policy/l4-inexact-cells-warned.
It was a symptom, symptom/l4-exponent-caret-parse-error, until DECISIONS.md D-24.'
SOURCE='src/DMN/Translate/L4.hs fnf2l4'
ARGS='--to=l4 input.md'
