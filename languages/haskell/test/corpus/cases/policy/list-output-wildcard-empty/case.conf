TITLE='a wildcard cell in a collection OUTPUT column is the EMPTY list, not a one-element list holding a wildcard'
WHY='WAS symptom/md-list-output-wildcard-undefined.

Before: `{"sides":[undefined]}` - a length-1 array in JS/TS where it should be
length 0, and in Python a NameError at import time, because `undefined` is not a
Python name. showFeels took its array branch and mapped showFeel over the single
FAnything, and showFeel renders FAnything as the literal string "undefined".

Now: `{"sides":[]}`. showFeels filters FAnything out of a collection cell before
wrapping, so a wholly-wildcard cell yields the empty array.

This case and policy/md-list-output-array share the same code path and are
deliberately separate fixtures: one has a wildcard row and one does not. Folding
them together would put a defect inside a policy recording, where the correct
fix would look like a regression. Keep them apart.'
SOURCE='src/DMN/Translate/FEELhelpers.hs showFeels members filter'
ARGS='--to=ts input.md'
