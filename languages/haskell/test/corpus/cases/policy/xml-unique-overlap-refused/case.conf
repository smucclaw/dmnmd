TITLE='the XML reader refuses two overlapping rules of a Unique table, as the markdown reader does'
WHY='D-22 rule 2 lives in tableErrors, which the XML reader calls directly, so it reaches --from=xml with no extra wiring, as D-13 does. The decision table has no hitPolicy attribute, which the XSD and ParseDMN both default to UNIQUE. Its two rules, `<= 20` and `>= 10`, are not identical, so D-13 is silent, but both match every age from 10 to 20. The refusal names the rules by their 1-based position, which is how the XML reader numbers rows, and the column by its inputExpression text, age, rather than its label.'
SOURCE='src/DMN/XML/XmlToDmnmd.hs convTable, which calls tableErrors; src/DMN/Regions.hs conflictErrors; DECISIONS.md D-22'
ARGS='-f xml --to=ts input.dmn'
