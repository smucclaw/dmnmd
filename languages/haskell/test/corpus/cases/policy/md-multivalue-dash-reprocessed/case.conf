TITLE='a multi-value cell `4, -` is re-made at the column type element-wise, wildcard intact'
WHY='Not D-2: inference typed this column Number and was right to (FAnything contributes no evidence and is dropped). The bug was in reprocessRows, which guarded on EVERY cell of the multi-value list still being an unconverted VS and so left "4" a STRING inside a NUMBER column. The guard could not simply be relaxed: the rebuild was a list COMPREHENSION over `FNullary (VS x) <- cells`, i.e. a filter, so without the guard it would have silently DELETED the FAnything and turned `4, -` into a one-alternative cell. Guard and rebuild had to change together, and the rebuild is now an element-wise map. Also covers the far likelier trailing-comma typo `4,`. RE-FIXTURED under D-22 part 2. `4, -` matches every Guest Count, so in the old table row 1 overlapped row 2 at 8, which D-22 refuses; that table is now `policy/hp-unique-overlap-multivalue-dash-refused`. A Season column now keeps the two rules apart, and the Guest Count column is unchanged.'
SOURCE='src/DMN/DecisionTable.hs reprocessRows, the element-wise rebuild'
ARGS='--to=ts input.md'
