TITLE='R3: a FEEL construct in a collection cell is refused per fragment, rather than accepted as junk members'
WHY='mkFsEither splits a cell on commas before anything looks at what the cell
MEANS, so the single FEEL negation not(RED, BLUE) arrives already shredded into
"not(RED" and "BLUE)". Both are well-formed FNullary (VS _) as far as the cell
layer is concerned.

In a scalar column that shredding is a known defect recorded as
symptom/xml-comma-split-negation. In a COLLECTION column it is worse, because
membership makes those fragments look like ordinary domain members: the table
would compile, exit 0, and test the collection for containing the literal
five-character string "BLUE)".

So a collection cell whose text contains ( ) [ or ] is refused. That covers
not(...), list contains(?, "RED"), count(?)>0 and the FEEL list literal
["a","b"] - every construct that could otherwise be mistaken for a member.
Both fragments are named, so the author sees the whole cell, not half of it.

This is what stops the XML lift of isCollection from quietly accepting DMN
input that dmnmd does not actually implement.'
SOURCE='src/DMN/DecisionTable.hs structuralErrors junkMsg; src/DMN/DecisionTable.hs:133 mkFsEither comma split'
ARGS='--to=ts input.md'
