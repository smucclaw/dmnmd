TITLE='`[1..5)` excludes its upper bound, all the way through to the emitted guard'
WHY='The case that required the IR change. S-FEEL gives NINE surface spellings for FOUR interval semantics (DMN 1.3 §9.2 rules 6-10: left bracket one of "[ ( ]", right one of "] ) [", freely combined, because ]a..b[ is the ISO 31-11 synonym for (a..b)). `FInRange Float Float` could express exactly one of the four, so this was a hard crash. It now emits `1.0 <= Score && Score < 5.0` -- note the strict `<` on the upper bound. fEval honours the flags too, which means a declared domain of `(0..150)` excludes its endpoints for free, since domainErrors decides membership with the same function.'
SOURCE='src/DMN/Types.hs Bound; src/DMN/ParseCell.hs interval; src/DMN/DecisionTable.hs fEval'
ARGS='--to=ts input.md'
