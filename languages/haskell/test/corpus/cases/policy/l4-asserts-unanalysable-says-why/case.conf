TITLE='a table whose regions cannot be computed gets one comment saying why and no assertions, and its neighbour is still asserted'
WHY='DMN.Regions.regionMap declines a collection input column, because a cell there tests membership and a region would have to describe sets of collections.
emitAsserts does not fall back to a sample for such a table, since a sample of regions dmnmd cannot describe would be a guess.
It writes one comment line with the reason regionMap gave, so the omission is visible in the file, and asserts the other table as usual.
The file is emitted at exit 0: a table with no assertions is not an error.'
SOURCE='src/DMN/Translate/L4.hs assertLines; src/DMN/Regions.hs UnsupportedKind CollectionColumn'
ARGS='--to=l4 --asserts input.md'
