TITLE='a numeric multi-value cell `4111, 4112` is two alternatives, and must stay two'
WHY='DMN 1.3 §9.2 rule 11 makes a comma an OR between unary tests, and this is the NUMERIC control for that rule — policy/md-multivalue-cell covers only strings, and the numeric case otherwise exists solely inside test/golden/miles-card-dmn.md, which the corpus does not run. This case exists to be the thing a thousands-separator guard must NOT break: any rule that treats `1,000` as a mis-typed 1000 has to leave `4111, 4112` alone, and without this recording that regression is silent.'
