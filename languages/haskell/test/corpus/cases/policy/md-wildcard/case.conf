TITLE='the wildcard cell forms - and _ and empty are parsed as FAnything'
WHY='All three wildcard spellings, in one table. Row 3 covers - and _; row 2
covers the EMPTY cell, which the TITLE always claimed and the fixture did not
actually contain until an audit noticed. That arm matters more than the other two:
the empty string is not a valid S-FEEL unary test at all, so it is precisely what a
grammar rewrite is liable to drop, and ParseTable.hs makes the asymmetry deliberate
- in the data section a blank cell means anything, but in a subhead row it means
nothing. The blank cells elsewhere in the corpus are all blank ROW NUMBERS, a
different code path, so this was the only place the data-cell arm could be pinned.
The empty row sits BEFORE the catch-all on purpose: after it, its arm would be dead
code and the case would be freezing unreachable output.'
SOURCE='src/DMN/DecisionTable.hs mkFEither, the FAnything arms'
ARGS='--to=ts input.md'
