TITLE='a column header marked both (in) and (out) is refused, naming the column and both labels'
WHY='parseColHeader accepts a (in), (out) or (comment) label on either side of the type declaration. It used to combine the two with mylabel_postA <|> mylabel_postB, so the first one written won and the other was discarded with no diagnostic: Dish (in) (out) was an input and Dish (out) (in) an output, though the author wrote both words. The table here was not rescued by reviseInOut, which relabels the rightmost column only when every column is an input, because Price is an output; so the function took Dish as an argument and the rules tested Dish against Stew and Soup, at exit 0. Now parseColHeaderL returns every label written on the header and labelClash refuses a column whose labels name more than one of input, output and comment: exit 1, nothing emitted, one error that names the table, the column and both labels. Two labels that agree are not a clash, and policy/md-header-agreeing-labels-accepted pins that. policy/struct-label-pre-post-clash-refused is the sibling in which a prefix label and a post label disagree.'
SOURCE='src/DMN/ParseTable.hs parseColHeaderL, labelClash; audit 10 finding f7; chosen in the branch fix/audit10-parser-silent-drops (assumed, not ruled)'
ARGS='--to=ts input.md'
