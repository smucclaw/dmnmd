TITLE='a domain with a wildcard member is refused, because it would silently disable the domain check'
WHY='Note the trailing comma after Grocery. That is the entire input difference,
and before this fix it bought silent acceptance:

  Dining, Grocery     TOTALLY BOGUS   exit 1, refused
  Dining, Grocery,    TOTALLY BOGUS   exit 0, ACCEPTED
  Dining,, Grocery    TOTALLY BOGUS   exit 0, ACCEPTED

mkFsEither splits the sub-header cell on commas, a trailing or doubled comma
yields a fragment that is the empty string, and mkFEither _ "" = Right FAnything
turns that into a wildcard MEMBER of the domain. domainErrors decides membership
with fEval, and fEval FAnything _ = True, so every cell in the column passed and
the column stopped being checked at all.

That is the exact failure class E4 was built to remove - accepting input and
quietly giving a different answer - reintroduced by E4 itself, through one
character, with nothing reported. It was found by an adversarial reviewer
attacking a LATER design, not by any of the E4 cases.

Refusing is right rather than dropping the wildcard and checking the remaining
members, because we cannot distinguish a typo from a deliberate "anything goes",
and the two want opposite treatment. Making the author say which costs them one
character; guessing costs them a silent wrong answer.

The message names the likely cause rather than only the symptom, because "the
declared domain has a wildcard member" is not something an author would connect
to a comma on their own.

WHAT MUST NOT REGRESS ALONGSIDE: a sub-header cell of ONLY `-` still means NO
declared domain, and must stay accepted. parseTable turns a wholly-FAnything
sub-header cell into enums = Nothing before domainErrors ever sees it, which is
why the guard here is length > 1. policy/enum-domain-test-not-checked covers the
neighbouring rule, that a `-` in a DATA row is exempt.'
SOURCE='src/DMN/DecisionTable.hs domainErrors/emptyMemberMsg; found by the adversarial review of the L4 sum-type design'
ARGS='--to=ts input.md'
