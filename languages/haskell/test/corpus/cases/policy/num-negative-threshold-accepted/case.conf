TITLE='`>= -5` is a comparison against a negative number'
WHY='The first negative threshold expressible anywhere in dmnmd. It used to crash, because the `intersect "+-*/"` heuristic sat AHEAD of every comparison arm and captured the minus sign, routing the cell to the arithmetic parser. That heuristic can never work: DMN 1.3 §9.2 rule 27 puts `. / - . + *` inside legal FEEL names, so a character-set test cannot separate arithmetic from an endpoint or an identifier. Rule 31 makes the sign part of the literal, which is where it now lives.'
SOURCE='src/DMN/ParseCell.hs numericLiteral, the optional leading "-"'
ARGS='--to=ts input.md'
