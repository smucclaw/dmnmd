TITLE='an input column named like one of its own domain members is renamed, because otherwise the guard becomes a tautology that l4 cannot see'
WHY='The input column is named Route and its declared domain CONTAINS Route. Emitted
naively that is:

  GIVEN Route IS A Route
  Categorize Route MEANS
    BRANCH
      IF Route EQUALS `Route` THEN JUST `PRVI`
      IF Route EQUALS `Grab`  THEN JUST `Amex`
      OTHERWISE NOTHING

The parameter SHADOWS the constructor, so `Route EQUALS `Route`` compares the
parameter with itself. It is a TAUTOLOGY and arm 1 fires for every input.
Measured on exactly that file:

  l4 check                       -> exit 0        <-- nothing is reported
  #EVAL Categorize `Grab`        -> JUST OF PRVI  <-- Amex is correct
  #ASSERT ... EQUALS JUST `Amex` -> assertion failed

With the rename (this recording):

  l4 check                       -> exit 0
  #ASSERT ... EQUALS JUST `Amex` -> assertion satisfied

THE DESIGN DOCUMENT SAID L4 WOULD CATCH THIS WHEN THE TYPES DIFFER. It does not:
NUMBER, STRING and an unrelated sum type all typecheck clean and give the wrong
answer, because after capture both operands are the SAME VARIABLE and there is
nothing left to disagree about. l4 objects only when a captured name lands in a
type-forced output slot, which is not what a guard is. So there is no typechecker
backstop here at all - this rename is the whole defence.

Three details that are each a bug if got wrong:

  - the PARAMETER is renamed, never the constructor. A domain member is the
    authors word and appears in their source; a parameter is a binder dmnmd
    invented from the column name.
  - the comparison is on the RAW name, not the emitted token. Backticks in l4 are
    purely LEXICAL, so bare Route and `Route` are the same identifier; comparing
    emitted tokens would miss precisely the collisions that matter.
  - the suffix loops. A domain member literally named Route_ re-creates the
    capture and Route__ defeats two underscores. Members are the authors words
    and can be anything.'
SOURCE='src/DMN/Translate/L4.hs renameParams; BUILD-SPEC-dmnmd-l4-sumtype.md sectionA.4 and its MEASURED block'
ARGS='--to=l4 input.md'
