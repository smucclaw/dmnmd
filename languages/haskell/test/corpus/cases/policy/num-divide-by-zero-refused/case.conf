TITLE='dividing by zero is refused, naming the expression, instead of answering Infinity'
WHY='A decimal has no infinity, so there is no value to return and the evaluation says
so. This is a BEHAVIOUR CHANGE introduced with DECISIONS.md D-1 and it is
deliberate: while VN was a Float, 10 / 0 evaluated to Infinity, at exit 0, and
every backend printed it -- a valid JavaScript literal, a Python NameError, and
in --to=l4 a plain, innocent-looking 0, because showNumL4 caught isInfinite and
returned "0". A payout formula that divides by a zero-valued input answered
"infinity" or "nothing" depending only on which backend you asked. Accepting the
input and quietly giving a different answer is the failure mode CLAUDE.md calls
strictly worse than rejecting it. The message names the offending expression
(-- in Amount / Divisor) because a table may have several. RECORDED BECAUSE
NOTHING ELSE COVERS IT: before this case, FNDiv was exercised by zero corpus
cases and zero hspec examples. The only division anywhere in the tree is
test/golden/miles-card-dmn.md:53 (1.4 / 2.4), and that column infers as String,
so the cell is quoted text and never reaches fNEval at all.'
SOURCE='src/DMN/Number.hs divideFeel; src/DMN/DecisionTable.hs fNEval'
ARGS='-q -t ts input.md'
STDIN_FILE='stdin'
