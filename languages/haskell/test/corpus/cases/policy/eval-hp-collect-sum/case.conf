TITLE='hit policy C+ sums the output column across every matching row'
WHY='Guests=3 matches all three rows, so Fee must be 5+10+20 = 35. The Collect
aggregations are the only place in evalTable that reaches *inside* a FEELexp to
pull out a number (`[ x | (FNullary (VN x)) <- ... ]`), so they are unusually
exposed to a change in how numeric cells are represented — a rewrite that
wrapped numbers one layer deeper would silently start summing nothing and
return 0.0 here.'
SOURCE='src/DMN/DecisionTable.hs evalTable, HP_Collect Collect_Sum arm'
ARGS='-q -t ts input.md'
STDIN_FILE='stdin'
