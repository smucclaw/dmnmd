TITLE='a fractional exponent is refused rather than approximated through a binary float'
WHY='2 ** 0.5 is irrational, so it has no decimal value at all and dmnmd will not
invent one. This is the second BEHAVIOUR CHANGE from DECISIONS.md D-1 and the
one that forced a decision rather than a port: (**) needs a Floating instance and
Scientific has none, so the old fNEval arm did not compile and could not be made
to. Routing through Double and back would have reintroduced exactly the binary
rounding D-1 exists to remove, on the operator most able to make it large and
visible, so DMN.Number.powerFeel refuses instead. An INTEGRAL exponent is exact
and still works -- see the sibling case; a negative integral exponent goes
through divideFeel and inherits its 34-digit rounding. RECORDED BECAUSE NOTHING
ELSE COVERS IT: FNExp had zero corpus cases and zero hspec examples before this.'
SOURCE='src/DMN/Number.hs powerFeel; src/DMN/DecisionTable.hs fNEval'
ARGS='-q -t ts input.md'
STDIN_FILE='stdin'
