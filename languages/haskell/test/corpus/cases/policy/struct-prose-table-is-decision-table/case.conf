TITLE='a documentation table whose top-left cell happens to be a hit-policy letter is ingested as a decision table'
WHY='An unavoidable collision, not a defect, and recorded here so that a grammar
rewrite cannot quietly move the boundary.

CLAUDE.md documents the discriminator: a pipe table whose top-left cell is NOT a hit
policy is prose. The converse is this case. U A P F O R C are all single letters
that occur as ordinary column headers - U for unit, P for priority, C for count - so
any table starting that way is genuinely ambiguous, and no amount of parsing can
settle it from the table alone. The fixture is a plain SI units table to make that
concrete rather than contrived.

policy/md-prose-only-exits-zero pins the other side of the same boundary: a pipe
table whose top-left is not a hit-policy letter is skipped, with a note on stderr,
exit 0. Together the two cases fix the discriminator in both directions, which is
what makes a change to it visible. Widening or narrowing it is a language-surface
decision - BUILD-SPEC-dmnmd-extensions.md section 6 - and not something a cell-grammar
rewrite should do as a side effect.

The fixture deliberately has THREE columns. It used to have two, which left exactly
one non-hit-policy column and so tripped the separate defect recorded in
symptom/struct-onecol-no-output: the table got no output column and emitted
"return {}". Fixing that defect would have turned this case red for an unrelated
reason. With three columns the rightmost becomes the output and this case depends on
nothing but the discriminator.'
SOURCE='app/ParseMarkdown.hs isDecisionTable; src/DMN/ParseTable.hs mkHitPolicy_; CLAUDE.md "Diagnostics and exit status"'
ARGS='--to=ts input.md'
