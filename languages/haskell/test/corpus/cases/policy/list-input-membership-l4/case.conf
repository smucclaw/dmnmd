TITLE='a plain cell in a collection INPUT column means MEMBERSHIP, emitted as a self-contained L4 helper call'
WHY='WAS symptom/md-list-column-cells-are-scalars, the case that recorded tier 2
being blocked. It is now the case that pins tier 2 working.

Before: `5` in a `tags : [Number]` column emitted `IF tags EQUALS 5` under
`GIVEN tags IS A LIST OF NUMBER` - comparing a list to a number, which l4 check
rejected with exit 1.

Now: `IF `dmnmd list contains` tags 5`. l4 check succeeds and l4 run gives the
right answers.

THE RESULT IS A MAYBE (D-22 part 3, which names this case). DMN.Regions does
not analyse a collection column, so dmnmd cannot prove the table total, and
where it cannot, the L4 backend says NOTHING rather than risk a sentinel. Here
the table is in fact partial: a list holding neither 5 nor 7 matches no rule,
and so does EMPTY. The OTHERWISE was the typed sentinel "" under GIVETH A STRING;
it is now NOTHING under GIVETH A MAYBE STRING, with each arm in JUST. Measured
2026-09-29 with the l4 on PATH: l4 run satisfies Scores (LIST 5) EQUALS
JUST "pass", Scores (LIST 3) EQUALS NOTHING and Scores EMPTY EQUALS NOTHING.
The stderr warning is part 2 (collection-input U tables keep the overlap
warning) and did not move.

WHY A SELF-CONTAINED HELPER AND NOT `IMPORT prelude`. l4 prelude DOES define
elem, at jl4-core/libraries/prelude.l4:448, with exactly the signature this
needs. Two reasons not to use it:

  * an IMPORT brings ~100 prelude names into scope, and every one of them can
    collide with a column or table name taken from the author markdown. A
    collision is a hard l4 check error pointing at generated code.
  * an IMPORT that fails to resolve breaks the WHOLE emitted file, not one
    guard. Library resolution is a six-tier cascade and the tiers that are
    present depend on how the l4 binary was built.

Nine lines of CONSIDER/WHEN cost nothing and cannot break. Argument order is
FEEL (list contains(list, element)), not prelude elem reversed order, so a DMN
reader reads the guard forwards.

The helper is emitted only when some table actually has a collection input
column, so ordinary output is unchanged.

DO NOT re-add IMPORT prelude here as a simplification.'
SOURCE='src/DMN/Translate/L4.hs containsHelper, containsHelperFor, feel2l4In; noRuleMayMatch for the MAYBE'
ARGS='--to=l4 input.md'
