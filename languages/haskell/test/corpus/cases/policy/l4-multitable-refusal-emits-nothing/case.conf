TITLE='a multi-table file whose second table is refused emits nothing at all, and names the table it refused'
WHY='Table Good would emit fine; table Bad has hit policy C+, which the L4 backend
refuses. Nothing reaches stdout, the exit is 1, and stderr names Bad.

This was symptom/l4-multitable-refusal-partial-output until toL4File landed. Under
the old per-table emission Good was written to the handle before Bad was even
looked at, so a refused run left a half-written file behind alongside an exit 1
that a shell script may not check. policy/l4-refuses-outputorder promises the
opposite in so many words, and that promise held only because every L4 refusal
case was single-table.

The fix is structural rather than a flush: toL4File asks l4Refusal about EVERY
table before rendering ANY of them, and returns an empty string plus diagnostics
if any table is refused. There is no point at which a partial file exists.

Read this together with policy/l4-multitable-refusal-emits-nothing-large, which is
the same shape at 45 rows instead of 1. THIS case cannot on its own tell "emitted
nothing" from "emitted less than one 2048-char buffer chunk and died before
flushing" - during development it went quiet for a while by exactly that accident,
while every table over ~30 rows still leaked. The large case is what actually
holds the promise down. Do not delete it as redundant; it is the control that
makes this one mean something.

The stderr shape changed deliberately. It was a Haskell CallStack naming
src/DMN/Translate/L4.hs:53 - an internal source position rather than anything
about the users document - and it did not say which table was refused. It now
reads like every other refusal in the tool, error: table "Bad": <why>, followed by
an explicit statement of the emit-nothing rule.

Originally found by an adversarial reviewer attacking the sum-type design, not by
the corpus.'
SOURCE='src/DMN/Translate/L4.hs toL4File / l4Refusal; app/Main.hs outputToAll; BUILD-SPEC-dmnmd-l4-sumtype.md sectionA.6'
ARGS='--to=l4 input.md'
