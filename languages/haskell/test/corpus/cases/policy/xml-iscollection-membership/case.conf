TITLE='DMN isCollection="true" becomes a real collection type, through a derivation chain, and its cells mean membership'
WHY='TIER 2 ITSELF. This is the case the whole piece of work exists to make
possible, and it is the one that used to be a blanket refusal.

The fixture declares a collection DERIVED FROM A NAMED BASE, not straight from a
FEEL built-in:

  tRole   isCollection="false"  typeRef string
  tRoles  isCollection="true"   typeRef tRole

so it covers composition as well as the flag: resolveTypeRef follows
tRoles -> tRole -> string and only THEN wraps the result in DMN_List. Wrapping
after the recursive resolve is what makes that free; wrapping before would only
have handled collections of built-ins.

The emitted TypeScript is `roles : string[]` guarded by `roles.includes("admin")`,
and the multi-value rule by
`(roles.includes("clerk") || roles.includes("teller"))` - the comma still means
OR, at the element level.

ALSO PINS THE isStringy TRAP. mkCells decides whether to run the FEEL
string-literal parser, and its test used to be `ty == Nothing || ty == Just
DMN_String`. A [String] column fails that, so it would have fallen through to
the mkFsEither comma-split path and reinstated symptom/xml-comma-split-negation
for exactly the type this work adds - a fresh silent shred introduced by the fix
that was meant to help. The test now asks about the ELEMENT type. If that
regresses, the quoted cells here stop being unquoted and this recording moves.

A cell that is NOT a plain member is still refused, per rule id, by
structuralErrors R3. That is the honest replacement for the blanket refusal that
policy/xml-itemdefinition-warns used to carry.'
SOURCE='src/DMN/XML/XmlToDmnmd.hs isCollectionOf + resolveTypeRef; mkCells isStringy'
ARGS='--from=xml --to=ts input.dmn'
