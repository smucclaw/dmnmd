TITLE='--to=xml writes a DMN 1.3 document: namespace, typeRefs, hit policy, one <decision> per table, and the DRG wiring'
WHY='This was symptom/cli-to-xml-unimplemented, which recorded dmnmd advertising a capability it did not have: optparse accepted xml, the whole input was read, and the outputTo fallthrough then died with an unlocated error. DECISIONS.md D-8 ruled to build the writer; it was gated on D-1, because you cannot write a faithful DMN document out of a Float.

This is the shape of the output and every part of it is load-bearing:

- xmlns="https://www.omg.org/spec/DMN/20191111/MODEL/". hxt does NOT emit a namespace declaration in the pickling direction (xpElemNS builds a universal name and the writer serialises the qualified one), so this attribute is added to the root after pickleDoc. Without it dmnmd cannot read its own output.
- typeRef="number" on both the inputExpression and the output, from dmnmd type inference - the column is undeclared in the markdown.
- hitPolicy is ABSENT because U is the XSD default and xpDefault suppresses it. That is correct DMN; a document without hitPolicy means UNIQUE.
- The column name appears in <inputExpression><text> AND on @label for an input, and on both @name and @label for an output. XmlToDmnmd reads inputs from the <text> first and outputs from @label first, so a document where those disagree renames a column depending on who reads it.
- <inputData> plus <informationRequirement> are the DRG. dmnmd parses them and ignores them (D-6), so no round trip can check them; they are written because they are true (an input column IS the statement that this decision reads that input) and because they are what makes the file usable in Camunda or Trisotech.
- <text>&lt; 18</text>. hxt SX.xshow does not escape, and the first whole-file output of test/golden/miles-card-dmn.md was not well-formed XML because of it.

Verified beyond this recording, at the commit that promoted it: xmllint --noout --schema xsd/DMN13.xsd validates this document, and the round-trip harness (114 pass / 0 fail / 6 xfail over 120 eligible fixtures) shows md --to=xml | --from=xml --to=ts is byte-identical to md --to=ts.'
SOURCE='src/DMN/Translate/XML.hs; app/Main.hs renderAll; DECISIONS.md D-8; issue #13, filed 2023-04-11'
ARGS='--to=xml input.md'
