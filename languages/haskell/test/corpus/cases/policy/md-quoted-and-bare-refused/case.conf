TITLE='an undeclared column mixing the string "2020" with the number 2021, and one mixing "yes" with no, is refused'
WHY='A column has one type, so a table that mixes a string literal with a bare numeral, or a quoted boolean word with a bare one, in one undeclared column is not describing one. D-2 refuses a column whose cells disagree (VConflict), and it can only do that if it sees the quotes. Pass 1 used to unquote "2020" and "yes" first, so they were graded exactly like 2020 and yes, the columns typed quietly as Number and Boolean, and the authors strings were rewritten as the number 2020.0 and the boolean true at exit 0. The cells of a column that cannot be settled keep their quotes, because tableErrors asks columnVerdict the same question of the built cells. It is exit 1 with nothing emitted and a D-2 error naming both cells, as the XML reader has done since policy/xml-untyped-quoted-and-bare-refused. Both an input column and an output column are here because they reached pass 1 through different wrappers.'
SOURCE='src/DMN/DecisionTable.hs mkDataFsAt, inferenceErrors; src/DMN/ParseTable.hs mkFEELCol'
ARGS='--to=ts input.md'
