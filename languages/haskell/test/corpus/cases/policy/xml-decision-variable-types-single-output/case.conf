TITLE='a single-output column takes its type from the decision'"'"'s <variable typeRef>, not from inference'
WHY='DMN reserves an <output> clause'"'"'s name and typeRef for a table with MORE than one output; a single-output table states its result type on the enclosing <decision>'"'"'s own <variable>. The XSD cannot express that -- tOutputClause declares both attributes unconditionally -- so such a document validates either way and only the reader can get it wrong, silently, at exit 0. dmnmd used to get it wrong: the <variable> was an xpIgnoredElemOpt beside <question> and <allowedAnswers>, so the declared type was parsed and thrown away and the column was inferred instead. Here the two cells discriminate. Honour the variable and the column is a string, so the outputs are the TEXT "1" and "2"; ignore it and inference sees two bare numerals, calls the column Number, and the outputs become the NUMBERS 1.0 and 2.0. Both spellings exit 0, so nothing but this comparison catches the difference. What is pinned: the ts output returns "1" and "2" quoted. If they come back as 1.0 and 2.0 the reader has gone back to ignoring the declaration. This is not a hypothetical shape: the l4-ide DMN exporter omits typeRef from every one of its output clauses deliberately -- measured at 0 of 271, against 429 of 429 input expressions -- and cites KIE'"'"'s ILLEGAL_USE_OF_TYPEREF as the reason.'
SOURCE='src/DMN/XML/ParseDMN.hs Decision/decVariable and its DmnPU instance; src/DMN/XML/XmlToDmnmd.hs convdec decVarType, convTable outFallback, convOutputCol fallbackTypeRef'
ARGS='-f xml --to=ts input.dmn'
