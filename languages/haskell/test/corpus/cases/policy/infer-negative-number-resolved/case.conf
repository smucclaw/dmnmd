TITLE='a negative number is numeric evidence, so -5 and 20 resolve the column to Number'
WHY='Fixed by anchoring, not by refusing. The old recogniser was the hand-rolled `^\d+(\.\d+)?$` of `anchoredDigits`, which has no sign and no leading-dot alternative, so `-5` inferred String while `20` inferred Number and the column was left untyped: `Temp === "-5"` at exit 0, matching nothing a caller could pass. Inference now asks DMN.ParseCell.parseNumberCell -- the same oracle the DECLARED path already used and which always accepted -5 and .5 -- so the two agree by construction and cannot drift, which is the pattern domainErrors already follows with fEval. Note `1e3` is NOT covered and must stay String: rule 31 admits no exponent, and the existing refusal message says so.'
SOURCE='src/DMN/DecisionTable.hs inferEvidence, the parseNumberCell oracle; DECISIONS.md D-2'
ARGS='--to=ts input.md'
