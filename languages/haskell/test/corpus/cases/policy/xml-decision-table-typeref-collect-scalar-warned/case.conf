TITLE='a scalar <decisionTable typeRef> on a COLLECT table is not applied to the column, and is warned about'
WHY='The negative control for xml-decision-table-typeref-collect-is-list, and the table-level twin of policy/xml-collect-variable-scalar-warned. Under a list-valued hit policy the decision result is a list, so a typeRef naming a single value (number, here) contradicts the hit policy and cannot be the result type. dmnmd does not apply it to the output column -- the cells are the strings "gold" and "silver", and number would refuse them -- and does not drop it in silence either, because anything parsed but not honoured must be a loud, located diagnostic: the warning names the <decisionTable> and says how to type the column (a collection type). It used to be ignored with no diagnostic at all, because the attribute was not read. What is pinned: the cells come out as "gold" and "silver", exit 0, and stderr carries the warning.'
SOURCE='src/DMN/XML/XmlToDmnmd.hs resolveElementType (the TypeSource it is told); audit 2026-09-26 finding f3'
ARGS='-f xml --to=ts input.dmn'
