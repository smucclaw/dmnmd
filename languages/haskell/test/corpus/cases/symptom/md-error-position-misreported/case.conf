TITLE='a missing final newline is reported at the wrong line — three lines earlier, in a table that is fine'
WHY='The last byte of input.md is a pipe with no newline after it (deliberately; do not "fix" it). grepMarkdown fails, but `try` backtracks the failed table and the error resurfaces from the fallback parser some lines earlier, so the reported position 9:1 points at the header row of table B, which is well formed. The real defect is at EOF. CLAUDE.md records this: "Check for a final newline before trusting a grepMarkdown position." Add a newline to input.md and both tables import cleanly.'
SOURCE='app/ParseMarkdown.hs grepMarkdown, the try/backtrack; audit reproduction X-error-position; CLAUDE.md "Known-broken, do not be surprised"'
ARGS='--to=ts input.md'
