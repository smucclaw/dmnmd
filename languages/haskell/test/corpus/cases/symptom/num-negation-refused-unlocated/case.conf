TITLE='`not([1..5])` is refused -- dmnmd has no IR for negation'
WHY='The worst defect in the cluster and the one this refusal replaces: the old interval recogniser was an UNANCHORED PCRE search, so it matched `[1..5]` INSIDE `not([1..5])` and threw the negation away, compiling the cell to its own exact logical complement at exit 0. The message says so explicitly, so anyone who hits it learns what their old output meant. The VERDICT is now correct and the message names the construct, cites the rule and prints the repair. What is still wrong is the LOCATION: the refusal arrives through mkFs/mkF`s `either error id` and so names a source position in dmnmd rather than the table, column and row in the user`s file. CLAUDE.md`s bar is "loud AND located", and in this repo that is not a slogan -- every policy/ refusal recording is located and all the unlocated mkFs/mkF refusals are filed here. Promotes when the CellSite plumbing lands.'
SOURCE='src/DMN/ParseCell.hs peelNot, negationMsg'
ARGS='--to=ts input.md'
