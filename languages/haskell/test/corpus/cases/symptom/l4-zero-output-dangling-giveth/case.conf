TITLE='a table with zero output columns emits GIVETH A <Name> with no DECLARE, and real l4 check rejects it'
WHY='A table with zero output columns emits GIVETH A OneCol and never DECLAREs OneCol, so the emitted L4 does not typecheck. In toL4, baseGiveth is a case on outs whose second arm returns recName, and that catch-all arm swallows the outs == [] case along with the genuine multi-output case; but the DECLARE record and the mk<Name> constructor are gated on multiOut = length outs > 1, which is False when there are zero outputs. The result is a GIVETH naming a record type that is never declared. Real l4 check refuses it with three errors: I could not find a definition for the identifier OneCol which I have inferred to be of type TYPE, then an internal I have encountered a resolved name that has no additional information stored for it, then a signature mismatch saying the definition is here of type STRING; l4 check exits 1. A one-column table is one way to reach outs == [] but NOT the only one: a table with one input column plus only (comment) columns reaches it too, because reviseInOut counts only non-comment columns and its guard is length noncomments > 1. The defect would therefore survive a fix to reviseInOut - it lives in baseGiveth, which needs an outs == [] arm of its own. Compare symptom/struct-onecol-no-output, which records the reviseInOut cause through --to=ts; this records the L4 consequence, which is the one an external typechecker rejects.'
SOURCE='src/DMN/Translate/L4.hs baseGiveth / multiOut / recordDecls in toL4; src/DMN/ParseTable.hs reviseInOut'
ARGS='--to=l4 input.md'
