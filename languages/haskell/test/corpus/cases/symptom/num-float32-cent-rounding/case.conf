TITLE='1234567.89 emits as 1234567.9 -- binary32 cannot hold seven digits and two cents'
WHY='WHAT IT DOES: the output cell reads 1234567.89 and the emitted TypeScript returns 1234567.9, at exit 0 with nothing on stderr. WHY THAT IS WRONG: the same root cause as num-float32-integer-identity-lost, in the form that matters most to the money this tool is aimed at. VN is Float, binary32, roughly seven significant decimal digits; 1234567.89 needs nine, so the cent field is rounded away at parse time and every backend inherits the rounded value rather than the one in the source table. A payout table quietly pays a cent more than it says and reports nothing. WHAT THE FIX LOOKS LIKE: DECISIONS.md D-1 rules that VN becomes Scientific -- FEEL decimal128 rather than a wider binary float -- so this recording should change to return 1234567.89 exactly, still at exit 0 and still with an empty stderr. A diff that merely moved the rounding to a different digit would be a different bug, not the fix. The guard column is a String on purpose so the only number in the whole recording is the one under test; a Number guard added a stray comparison against 1.0. Both columns are explicitly typed so the case does not also depend on inference.'
SOURCE='src/DMN/Types.hs, the VN Float constructor; DECISIONS.md D-1, which requires this recording to exist before the change'
ARGS='--to=ts input.md'
