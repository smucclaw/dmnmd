TITLE='the -o destination is opened for writing before the input is read, so a run that reads nothing still truncates the output file'
WHY='main calls myOutHandle (out opts) BEFORE parseTables. openFile ... WriteMode truncates. So dmnmd destroys the contents of the -o file before it knows whether it can read the input, whether the tables parse, or whether it can even write the requested format.

This case makes the ordering visible on stderr alone, with no file side effect: give it an output destination that cannot be opened (a directory) AND an input file that does not exist. If the input were read first the message would name nosuch.md. It names the directory instead, which can only happen if the destination is opened first.

The consequence the recording cannot show, but which is the reason this matters, was checked directly: with a good previous run.ts on disk and an input containing one unparseable table, dmnmd --to=ts -o run.ts bad.md exits 1, prints the parse error, and leaves run.ts at ZERO BYTES. Main.hs prints, in that very failure, that it is refusing to emit the tables that could be read because partial output is indistinguishable from complete output - and then the -o file is already empty with a fresh mtime, which under make reads as up to date. The guarantee CLAUDE.md states is defeated for every -o user.

The fix is to write to a temporary file, or to a lazily-opened handle, and only put it in place once the whole run has succeeded. Note this case creates no file in the case directory, deliberately - the destination is `.`, which cannot be opened.'
SOURCE='app/Main.hs main: myouthandle <- myOutHandle (out opts) precedes mydtables <- parseTables opts; myOutHandle uses openFile h WriteMode. CLAUDE.md, Diagnostics and exit status: partial output is indistinguishable from complete output'
ARGS='--to=ts -o . nosuch.md'
