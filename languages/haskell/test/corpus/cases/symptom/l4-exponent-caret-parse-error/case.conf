TITLE='an exponent in an output cell is emitted as ^, which is not an L4 operator and does not parse'
WHY='fnOp2l4 renders FNExp as a caret.
In L4 a caret is the ditto marker, so (x ^ 2) is a parse error: l4 check reports unexpected ^ and exits 1.
It fails loudly, not silently, but the emitter writes a file that cannot be used.
Found by running the --to=l4 --asserts cross-check over every fixture: policy/num-integral-exponent-exact and policy/num-fractional-exponent-refused fail l4 check for this reason, and do so without --asserts too.
dmnmd evaluates the exponent itself (powerFeel, exact at an integral exponent), so the interpreter is right and the L4 backend is the side that cannot say it.
What L4 offers instead is the built-in EXPONENT, a prefix function (EXPONENT base power), registered at jl4-core/src/L4/TypeCheck/Environment.hs line 54 and documented in doc/courses/foundation/module-5-functions.md line 128 on unstable at dddb05d9e.
Checked against the installed l4 on 2026-10-13: the prefix form (EXPONENT x 2) passes l4 check and gives 9 at 3, 4 at -2, 6.25 at 2.5 and exactly 100000000000000000000 for EXPONENT 10 20.
The INFIX form with a variable base, (x EXPONENT 2), is rejected ("you are giving 2 inputs to x"), so only the prefix form is safe for generated code.
So the fix for the parse failure is to render FNExp as (EXPONENT x 2).
It is not done here because a fractional power is a separate question: EXPONENT 2 0.5 evaluates to 1.4142135623730951 but is not equal to that literal, so it is inexact, the same exact-versus-decimal128 question as the quotient in symptom/l4-asserts-quotient-rounded-vs-exact, and dmnmd itself refuses a fractional exponent (powerFeel).
Settle both together; this records the symptom and nothing more.'
SOURCE='src/DMN/Translate/L4.hs fnOp2l4'
ARGS='--to=l4 input.md'
