TITLE='an exponent in an output cell is emitted as ^, which is not an L4 operator and does not parse'
WHY='fnOp2l4 renders FNExp as a caret.
In L4 a caret is the ditto marker, so (x ^ 2) is a parse error: l4 check reports unexpected ^ and exits 1.
It fails loudly, not silently, but the emitter writes a file that cannot be used.
Found by running the --to=l4 --asserts cross-check over every fixture: policy/num-integral-exponent-exact and policy/num-fractional-exponent-refused fail l4 check for this reason, and do so without --asserts too.
dmnmd evaluates the exponent itself (powerFeel, exact at an integral exponent), so the interpreter is right and the L4 backend is the side that cannot say it.
What L4 offers instead is not known here, and refusing the table is a ruling, so this records the symptom and nothing more.'
SOURCE='src/DMN/Translate/L4.hs fnOp2l4'
ARGS='--to=l4 input.md'
