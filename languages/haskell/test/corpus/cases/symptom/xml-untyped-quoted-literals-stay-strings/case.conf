TITLE='an untyped XML column of FEEL string literals "2020" and "yes" is inferred Number and Boolean, so the strings come back as 2020.0 and true'
WHY='In DMN XML a string is written with its quotes: "2020" is a string and 2020 is the number, and the quotes are the only thing that tells them apart. The input column has no typeRef (the XSD makes it optional) and neither the output clause nor the decision variable carries one (section 8.3.2 bars the clause), so dmnmd infers both types from their cells. It reads the cells without their quotes: XmlToDmnmd.resolveColumn builds its inference pre-pass with mkFsEither, and mkFsEither runs unquoteCell before any evidence is taken, so "2020" is graded exactly like 2020 and "yes" like the boolean word yes. The guard is emitted as year === 2020.0 where the document says year === "2020", and the output "yes" comes back as the boolean true, at exit 0 with no diagnostic. Two comments in the tree say the pre-pass keeps the quotes because they are the only thing that distinguishes a FEEL "2020" from 2020 (resolveColumn, and the VS arm of DecisionTable.inferEvidence, which has a quoted-string clause for exactly this); neither was true. Progress is a recording whose parameter is year : string, whose guards compare against "2020" and "2021", and whose outputs are the strings "yes" and "no".'
SOURCE='src/DMN/XML/XmlToDmnmd.hs resolveColumn firstPass; src/DMN/DecisionTable.hs mkFsEither (unquoteCell) and inferEvidence (the quoted-string clause); audit 2026-09-26 finding f4'
ARGS='-f xml --to=ts input.dmn'
