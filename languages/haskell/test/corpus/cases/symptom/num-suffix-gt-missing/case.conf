TITLE='suffix `5 >` has no arm at all and dies at the numeric fallthrough'
WHY='The chain handles `<=`, `<` and `>=` as suffixes but not `>`, so the cell falls through to the bare numeric reader. inferType classifies the cell as Number (its regex list includes ">"), so it is routed into the branch that then cannot handle it. The diagnostic names no table, no column and no row.'
SOURCE='src/DMN/DecisionTable.hs mkFEither: there is no `">" isSuffixOf` arm; audit lens "numeric cell parsing", finding 8'
ARGS='--to=ts input.md'
