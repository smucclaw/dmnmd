TITLE='-q with a --pick that matches nothing dies claiming the tables have different types'
WHY='With no table selected, `differentlyTyped []` is `length (nub []) /= 1`, which is `0 /= 1`, which is True, so the interactive evaluator reports `tables [] have different types; cant query. use --pick to choose one`. Every clause of that sentence is wrong: there are no tables rather than several, they cannot disagree about types, and --pick is what caused the problem rather than what would fix it. The empty list is not distinguished from the two-or-more list anywhere on this path. It also lands as an uncaught `user error` from `fail` in IO rather than as a diagnostic, so the message arrives wrapped in Haskell exception syntax. This is the -q sibling of cli-pick-no-match-silent-empty: the same mistake by the user gets silence in one mode and a false accusation in the other. The exit status of 1 happens to be defensible; the message is not.'
SOURCE='app/Main.hs lines 71 and 111-115 (differentlyTyped / getVarTypes)'
ARGS='-q -t ts --pick NoSuchTable input.md'
