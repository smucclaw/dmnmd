TITLE='an ordinary Markdown documentation table is ingested as a decision table whenever its top-left cell happens to be a hit-policy letter'
WHY='CLAUDE.md documents the boundary: a pipe table whose top-left cell is not a hit policy is prose. The single letters U A P F O R C are ordinary column headers in documentation tables, so a two-column table headed | A | B | parses as hit policy Any with input column B, named f1. This case sits exactly on the documented boundary; it is classified symptom because a real grammar should be able to tell a documentation table from a decision table by more than one character, but changing it is a language-surface decision, not a free one.'
SOURCE='app/ParseMarkdown.hs isDecisionTable; src/DMN/ParseTable.hs mkHitPolicy_; audit lens "table structure", finding 31 (second half)'
ARGS='--to=ts input.md'
