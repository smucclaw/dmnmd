TITLE='the L4 backend turns a Unique table into a first-match BRANCH with no diagnostic'
WHY='WHAT IT DOES: this table is marked U and its two rules overlap on [10..20]. The L4 backend emits the same first-match BRANCH it emits for F, so Age 15 answers 5 purely because that arm is written first. Exit 0, empty stderr, nothing anywhere in the output records that a hit policy was substituted. WHY THAT IS WRONG: DMN Unique means the rules are disjoint and at most one may match; if two match, the table is in error. First means take the topmost match. Those are different semantics, and the overlap here makes the substitution observable rather than academic. The interpreter in the same binary disagrees with the backend about this very file: under -q with input 15 it reports multiple rows returned -- this was supposed to be a unique table, which policy/md-eval-unique-conflict pins as correct and load-bearing. One half of dmnmd calls the table an authoring error while the other half quietly picks a winner. l4Refusal in src/DMN/Translate/L4.hs names only Collect, Aggregate, OutputOrder and RuleOrder, so U falls through the wildcard arm; this is a documented deferral that never got its gate. BUILD-SPEC-dmnmd-to-l4.md section 1.5 says U and Priority emit a first-match BRANCH and that evalTable conflict semantics are not re-encoded, and section 9 risk 4 prescribes the mitigation: document the limitation and gate unsupported policies with a clear error. Priority was later honoured properly, see policy/l4-priority-reorders-arms; the gate was built for the list-valued policies and never extended to U. So this stands in breach of the governing rule in CLAUDE.md that anything we parse but do not yet honour must produce a loud, located diagnostic. WHAT THE FIX LOOKS LIKE: either a located diagnostic naming the table and saying that Unique is being emitted as first-match, or an emission that actually encodes uniqueness. Silence at exit 0 is the one outcome that must not survive. Not covered by symptom/eval-hitpolicy-ignored-by-js, whose WHY says the L4 backend is the only one that refuses -- true of Collect, false of Unique. Note for whoever fixes this: several policy recordings under --to=l4 are U tables ending in an all-wildcard catch-all row, which overlaps every earlier rule by construction, so they currently bake first-match-for-U in as correct. Verified by reading their fixtures: md-backend-l4 row 3, l4-sumtype-emitted row 3, md-l4-ditto-wide-chars row 4, l4-keyword-column-names-quoted row 2. Expect them to go red, and read that as progress rather than damage. The OTHERWISE 0 sentinel and the caret in the second arm are incidental to this defect and are pinned by policy/l4-otherwise-sentinel-not-last-row and policy/md-l4-ditto-wide-chars.'
SOURCE='src/DMN/Translate/L4.hs l4Refusal, the wildcard arm that swallows HP_Unique, and the toL4 haddock stating that First/Unique/Priority map to a first-match BRANCH; contrast the HP_Unique arm of evalTable in src/DMN/DecisionTable.hs; BUILD-SPEC-dmnmd-to-l4.md sections 1.5 and 9 risk 4'
ARGS='--to=l4 input.md'
