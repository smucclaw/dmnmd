TITLE='the TypeScript half of the list-input defect: a [Number] column emits `number[]` and then compares it to a scalar'
WHY='Sibling of symptom/md-list-column-cells-are-scalars, which records only
--to=l4. Recorded separately because the two fail in OPPOSITE ways and only one
of them is loud.

  --to=l4   GIVEN tags IS A LIST OF NUMBER ... IF tags EQUALS 5   -> l4 check exit 1
  --to=ts   function Scores ( tags : number[] ) ... if (tags === 5.0)

The L4 is caught by l4 typechecker, so a user who runs l4 finds out. The
TypeScript is NOT: tsc would reject `number[] === number`, but dmnmd does not
compile what it emits, so what ships is a comparison that is never true. Every
row falls through and the function returns undefined.

Recording the quiet half explicitly, because a fix that only satisfies the L4
typechecker would leave this one standing and the corpus would not notice.

WHAT WOULD FIX IT: a list-typed column needs its cells to be list TESTS -
`5` should mean "tags contains 5", emitted as tags.includes(5.0). See
BUILD-SPEC-dmnmd-l4-sumtype.md B.3 tier 2.'
SOURCE='src/DMN/DecisionTable.hs:157 mkFEither delegating DMN_List to baseType; src/DMN/Translate/JS.hs type2js'
ARGS='--to=ts input.md'
