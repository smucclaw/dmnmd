TITLE='omitting --to entirely fails with an internal constructor name, Unsupported file type: Unknown, after the whole file has been read'
WHY='There is no default output format. With no --to and no -o, outformat stays Unknown (detectFormat over ["-"] finds no extension), and the run dies in the outputTo fallthrough reporting `Unsupported file type: Unknown`.

Unknown is a FileFormat constructor from app/Options.hs. The user did not type it, cannot type it, and it appears nowhere in --help. The message does list the four real formats, so it is recoverable, but it describes the situation wrongly: nothing was unsupported, the user simply did not say what they wanted. The right shape for a missing required argument is an optparse usage error before any work happens - which is exactly what the binary already does for a BAD --to value, so the machinery exists (see policy/cli-to-bogus-rejected-at-parse-time).

As it stands, plain `dmnmd table.md` - the most obvious thing anybody types first - opens and truncates any -o file, reads and parses the whole input, and then errors with an internal name. Fix by giving --to a sensible default or by making it required at the parser level.'
SOURCE='app/Options.hs FileFormat(Unknown) and detectOutformat, which cannot resolve the default out="-"; app/Main.hs outputTo fallthrough'
ARGS=input.md
