TITLE='--to=l4 drops the dash from a multi-value cell `4, -`, so the rule matches only 4 where the interpreter and --to=ts match every Guest Count'
WHY='The interpreter (fEvals is or . map fEval) reads a multi-value cell holding a dash as matching everything, and so does --to=ts, which renders it as (Guest_Count === 4.0 || (true||Guest_Count)): see policy/md-multivalue-dash-reprocessed. The L4 backend instead filters the dash out of the cell (feel2l4In and conjSubCells do filter (/= FAnything), and armCells counts only the non-dash members as present) and renders what is left, so row 1 reads Guest Count EQUALS 4 AND Season EQUALS Fall. A Fall party of 8 then gets NOTHING from the emitted L4, where dmnmd -q answers Spareribs. Found by the emitAsserts cross-check (D-21 step 2): the assertion for Guest Count 8, Fall failed under l4 run. Same table as policy/md-multivalue-dash-reprocessed.'
SOURCE='src/DMN/Translate/L4.hs feel2l4In, conjSubCells, armCells; found by the emitAsserts cross-check'
ARGS='--to=l4 input.md'
