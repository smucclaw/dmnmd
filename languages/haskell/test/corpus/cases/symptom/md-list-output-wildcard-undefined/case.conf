TITLE='a wildcard cell in a [T]-typed OUTPUT column emits a one-element array holding `undefined`'
WHY='A `-` in a list-typed output column should be the EMPTY list. Instead
showFeels takes its non-squash branch, maps showFeel over the single FAnything,
and showFeel renders FAnything as the literal string "undefined":

  return {"sides":[undefined]};

In JS/TS that is a length-1 array whose only element is undefined - so
`sides.length` is 1 when it should be 0, and any consumer that iterates gets one
bogus member. In Python it is worse: `undefined` is not a Python name, so the
module raises NameError at import time. MEASURED, both backends, exit 0.

The guard on the same row is separately odd - `else if ("default")` - but that
is a pre-existing wildcard-row artefact and not what this case is about.

WHAT WOULD FIX IT: showFeels should special-case a wholly-FAnything cell in a
list column to the empty array `[]` (and L4 to EMPTY). Note the fix must not
disturb policy/md-list-output-array, which pins the correct behaviour for real
values in the same code path.'
SOURCE='src/DMN/Translate/FEELhelpers.hs:25-30 showFeels; src/DMN/Translate/FEELhelpers.hs:50 showFeel _ FAnything = "undefined"'
ARGS='--to=ts input.md'
