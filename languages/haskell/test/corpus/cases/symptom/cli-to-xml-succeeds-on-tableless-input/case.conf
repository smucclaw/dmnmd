TITLE='an output format the binary cannot write reports success (exit 0, silence) when the input happens to contain no decision table'
WHY='dmnmd cannot write XML at all - CLAUDE.md says so under Known-broken, and app/Main.hs has no outputTo clause for Xml, only the fallthrough that calls crash. But the refusal lives INSIDE the per-table loop (mapM_ (outputTo ...) pickedTables), so it only ever fires if there is a table to write. Hand it a prose markdown file and the loop runs zero times: dmnmd accepts --to=xml, prints nothing on either channel, and exits 0. The user asked for XML, got nothing, and was told everything was fine.

This is the failure mode CLAUDE.md names outright: accepting input and quietly giving a different answer is strictly worse than rejecting it. Here it accepts and gives no answer at all, silently. It also makes the refusal in cli-to-xml-unimplemented input-dependent - the same flag on the same machine is a hard error on one file and a success on another - which is why that case is filed as a symptom rather than as a deliberate refusal.

The fix is to validate the output format once, before anything is read, rather than once per table. When that lands this case should exit 1 with the same message the table-bearing case gets, and can then move to policy.'
SOURCE='app/Main.hs outputTo fallthrough (crash on an unsupported FileFormat) reached only from the mapM_ over pickedTables in main; CLAUDE.md Known-broken, --to=xml is not implemented at all'
ARGS='--to=xml input.md'
