TITLE='a multi-value cell containing `-` leaves a STRING literal inside a NUMBER column'
WHY='mkFs splits `4, -` into a VS and an FAnything. inferTypes still infers Number for the column (FAnything is dropped by catMaybes), so the header says NUMBER, but reprocessRows guards on every cell being a VS, which is now false, so "4" is never re-made as a number. Header type and cell type disagree in the emitted code. Same for the far more likely trailing-comma typo `4,`.'
SOURCE='src/DMN/DecisionTable.hs reprocessRows, the `length [x | FNullary (VS x) <- cells] == length cells` guard; audit lens "type inference", finding 14'
ARGS='--to=ts input.md'
