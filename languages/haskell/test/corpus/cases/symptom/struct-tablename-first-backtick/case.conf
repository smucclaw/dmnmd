TITLE='cleanTableName grabs the FIRST backticked token, so a heading that backticks anything else names the table wrong'
WHY='cleanTableName does `dropWhile (/= backtick)` and takes the first backticked span unconditionally. A heading that backticks a filename yields a table name that is not a legal identifier, and the JS/PY backends emit it verbatim, which is a hard syntax error in both. There is no identifier sanitisation on the JS/PY path.'
SOURCE='app/ParseMarkdown.hs cleanTableName; audit lens "table structure", finding 29'
ARGS='--to=ts input.md'
