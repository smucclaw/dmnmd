TITLE='a domain split across two sub-header rows is space-joined, and now refuses the table'
WHY='parseContinuationRows is `many` followed by `trim . unwords <$> transpose`
(src/DMN/ParseTable.hs:174-177), so N sub-header rows are concatenated with a
SPACE before mkFs splits the result on commas.

Here the output domain is written over two rows as `C` then `A, B`. Joined, that
is the single string `C A, B`, which splits into the two members `C A` and `B`.
So `A` and `C` are not in the domain at all. Hit policy O sorts by elemIndex
against the domain, and elemIndex returns Nothing for a value it cannot find,
which sorts BEFORE every value it can — so the run emits A, C, B.

Written as one row, `C, A, B`, the same table emits C, A, B. Same values, same
order, two spellings, two different answers, nothing reported, exit 0.

Recorded deliberately BEFORE any E4 work, so that it is on record as behaviour
E4 inherited rather than behaviour E4 introduced.

UPDATED after E4 step 4 (domain validation) landed. The recording above described
the ORIGINAL failure: silent, exit 0, wrong order. It now fails LOUDLY instead -
`A` and `C` are not members of the joined domain {C A, B}, so the table is
refused with exit 1 and a located message per offending cell.

That is a strict improvement and it is exactly what BUILD-SPEC-dmnmd-e4.md
section 2.1 predicted: E4 makes declared domains load-bearing, which raises the
cost of this defect without addressing it. It STAYS a symptom, because the
defect is unchanged - a domain written over two rows is still a legitimate thing
to write and dmnmd still cannot read it. All that changed is that it now says so
rather than quietly reordering the output.

Note the message is honest but unhelpful about the CAUSE: it reports {C A, B} as
the domain, which is the joined string, not the two rows the author wrote. Anyone
fixing the join should also make this diagnostic name the real problem.

The fix, when someone takes it, is to decide what N sub-rows MEAN — either
reject the second one, or treat each row as a separate continuation of the same
comma list rather than joining with a space.'
SOURCE='src/DMN/ParseTable.hs:174-177 parseContinuationRows; BUILD-SPEC-dmnmd-e4.md section 2.1'
ARGS='-q -t ts input.md'
STDIN_FILE='stdin'
