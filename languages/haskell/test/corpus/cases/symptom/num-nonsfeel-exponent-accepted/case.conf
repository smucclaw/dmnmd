TITLE='`1e5` is accepted as 100000, but FEEL has no exponent notation'
WHY='The numeric fallthrough is Haskell`s `read`, whose grammar is not DMN 1.3 §9.2 rule 31. Rule 31 is optionally-signed digits with at most one decimal point; it admits no exponent. So a cell dmnmd silently reads as 100000 is one no conformant DMN tool would accept, and the divergence is invisible at exit 0. Recorded BEFORE the fix so the change reads as a demonstrated improvement rather than an asserted one.'
SOURCE='src/DMN/DecisionTable.hs mkFEither, the `readMaybe :: Maybe Float` fallthrough at :200-202'
ARGS='--to=ts input.md'
