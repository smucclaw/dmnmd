TITLE='a table that is nothing but a hit policy is accepted and compiles to a no-argument function returning an empty object'
WHY='The input is a pipe table whose only column is the hit-policy/row-number column: header | U |, separator, and one row | 1 |. There are no input columns and no output column, so there is nothing to decide. dmnmd accepts it at exit 0 and emits export function Bare (  ) { if ("default") { // 1 return {}; } }. The "default" guard is the deliberate JS idiom for an all-wildcard row (JS.hs:87 says as much, exploiting the truthiness of JS), so the emitted function is unconditionally true and returns {} for every call. That is a syntactically valid module that means nothing, produced in silence, which is precisely what CLAUDE.md says must not happen: never silently discard, and never accept input and quietly give a different answer. DMN agrees that this is not a table - the vendored xsd/DMN13.xsd requires at least one output clause (element output has no minOccurs, so it defaults to 1), while input and rule are both minOccurs=0. This is the zero-column sibling of symptom/struct-onecol-no-output, which records the one-column case where the single column is consumed as a guard and no output column is left; keeping both distinguishes a rewrite that fixes the arity check in general from one that only special-cases a single column. The fix should be a refusal naming the table and saying it has no output column, and exit 1.'
SOURCE='src/DMN/ParseTable.hs parseTable header handling and src/DMN/DecisionTable.hs reviseInOut; src/DMN/Translate/JS.hs:87 the "default" guard'
ARGS='--to=ts input.md'
