TITLE='bare `dmnmd -q file.md` — the documented interactive evaluator — crashes on the first successful query'
WHY='showToJSON in app/Main.hs has arms for Js, Ts and Py only. With no --to and no --out, detectOutformat leaves outformat = Unknown, so every successful query in the REPL falls off the end of the pattern match. The failure is masked whenever the query FAILS, because the error path does not call showToJSON — which is why it survived: every worked example that errors out looks fine. Same root cause as cli-showtojson-l4-nonexhaustive. Found after the audit, not in the audit journal.'
SOURCE='app/Main.hs showToJSON; app/Options.hs detectOutformat'
ARGS='-q input.md'
STDIN_FILE='stdin'
