TITLE='a quoted dash "-" and a quoted empty string "" are wildcards, not string literals'
WHY='Found while fixing policy/md-quoted-literals-are-strings and deliberately NOT changed by that fix. unquoteCell strips the quotes of a well-formed literal and the result is handed to mkFEither, which maps the text "-", "_" and the empty text to FAnything before it looks at the column type. So the cell "-" means the string literal minus in FEEL and a wildcard in dmnmd, and "" (the empty string literal) is a wildcard too; rows 1 and 2 here match every input. The XML reader reads the same cells as string literals (mkCells parses a FEEL string literal). The fix for quoted numerals preserves this behaviour on purpose, so that it moves one thing; it is recorded here so it is not lost. Progress is Year === "-" and Year === "" in the guards of rows 1 and 2, and an if for row 3 that is reachable.'
SOURCE='src/DMN/DecisionTable.hs mkFEither (the "", "_" and "-" arms), unquoteCell'
ARGS='--to=ts input.md'
