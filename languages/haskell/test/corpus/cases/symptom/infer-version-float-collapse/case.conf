TITLE='identifier-like numbers are coerced through Float: 1.1 and 1.10 collapse into the same branch'
WHY='The inference regex ^\d+(\.\d+)?$ matches both, so the column infers Number and 1.1 and 1.10 arrive as the same value. Rows 1 and 2 become byte-identical guards; the second is dead. A Unique table that was well formed becomes a runtime conflict. NOTE ON THE MECHANISM, which changed under D-1 while the symptom did not: this recording used to say `read :: Float gives 1.1 for both`, and that is no longer how it happens -- DecisionTable.mkInputValue is now `readMaybe :: Maybe Scientific` and no Float remains on the path. Scientific stores 1.1 and 1.10 distinguishably (coefficient 11 exponent -1 versus 110 exponent -2) but its Eq compares on VALUE and ignores scale, so the two still collapse. The name of this case is therefore now slightly wrong and is kept for stability. THE DEFECT IS STILL INFERENCE, not the numeric type: a version identifier is not a number and should never have become one. That is D-2 territory, and fixing the number representation neither fixed nor worsened it.'
SOURCE='src/DMN/DecisionTable.hs inferType / mkVN; audit lens "type inference", finding 16'
ARGS='--to=ts input.md'
