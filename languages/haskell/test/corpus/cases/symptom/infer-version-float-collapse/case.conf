TITLE='identifier-like numbers collapse: 1.1 and 1.10 become the same branch, and row 2 is dead'
WHY='STILL OPEN AFTER D-2, deliberately. Both cells parse as genuine FEEL numbers under the anchored grammar, so the column resolves unambiguously to Number and there is no disagreement for D-2 to refuse; Scientific stores them distinguishably (11e-1 vs 110e-2) but its Eq compares on value and ignores scale, so rows 1 and 2 emit byte-identical guards and the second is dead code in a Unique table. Two candidate fixes, both rejected FOR NOW and both recorded in DECISIONS.md D-12: (a) extend the leading-zero ambiguity rule to any redundant zero -- it catches this, and catches 10.50 and 2.0 with it, so it would refuse a money column for writing cents; (b) a hit-policy overlap check -- two rules of a U table with identical guards violate DMN uniqueness, is detectable with no reference to types at all, and catches a strictly larger class. (b) is the better fix and is a decision D-2 does not contain. Earlier note on the mechanism, still accurate: the name of this case is slightly wrong since D-1 (no Float remains on the path) and is kept for stability.'
SOURCE='src/DMN/DecisionTable.hs inferEvidence; hit-policy uniqueness is unchecked; DECISIONS.md D-2, D-12'
ARGS='--to=ts input.md'
