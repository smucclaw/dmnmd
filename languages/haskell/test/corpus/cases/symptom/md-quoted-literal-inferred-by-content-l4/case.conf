TITLE='the L4 face of symptom/md-quoted-literal-inferred-by-content: the quoted columns are declared NUMBER and BOOLEAN'
WHY='The same table as symptom/md-quoted-literal-inferred-by-content, read through --to=l4, because L4 is the backend where the wrong type is most visible: GIVEN Year IS A NUMBER and GIVETH A MAYBE BOOLEAN, with guards Year EQUALS 2020 and results TRUE and FALSE, where the author wrote the strings "2020", "2021", "yes" and "no". The markdown reader unquotes a well-formed double-quoted cell in pass 1 (unquoteCell), before type inference grades it, so inferEvidence never sees the quotes that make a cell a string literal. The XML reader stopped doing this in audit finding f4 (mkFsKeepingQuotes); the same table written as DMN XML is a String column and a String result. Progress is GIVEN Year IS A STRING, GIVETH A MAYBE STRING, and the guards and results compared against the strings.'
SOURCE='src/DMN/DecisionTable.hs mkFsEither (unquoteCell), mkInputFsAt, inferEvidence; audit 2026-09-26 finding f4 (markdown side)'
ARGS='--to=l4 input.md'
