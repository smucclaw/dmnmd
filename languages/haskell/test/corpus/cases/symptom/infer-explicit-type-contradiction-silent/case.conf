TITLE='an explicit header type that contradicts the column wins in SILENCE, and the comparisons evaporate'
WHY='NOT REACHED BY D-2, and a refusal would be the wrong remedy. "Guest Count : String" holding "<= 8" is legitimate -- the declaration must win (DMN says typeRef governs, and preserving that is a hard constraint on this work), and a String column whose cell is the literal text "<= 8" is a well-formed unary test. The defect is the SILENCE, not the outcome: the author almost certainly meant a numeric comparison and gets an equality test against source text with no word said. Under D-2 inferTypes tests the declared type FIRST and returns early, so it no longer even computes the contradicting verdict -- which makes this strictly harder to report from there and confirms the right shape is a located WARNING at exit 0, not an error. The markdown path has no warning channel: it has error and ParseMarkdown note: on stderr and nothing in between (the XML reader Diagnostic type is not plumbed here). That channel is D-7 work.'
SOURCE='src/DMN/DecisionTable.hs inferTypes, the declared-type early return; DECISIONS.md D-2, D-7'
ARGS='--to=ts input.md'
