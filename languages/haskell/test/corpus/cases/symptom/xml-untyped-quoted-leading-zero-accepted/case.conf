TITLE='an untyped XML output column of FEEL strings "007" and "008" is refused as an ambiguous leading-zero number'
WHY='The same root cause as symptom/xml-untyped-quoted-literals-stay-strings, in its loud form. dmnmd refuses a BARE 007 in an undeclared column because it cannot tell the number 7 from an identifier that happens to be digits (VAmbiguous, D-2). A QUOTED "007" has already said which it is: it is a FEEL string literal. The XML inference pre-pass strips the quotes before grading the cell, so the string is refused as if it were an unquoted numeral, at exit 1, and the advice in the message (declare the column, output1 : String) is markdown header syntax that means nothing in a DMN document. The document is perfectly clear and is refused. Progress is exit 0 and the outputs "007" and "008" as strings.'
SOURCE='src/DMN/XML/XmlToDmnmd.hs resolveColumn firstPass; src/DMN/DecisionTable.hs mkFsEither (unquoteCell), inferEvidence, redundantLeadingZero; audit 2026-09-26 finding f4'
ARGS='-f xml --to=ts input.dmn'
