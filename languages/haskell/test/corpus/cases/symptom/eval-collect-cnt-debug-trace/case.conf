this recording is what will show it happened.

Read this case together with policy/eval-hp-collect-sum, -min and -max: those
three guard that the Collect *values* are right, so nothing is lost by having
Cnt and All classified as symptoms. If you remove the trace, the correct move is
to re-record here and `git mv` this case into cases/policy/, rewriting the WHY
to describe the count rather than the trace.'
SOURCE='src/DMN/DecisionTable.hs evalTable, HP_Collect Collect_Cnt arm'
ARGS='-q -t ts input.md'
