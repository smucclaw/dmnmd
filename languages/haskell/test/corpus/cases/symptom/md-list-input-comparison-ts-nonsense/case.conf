TITLE='a comparison cell on a [Number] input column emits `tags > 3.0` against an array — data-dependent nonsense, not merely never-true'
WHY='The dangerous half of the list-input defect, and the reason tier 2 refuses
this cell shape rather than picking a quantifier for it.

  | 1 | > 3 | pass |     with  tags : [Number]
  -->  if (tags > 3.0) {

MEASURED in node, because "it just never matches" would be the comforting
assumption:

  [5]   > 3  ->  true
  [10]  > 3  ->  true
  [1,2] > 3  ->  false
  []    > 3  ->  false

JS stringifies the array and then coerces: [5] becomes "5" becomes 5, so the
guard fires; [1,2] becomes "1,2" which is NaN, so it does not. The rule
therefore fires on SOME lists containing an element over 3 and not others, with
no relationship to what the table says. That is strictly worse than a comparison
that is always false, because a test suite over single-element lists would pass.

It is also not fixable by picking a quantifier, which is the point: "some
element is > 3" and "every element is > 3" are different rules, DMN gives a
comparison against a collection no meaning at all (10.3.2.10 reduces
satisfaction to FEEL(e in (t)), and Table 54 defines < and > over scalars only),
and dmnmd will not guess.

WHAT WOULD FIX IT: refuse the cell with a located diagnostic naming both
readings and telling the author to aggregate the collection to a scalar before
the table, or split the column. Tier 2, refusal R2.'
SOURCE='src/DMN/DecisionTable.hs:157 mkFEither delegating DMN_List to baseType; src/DMN/Translate/JS.hs:147 feel2jsIn FSection Fgt'
ARGS='--to=ts input.md'
