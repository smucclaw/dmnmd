TITLE='inferType accepts `n` as Boolean but mkVB cannot build it, so a y/n column dies at parse time'
WHY='inferType boolean vocabulary is ["true","yes","positive","y","false","no","negative","n"]. mkVB two lists are true=["true","yes","t","y","positive"] and false=["false","no","t","y","negative"]: the false list is a copy-paste of the true list short forms, so "t" and "y" are dead there and "f" and "n" appear in neither. yes/no works, which makes this easy to miss.'
SOURCE='src/DMN/DecisionTable.hs inferType boolean list vs mkFEither mkVB; audit lens "type inference", finding 19'
ARGS='--to=ts input.md'
