TITLE='a First table with no matching row aborts the run instead of reporting no match'
WHY='`head0` raises an `error` when nothing matched. The message is a good one —
it names the table and the hit policy, which most of the crash sites in this
corpus do not — but crashing is still the wrong behaviour: under DMN a decision
table with no matching rule produces a null result, and the two neighbouring
policies handle this without dying (U returns "no rows returned", R returns an
empty list). P shares the defect, since it calls head0 too.'
SOURCE='src/DMN/DecisionTable.hs head0, called from the HP_First and HP_Priority arms'
ARGS='-q -t ts input.md'
STDIN_FILE='stdin'
