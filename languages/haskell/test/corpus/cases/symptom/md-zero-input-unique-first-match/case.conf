TITLE='a U table whose every column is marked (out) has no input column, its two rules overlap everywhere, and the first one wins'
WHY='Every column is marked (out), so the table has zero input columns and every rule is vacuously true for every call. Under hit policy U that is overlapping rules, which DMN 1.3 section 8.2.10 forbids. The reader refuses the same table with three rows ("row 1 and row 2 both match every input", from DMN.Regions.conflictErrors) but accepts it with two: uniqueCatchAll tests all (all (== FAnything)) over the last row input cells, which is vacuously true when there are none, so the last row is read as the trailing catch-all default and the first row answers every input. ts, js and py render a rule with no tests as if ("default"), a truthy string, so they take the first rule and the second is dead code. L4 emits IF TRUE for the first and OTHERWISE for the second. --to=xml writes both rules with no input entries. The -q REPL cannot evaluate the table at all (expected 0 arguments, got 1). DECISIONS.md D-13 had called this shape unreachable from markdown, and its correction of 2026-09-26 says otherwise.'
SOURCE='src/DMN/DecisionTable.hs uniqueCatchAll; src/DMN/Translate/JS.hs mkIf; DECISIONS.md D-13 correction of 2026-09-26; audit 10 finding f8'
ARGS='--to=ts input.md'
