TITLE='the XML reader keeps an input entry shaped like a comparison it cannot read (>= start) as text: the rule can never fire, exit 0'
WHY='WHAT IT DOES: --to=ts emits day === ">= start" at exit 0 with nothing on stderr. The inputEntry is a comparison against another name, which S-FEEL allows and dmnmd cannot read; kept as text it is an equality test against its own spelling, so the rule is permanently dead.

WHY IT SURVIVED: the markdown reader now refuses exactly this cell in an undeclared column (policy/md-unreadable-comparison-refused), through DMN.DecisionTable.mkInputFsAt called from DMN.ParseTable pass 1. The XML reader has its own pass (XmlToDmnmd mkCells) and was deliberately left alone by that change. When the cell contains a double quote -- < "m", >= date("2026-09-24") -- this reader does at least warn that it is not a FEEL string literal, but it still emits the dead rule at exit 0; with no quote in it, as here, it says nothing.

WHY IT WAS NOT FIXED ALONGSIDE: two things need deciding first. The markdown repair the refusal names, declare the column String, is markdown syntax, and on this path a typeRef of string does not help: a declared string column is the COMMON case in DMN XML, and it keeps the same cell as text too. Refusing test-shaped cells in a typeRef string column is right by DMN semantics (a string comparison is legal there and unimplemented here), but it is a wider change than the markdown one, which exempts a declared String column because that declaration is the documented escape hatch in markdown. The shared predicate, DMN.ParseCell.unreadableTestShape, is ready for whichever ruling is made.

WHAT PROGRESS LOOKS LIKE: a located Error naming the rule, and nothing emitted.'
SOURCE='src/DMN/XML/XmlToDmnmd.hs mkCells (the isStringy verbatim path); src/DMN/ParseCell.hs unreadableTestShape'
ARGS='-f xml --to=ts input.dmn'
