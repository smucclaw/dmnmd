TITLE='the first data row with a blank row-number is swallowed as the enum subhead row, and now refuses the table'
WHY='parseTable calls parseContinuationRows before parseDataRows, and
parseContinuationRow matches on nothing more than "first cell is blank",
regardless of hit policy. It uses many, so two consecutive blank-numbered rows
are both swallowed and joined with unwords.

UPDATED after E4 step 4 (domain validation) landed. Previously this silently
dropped row 1 and emitted a working two-rule function - the row simply vanished
and nothing said so. Now the swallowed row becomes the DECLARED DOMAIN ({Fall}
for Season, {Stew} for Dish), rows 2 and 3 violate it, and the whole table is
refused with exit 1.

Still a symptom, and still the same defect: a data row with a blank rule number
should not be read as a sub-header row at all. What changed is only the failure
mode, from silent data loss to a loud refusal - which is the right direction and
is why this was not reverted.

But note the diagnostic does NOT name the real cause. It talks about a declared
domain the author never declared, so a user who simply forgot a rule number is
told their values are outside a domain they never wrote. Whoever fixes the
swallowing should check whether parseContinuationRows can distinguish "no rule
number" from "sub-header row" - until it can, this message will keep
misdirecting. Related: symptom/enum-domain-multirow-joined, which has the same
shape and the same misdirecting message.'
SOURCE='src/DMN/ParseTable.hs parseContinuationRows; audit lens "table structure", finding 23'
ARGS='--to=ts input.md'
