TITLE='--to=l4 silently drops every member but the first from a [T]-typed OUTPUT cell, under a GIVETH that promises a list'
WHY='Same input as policy/md-list-output-array, which shows TS getting this right.
The L4 backend does not have showFeels list awareness, so `fries, slaw` in a
`sides : [String] (out)` column emits

  GIVETH A LIST OF STRING
  ...
    IF season EQUALS "Fall"   THEN "fries"

The signature promises a list, the arm returns a bare STRING, and "slaw" is
gone. Exit 0, no diagnostic.

Two distinct defects in one line:
  1. the value is truncated to its head - a wrong answer, silently;
  2. what is emitted does not even have the declared type, so l4 check would
     reject it. That half is loud, but only if you run l4.

WHAT WOULD FIX IT: the L4 backend needs the equivalent of showFeels wrapArray
branch - render a list-typed output cell as an L4 list literal (LIST a, b), and
EMPTY for a wildcard. Part of tier 2; see BUILD-SPEC-dmnmd-l4-sumtype.md B.3.'
SOURCE='src/DMN/Translate/L4.hs oneFeelCells/feelValL4 (no DMN_List case); compare src/DMN/Translate/FEELhelpers.hs:25-30'
ARGS='--to=l4 input.md'
