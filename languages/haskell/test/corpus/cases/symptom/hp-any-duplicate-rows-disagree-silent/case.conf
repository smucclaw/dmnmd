TITLE='an ANY table whose identical rules DISAGREE on output emits a dead branch at exit 0'
WHY='WHAT IT DOES: hit policy A, two rows with the byte-identical guard x = 5, returning "alpha" and "beta". The emitted TypeScript contains both branches, the second unreachable, at exit 0 with nothing on stderr. WHY THAT IS WRONG: DMN 1.3 §8.2.10 lets ANY rules overlap ONLY if they produce the same output; rules that overlap and disagree are a violation. dmnmds own evalTable knows this -- D-5 made HP_Any refuse genuine disagreement at RUNTIME -- but the transpilers do not implement hit policies at all, so the generated code just silently prefers the first branch. The table says two things and the generated system does one of them, which is the silent-wrong-answer class. WHY IT IS NOT FIXED HERE: D-13 was scoped by Meng to exact duplication in U tables ONLY, explicitly not A and not P, because A legitimately permits overlapping rows that agree and P orders them deliberately. Widening the check to A would have needed the agree/disagree distinction, which is a different check from the one that was ruled. Recorded rather than fixed so the scope ruling is respected and the finding is not lost. WHERE IT BELONGS: with the deferred full-overlap project in D-13 (Calvanese et al. 2016), or as its own small ruling -- the check is nearly the same walk uniquenessErrors already does, plus a comparison of the OUTPUT sides, which uniquenessErrors deliberately ignores because for U tables the outputs are irrelevant. FOUND BY: a verify lens on the D-13 workflow, probing a policy the ruling had placed out of scope. Not caught by any gate: the corpus, the round trip and cabal test were all green across it.'
SOURCE='src/DMN/DecisionTable.hs, uniquenessErrors and evalTable HP_Any; DECISIONS.md D-13, D-5'
ARGS='--to=ts input.md'
