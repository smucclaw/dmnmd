TITLE='a multi-table file whose second table is refused still writes the first table to stdout'
WHY='Table Good emits in full; table Bad has hit policy C+, which toL4 refuses;
the run exits 1 having already written Good to stdout.

That contradicts a promise the single-table refusal cases make explicitly.
policy/l4-refuses-outputorder pins "the refusal exits 1 and emits nothing
whatsoever on stdout, so a redirect cannot leave a half-written file behind" -
and that is true, but only because both existing refusal cases are single-table.
With two tables the guarantee is gone and `dmnmd -o out.l4` leaves a partial file
that looks like a complete one, alongside exit 1 that a shell script may not
check.

The cause is app/Main.hs: outputTo is applied per table with mapM_ over one
handle, so each table is written as it is converted and the refusal is an error
raised part-way through the fold.

Filed as a symptom, not policy: emitting nothing is the behaviour the other
refusal cases promise, and this should converge on it rather than the other way
round.

RECORDED BEFORE toL4File EXISTS, DELIBERATELY. BUILD-SPEC-dmnmd-l4-sumtype.md
section A.6 proposes toL4File :: L4Opts -> [DecisionTable] -> ([Diagnostic],
String) so a file-level DECLARE preamble can be deduplicated. That makes whether
Good still reaches stdout a function of Haskell strictness in the file-level
scan - so without this recording, the change could alter it in either direction
and nothing would notice. Neither existing refusal case can catch it: both are
single-table, so their recorded stdout is empty either way.

Found by an adversarial reviewer attacking the sum-type design, not by the
corpus.'
SOURCE='app/Main.hs outputTo/mapM_; src/DMN/Translate/L4.hs the Collect refusal; BUILD-SPEC-dmnmd-l4-sumtype.md section A.7'
ARGS='--to=l4 input.md'
