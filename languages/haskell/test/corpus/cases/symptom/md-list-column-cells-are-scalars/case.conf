TITLE='a column declared [Number] emits a list-typed signature but reads its cells as scalars, in every backend'
WHY='DMN_List is a real constructor in DMN.Types, ParseTable accepts the [Number]
header syntax, and every backend has a type2* case for it. What none of them has
is a list-aware CELL. DecisionTable.mkFEither:157 sends a list type straight to
baseType, so `5` in a [Number] column becomes the scalar test it would be in a
Number column - while the emitted signature still says list.

  --to=l4  GIVEN tags IS A LIST OF NUMBER ... IF tags EQUALS 5   -> l4 check exit 1
  --to=ts  function Scores ( tags : number[] ) ... if (tags === 5.0)

The L4 is caught by l4s typechecker. The TypeScript is worse: tsc would reject
number[] === number, but dmnmd does not compile what it emits, so what actually
ships is a comparison that is never true. Same defect, one loud and one silent.

Recorded now because a diagnostic points at it. XmlToDmnmd refuses a DMN
<itemDefinition isCollection="true"> and cites this case as the reason - see
policy/xml-itemdefinition-warns. Without a recording, that message would be an
unverified claim about another part of the tree, which is exactly the drift
CLAUDE.mds "keeping written claims true" section is about.

BUILD-SPEC-dmnmd-l4-sumtype.md sectionB.3 lists tier 2 (isCollection -> DMN_List)
as "small, once tier 1 exists". That verdict was wrong, and this is why: the type
already exists and the plumbing is one line, but the cell layer underneath it does
not work, so the one-line change would import this defect into the XML reader and
turn a refusal into a wrong answer. Tier 2 is blocked on making DMN_List mean
something at the cell layer, which is a real piece of work.

WHAT WOULD FIX IT: a list column needs its cells to be list tests. In DMN, an
inputEntry on a collection is a membership or quantified test, not an equality -
so this reaches into the S-FEEL grammar work rather than being a local patch.'
SOURCE='src/DMN/DecisionTable.hs:157 mkFEither delegating DMN_List to baseType; src/DMN/Translate/L4.hs type2l4; src/DMN/Translate/JS.hs type2js; BUILD-SPEC-dmnmd-l4-sumtype.md sectionB.3'
ARGS='--to=l4 input.md'
