TITLE='the DMN requirement graph is discarded silently: two decisions wired by requiredDecision emit as two unrelated functions'
WHY='WHAT IT DOES: Fare requires Band through <requiredDecision>, and Band requires an <inputData> through <requiredInput>. Both edges vanish. What comes out is Band(age) and Fare(band) as two independent TypeScript functions -- nothing calls Band, and nothing records that the band parameter is meant to be the output of Band. Exit 0, empty stderr. WHY THAT IS WRONG: informationRequirement is parsed into Decision.decInfoReq in src/DMN/XML/ParseDMN.hs and then never mentioned in XmlToDmnmd; grep -c prints 0 there for informationRequirement, decInfoReq, requiredDecision and knowledgeRequirement alike, and decInfoReq is referenced nowhere else in the tree. This is the one place XmlToDmnmd breaks its own governing rule that anything parsed but not honoured must produce a loud, located diagnostic -- every other drop in that module honours, warns, or refuses by name. A generated function whose parameter is silently a dangling reference is a plausible wrong answer at exit 0, which CLAUDE.md calls strictly worse than a refusal. WHAT THE FIX LOOKS LIKE: DECISIONS.md D-6 rules that the Warning is adopted, so this recording should grow a diagnostic per dropped edge -- two lines here, one for the requiredInput and one for the requiredDecision -- naming the decision they were attached to. Actually modelling the graph is the separate, larger job D-6 explicitly does not wait for, so a diff in which Fare starts calling Band is more than was ruled and should be read carefully rather than assumed. Both edge kinds are kept in one fixture on purpose: they are the same single omission, the field is read by nobody, and a warning per edge makes the diff show two lines of progress rather than one. Isolated from the label/name precedence that policy/xml-baseline-13 and policy/xml-output-without-label pin: both <output>s here set name and label to the same string, and both <input>s omit label entirely, so a change to convOutputCol precedence cannot perturb this recording.'
SOURCE='src/DMN/XML/ParseDMN.hs, the decInfoReq field of Decision, written and never read; src/DMN/XML/XmlToDmnmd.hs, zero occurrences of any requirement term; DECISIONS.md D-6'
ARGS='-f xml --to=ts input.dmn'
