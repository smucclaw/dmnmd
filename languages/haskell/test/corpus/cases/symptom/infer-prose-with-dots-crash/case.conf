TITLE='prose containing `..` is inferred as a NUMBER column and then dies at the numeric reader'
WHY='inferType asks whether the cell CONTAINS any of "..", ">", "<", "=" or a spaced arithmetic operator, so an occurrence anywhere in the value wins. An ordinary label column of prose is typed Number and every cell then fails to read. The wording here used to name an unanchored PCRE list; the regexes went with regex-pcre and the test is now isInfixOf plus an anchored span isDigit, which is the same behaviour by a different mechanism. The refusal is now located (`table "EllipsisDish": column "Dish": row 1`), which does not help: the location is right and the TYPE is wrong, so this stays a symptom.'
SOURCE='src/DMN/DecisionTable.hs inferType, the unanchored substring test; audit lens "type inference", finding 15'
ARGS='--to=ts input.md'
