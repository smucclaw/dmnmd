TITLE='a String-declared input column takes an arithmetic cell as literal text and emits a rule that can never fire, at exit 0 and in silence'
WHY='D-15, and the reason both numeric messages now caveat their closing `: String` advice instead of merely offering it. Declaring the column String is what BOTH messages told the author to do; doing it is ACCEPTED, and --to=js emits `if (Age === "(Age * 2) + 1")` -- a string equality against the cell own source text. Run under node with Age=3 the function returns undefined: the rule is DEAD for every input, and nothing is printed on stderr and the exit status is 0. That is strictly worse than the refusal it replaced, and it is the failure the governing rule in CLAUDE.md names -- accepting input and quietly giving a different answer. The message caveat is a mitigation, not a fix; the emitter still has no diagnostic for a String cell that parses as arithmetic, and this case stays in symptom/ until it does. The natural repair is a structuralErrors rule alongside inputArithErrs, but inputArithErrs matches on FFunction and this cell is an FNullary VS, so it is a different predicate and a separate change. NOT the same as policy/num-dash-range-refused, which is the Number-column path and IS refused.'
SOURCE='src/DMN/DecisionTable.hs structuralErrors (no rule covers this); src/DMN/Translate/JS.hs'
ARGS='--to=js input.md'
