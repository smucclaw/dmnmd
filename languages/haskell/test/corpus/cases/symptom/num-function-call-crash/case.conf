TITLE='a numeric cell containing a function call aborts the run'
WHY='parseFNumFunction models only variables, literals and the binary operators + - * / ^. Any FEEL function call — floor(), decimal(), ceiling() — trips the `intersect "+-*/"` heuristic on its operator, is handed to a parser that cannot represent a call, and the either branch calls error. Real fee tables are full of these, which is how this was found.'
SOURCE='src/DMN/DecisionTable.hs parseFNumFunction and the arithmetic guard; audit reproduction X-parseFNumFunction-crash (verdict PARTIAL)'
ARGS='--to=ts input.md'
