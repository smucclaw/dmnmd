TITLE='--to=l4 renders an output range as its lower bound alone, dropping the upper'
WHY='README "Extensions" permits a range in an OUTPUT cell. `DMN.Translate.L4.showFeelL4` renders `FInRange` as `showNumL4 lo` and discards the upper bound entirely, so `[1..5]` emits as `THEN 1`. The TypeScript backend gets it right for the same table — `(x)=> 1.0 <= x && x <= 5.0` — so this is a per-backend wrong answer at exit 0, the worst shape a defect can take. Pre-existing and entirely out of scope for the num cell-layer work; recorded here only so that it stops being invisible, since the num change touches this exact function`s arity and would otherwise look like it had considered the case.'
SOURCE='src/DMN/Translate/L4.hs showFeelL4 :783; contrast src/DMN/Translate/FEELhelpers.hs showFeel :49-50'
ARGS='--to=l4 input.md'
