TITLE='not(...) in a STRING column is silently taken as literal text: the guard becomes an equality test against the six-plus-character source string'
WHY='WHAT IT DOES: rule 1 emits Season === "not(Fall)" at exit 0, with no
diagnostic. A table that says "any season except Fall" fires only for an input
whose literal text is not(Fall), which nothing will ever be, so the rule is
permanently dead and the tool reports success.

WHY THAT IS WRONG: this is the silent-wrong-answer class, which CLAUDE.md calls
strictly worse than a refusal. Nothing tells the author their negation was not
read as one.

WHY IT SURVIVED D-9: D-9 implements DMN 1.3 §9.2 rule 12.b in
DMN.ParseCell.parseNumberCell, and that function is reached only from the
DMN_Number arm of mkFEither. The DMN_String arm is one line -- it wraps the
trimmed text in FNullary (VS …) -- and never consults a grammar at all, so no
amount of work inside ParseCell can reach it. The FNot constructor, fEval and all
four backend renderings are already in place and would handle a string negation
correctly; what is missing is only the parse.

So this is a gap D-9 makes MORE visible rather than one it introduces: before
D-9, not(...) was unsupported everywhere and this cell was wrong in the same way
it is now. What is new is the inconsistency -- the identical construct is a real
negation one column over, if that column happens to be numeric.

WHAT THE FIX LOOKS LIKE: teach the DMN_String arm to peel not(...) as the numeric
arm does. It was deliberately not done in the D-9 commit because it needs an
escape hatch decided first, and there is currently none: unquoteCell strips
quotes all-or-nothing BEFORE the type arms run, so "not(Fall)" arrives as
not(Fall) and quoting cannot be used to force the literal reading. A column of
genuine strings that happen to look like calls would have no way to say so.
Deciding that belongs with the quoting rule, not with this parse.

The second row is a plain Fall so that the column is unambiguously String and the
recording cannot be perturbed by inference; the negation is the only thing under
test.'
SOURCE='src/DMN/DecisionTable.hs mkFEither, the DMN_String arm, which never reaches DMN.ParseCell; DECISIONS.md D-9'
ARGS='--to=ts input.md'
