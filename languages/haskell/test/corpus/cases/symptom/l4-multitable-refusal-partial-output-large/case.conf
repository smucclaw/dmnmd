TITLE='the same multi-table refusal, at an output size the stdout buffer cannot hold - 4KB of a refused run reaches stdout'
WHY='This is symptom/l4-multitable-refusal-partial-output with ONE difference: table
Good is 45 rows instead of 1, so its emission exceeds the output handle chunk
size. The small case CANNOT distinguish "dmnmd emitted nothing" from "dmnmd
emitted less than one buffer chunk and the process died before it flushed", and
the two are not the same promise.

Measured on this exact fixture family, varying only the row count:

  rows   input bytes   bytes reaching stdout on the refused run
    1        ~180                 0
   20         615                 0
   30         825              2047
   45        1140              4094
   90        2085              8188
  400        7900             18423

So the boundary is a 2048-char buffer chunk, and everything committed before the
error survives. A promise that holds only for tables under about 30 rows is not a
promise; policy/l4-refuses-outputorder states it flatly - "the refusal exits 1 and
emits nothing whatsoever on stdout, so a redirect cannot leave a half-written file
behind" - and that case is single-table, so it never exercises this.

45 rows is the deliberate size: comfortably past the 30-row boundary so the leak
is robust rather than marginal, and small enough to keep the fixture near 1KB. The
long input column name is doing the amplification - it is re-emitted (or dittoed
to a same-width caret) on every arm, so a 55-character name turns 1KB of markdown
into 4KB of L4.

A fix that only makes the SMALL case go quiet has fixed nothing. Both cases must
go to an empty stdout together, and this one is why.'
SOURCE='app/Main.hs outputTo/mapM_ over one handle; src/DMN/Translate/L4.hs the Collect refusal; policy/l4-refuses-outputorder for the promise this breaks'
ARGS='--to=l4 input.md'
