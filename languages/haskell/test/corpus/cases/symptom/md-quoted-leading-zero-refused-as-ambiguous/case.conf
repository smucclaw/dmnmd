TITLE='a column of double-quoted leading-zero numerals "007" is refused as an ambiguous number, input and output alike'
WHY='The loud form of symptom/md-quoted-literal-inferred-by-content. dmnmd refuses a BARE 007 in an undeclared column because it cannot tell the number 7 from an identifier that happens to be digits (VAmbiguous, D-2). A QUOTED "007" has already said which it is: it is a string literal. The markdown reader unquotes the cell in pass 1 (unquoteCell), so inference grades 007 and refuses the string as if it were an unquoted numeral, at exit 1, with advice (declare the column Code : String) the author had in effect already followed by writing the quotes. Both columns are here because the input cell and the output cell reach pass 1 through different wrappers (mkInputFsAt and mkFsAt). The XML reader accepts the same cells since audit finding f4 (policy/xml-untyped-quoted-leading-zero-accepted). Progress is exit 0 with Code a string and the results the strings "0001" and "0002".'
SOURCE='src/DMN/DecisionTable.hs mkFsEither (unquoteCell), mkInputFsAt, mkFsAt, inferEvidence, redundantLeadingZero; audit 2026-09-26 finding f4 (markdown side)'
ARGS='--to=ts input.md'
