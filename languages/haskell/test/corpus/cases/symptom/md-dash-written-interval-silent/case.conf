TITLE='a date range written with a double dash, [24 Sep 2026 -- 24 Oct 2026], is still taken as literal text and the rule can never fire'
WHY='WHAT IT DOES: --to=ts emits day === "[24 Sep 2026 -- 24 Oct 2026]" at exit 0 with nothing on stderr. The author wrote a range; the rule fires only for an input whose text is that bracketed string, which nothing will be.

WHY IT SURVIVED THE UNREADABLE-TEST REFUSAL: that refusal recognises an interval by its S-FEEL shape -- a bracket from [ ( ], two endpoints separated by .., a bracket from ] ) [ -- and this cell has no .. in it. Widening the shape to other separators (--, an en dash, a spaced hyphen, the word to) is guessing at prose, and a bracketed label such as [TBD -- see note] or [draft] is plausible text in a column. So the interval half of that refusal was kept to the one separator S-FEEL defines, and this case records what that leaves behind.

WHAT PROGRESS LOOKS LIKE: a located refusal. Date support itself is held by DECISIONS.md D-3 and is not what fixes this; recognising the shape without guessing is.'
SOURCE='src/DMN/ParseCell.hs unreadableTestShape (the .. requirement); policy/md-unreadable-interval-refused'
ARGS='--to=ts input.md'
