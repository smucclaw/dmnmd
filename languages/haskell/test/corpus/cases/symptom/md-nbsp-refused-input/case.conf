TITLE='a non-breaking space inside an input cell is refused, though DMN rule 36 lists U+00A0 as white space'
WHY='DMN 1.3 §9.2 rule 36 enumerates FEEL white space and U+00A0 NO-BREAK SPACE is in it. dmnmd`s cell layer skips only ASCII space and tab (DMN.ParseCell.skipHorizontalSpace), so `< <NBSP> 5` is not a comparison and the column fails to read as Number.

The refusal is honest rather than silent -- it is loud, located, names the author`s own column and row, and renders the offending codepoint as \160 so an invisible character is at least visible. That is why this is not a wrong answer. It is still a conformance gap, and it lands on the one ingestion path dmnmd exists to serve: NBSP is what a paste out of Word or Google Docs leaves in a markdown table cell.

REHOMED. Until D-14 this gap was named nowhere in the machine-checked corpus. Its only witness was test/SFeelGrammar.hs, which asserted that DMN.SFeelGrammar parses "1\160+\160\&2" as arithmetic -- an hspec assertion about a module nothing imported. That module is deleted; this recording is where the gap lives now, against the live binary. See DECISIONS.md D-14.

Progress here means accepting the cell. The sibling md-nbsp-refused-output pins the same gap in the other position, because what is legal differs between them.'
SOURCE='src/DMN/ParseCell.hs skipHorizontalSpace; DMN 1.3 §9.2 rule 36; rehomed from test/SFeelGrammar.hs by DECISIONS.md D-14'
ARGS='--to=ts input.md'
