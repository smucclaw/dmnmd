TITLE='a non-breaking space inside an arithmetic output cell is refused, though DMN rule 36 lists U+00A0 as white space'
WHY='The output half of md-nbsp-refused-input. `1 <NBSP> + <NBSP> 2` is a well-formed FEEL addition under rule 36, and dmnmd refuses it because DMN.ParseCell.skipHorizontalSpace skips only ASCII space and tab. The plain-ASCII `1 + 2` in the same cell is accepted.

Recorded separately from the input case deliberately: what is legal in an input entry and in an output entry differ, and two separate cell-layer defects have already shipped that were silent in one position and loud in the other.

REHOMED from test/SFeelGrammar.hs, whose arithExpr block asserted exactly this string parsing -- see DECISIONS.md D-14. Progress here means accepting the cell.'
SOURCE='src/DMN/ParseCell.hs skipHorizontalSpace; DMN 1.3 §9.2 rule 36; rehomed from test/SFeelGrammar.hs by DECISIONS.md D-14'
ARGS='--to=ts input.md'
