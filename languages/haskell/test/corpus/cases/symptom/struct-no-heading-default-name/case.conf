TITLE='a table with no heading immediately above it takes the per-file default name f1, and several such tables collide'
WHY='grepTable re-runs maybeHeaderLines for each table and only sees the lines between the previous table and this one, so a second table under the same heading falls back to defaultName = "f" ++ fileIndex. Two tables under one heading is an entirely ordinary Markdown layout.'
SOURCE='app/ParseMarkdown.hs grepTable / defaultName; audit lens "table structure", finding 32'
ARGS='--to=ts input.md'
