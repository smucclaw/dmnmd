TITLE='a <decisionTable typeRef> is ignored, so a single-output column declared string is inferred Number'
WHY='tDecisionTable extends tExpression, which declares an optional typeRef (xsd/DMN13.xsd), and DMN 1.3 section 7.3.1 says that when an Expression that defines the output of a Decision includes a typeRef, the referenced type SHALL be the same as the type of the containing Decision. For a single-output table it is therefore one more place the column type may be written, beside the decision variable typeRef (policy/xml-decision-variable-types-single-output) -- and section 8.3.2 bars the <output> clause from carrying it, so in a conformant document it may be the ONLY place. dmnmd ignores it: ParseDMN.DecisionTable lists typeRef in the xpIgnoredAttrs of its pickler, so a declared type is parsed and thrown away and the column is inferred from its cells instead. Here the two cells discriminate. The table declares string and the cells are the bare numerals 1 and 2; honour the declaration and the outputs are the TEXT "1" and "2", ignore it and inference calls the column Number and they become 1.0 and 2.0, at exit 0 with no diagnostic. Not hypothetical: the OMG Chapter 11 examples under test/examples write decisionTable typeRef="tStrategy". Progress is a recording that returns "1" and "2" quoted.'
SOURCE='src/DMN/XML/ParseDMN.hs DecisionTable (xpIgnoredAttrs [..., "typeRef", ...]); src/DMN/XML/XmlToDmnmd.hs convTable singleOutput; audit 2026-09-26 finding f3'
ARGS='-f xml --to=ts input.dmn'
