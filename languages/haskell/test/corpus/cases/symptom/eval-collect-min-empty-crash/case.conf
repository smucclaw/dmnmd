TITLE='a Collect min/max table with no matching row dies on Prelude.minimum: empty list'
WHY='Guests=99 matches nothing, so the comprehension feeding `minimum` is empty
and the run aborts. Three things are wrong at once. The message names no table,
no column and no row — it is a bare Prelude error, so a user has nothing to act
on. It exits 1 from what is a perfectly ordinary situation: DMN says a Collect
table with no matching rows yields an empty result, not an error. And the whole
call stack lands inside `libraries/`, so the runner normalises all of it away
and the recording is a single unattributable line. C> has the identical defect
via `maximum`; C+ does not, because `sum []` is 0.'
SOURCE='src/DMN/DecisionTable.hs evalTable, HP_Collect Collect_Min arm'
ARGS='-q -t ts input.md'
STDIN_FILE='stdin'
