TITLE='an untyped XML input column mixing the string "2020" with the number 2021 is read as all-Number instead of being refused'
WHY='A column has one type, so a document that mixes a FEEL string literal ("2020") with a number (2021) in one untyped column is not describing one. D-2 refuses a column whose cells disagree (VConflict), and it can only do that if it sees the quotes. The XML inference pre-pass strips them first, so "2020" and 2021 are the same evidence, the column is quietly Number, and the string 2020 is rewritten as the number 2020 at exit 0: year === 2020.0 where the document says year === "2020". Progress is the D-2 refusal: exit 1, nothing emitted, an error that says the cells disagree.'
SOURCE='src/DMN/XML/XmlToDmnmd.hs resolveColumn firstPass; src/DMN/DecisionTable.hs mkFsEither (unquoteCell), columnVerdict; audit 2026-09-26 finding f4'
ARGS='-f xml --to=ts input.dmn'
