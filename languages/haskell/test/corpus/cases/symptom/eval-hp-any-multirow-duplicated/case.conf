TITLE='hit policy A, two matching rows with identical outputs: refused as multiple distinct rows, and the payload is the doubled answer a guard-only fix would return'
WHY='WHAT IT DOES: both rules match Age 5 and carry byte-identical outputs, which is exactly the situation DMN ANY exists to permit. The evaluator refuses with multiple distinct rows returned -- an Any lookup may return multiple matches but they should all be the same, then prints both DTrows. Exit 0, empty stderr; an unanswerable query is reported to stdout as prose and the process succeeds. WHY THAT IS WRONG: two things, and DECISIONS.md D-5 rules that they are fixed together or not at all. First, the HP_Any guard in evalTable reads not (null (nub …)) where it means length (nub …) > 1, so it is never false and an A table has never returned an answer -- that is what symptom/eval-hp-any-always-left already pins. Second, and invisible in that case because its table has ONE row, the success branch returns one entry per matched row where ANY is single-hit. This case makes the second bug visible while it is still shadowed by the first: the printed payload is literally the outputs list, which is what Right (row_outputs <$> outputs) would hand back, so it shows the doubled answer in advance. The recorded message is also false here -- nub collapses these two rows to one, so they are not distinct -- and a control run with row 2 changed to a genuinely different output produced identical text apart from the value inside the payload, meaning the tool today cannot distinguish a correct refusal from a wrong one. WHAT THE FIX LOOKS LIKE: this input should return ok once, not twice and not as an error. Fixing the guard alone is the trap D-5 names: eval-hp-any-always-left would go green while this input started silently returning a two-element list. So a diff here that shows a single ok is the progress wanted; a diff that shows two of them is the half-fix. Deliberately built as the complement to eval-hp-any-always-left, which is a one-row all-wildcard table and structurally blind to the second bug. Overlapping prefix comparisons were chosen over two wildcard rows because prefix comparisons are already policy-correct in the corpus, so nothing else in the cell layer is exercised, and the overlap is the kind DMN ANY is for rather than a degenerate duplicated rule. -t ts keeps the unrelated cli-showtojson-unknown-format defect out of the recording.'
SOURCE='src/DMN/DecisionTable.hs evalTable, the HP_Any arm; DECISIONS.md D-5, which requires a two-row recording before the fix'
ARGS='-q -t ts input.md'
STDIN_FILE='stdin'
