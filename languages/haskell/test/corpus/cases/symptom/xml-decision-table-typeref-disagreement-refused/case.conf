TITLE='a <decisionTable typeRef> that contradicts the decision variable is not noticed: the variable silently wins'
WHY='DMN 1.3 section 7.3.1: if an Expression that defines the output of a Decision includes a typeRef, the referenced type SHALL be the same as the type of the containing Decision. The decision type is what its <variable> declares (section 6.3.7). This document breaks the SHALL: the variable says number and the <decisionTable> says string. Because dmnmd ignores the table typeRef altogether, it never sees the contradiction: the variable is applied, the column is a Number and the outputs 1 and 2 come out as 1.0 and 2.0 at exit 0. Once the table typeRef is read, a silent choice between the two would be the same defect the other way round, so progress is a refusal that quotes both statements and exits 1 with nothing emitted.'
SOURCE='src/DMN/XML/XmlToDmnmd.hs convOutputCol; audit 2026-09-26 finding f3'
ARGS='-f xml --to=ts input.dmn'
