TITLE='an untyped XML output column of FEEL string literals "5" and "6" is inferred as Number, so the strings come back as the numbers 5.0 and 6.0'
WHY='The document states the strings "5" and "6" -- FEEL string literals, quotes included -- and dmnmd emits the numbers 5.0 and 6.0 at exit 0 with no diagnostic. The column has no typeRef, so XmlToDmnmd.resolveColumn infers one from a pre-pass over the cell texts, and two comments in the tree say that pre-pass keeps the quotes because they are "the only thing that distinguishes" a FEEL "2020" from 2020 (resolveColumn itself, and the VS arm of DecisionTable.inferEvidence, which has a quoted-string clause for exactly this). It does not: the pre-pass calls mkFsEither, and mkFsEither runs unquoteCell before any evidence is taken, so "5" is graded exactly like 5. The defect predates the section 8.3.2 follow-up to D-17 (trunk 18481de gives the same output for an untyped column), but that follow-up makes it reachable from dmnmd own output: under COLLECT COUNT the decision variable types the count (DMN 1.3 section 8.2.10), so a counted String column is written with no type anywhere and read back through inference. A markdown C# table with a declared String column holding 5 and 6 round-trips --to=xml then --from=xml --to=ts as {"flag":5.0} where the direct --to=ts gives {"flag":"5"}. This input is that shape, written by hand. Progress is a recording that returns "5" and "6" quoted.'
SOURCE='src/DMN/XML/XmlToDmnmd.hs resolveColumn firstPass; src/DMN/DecisionTable.hs mkFsEither (unquoteCell) and inferEvidence (the quoted-string clause)'
ARGS='-f xml --to=ts input.dmn'
