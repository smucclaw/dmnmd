TITLE='a sub-header row with fewer cells than the header silently deletes the columns it does not reach'
WHY='parseTableD merges the sub-header row into the header with zipWith over the header columns and the sub-header cells, and zipWith stops at the shorter list. The sub-header here has one cell for two columns, so the Price column is not given an empty domain: its header is deleted from the table. The data rows still read their Price cells, so the table that results has rule rows carrying an output cell and no output column. ts, js and py emit rules that return {}, and L4 emits GIVETH A ShortSubHeader with no declaration of that type, all at exit 0. --to=xml refuses, but with the diagnosis "no output column", which is not what the author did wrong. A blank sub-header cell already means no domain declared for its column, so the author could have written the missing cell; the reader should say that the sub-header row is short instead of discarding the column.'
SOURCE='src/DMN/ParseTable.hs parseTableD, the zipWith over (cols headerRow_1) and subHeadOk; audit 10 finding f1'
ARGS='--to=ts input.md'
