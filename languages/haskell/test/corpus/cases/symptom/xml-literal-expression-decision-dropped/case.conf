TITLE='a decision whose logic is a <literalExpression> is dropped with a warning, and the run still exits 0 with a partial translation'
WHY='convdec turns a decision it cannot convert into a Warning and returns no table, so a DMN file containing two decisions -- one decision table, one literal expression -- emits one function and exits 0. The user asked for a translation of the file and got a translation of part of it, with a green exit status; if stdout was redirected they have a .ts file that is missing a decision. Two things in the tree say that is the wrong side of the line. First, policy/md-partial-failure-emits-nothing pins the opposite choice for markdown -- when some tables come through and others do not, dmnmd emits nothing and exits 1, because partial output is indistinguishable from complete output. Second, CLAUDE.md defines the Warning/Error split by scope: a Warning is something dropped from inside a table that is still emitted (a <defaultOutputEntry>, the <annotation> column names), while an Error is a table that could not be represented faithfully and is therefore not emitted. A whole decision that cannot be represented at all sits on the Error side of that definition. The comparison case is policy/xml-unsupported-drgelement-rejected, where valid-DMN-that-dmnmd-does-not-model (<businessKnowledgeModel>) is refused at exit 1 with a message saying exactly that; the same class of input gets exit 0 here purely because it arrived as decision logic rather than as a DRG element. The counter-argument, which a future reader should weigh before acting: on a real model with eight decision tables and two literal expressions, refusing the whole file makes dmnmd useless, and warn-and-continue is the pragmatic choice -- in which case this case moves to policy and the WHY should say so. What must not change either way is that the skip is loud: silently dropping the decision would violate the rule that governs both readers.'
SOURCE='src/DMN/XML/XmlToDmnmd.hs convdec, the `Just (X.ExprLiteral _)` arm (warnAt ... skipped); contrast app/Main.hs parseTables, which exits 1 only on `any isError diags`'
ARGS='-f xml --to=ts input.dmn'
