TITLE='a quoted S-FEEL string literal keeps its quotes and compares against them'
WHY='In S-FEEL a string literal is written in double quotes, so the cell "Fall"
denotes the four-character string Fall. dmnmd compiles it to
`Season === "\"Fall\""` — a comparison against the six-character string
including the quote marks — so the row can only ever match input that literally
contains quotes. A silent misparse of the classic kind: nothing is reported and
the table looks right.

This is not hypothetical. The XML reader emits quoted strings, because that is
how DMN XML writes an outputEntry (`<text>"adult"</text>`), so any table that
round-trips through XML and back into markdown acquires cells this grammar
cannot read. It is also the reason no other corpus case contains a quote
character: the surface simply does not support one today.'
SOURCE='src/DMN/DecisionTable.hs mkF, the string fallthrough'
ARGS='--to=ts input.md'
