TITLE='a decision table with columns but no rules is accepted silently, and the Python backend emits a syntax error'
WHY='parseDataRows is a `many`, so zero rules parses cleanly. Nothing is reported, the
run exits 0, and every backend emits an artefact with no behaviour in it.

This case runs --to=py because that output is the one nobody can argue with: it is
`def NoSep ( Season ) :` followed by a blank line, a function with an empty body,
which is a SyntaxError. Python is the only one of the three backends where the
emptiness is fatal rather than merely useless, so it is the honest observable to pin.
For the record the other two: --to=ts gives `export function NoSep ( Season ) { }`,
which returns undefined for every input, and --to=l4 gives a BRANCH whose only arm is
the synthesized OTHERWISE "".

Note what makes this a table at all: there is no |---| separator row. WITH one, the
same zero-rule table is REFUSED - exit 1, a located parse error at the separator. So
dmnmd today rejects the well-formed Markdown spelling of an empty table and accepts
the malformed one. That asymmetry is the finding; an earlier version of this case
pinned only the refusing half and would have recorded the tool as behaving correctly.

Distinct from symptom/struct-hitpolicy-only-table-accepted, which is a table whose
only column is the hit policy.'
SOURCE='src/DMN/ParseTable.hs parseDataRows (a many, so zero rules is legal); src/DMN/Translate/PY.hs'
ARGS='--to=py input.md'
