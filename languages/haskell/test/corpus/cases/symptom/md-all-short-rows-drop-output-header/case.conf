TITLE='when every data row is short the output column vanishes from the table, and the rules return nothing'
WHY='The sibling of struct-short-row-truncated, which has one short row and keeps its output header. mkDTable builds the typed headers by zipping the input and output headers with the transpose of the rows, and zipWith stops at the shorter list. With one short row among full ones the longest row keeps the transpose as wide as the header and every header survives, which is why that case looked contained. Here no row reaches the Dish column, so the transpose has one column, the Dish header is deleted, and the table has no output column: ts, js and py emit rules that return {}, and L4 emits GIVETH A MAYBE AllShort with no declaration of that type, all at exit 0. --to=xml refuses, but with the diagnosis "no output column", which is not what the author did wrong. The author left out the Dish cell of both rows, and the reader should say that.'
SOURCE='src/DMN/BuildTable.hs mkDTable, zipWith inferTypes over the headers and the transpose of the rows; audit 10 finding f2'
ARGS='--to=ts input.md'
