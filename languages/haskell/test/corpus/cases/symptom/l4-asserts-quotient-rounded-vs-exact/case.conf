TITLE='an asserted quotient that does not terminate is rounded by dmnmd and exact in l4, so l4 run reports the assertion false'
WHY='A quotient that does not terminate is rounded by dmnmd to 34 significant digits (divideFeel, DECISIONS.md D-1), because FEEL numbers are decimal128.
The L4 function computes it as 10 / d, and l4 divides exactly: measured with l4, 1 / 3 EQUALS 0.3333333333333333 is false while 1 / 3 * 3 EQUALS 1 and 0.1 + 0.2 EQUALS 0.3 are true.
So the assertion below, whose expected value is the interpreter answer 3.333333333333333333333333333333333, is reported false by l4 run, on a table whose logic is right.
Neither side is wrong about the table; they disagree about what a number is, and --asserts is where that shows.
It is a symptom and not a policy because the right outcome is not decided: skipping such a region with a comment, asserting a tolerance, or making the L4 backend round too would each be a ruling.
No markdown fixture in the tree reaches it: the one with a quotient, policy/num-divide-repeating-rounded, has its only region at Divisor = 0, which evalTable refuses.'
SOURCE='src/DMN/Translate/L4.hs assertLines; src/DMN/Number.hs divideFeel'
ARGS='--to=l4 --asserts input.md'
