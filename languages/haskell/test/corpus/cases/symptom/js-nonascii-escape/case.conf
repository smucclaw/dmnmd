TITLE='the JS/TS backend renders non-ASCII string cells with Haskell escape syntax'
WHY='The JS/TS path renders strings through Haskell show, which escapes U+00A7 as \167 and then inserts the \& empty-string separator so the following digit is not absorbed. JavaScript reads neither escape, so the emitted literal is wrong. The L4 backend gets this right, so this is a backend defect rather than a cell-parsing one — it is in the corpus because the rewrite touches the same rendering path.'
SOURCE='src/DMN/Translate/FEELhelpers.hs / src/DMN/Translate/JS.hs; audit lens "type inference", finding 21 (out of lens, demonstrated)'
ARGS='--to=ts input.md'
