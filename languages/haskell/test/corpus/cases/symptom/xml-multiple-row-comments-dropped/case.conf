TITLE='a rule carrying more than one comment loses every comment, while the warning says they are kept'
WHY='Every rule here has two <annotationEntry> elements, and the emitted TypeScript
contains no comment at all — not one of the four texts survives. Meanwhile stderr
prints the usual warning saying the annotationEntry text "is kept, as a row comment"
and that only the column provenance is lost. So this is worse than a silent discard:
there is a diagnostic, and it asserts the opposite of what happened.

The mechanism. JS.hs annotationsAsComments switches to the prefixed form —
"// why: under the age of majority" — as soon as a row has more than one comment,
and builds it by zipping the row comments against the table s comment COLUMN headers.
On the XML path XmlToDmnmd.hs builds header from the input and output columns only,
so there are no DTCH_Comment headers, the zip is against the empty list, and every
comment falls out. One comment per row takes the unprefixed branch and survives,
which is why this looks fine in every other XML fixture.

Two controls establish that this is a backend defect and not a deliberate omission,
and both are worth re-running before you touch it:

  --to=l4 on THIS FILE emits the comments (as "-- under the age of majority; s.2(1)"),
  so the IR carries them faithfully.

  policy/md-comment-column is the markdown single-column control, and a markdown table
  with TWO (comment) columns emits "// NoteA: ..." / "// NoteB: ..." — the prefixed
  form working exactly as intended. The XML path simply never reaches that intent.

Affects --to=ts, --to=js and --to=py, which share JS.hs. The fix is to give the XML
path synthetic comment headers, which would also let the warning stop lying — so
expect this case and the warning wording pinned by policy/xml-annotations-warn to
move together.'
SOURCE='src/DMN/Translate/JS.hs annotationsAsComments; src/DMN/XML/XmlToDmnmd.hs header construction'
ARGS='-f xml --to=ts input.dmn'
