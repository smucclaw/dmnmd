TITLE='FEEL string escape sequences are not interpreted: a cell written "a\tb" compares against backslash-t, not a tab'
WHY='DMN 1.3 §9.2 rules 29 and 38 give a string literal an escape production: \" \\ \n \r \t and \uXXXX. dmnmd has no escape handling anywhere. DecisionTable.unquoteCell strips the surrounding quotes all-or-nothing and passes the body through verbatim, so the two characters backslash and t stay two characters, and the TypeScript backend then re-escapes the backslash on the way out. The emitted guard is S === "a\\tb" and it will never match a string containing a tab.

Exit 0, nothing on stderr. It is at least self-consistent -- dmnmd re-escapes exactly what it read -- so a table written and read only by dmnmd behaves predictably. It is still a silent divergence from FEEL, and it bites the moment a cell is authored against the standard or imported from a DMN document.

REHOMED. The only witness to this gap was test/SFeelGrammar.hs, whose 11-example stringEscapeSequence block tested DMN.SFeelGrammar -- a module nothing imported, and whose implementation VALIDATES rather than decodes (it returns the two-character text \t unchanged) and whose hexDigit accepts only 0 9 a f A F because ParsingUtils.inClass does not expand ranges. So the deleted tests did not describe a working alternative either. See DECISIONS.md D-14.

Progress here means the guard tests a real tab.'
SOURCE='src/DMN/DecisionTable.hs unquoteCell; DMN 1.3 §9.2 rules 29 and 38; rehomed from test/SFeelGrammar.hs by DECISIONS.md D-14'
ARGS='--to=ts input.md'
