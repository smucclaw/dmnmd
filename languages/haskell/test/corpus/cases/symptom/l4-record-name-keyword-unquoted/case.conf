TITLE='the DECLARE record type name skips quoteVar, so a table named with an L4 keyword emits DECLARE WHERE HAS and fails to parse'
WHY='BUILD-SPEC section 9.6 made column, table and record FIELD names backtick-quoted when they collide with an L4 keyword, and quoteVar does exactly that for the function name. The record TYPE name does not go through quoteVar at all: recName = pascal (tableName dt), and pascal only capitalises. So a multi-output table named WHERE emits DECLARE WHERE HAS, GIVETH A WHERE and mkWHERE v1 v2 MEANS WHERE WITH, all bare, on the same page as a correctly quoted backtick-WHERE on the function header line - the same name quoted in one place and unquoted in another, in one file. Real l4 check fails on the very first token: unexpected WHERE, expecting identifier or space token, and exits 1. An all-caps table name looks contrived, but pascal manufactures the collision out of innocuous input: a table named a becomes DECLARE A HAS, and A is in reservedWordsL4 - verified, l4 check gives unexpected A at 1:9 and exits 1. Single-output tables are unaffected because they never emit a record, which is why the existing policy/md-multi-output-l4-record case (table name MultiOut) could not see this.'
SOURCE='src/DMN/Translate/L4.hs recName = pascal (tableName dt), used by declareRecord/ctorHelper/baseGiveth without quoteVar; contrast fnHeader which does call quoteVar'
ARGS='--to=l4 input.md'
