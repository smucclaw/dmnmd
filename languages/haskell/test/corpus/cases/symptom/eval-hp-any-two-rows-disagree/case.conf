TITLE='hit policy A with TWO matching rows whose outputs DISAGREE: must stay an error, and the message must not be the one every A table gets today'
WHY='Age=5 matches both rows and they name different Verdicts, so under DMN this
table is ill-defined and refusing is the CORRECT answer. It is recorded as a
symptom rather than a policy because the message is currently indistinguishable
from the one a perfectly well-formed A table gets: the guard fires on every A
table, so this recording and its agreeing twin differ only in the raw `show
outputs` dump appended to the message. Once D-5 lands, this text is reached only
by a genuine conflict and this becomes the case that pins the surviving half of
the semantics.

Note the second output is written `deny` rather than `no`. A `no` cell infers as
Boolean, and under D-2 anchored inference the column is then refused before
evalTable is ever reached, at exit 1 — which would look like the ANY defect and
is not. Anyone rewriting this fixture should keep the outputs clear of the
boolean vocabulary.'
SOURCE='src/DMN/DecisionTable.hs evalTable, the HP_Any arm. DECISIONS.md D-5'
ARGS='-q -t ts input.md'
STDIN_FILE='stdin'
