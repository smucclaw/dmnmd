TITLE='a negative number infers STRING, poisoning the whole column into string comparisons'
WHY='The inference regex ^\d+(\.\d+)?$ has no sign and no leading-dot alternative, so "-5" infers String while "20" infers Number; the column is then left untyped. A downstream caller passing the number -5 or 20 matches nothing. `.5` and `1e3` fall into the same hole.'
SOURCE='src/DMN/DecisionTable.hs inferType, the numeric regex; audit lens "type inference", finding 18 (and "numeric cell parsing", finding 7)'
ARGS='--to=ts input.md'
