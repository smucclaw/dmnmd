TITLE='prose in a Number output column is read as arithmetic over undefined variables: Non-Participating emits (Non - Participating), which throws ReferenceError'
WHY='DMN.ParseCell.arithmetic guards its arm on FNF3{} -- "an operator was actually applied" -- so that a bare word cannot become FFunction (FNF1 "Fall") and render as an undefined identifier. The haddock at ParseCell.hs argues exactly that case. The guard is one level too shallow: it constrains the SHAPE of the node but not its OPERANDS, so an FNF3 whose leaves are themselves bare identifiers passes.

Measured, at exit 0 with nothing on stderr: `Non-Participating` emits {"Out":(Non - Participating)} and `n/a` emits {"Out":(false / a)} -- the author`s `n` silently read as the boolean false by parseFNF0. Both throw under node:

  Ref(a) THREW: ReferenceError Non is not defined
  Ref(b) THREW: ReferenceError a is not defined

Found by RUNNING the emitted JavaScript, not by reading it. Nothing in the dmnmd test suite executes generated output, which is why the defect the guard was written to prevent is still reachable one level down. Both spellings are ordinary things to write in an insurance table.

The input position fails differently and is its own defect: the diagnostic quotes back text the author never wrote -- `the input cell reads "Non - Participating"` with spaces inserted, and `"false / a"` with the author`s `n` replaced.

Progress here means refusing both cells.'
SOURCE='src/DMN/ParseCell.hs arithmetic, the FNF3{} guard; src/DMN/ParseFEEL.hs parseFNF0'
ARGS='--to=ts input.md'
