TITLE='16777217 is not representable in binary32, so it silently emits as 1.6777216e7'
WHY='WHAT IT DOES: the table writes 16777217 in both the guard and the output cell; the emitted TypeScript compares against 1.6777216e7 and returns 1.6777216e7, at exit 0 with nothing on stderr. WHY THAT IS WRONG: DMN.Types spells the numeric value VN Float, which is binary32 with a 24-bit significand, so every integer above 16777216 is rounded to a representable neighbour before anything downstream sees it. The rule that comes out can never match the value it was written for, and no diagnostic says so. FEEL numbers are decimal128 (DMN 1.3 section 10.3.2.3.1), so this is a conformance defect and not only a precision one. WHAT THE FIX LOOKS LIKE: DECISIONS.md D-1 rules that VN becomes Scientific, so the recording should change to compare against and return 16777217 exactly, still at exit 0 and still with an empty stderr; the only change wanted here is the digits. If a future diff shows a diagnostic or a nonzero exit instead, that is a different bug. Distinct from symptom/infer-version-float-collapse, where 1.1 and 1.10 are the same number and the defect is that inference reaches Float at all; here 16777216 and 16777217 are different numbers and one of them cannot be held. Both columns are explicitly typed so this recording does not also depend on inference, which D-2 is queued to change. The L4 backend is worse than the TypeScript shown here: showNumL4 prints this value as a plain 16777216, an ordinary-looking integer one less than the source literal, where the TS rendering at least looks unusual enough to prompt a second look.'
SOURCE='src/DMN/Types.hs, the VN Float constructor; DECISIONS.md D-1, which requires this recording to exist before the change'
ARGS='--to=ts input.md'
