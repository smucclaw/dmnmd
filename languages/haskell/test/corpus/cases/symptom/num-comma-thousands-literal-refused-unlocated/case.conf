TITLE='a bare `1,000` is refused as thousands-shaped'
WHY='RETRACTION. This case previously read "a bare `1,000` becomes the OR of 1 and 0" and blamed the comma split for a misparse. That diagnosis was WRONG ABOUT THE PARSE. FEEL has no grouping production -- rule 31 admits no separator, and rules 32-33 are digit = [0-9] and digits = digit , {digit} -- so `1,000` is legally TWO unary tests, `1` and `000`, and `000` is a well-formed literal denoting 0. The old output was conformant. What was actually wrong is the SILENCE: nobody writing `1,000` in a value column means "1 or 0", and dmnmd said nothing. So the fix is a refusal, not a new parse -- inventing a thousands separator would be a markdown-surface extension under BUILD-SPEC-dmnmd-extensions.md §6 and could not be added without breaking policy/md-multivalue-cell and test/golden/miles-card-dmn.md, whose `4111, 4112` is the same shape. Still symptom/ only because the message names DecisionTable.hs rather than the table, column and row; promotes with the CellSite plumbing.'
SOURCE='src/DMN/ParseCell.hs thousandsGrouped; src/DMN/DecisionTable.hs mkFsEither, thousandsMsg'
ARGS='--to=ts input.md'
