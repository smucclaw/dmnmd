TITLE='a comparison or a closed interval in an OUTPUT cell emits a JavaScript arrow function as the output value, and JSON.stringify drops the field'
WHY='An output entry must name a VALUE. `< 5` and `[1..5]` are tests, and there is no value they denote. dmnmd accepts both at exit 0 and the backends render the test as a predicate lambda:

  return {"Out":(x)=> x < 5.0};
  return {"Out":(x)=> 1.0 <= x && x <= 5.0};

Executed under node, JSON.stringify(OutCmp("a")) is {} -- a function is not JSON, so the output field silently disappears from the answer. Found by RUNNING the emitted JavaScript.

What makes this a defect rather than a design choice is the neighbour: a HALF-OPEN range in the same position IS refused, with a good message saying an excluded endpoint has no value to name. So the layer already knows that a range in an output cell is suspect; it refuses the safe case and accepts the two that produce a wrong answer.

Progress here means refusing all three, with the message the half-open case already has.'
SOURCE='src/DMN/DecisionTable.hs structuralErrors, the output-cell arms; src/DMN/Translate/JS.hs FSection and FInRange rendering'
ARGS='--to=ts input.md'
