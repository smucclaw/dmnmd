TITLE='a <decisionTable> with no rules compiles to a function with no branches, no diagnostic, exit 0'
WHY='A decision table carrying inputs and outputs but zero <rule> elements is accepted and emitted as `export function Band ( age : number ) {\n}` -- a function that returns undefined for every input, with nothing said on stderr and exit 0. CLAUDE.md names this shape explicitly when it explains why a refused table is not emitted: a table that can never match is a wrong answer that exits 0. Here it is not merely emitted, it is emitted in silence. Downstream this is worse than a refusal, because the caller gets a function that typechecks and quietly answers undefined. The markdown reader refuses the same shape -- a table with a header row and no data rows fails to parse with a located message and exit 1 (`failed to parse table Empty at 2:1 ... expecting parseDataRows`) -- so the two readers disagree about whether an empty decision table is input at all. Whatever the resolution, one of the two has to move; recording the XML side here makes the disagreement visible.'
SOURCE='src/DMN/XML/XmlToDmnmd.hs convTable -- nRows is allowed to be 0 and no structural check mentions it; src/DMN/Translate/JS.hs emits the branch list as-is'
ARGS='-f xml --to=ts input.dmn'
