TITLE='an undeclared column mixing the string "2020" with the number 2021, and one mixing "yes" with no, is read as one type'
WHY='A column has one type, so a table that mixes a string literal with a bare numeral (or a quoted boolean word with a bare one) in one undeclared column is not describing one. D-2 refuses a column whose cells disagree (VConflict), and it can only do that if it sees the quotes. The markdown reader unquotes "2020" and "yes" in pass 1 (unquoteCell), so they are graded exactly like 2020 and yes, the columns type quietly as Number and Boolean, and the author strings are rewritten as the number 2020.0 and the boolean true at exit 0. The XML reader refuses the same mix since audit finding f4 (policy/xml-untyped-quoted-and-bare-refused). Both an input column and an output column are here because they reach pass 1 through different wrappers. Progress is exit 1, nothing emitted, and a D-2 error for each column naming both cells.'
SOURCE='src/DMN/DecisionTable.hs mkFsEither (unquoteCell), mkInputFsAt, mkFsAt, columnVerdict, inferenceErrors; audit 2026-09-26 finding f4 (markdown side)'
ARGS='--to=ts input.md'
