TITLE='`>= 1,000` is refused as thousands-shaped'
WHY='RETRACTION, on the same grounds as num-comma-thousands-literal-refused-unlocated -- read that one first. This is the threshold spelling, and it is the more alarming of the two: the old output was `(Amount >= 1.0 || Amount === 0.0)`, a guard that fires for almost every input, in a column whose author plainly meant "at least one thousand". Conformant, and catastrophically not what was meant. The refusal names the repair both ways: drop the separator, or add a space if two alternatives really were intended.'
