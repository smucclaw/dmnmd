TITLE='`Infinity` is accepted and emitted verbatim into the guard'
WHY='Haskell`s `read` accepts `Infinity` and `NaN` as Float. DMN 1.3 §9.2 rule 31 has no such literal, and FEEL numbers are decimal. The emitted TypeScript happens to mean something in JavaScript, which is why this is silent: the guard compiles and runs and simply is not DMN. The same cell in a Python backend would emit a bare undefined name.'
SOURCE='src/DMN/DecisionTable.hs mkFEither, the `readMaybe :: Maybe Float` fallthrough at :200-202'
ARGS='--to=ts input.md'
