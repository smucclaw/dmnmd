TITLE='not([1..5]) is refused because dmnmd has no IR for negation -- a deferral, not a destination'
WHY='Still a symptom for the original reason: negation is a real S-FEEL construct (rule 12.b) that dmnmd should one day implement rather than refuse. What CHANGED under D-2 is which refusal fires. This fixture holds TWO malformed cells -- row 2 [1..5] [10..20] is a botched interval that the anchored grammar refuses as well -- so the column now trips the column-level "cannot infer a type" refusal before any cell-level message is built. The negation-specific message is not lost: it is pinned by policy/md-negation-in-numeric-column-refused, where the rest of the column is well-formed. Note that a Left from parseNumberCell is NOT evidence the column is non-numeric when it is one of the two NAMED refusals; without that distinction (DMN.ParseCell.namedRefusal) this fixture would have typed String and emitted an equality test against the literal text not([1..5]) at exit 0.'
SOURCE='src/DMN/ParseCell.hs peelNot / negationMsg; src/DMN/DecisionTable.hs inferenceErrors'
ARGS='--to=ts input.md'
