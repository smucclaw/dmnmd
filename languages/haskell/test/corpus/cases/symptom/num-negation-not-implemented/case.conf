TITLE='`not([1..5])` is refused because dmnmd has no IR for negation -- a deferral, not a destination'
WHY='STILL A SYMPTOM, and deliberately so. The refusal is a large improvement on what it replaced: the old interval recogniser was an UNANCHORED search, so it matched [1..5] INSIDE not([1..5]) and threw the negation away, compiling the cell to its own exact logical complement at exit 0. The message says that out loud, so anyone who hits it learns what their old output meant. But rule 12.b, `not`, `(`, simple positive unary tests, `)`, IS IN THE S-FEEL GRAMMAR, so refusing it is dmnmd declining to implement a conformant construct. The destination is to COMPILE it -- `!(1.0 <= Age && Age <= 5.0)` -- which needs an FNot constructor in FEELexp and arms in the interpreter and in all four backends. That is deferred because 10 of the 16 library-side FEELexp matches end in a catch-all, so -Werror=incomplete-patterns would not find the sites that need it. This case was briefly named num-negation-refused-unlocated and carried boilerplate saying it promoted once cell diagnostics were located. That was wrong on both counts and is retracted here: the diagnostic IS located now (`table "NotRange": column "Age": row 1`) and the case still does not promote, because location was never what was wrong with it. Contrast policy/num-function-call-refused, where the refusal IS the destination -- invocation has no production in rules 1-38 at all, and that argument does not transfer to rule 12.b.'
SOURCE='src/DMN/ParseCell.hs peelNot, negationMsg; located by DMN.DecisionTable.mkFAt'
ARGS='--to=ts input.md'
