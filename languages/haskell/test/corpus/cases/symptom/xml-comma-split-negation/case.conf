TITLE='a FEEL negation `not("Fall", "Winter")` in a DMN XML cell is shredded into comma-separated fragments with unbalanced quotes'
WHY='mkFsEither splits every cell on commas before anything looks at what the cell means, so a single FEEL negation becomes four fragments, two of them with unbalanced quotes and parentheses. Nothing downstream can reconstruct the negation. This is the SAME comma-split defect as symptom/num-comma-thousands-threshold, reached through the XML reader instead of the markdown reader, and it is the defect that test/DmnXmlSpec.hs freezes as an expectation around the "Dish" table. The reader does at least warn now, which is the part PR #17 added; the shredding is what has to change.'
SOURCE='src/DMN/DecisionTable.hs mkFsEither splitOn ","; frozen in test/DmnXmlSpec.hs (search for KNOWN DEFECT)'
ARGS='-f xml --to=ts input.dmn'
