TITLE='an integer past 2^53 becomes a Python float literal, and a DIFFERENT value matches its row'
WHY='WHAT IT DOES: the cell reads 9007199254740993 and the emitted Python reads `Balance == 9007199254740993.0`, at exit 0 with nothing on stderr. The trailing `.0` makes it a float literal, and Python parses it as 9007199254740992.0 -- so running the emitted module, the authors own value 9007199254740993 falls through to the wildcard row, while 9007199254740992, a number the table never mentions, matches the row written for ...93. WHY THAT IS WRONG: it is a wrong answer at exit 0, which CLAUDE.mds governing rule calls strictly worse than a refusal. It is also worse in KIND than what it replaced. Before D-1 this emitted 9.007199e15 and the authors value simply failed to match -- a false negative, which is visibly broken the first time anyone tests it. Now a value the table does not contain silently claims a branch, which is a false positive and can go unnoticed indefinitely. The number reaching the backend is exact; only the spelling loses it. WHERE IT LIVES: DMN.Number.showNumFloatish is `formatScientific Fixed Nothing`, which always writes a fractional part, and PY.hs shares it with JS.hs. Its own haddock defers the question. Python is the ONLY affected target and the fix is Python-only: Python has arbitrary-precision ints, and an int literal compares exactly against both ints and floats, so emitting an integral value WITHOUT the `.0` is exact where the float literal is not. JS and TS have no integer type to forfeit -- 9007199254740993 is unrepresentable in a JS Number however it is spelled -- and the L4 backend already goes through showNumPlain and is exact. WHAT MUST NOT HAPPEN WHEN THIS IS FIXED: do not fix it by widening showNumFloatish for all three backends without deciding what the emitted Pythons output TYPE should be, which is the reason the `.0` is there at all. FOUND BY: verify lens 1 of the D-1 workflow, by running the emitted Python rather than by reading it -- no dmnmd test executes generated code.'
SOURCE='src/DMN/Number.hs, showNumFloatish; src/DMN/Translate/PY.hs:137; DECISIONS.md D-1'
ARGS='--to=py input.md'
