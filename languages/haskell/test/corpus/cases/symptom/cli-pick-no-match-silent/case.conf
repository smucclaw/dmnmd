TITLE='a --pick name that matches no table produces no output, no diagnostic and exit 0'
WHY='Three tables are read successfully and then all three are discarded because the user named a fourth that does not exist. Nothing is printed on either channel and the status is 0, so a typo in --pick is indistinguishable from success. With -o FILE it is worse: the run creates a zero-byte out.ts and exits 0, which is exactly the shape the corpus README records as already having been fixed once for parse failures (a redirect silently produces an empty output file). This violates the governing rule in CLAUDE.md, that anything we parse but do not honour must produce a loud diagnostic and never be silently discarded. The exit-status table has no row for an unmatched --pick; the nearest row, markdown with decision tables equals 0, is about whether the READ succeeded, and it did. So the exit status is arguable but the silence is not. Main.hs already computes the right message and then hides it: line 62 is when (null pickedTables) $ mylog opts $ "available tablenames were " ++ show (tableName <$> mydtables), and mylog is gated on --verbose, so the diagnostic exists and only -v users ever see it. The minimum fix is to print that line to stderr unconditionally; whether an unmatched --pick should also exit 1 is the judgement call for whoever fixes it, and the zero-byte output file is the strongest argument that it should. Note the case must stay classified by what it records, not by the fix: if the fix only adds the stderr line and leaves the status at 0, re-record and move to policy.'
SOURCE='app/Main.hs pickedTables filter and the mylog-gated available-tablenames message (app/Main.hs:60-62)'
ARGS='--to=ts --pick Nonexistent input.md'
