TITLE='under a list-valued hit policy a <decisionTable typeRef> types the RESULT LIST, so the column takes its element type'
WHY='A COLLECT table whose <decisionTable> typeRef is BandList, an isCollection itemDefinition over string, and whose <variable> carries no typeRef. By section 7.3.1 the table typeRef is the same statement as the decision variable, and under bare C, R or O the decision result is a list, so the typeRef describes the list across rules and the column takes the ELEMENT type, string (the same rule policy/xml-collect-variable-is-list pins for the variable). dmnmd ignores the table typeRef, so the column is inferred from its bare numeral cells 1 and 2 and the outputs come out as the numbers 1.0 and 2.0 at exit 0. Progress is a recording that returns "1" and "2" quoted; the list-ness must not be applied to the column as well, or the cells would come out as lists.'
SOURCE='src/DMN/XML/ParseDMN.hs DecisionTable (xpIgnoredAttrs); src/DMN/XML/XmlToDmnmd.hs convOutputCol and resolveElementType; src/DMN/Types.hs resultShape; audit 2026-09-26 finding f3'
ARGS='-f xml --to=ts input.dmn'
