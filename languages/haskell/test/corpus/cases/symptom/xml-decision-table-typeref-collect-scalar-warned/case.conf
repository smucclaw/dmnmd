TITLE='a scalar <decisionTable typeRef> on a COLLECT table is dropped in silence, where the decision variable gets a warning'
WHY='The negative control for xml-decision-table-typeref-collect-is-list, and the table-level twin of policy/xml-collect-variable-scalar-warned. Under a list-valued hit policy the decision result is a list, so a typeRef naming a single value (number, here) contradicts the hit policy and cannot be the result type. dmnmd must not apply it to the output column -- the cells are the strings "gold" and "silver", and number would refuse them -- and must not drop it in silence either: the governing rule is that anything parsed but not honoured is a loud, located diagnostic. Today it is ignored with no diagnostic at all, because the attribute is not read; progress is the same output plus a warning on stderr, exit 0.'
SOURCE='src/DMN/XML/ParseDMN.hs DecisionTable (xpIgnoredAttrs); src/DMN/XML/XmlToDmnmd.hs resolveElementType; audit 2026-09-26 finding f3'
ARGS='-f xml --to=ts input.dmn'
