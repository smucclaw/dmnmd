TITLE='a column header marked both (in) and (out) silently becomes an input'
WHY='parseColHeader accepts a (in), (out) or (comment) label on either side of the type declaration and combines the two with mylabel_postA <|> mylabel_postB, so the first one written wins and the other is discarded with no diagnostic. Dish (in) (out) is an input and Dish (out) (in) is an output, though the author wrote both words. The table here is not rescued by reviseInOut, which relabels the rightmost column only when every column is an input, because Price is an output. So the function takes Dish as an argument and the rules test Dish against Stew and Soup, which the author who wrote (out) meant the function to return. It exits 0 and no backend says anything. struct-label-pre-wins records the sibling in which a prefix label and a post label disagree.'
SOURCE='src/DMN/ParseTable.hs parseColHeader, mylabel_postA <|> mylabel_postB; audit 10 finding f7'
ARGS='--to=ts input.md'
