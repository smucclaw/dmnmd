TITLE='D-6 warns about informationRequirement only: import, knowledgeSource, knowledgeRequirement, authorityRequirement, textAnnotation and association are still dropped in total silence'
WHY='WHAT IT DOES: this document carries seven DRG constructs around one decision
table. Exactly ONE of them now produces a diagnostic -- the
informationRequirement, warned about by D-6. The other six vanish without a word:
the <import>, the <knowledgeSource>, the <knowledgeRequirement> pointing at it
through requiredKnowledge, the <authorityRequirement>, the <textAnnotation> and
the <association> joining them. Exit 0.

WHY THAT IS WRONG: the governing rule in CLAUDE.md says anything parsed but not
honoured must produce a loud, located diagnostic and must never be silently
discarded. D-6 names five constructs and only informationRequirement was fixable
where D-6 said to fix it, so this case records the remainder honestly instead of
letting the commit imply the rule is now satisfied.

WHY THE REST WERE NOT DONE IN THE SAME COMMIT: they are a strictly larger change
and a different one. informationRequirement is PARSED, into the decInfoReq field
of Decision, so XmlToDmnmd can see it and describe it. The others are not parsed
at all -- xpIgnoredElemsOf in ParseDMN.hs consumes knowledgeRequirement,
authorityRequirement, textAnnotation, association and import to the unit value
and keeps nothing, not even a count, so there is nothing downstream to report on.
Warning about them means first making ParseDMN retain something, which is a
change to the pickler tree rather than to the converter. D-6 scoped itself to the
afternoon that XmlToDmnmd can do alone.

Two more silent drops are visible here and are named in no ruling at all:
defInputData is written by the pickler and read by nothing in src, so every
inputData node and the typeRef on its variable disappear; and knowledgeSource is
parsed into DrgKS, carried in defDrgElems, then filtered out by allDecisions,
which comprehends only DrgDec. The second is why the knowledgeSource here leaves
no trace even though it survived parsing.

WHAT THE FIX LOOKS LIKE: six more warning lines, after ParseDMN retains the
dropped element names. A diff here that shows them is progress; a diff in which
the single existing warning disappears is a D-6 regression and belongs to
policy/xml-informationrequirement-dropped-silently.

Note a knowledgeRequirement can only survive at all when it points into an
import: a requiredKnowledge naming an in-document businessKnowledgeModel is
unreachable, because dmnmd already refuses that element by name at exit 1. This
fixture points at a BKM_1 that is not present, which no reader here validates.'
SOURCE='src/DMN/XML/ParseDMN.hs xpIgnoredElemsOf and the decisionInterlude / definitionsEpilogue lists; defInputData, written and never read; allDecisions in XmlToDmnmd.hs, which drops DrgKS. DECISIONS.md D-6'
ARGS='-f xml --to=ts input.dmn'
