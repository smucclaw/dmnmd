TITLE='the enum subhead row is typed with the PRE-inference column signature, so numeric output enums never match'
WHY='ParseTable builds the enums from the type as WRITTEN in the header; type inference then runs in mkDTable and reprocessRows re-types only the data rows, not the enums. sortCell elemIndex returns Nothing for every cell, so HP_OutputOrder silently degrades to row order. Adding an explicit `: Number` fixes it, which pins the diagnosis exactly.'
