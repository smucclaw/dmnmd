TITLE='--to=xml is accepted by the option parser, does all the reading, then dies from the output loop with an unlocated error'
WHY='CLAUDE.md records that --to=xml is not implemented at all despite Xml existing in FileFormat, and the repo README shows `dmnmd README.md --to=xml` as an example. What actually happens: optparse accepts xml (its own reject message advertises it - see policy/cli-to-bogus-rejected-at-parse-time, whose recording contains the list `ts, js, py, xml, md, l4`), dmnmd opens and truncates any -o file, reads and parses the whole input, and only then calls errorWithoutStackTrace from the outputTo fallthrough with a second, shorter list of formats that does not include xml.

Three things are wrong and each is separately fixable. (1) Two lists in one binary disagree about what --to accepts, and the user meets the generous one first. (2) The refusal fires after all the work, including after the -o file has been destroyed - see symptom/cli-out-opened-before-input-read. (3) The diagnostic is loud but not located: it names no input file, no table, and no position, which is the half of the CLAUDE.md rule about loud, LOCATED diagnostics that this misses.

There is a real counter-argument for calling the exit-1-and-refuse behaviour policy, on the grounds that CLAUDE.md blesses deliberate refusals (as with the L4 backend and list-valued hit policies). What defeats it is symptom/cli-to-xml-succeeds-on-tableless-input: the same flag exits 0 on an input with no table. A refusal that is contingent on the input is not a deliberate refusal, it is an unimplemented branch. Fix by rejecting the format once, up front, in parseFileFormat or immediately after parseOptions - or by implementing the writer.'
SOURCE='app/Main.hs outputTo fallthrough (crash "outputTo: Unsupported file type: ..."); app/Options.hs parseFileFormat, which accepts "xml"; CLAUDE.md Known-broken; README.md line 260'
ARGS='--to=xml input.md'
