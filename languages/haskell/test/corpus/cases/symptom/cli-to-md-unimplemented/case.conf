TITLE='--to=md is accepted and then refused after reading, the same way --to=xml is'
WHY='Same defect as symptom/cli-to-xml-unimplemented and the same fallthrough clause, recorded separately because the two are separately reachable and separately fixable, and because the message differs only in the constructor name - which is precisely the byte a fix would move.

Md is worth its own recording for two reasons the xml case does not cover. First, md is the INPUT language: --from=md --to=md is the natural reformat-my-table request, and the round trip is implied by the repo README doubling as the spec for the markdown surface. Second, Md is reachable without the user ever typing --to at all, because .md is in fileExtensionMappings and detectOutformat infers the output format from the -o filename - so `dmnmd -o notes.md table.md` selects a backend that does not exist. That path has no README example warning anybody off it.

As with the xml case, the refusal is contingent on the input containing a table; on a prose file --to=md exits 0 in silence.'
SOURCE='app/Main.hs outputTo fallthrough; app/Options.hs parseFileFormat accepts "md" and fileExtensionMappings maps ".md" to Md, so detectOutformat can select it from -o alone'
ARGS='--to=md input.md'
