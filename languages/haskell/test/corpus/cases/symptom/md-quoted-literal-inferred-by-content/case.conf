TITLE='an undeclared markdown column of double-quoted literals "2020" and "yes" is inferred Number and Boolean'
WHY='The markdown twin of symptom/xml-untyped-quoted-literals-stay-strings, found while diagnosing it, and the reason the premise "D-2 treats a quoted string as hard String evidence on the markdown path" does not hold for a quoted numeral or boolean word. mkInputFsAt and mkFsAt run mkFsEither, whose unquoteCell strips a well-formed double-quoted cell in pass 1, so inferEvidence sees 2020 and yes and never the quotes: the quoted-string clause of inferEvidence only fires for a cell that unquoteCell leaves quoted, such as one whose comma fragments are not all literals. A column of quoted numerals therefore types as Number (Year : number, Year === 2020.0) and a column of quoted boolean words as Boolean (the outputs true and false), at exit 0. The quotes are the author saying string: CLAUDE.md says a double-quoted cell is a string literal. Not fixed here -- the markdown fix belongs with the cell layer (pass 1 would have to keep the quotes of an undeclared column and pass 2 strip them at the inferred type), which is parser-side work -- and recorded so it is not lost. A quoted leading-zero numeral such as "007" is refused by the same cause (VAmbiguous). Progress is year : string, a guard comparing against "2020", and the outputs "yes" and "no".'
SOURCE='src/DMN/DecisionTable.hs mkFsEither (unquoteCell), mkFsAt, mkInputFsAt, inferEvidence; audit 2026-09-26 finding f4 (markdown side, found during the fix)'
ARGS='--to=ts input.md'
