TITLE='two tables sharing a domained column name emit two DECLAREs, and the L4 does not typecheck'
WHY='Both tables have an output column named `category` with the same declared
domain, so both emit `DECLARE Category IS ONE OF `Dining`, `Grocery``. Two
top-level declarations of the same constructors in one file is not legal L4:

  $ l4 check out.l4
  There are multiple definitions for the identifier Grocery
  ...
  Grocery (defined at out.l4:17:5-14) of type Category
  Grocery (defined at out.l4:4:5-14) of type Category
  exit 1

dmnmd exits 0. So the tool reports success and hands the user a file that its own
downstream compiler rejects - the "accepting input and quietly giving a different
answer" failure that CLAUDE.md puts at the top of the diagnostics section, except
here it is the OUTPUT that is quietly wrong.

This is a REGRESSION, not a longstanding gap. Before PR #30 gave domained columns
a real sum type, this same file emitted `GIVETH A STRING` twice and typechecked
fine. #30 made single tables strictly better and multi-table files broken, and
nothing caught it because every L4 corpus case at the time was single-table.

The cause is structural rather than local: app/Main.hs applies outputTo per table
with mapM_, so `toL4` cannot see that another table already declared this type.
BUILD-SPEC-dmnmd-l4-sumtype.md sectionA.6 proposes toL4File for exactly this, and
the fix is to hoist every DECLARE into one deduplicated file-level preamble. Two
tables that genuinely share a domain SHOULD share one L4 type - that is the
composition payoff in sectionA.6, not merely a workaround.

Recorded before the fix so the diff shows the preamble hoisting rather than
appearing as a new emission out of nowhere. Related:
symptom/l4-multitable-refusal-partial-output, the other multi-table L4 defect
that toL4File has to land without disturbing.'
SOURCE='src/DMN/Translate/L4.hs enumDecls (per-table); app/Main.hs outputTo/mapM_; BUILD-SPEC-dmnmd-l4-sumtype.md sectionA.6'
ARGS='--to=l4 input.md'
