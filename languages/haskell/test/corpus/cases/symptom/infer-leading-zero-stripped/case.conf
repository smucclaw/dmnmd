TITLE='leading zeros are silently discarded: the product code 007 becomes the number 7'
WHY='Same root cause as infer-version-float-collapse: an identifier-like cell is inferred as Number. Transpiled code compares a numeric 7 against a real-world string key "007". This used to be described as a `Float coercion`; that is stale as of D-1 -- the path is Scientific now and carries no binary format, but 007 and 7 are the same NUMBER whatever the representation, so the leading zero is lost at the moment inference decides the column is numeric. No numeric type can fix this; only refusing to infer can. D-2.'
SOURCE='src/DMN/DecisionTable.hs inferType / mkVN; audit lens "type inference", finding 16'
ARGS='--to=ts input.md'
